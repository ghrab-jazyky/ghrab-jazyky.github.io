e distinguer ?","main":"Suffit-il d’être une personne ordinaire et heureuse ?","questions":["Qui décide de ce qui rend une vie remarquable ?","L’ambition et la satisfaction peuvent-elles aller ensemble ?","Quelle attente de la société voudrais-tu remettre en cause ?"],"support":["Un avantage / un risque, c’est …","Cela pourrait être un problème parce que …","Que ferais-tu à leur place ?"],"challenge":"Rédigez un manifeste en trois phrases : Nous refusons de… / Nous valorisons… / Nous n’oublions pas que…","stretch":"Remettez en cause une idée irréaliste de la réussite."}],"vocab":[["la réussite","quelque chose d’important qu’on accomplit"],["l’attente","ce que les autres espèrent de nous"],["la pression du groupe","influence des personnes de notre âge"],["la confiance en soi","croire en ses capacités"],["la motivation","la raison pour laquelle on veut faire quelque chose"],["abandonner","arrêter d’essayer"],["l’équilibre entre vie professionnelle et vie privée","du temps pour le travail et du temps pour soi"],["le parcours professionnel","suite des étapes de sa vie au travail"],["l’ambition","envie forte de réussir"],["le bien-être","fait de se sentir bien dans son corps et son esprit"],["le compromis","accord où chacun fait un effort"],["la reconnaissance","appréciation ou éloges des autres"]],"toolkit":[["Donner son opinion","Je crois que … / Personnellement, je dirais que …"],["Justifier","La raison principale, c’est … / Par exemple, …"],["Nuancer poliment","Je comprends ton point de vue, mais … / C’est vrai en partie."],["Relancer","Tu peux expliquer pourquoi ? / Tu as un exemple ?"]]},"B2":{"warm":"Classez liberté, réussite, bonheur et sécurité. Défendez votre choix et remettez une idée en question.","stations":[{"title":"Qu’est-ce que réussir ?","subtitle":"Commençons par ce que nous voulons vraiment.","main":"Si personne ne pouvait voir tes réussites, poursuivrais-tu les mêmes objectifs ?","mainExplain":"Imagine que personne, pas même tes amis ou ta famille, ne connaisse tes réussites. Tes objectifs resteraient-ils les mêmes, ou certains dépendent-ils du regard des autres ?","questions":["Peut-on réussir sans reconnaissance sociale ?","Dans quelle mesure ton idée de la réussite t’appartient-elle ?","Deux parcours très différents peuvent-ils être aussi réussis l’un que l’autre ?"],"explanations":["La réussite est souvent liée aux compliments, aux « j’aime » ou à l’admiration des autres. Quelqu’un pourrait-il se sentir réussir même si personne ne remarquait ni ne félicitait ce qu’il a accompli ?","Notre idée de la réussite peut venir de la famille, de l’école, des amis ou des médias. Quelle part de ta propre idée de la réussite as-tu vraiment choisie toi-même ?","Deux personnes peuvent vivre des vies très différentes, par exemple avec des métiers, des lieux ou des objectifs différents. Pourraient-elles réussir autant l’une que l’autre ? De quoi cela dépendrait-il ?"],"support":["Le principal compromis semble être …","Je fixerais la limite à …","Que répondrais-tu à quelqu’un qui affirme que … ?"],"challenge":"Classez la liberté, l’argent, l’amitié, la reconnaissance et le sens de la vie. Défendez votre premier choix.","stretch":"Supposez que vos réussites ne soient plus jamais reconnues publiquement : qu’est-ce qui changerait ?"},{"title":"Le piège des notes","subtitle":"Quand les réussites deviennent des chiffres.","main":"D’excellentes notes annoncent-elles vraiment un avenir réussi ?","mainExplain":"Pense à des personnes qui ont d’excellentes notes et à d’autres qui ont des notes moyennes. Les notes disent-elles qui réussira plus tard, ou d’autres choses comptent-elles davantage ?","questions":["Quelles qualités échappent à l’évaluation scolaire ?","Préférerais-tu maîtriser une matière ou obtenir la meilleure note ?","Comment évaluer les progrès plus équitablement ?"],"explanations":["Les notes montrent certaines choses sur un élève, mais pas tout. Quelles qualités ou capacités importantes une évaluation scolaire pourrait-elle ne pas montrer du tout ?","Parfois, on peut avoir une bonne note sans vraiment comprendre une matière, ou bien la comprendre sans avoir la meilleure note. Que choisirais-tu si tu ne pouvais avoir qu’une seule de ces deux choses, et pourquoi ?","Beaucoup de gens ont l’impression que la façon d’évaluer à l’école n’est pas toujours juste. Comment pourrait-on mesurer les progrès des élèves de façon plus juste ?"],"support":["Le principal compromis semble être …","Je fixerais la limite à …","Que répondrais-tu à quelqu’un qui affirme que … ?"],"challenge":"Deux élèves : l’un obtient d’excellentes notes en dormant cinq heures par nuit, l’autre apprend lentement mais avec plaisir. Argumentez : lequel des deux le système scolaire récompense-t-il le plus, et est-ce juste ?","stretch":"Imaginez une méthode d’évaluation plus juste et défendez-la face à un professeur qui craint une baisse du niveau."},{"title":"Le rêve de qui ?","subtitle":"Attentes familiales et choix personnels.","scenario":"Un élève veut étudier la musique, mais sa famille préfère le droit.","main":"Quand devrait-il défendre son choix ?","mainExplain":"L’élève et sa famille ne veulent pas la même chose. Quand faut-il suivre son propre projet, et quand les inquiétudes de la famille devraient-elles compter davantage ?","questions":["À partir de quand le soutien familial devient-il une pression ?","Comment les moyens financiers, les obligations et les possibilités influencent-ils la liberté de choisir sa voie ?","Comment gérerais-tu un désaccord sérieux sur ton avenir ?"],"explanations":["Les parents soutiennent souvent leurs enfants parce qu’ils veulent le meilleur pour eux. Quand ce soutien pourrait-il commencer à ressembler à une pression ?","Tout le monde n’a pas la même liberté pour choisir son avenir. Comment l’argent, les obligations à la maison ou les possibilités autour de soi pourraient-ils influencer les choix qu’on peut faire ?","Imagine que toi et ta famille n’êtes pas du tout d’accord sur ton avenir. Comment essaierais-tu d’en parler et de trouver une solution ?"],"support":["Le principal compromis semble être …","Je fixerais la limite à …","Que répondrais-tu à quelqu’un qui affirme que … ?"],"challenge":"Ta famille finance tes études uniquement si elle peut choisir la filière. Négociez.","stretch":"Trouvez un compromis entre indépendance et responsabilité, puis nommez un risque que chaque partie devrait accepter."},{"title":"Le piège de la comparaison","subtitle":"Pourquoi les autres semblent-ils toujours en avance ?","main":"Sommes-nous en compétition même lorsque personne ne nous le demande ?","mainExplain":"Personne n’organise de compétition, et pourtant on compare ses notes, son apparence ou ses abonnés. Pourquoi, et est-ce toujours négatif ?","questions":["Comment les réseaux sociaux déforment-ils notre perception de la réussite ?","La comparaison peut-elle motiver sans détruire la confiance en soi ?","Qu’est-ce qui pourrait aider une personne qui a l’impression d’être en retard ?"],"explanations":["Sur les réseaux sociaux, les gens montrent surtout leurs réussites. Comment cela pourrait-il changer notre regard sur nos propres réussites et sur celles des autres ?","Se comparer aux autres peut motiver, mais aussi faire perdre confiance. Quand la comparaison peut-elle aider sans abîmer l’image qu’on a de soi ?","Certaines personnes ont l’impression que tout le monde avance pendant qu’elles prennent du retard. Qu’est-ce qui pourrait aider quelqu’un qui ressent cela ?"],"support":["Le principal compromis semble être …","Je fixerais la limite à …","Que répondrais-tu à quelqu’un qui affirme que … ?"],"challenge":"Tu apprends sur les réseaux qu’un ami a obtenu une grande bourse. Explique ta réaction.","stretch":"Propose deux habitudes pour moins te comparer et explique pourquoi l’une d’elles ne conviendrait pas à tout le monde."},{"title":"La peur de l’échec","subtitle":"Erreurs, risques et nouveaux départs.","main":"Éviter l’échec est-il parfois pire qu’échouer ?","mainExplain":"Certaines personnes n’essaient jamais quelque chose de difficile par peur d’échouer. Que risquent-elles de perdre en n’essayant pas du tout ?","questions":["Quand vaut-il la peine de prendre un risque ?","En quoi un échec public pourrait-il différer d’un échec vécu en privé ?","L’échec nous rend-il toujours plus forts ?"],"explanations":["Tout risque peut bien ou mal se terminer. Comment décides-tu si un risque vaut la peine d’être pris ? Qu’est-ce qui le rendrait valable ?","Échouer devant les autres peut être vécu très différemment d’un échec quand personne ne regarde. En quoi ces deux expériences pourraient-elles être différentes, et pourquoi ?","On dit souvent que l’échec nous rend plus forts. Est-ce toujours vrai, ou y a-t-il des situations où ce n’est pas le cas ?"],"support":["Le principal compromis semble être …","Je fixerais la limite à …","Que répondrais-tu à quelqu’un qui affirme que … ?"],"challenge":"Un élève doué refuse de participer aux concours par peur de perdre. Donne-lui des conseils réalistes.","stretch":"Débattez des moments où abandonner est raisonnable et mettez-vous d’accord sur un critère qui aiderait à décider."},{"title":"Toujours occupés","subtitle":"Ambition, repos et épuisement.","main":"Le travail acharné reste-t-il admirable s’il ne laisse plus de place à la vie ?","mainExplain":"Imagine quelqu’un qui travaille ou étudie tout le temps et n’a de temps pour rien d’autre. Faut-il l’admirer, ou manque-t-il quelque chose d’important ?","questions":["Pourquoi valorise-t-on parfois le surmenage ?","Une élève travaille tard chaque soir et n’apprécie plus ses loisirs. Est-ce de l’ambition ou un signal d’alerte ? Que faudrait-il savoir de plus ?","À quoi refuserais-tu de renoncer pour réussir ?"],"explanations":["Dans certains milieux, on admire le fait de travailler très longtemps et on en parle avec fierté. Pourquoi la société pourrait-elle parfois valoriser le fait de trop travailler ?","Vouloir accomplir beaucoup peut être sain, mais cela peut aussi épuiser quelqu’un sur la durée. Comment une personne pourrait-elle faire la différence entre les deux dans sa propre vie ?","Atteindre un objectif demande souvent de renoncer à quelque chose. À quoi ne serais-tu jamais prêt à renoncer, même pour réussir ?"],"support":["Le principal compromis semble être …","Je fixerais la limite à …","Que répondrais-tu à quelqu’un qui affirme que … ?"],"challenge":"Un élève ne dort que cinq heures par nuit à cause des devoirs et des activités, mais il tient à ses activités. Donne-lui des conseils pratiques qui respectent ses priorités.","stretch":"Propose une règle scolaire pour protéger le bien-être et réponds à l’objection la plus forte."},{"title":"Passion ou salaire ?","subtitle":"Choisir son avenir sans solution parfaite.","main":"Accepterais-tu un salaire plus bas pour un travail qui a du sens ?","mainExplain":"Imagine deux emplois : l’un qui compte vraiment pour toi mais paie moins, l’autre bien payé mais qui a peu de sens pour toi. Qu’est-ce qui guiderait ton choix ?","questions":["Comment la sécurité financière influence-t-elle la liberté ?","Un métier de rêve peut-il devenir un fardeau ?","Comment équilibrer salaire, intérêt et temps libre ?"],"explanations":["Avoir assez d’argent peut ouvrir plus de possibilités dans la vie. Comment la sécurité financière, ou son absence, pourrait-elle influencer la liberté réelle de quelqu’un ?","Un métier de rêve semble ne pouvoir rendre que heureux. Pourrait-il aussi devenir stressant ou pesant ? Comment ?","Un travail peut offrir de l’intérêt, un bon salaire et du temps libre, mais rarement les trois pleinement. Comment déciderais-tu ce qui compte le plus pour toi ?"],"support":["Le principal compromis semble être …","Je fixerais la limite à …","Que répondrais-tu à quelqu’un qui affirme que … ?"],"challenge":"Choisissez entre un métier passionnant mais mal payé et un travail sûr mais monotone. Défendez votre choix.","stretch":"Invente une troisième option et explique quel compromis elle ne permet toujours pas d’éviter."},{"title":"Le droit d’être ordinaire","subtitle":"Faut-il vraiment se distinguer ?","main":"Est-il raisonnable de vouloir une vie heureuse sans chercher à se distinguer ?","mainExplain":"Certaines personnes ne veulent être ni célèbres ni les meilleures ; elles veulent simplement une vie agréable et tranquille. Est-ce un objectif raisonnable, ou les jeunes devraient-ils viser plus haut ?","questions":["Pourquoi admirons-nous les exploits exceptionnels ?","La recherche de l’excellence peut-elle devenir malsaine ?","Comment définirais-tu une vie qui te suffit ?"],"explanations":["Les gens sont souvent fascinés par les exploits exceptionnels, comme les records, les prix ou les grandes découvertes. Pourquoi pourrions-nous les admirer autant ?","Chercher toujours à être le meilleur peut donner de grands résultats. Cela pourrait-il aussi devenir néfaste pour une personne ? Quand ?","Beaucoup parlent d’une vie pleine de grandes réussites. Comment décrirais-tu une vie qui te semblerait « suffisante » ?"],"support":["Le principal compromis semble être …","Je fixerais la limite à …","Que répondrais-tu à quelqu’un qui affirme que … ?"],"challenge":"Rédigez un manifeste en trois phrases (Nous refusons de… / Nous valorisons… / Nous n’oublions pas que…), puis testez l’une d’elles face à un contre-exemple solide.","stretch":"Remettez en cause une idée irréaliste de la réussite et expliquez à qui elle profite."}],"vocab":[["l’estime de soi","jugement qu’on porte sur sa propre valeur"],["la reconnaissance sociale","approbation publique des réussites"],["le perfectionnisme","besoin de faire les choses sans erreur"],["l’épuisement","fatigue profonde due à trop de pression"],["le prix à payer","ce qu’on sacrifie pour obtenir un avantage"],["le privilège","avantage que tout le monde ne possède pas"],["épanouissant","qui apporte du sens et de la satisfaction"],["la sécurité financière","garantie de ressources suffisantes"],["la stigmatisation","jugement négatif et injuste"],["la résilience","capacité à surmonter des difficultés"],["le conformisme","tendance à suivre les normes dominantes"],["la validation extérieure","approbation recherchée auprès des autres"]],"toolkit":[["Exprimer un point de vue","Je dirais que … / Il me semble que …"],["Argumenter","Une des raisons est que … / Prenons l’exemple de …"],["Nuancer un désaccord","Je comprends ton point de vue, mais … / Je me demande si …"],["Approfondir","Qu’est-ce qui te fait dire cela ? / Serait-ce encore vrai si … ?"]]},"C1":{"warm":"Définissez la réussite en une phrase, puis affinez la définition après un contre-exemple.","stations":[{"title":"Qu’est-ce que réussir ?","subtitle":"Commençons par ce que nous voulons vraiment.","main":"Dans quelle mesure les attentes sociales façonnent-elles ce que nous appelons la réussite personnelle ?","mainExplain":"Nous pensons souvent que notre idée de la réussite nous appartient. Mais quelle part vient de ce que les autres attendent de nous ?","questions":["Deux jeunes tout aussi talentueux veulent faire un stage non rémunéré, mais un seul peut se le permettre. Que révèle cela sur la liberté de poursuivre ses ambitions ?","Peut-on rejeter les critères habituels de réussite sans se sentir jugé ?","Quelle définition de la réussite serait plus inclusive ?"],"explanations":["Certaines personnes peuvent se permettre de choisir une voie qui les épanouit, d’autres doivent surtout penser à gagner leur vie. Comment le milieu social pourrait-il influencer qui peut chercher à s’épanouir ?","Certaines personnes choisissent de ne pas suivre l’idée habituelle de la réussite, comme un salaire élevé ou un poste prestigieux. Peuvent-elles le faire sans se sentir jugées ? Pourquoi, ou pourquoi pas ?","Notre idée habituelle de la réussite laisse de côté certaines personnes et certaines façons de vivre. À quoi pourrait ressembler une définition de la réussite qui inclut davantage de monde ?"],"support":["Cet argument suppose que …","Une conséquence imprévue pourrait être …","Ne faudrait-il pas distinguer … de … ?"],"challenge":"Élaborez une définition de la réussite qui tienne compte des inégalités de départ.","stretch":"Vérifiez si elle convient à quelqu’un qui refuse toute reconnaissance publique."},{"title":"Le piège des notes","subtitle":"Quand les réussites deviennent des chiffres.","main":"Les notes mesurent-elles surtout l’apprentissage ou la conformité à un système ?","mainExplain":"Une bonne note peut montrer qu’un élève a beaucoup appris, ou qu’il sait exactement ce que l’école veut voir. Comment faire la différence ?","questions":["Comment l’évaluation peut-elle modifier les priorités des élèves ?","Supprimer les notes créerait-il de nouvelles inégalités ?","Quel équilibre entre exigences et développement personnel défendrais-tu ?"],"explanations":["Quand les élèves savent comment ils seront évalués, ils changent parfois ce sur quoi ils se concentrent. Comment l’évaluation pourrait-elle modifier ce que les élèves jugent important ?","On propose parfois de supprimer les notes pour réduire la pression. Cela pourrait-il créer de nouvelles formes d’injustice ? Comment ?","L’école veut garder un niveau élevé, mais aussi soutenir le développement personnel de chacun. Quel équilibre entre les deux pourrais-tu défendre ?"],"support":["Cet argument suppose que …","Une conséquence imprévue pourrait être …","Ne faudrait-il pas distinguer … de … ?"],"challenge":"Imaginez une évaluation qui valorise les apprentissages sans abandonner les exigences.","stretch":"Repérez une conséquence imprévue de votre proposition."},{"title":"Le rêve de qui ?","subtitle":"Attentes familiales et choix personnels.","main":"Comment distinguer un conseil bienveillant d’une forme subtile de contrôle ?","mainExplain":"Les parents ou les enseignants donnent souvent des conseils sur l’avenir. Quand ces conseils aident-ils à choisir librement, et quand font-ils discrètement le choix à la place de quelqu’un ?","questions":["À quelles conditions, s’il y en a, les sacrifices familiaux pourraient-ils créer des obligations ?","Comment le contexte culturel changerait-il ta réponse ?","L’autonomie peut-elle coexister avec la responsabilité envers les autres ?"],"explanations":["À quelles conditions, s’il y en a, les sacrifices qu’une famille a faits pour quelqu’un pourraient-ils créer une obligation pour cette personne ? De quel type d’obligation s’agirait-il ?","Les idées sur ce qu’on doit à sa famille ne sont pas les mêmes dans toutes les cultures. Comment le contexte culturel pourrait-il changer la façon de répondre à la question des sacrifices familiaux ?","Être libre de prendre ses propres décisions et se sentir responsable des autres peuvent sembler tirer dans des directions opposées. Les deux peuvent-ils coexister dans la vie d’une personne ? Comment ?"],"support":["Cet argument suppose que …","Une conséquence imprévue pourrait être …","Ne faudrait-il pas distinguer … de … ?"],"challenge":"Défendez puis critiquez l’obligation de répondre aux attentes familiales.","stretch":"Tentez de concilier autonomie et devoirs envers les proches."},{"title":"Le piège de la comparaison","subtitle":"Pourquoi les autres semblent-ils toujours en avance ?","main":"Comment les plateformes numériques façonnent-elles l’image d’une vie réussie ?","mainExplain":"En ligne, on voit surtout les meilleurs moments et les réussites des autres. Comment cela peut-il changer notre idée d’une vie normale ou réussie ?","questions":["La comparaison dépend-elle surtout de la personnalité ou de la société ?","Dans quelles circonstances la reconnaissance publique pourrait-elle aider ou nuire à quelqu’un ?","Comment mesurer les progrès sans repères extérieurs ?"],"explanations":["Certaines personnes se comparent aux autres beaucoup plus que d’autres. Est-ce surtout une question de personnalité, ou la société joue-t-elle un rôle plus important ?","Être reconnu publiquement peut faire se sentir apprécié, mais aussi mettre sous pression. Dans quelles circonstances la reconnaissance pourrait-elle aider, et quand pourrait-elle nuire ?","Nous mesurons souvent nos progrès en nous comparant aux autres. Comment pourrais-tu juger tes propres progrès sans prendre les autres comme repère ?"],"support":["Cet argument suppose que …","Une conséquence imprévue pourrait être …","Ne faudrait-il pas distinguer … de … ?"],"challenge":"Imaginez une société sans classements publics.","stretch":"Examinez comment la compétition pour le statut pourrait réapparaître autrement."},{"title":"La peur de l’échec","subtitle":"Erreurs, risques et nouveaux départs.","main":"Dans quelles conditions l’échec conduit-il réellement à apprendre ?","mainExplain":"On dit souvent qu’on apprend de ses erreurs. Que doit-il se passer après un échec pour qu’on apprenne vraiment quelque chose, au lieu de simplement se sentir mal ?","questions":["Quels facteurs personnels et sociaux peuvent influencer la manière de surmonter un revers ?","Quand devient-il insensible de célébrer la résilience ?","Les institutions devraient-elles valoriser les risques réfléchis, même en cas d’échec ?"],"explanations":["Les gens se remettent des revers de façons très différentes. Quelles circonstances personnelles et sociales pourraient rendre cela plus facile ou plus difficile ?","Féliciter quelqu’un d’être résilient peut sembler encourageant. Quand ces félicitations pourraient-elles paraître insensibles à quelqu’un qui traverse une période difficile ?","Des institutions comme l’école ou l’entreprise récompensent souvent seulement la réussite. Devraient-elles aussi valoriser quelqu’un qui a pris un risque bien réfléchi qui n’a pas marché ? Pourquoi, ou pourquoi pas ?"],"support":["Cet argument suppose que …","Une conséquence imprévue pourrait être …","Ne faudrait-il pas distinguer … de … ?"],"challenge":"Critiquez « l’échec est le meilleur professeur » en vous plaçant dans deux situations sociales différentes.","stretch":"Définissez les conditions dans lesquelles un échec peut être formateur."},{"title":"Toujours occupés","subtitle":"Ambition, repos et épuisement.","scenario":"Un élève culpabilise dès qu’il se repose au lieu d’étudier.","main":"Pourquoi certains admireraient-ils cette attitude, et quand peut-elle devenir nocive ?","mainExplain":"Certains voient le travail permanent comme le signe d’un bon caractère. Pourquoi, et à partir de quand cette attitude nuit-elle à la personne elle-même ?","questions":["L’ambition peut-elle naître aussi bien d’un intérêt sincère que de l’anxiété ?","À qui une culture qui glorifie l’épuisement pourrait-elle profiter ou nuire ?","Quelle conception plus saine de la réussite proposerais-tu ?"],"explanations":["On peut travailler dur parce qu’on aime ce qu’on fait, ou parce qu’on a peur de ce qui arrivera sinon. Ces deux raisons peuvent-elles pousser la même personne en même temps ?","Dans certaines cultures, on félicite les gens d’être toujours fatigués et occupés. À qui une telle culture pourrait-elle profiter, et qui pourrait en souffrir ?","Notre conception actuelle de la réussite laisse souvent peu de place au repos. À quoi ressemblerait une conception plus saine de la réussite ?"],"support":["Cet argument suppose que …","Une conséquence imprévue pourrait être …","Ne faudrait-il pas distinguer … de … ?"],"challenge":"Défendez le droit aux loisirs sans le justifier par un gain de productivité.","stretch":"Demandez-vous qui supporte le coût de l’équilibre de vie des autres."},{"title":"Passion ou salaire ?","subtitle":"Choisir son avenir sans solution parfaite.","scenario":"Deux jeunes entendent le conseil « suis ta passion ». L’un doit aider financièrement sa famille, l’autre non.","main":"Ce conseil est-il aussi juste pour les deux ?","mainExplain":"Le même conseil peut sonner très différemment selon la situation de chacun. Que coûterait le fait de « suivre sa passion » à chacun des deux jeunes ?","questions":["À qui profite l’idée, répétée aux jeunes, qu’aimer son métier compte plus que le salaire ?","Un travail porteur de sens peut-il compenser des conditions précaires ?","Existe-t-il un devoir moral de choisir un métier socialement utile ?"],"explanations":["Des conseils comme « Suis ta passion » sont donnés à tous les jeunes de la même façon. Qui gagne quand on accepte d’être moins payé pour un travail qu’on aime, et qui pourrait y perdre ? Pense aux employeurs, aux familles et aux jeunes eux-mêmes.","Un travail peut avoir beaucoup de sens mais offrir peu de sécurité ou un faible salaire. Le sens peut-il compenser de mauvaises conditions ? Pour qui, et pendant combien de temps ?","Certains métiers aident clairement plus la société que d’autres. Existe-t-il un devoir moral de choisir un tel métier, ou est-ce une décision personnelle ? Pourquoi ?"],"support":["Cet argument suppose que …","Une conséquence imprévue pourrait être …","Ne faudrait-il pas distinguer … de … ?"],"challenge":"Examinez de façon critique le conseil « fais de ta passion un métier ».","stretch":"Reconsidérez-le à partir des métiers essentiels et mal rémunérés."},{"title":"Le droit d’être ordinaire","subtitle":"Faut-il vraiment se distinguer ?","main":"L’obligation d’être exceptionnel nuit-elle au bonheur quotidien ?","mainExplain":"Si l’on attend de chacun qu’il soit exceptionnel, que devient la valeur d’une vie quotidienne normale et heureuse ?","questions":["Peut-on séparer ambition et prestige ?","Quels présupposés le mot « ordinaire » véhicule-t-il ?","Comment une société pourrait-elle reconnaître les vies discrètes ?"],"explanations":["L’ambition est souvent liée à l’envie d’être admiré ou d’occuper une position élevée. Peut-on être ambitieux sans tenir au prestige ?","Le mot « ordinaire » peut sembler neutre, positif ou négatif. Quels jugements cachés les gens pourraient-ils porter quand ils disent qu’une vie est « ordinaire » ?","Beaucoup de gens mènent une vie tranquille qui attire rarement l’attention. Comment une société pourrait-elle montrer qu’elle reconnaît la valeur de ces vies ?"],"support":["Cet argument suppose que …","Une conséquence imprévue pourrait être …","Ne faudrait-il pas distinguer … de … ?"],"challenge":"Réfutez l’idée que tout le monde doit devenir exceptionnel.","stretch":"Débattez : la satisfaction est-elle un choix, une réussite ou un privilège ?"}],"vocab":[["la méritocratie","idée de récompenser selon le talent et les efforts"],["la mobilité sociale","changement de position dans la société"],["le pouvoir d’agir","capacité de choisir et d’avoir une influence réelle"],["l’inégalité structurelle","désavantage produit par les institutions"],["la précarité","manque durable de sécurité économique ou sociale"],["l’autodétermination","possibilité de décider soi-même de son avenir"],["la culture de la performance","pression sociale à produire et réussir sans cesse"],["le présupposé normatif","idée implicite de ce qui devrait être"],["la responsabilité collective","devoirs partagés par une communauté"],["le statut social","position et prestige dans un groupe"],["l’épanouissement","développement personnel donnant du sens à la vie"],["le contre-argument","raisonnement qui s’oppose à une thèse"]],"toolkit":[["Nuancer","Dans une large mesure, … / Cela ne revient pas à dire que …"],["Construire un argument","Le présupposé est que … / Cela apparaît clairement lorsque …"],["Remettre en question","Cette prémisse me paraît discutable, car …"],["Faire avancer","Pourrais-tu préciser … ? / Comment cela fonctionnerait-il concrètement ?"]]},"C2":{"warm":"Formulez une opinion répandue sur la réussite, révélez son présupposé et proposez un contre-exemple.","stations":[{"title":"Qu’est-ce que réussir ?","subtitle":"Commençons par ce que nous voulons vraiment.","scenario":"Une élève remporte un prix important ; un autre jeune passe un an à s’occuper d’un proche sans recevoir de distinction.","main":"Qui considère-t-on comme ayant réussi, et que révèle cela sur le statut social ?","mainExplain":"Les deux font beaucoup d’efforts, mais un seul est reconnu publiquement. Qu’est-ce qui décide quels efforts comptent comme une réussite dans une société ?","questions":["Quels présupposés sous-tendent les récits méritocratiques ?","Dans quelle mesure le hasard fragilise-t-il l’idée que les réussites sont entièrement méritées ?","Peut-on définir la réussite sans hiérarchiser les existences ?"],"explanations":["Les récits sur le mérite affirment que la réussite vient du talent et de l’effort. Quelles croyances non dites pourraient se cacher derrière ces récits ?","Beaucoup de choses dans la vie dépendent du hasard, pas seulement de l’effort. Si le hasard joue un rôle, peut-on encore dire que les gens méritent entièrement leur réussite ?","Les définitions de la réussite classent souvent les vies de la plus à la moins réussie. Est-il possible de parler de réussite sans hiérarchiser les existences ?"],"support":["Cela revient à confondre … et …","Un contre-exemple fragiliserait l’affirmation selon laquelle …","Je reformulerais la question ainsi : …"],"challenge":"Soutenez que la « réussite » est une catégorie irréductiblement sociale, puis tentez de défendre une définition purement privée contre cet argument.","stretch":"Déterminez si la chance peut jamais être entièrement dissociée du mérite, et ce qui en découle pour notre manière de récompenser les gens."},{"title":"Le piège des notes","subtitle":"Quand les réussites deviennent des chiffres.","scenario":"Imagine une école qui ne note que la rapidité des réponses.","main":"Comment cela pourrait-il transformer les apprentissages – et ce que les professeurs considèrent comme une aptitude ?","mainExplain":"Si seule la rapidité était récompensée, les élèves s’entraîneraient surtout à aller vite. La façon d’évaluer pourrait-elle changer ce que l’on entend par aptitude ?","questions":["Des notes apparemment objectives peuvent-elles dissimuler des avantages structurels ?","Que devrait préserver une alternative crédible aux classements traditionnels ?","Des exigences scolaires élevées peuvent-elles coexister avec des mesures ambitieuses contre les inégalités ?"],"explanations":["Les notes paraissent souvent neutres et objectives. Pourraient-elles quand même cacher des avantages que certains élèves ont grâce à leur milieu ? Comment ?","Imagine qu’on remplace le classement habituel des élèves par autre chose. Que devrait conserver cette alternative pour être prise au sérieux ?","Un niveau scolaire exigeant et de grands efforts contre les inégalités sont parfois vus comme opposés. Peuvent-ils exister ensemble ? Comment ?"],"support":["Cela revient à confondre … et …","Un contre-exemple fragiliserait l’affirmation selon laquelle …","Je reformulerais la question ainsi : …"],"challenge":"Soutenez que toute réforme de l’évaluation ne fait que déplacer les inégalités, puis confrontez cet argument aux contre-exemples les plus solides.","stretch":"Précisez quels traits de la notation sont indispensables et lesquels relèvent de la simple convention, et justifiez cette distinction."},{"title":"Le rêve de qui ?","subtitle":"Attentes familiales et choix personnels.","main":"Où s’achève l’obligation familiale légitime et où commence la contrainte ?","mainExplain":"Les membres d’une famille se doivent peut-être quelque chose, comme de l’aide ou de la loyauté. À partir de quand le sens du devoir devient-il une pression qui prive quelqu’un de sa liberté ?","questions":["Peut-on adhérer librement à des attentes héritées ?","Comment concilier autonomie et réciprocité lorsqu’elles entrent en conflit ?","Quand l’injonction à « suivre ses rêves » masque-t-elle une dépendance matérielle ?"],"explanations":["Beaucoup de jeunes reprennent des attentes venues de leur famille. Peut-on vraiment choisir de faire siennes ces attentes, plutôt que de simplement y obéir ?","La liberté personnelle et l’idée de rendre ce qu’on a reçu peuvent entrer en conflit. Comment trouver un équilibre entre ces deux valeurs quand elles s’opposent ?","« Suis tes rêves » semble encourageant. Quand cette phrase pourrait-elle cacher que certaines personnes dépendent financièrement d’autres et ne peuvent pas choisir librement ?"],"support":["Cela revient à confondre … et …","Un contre-exemple fragiliserait l’affirmation selon laquelle …","Je reformulerais la question ainsi : …"],"challenge":"Reconstruisez un argument solide en faveur de l’obligation filiale dans des termes que votre interlocuteur accepterait, puis repérez le point où elle bascule dans la contrainte.","stretch":"Déterminez si la gratitude peut jamais fonder un devoir contraignant, ou seulement une attente morale."},{"title":"Le piège de la comparaison","subtitle":"Pourquoi les autres semblent-ils toujours en avance ?","scenario":"Une élève publie chacun de ses succès, un autre évite les réseaux sociaux.","main":"L’un ou l’autre peut-il vraiment échapper à la comparaison ? Pourquoi ?","mainExplain":"Quitter les réseaux sociaux semble mettre fin à la comparaison, mais on peut se comparer autrement. Peut-on vraiment sortir de toute comparaison ?","questions":["Dans quelles circonstances les plateformes peuvent-elles tirer profit de l’insécurité tout en présentant la visibilité comme émancipatrice ?","Peut-on réellement sortir de l’économie de l’attention ?","Se comparer à soi-même est-il moins corrosif que rivaliser avec les autres ?"],"explanations":["Les plateformes présentent souvent la visibilité comme quelque chose qui donne du pouvoir aux gens. Dans quelles circonstances pourraient-elles en même temps gagner de l’argent grâce à l’insécurité des gens ?","Les applications et les médias se disputent sans cesse notre attention. Une personne peut-elle vraiment s’en retirer, ou est-ce presque impossible aujourd’hui ?","Certaines personnes se comparent seulement à celles qu’elles étaient avant, plutôt qu’aux autres. Ce type de comparaison est-il moins nocif ? Pourquoi, ou pourquoi pas ?"],"support":["Cela revient à confondre … et …","Un contre-exemple fragiliserait l’affirmation selon laquelle …","Je reformulerais la question ainsi : …"],"challenge":"Construisez la défense la plus solide de la comparaison sociale comme moteur de progrès, puis mettez au jour ses coûts cachés.","stretch":"Demandez-vous si se retirer de la visibilité publique est une véritable forme de liberté ou simplement un privilège de plus."},{"title":"La peur de l’échec","subtitle":"Erreurs, risques et nouveaux départs.","main":"Dans quelle mesure est-il plus facile de valoriser l’échec lorsqu’on bénéficie d’une sécurité financière ou sociale ?","mainExplain":"Dire « ce n’est pas grave d’échouer » est plus facile quand sa famille peut nous soutenir en cas de difficulté. Comment un filet de sécurité change-t-il le sens de l’échec ?","questions":["Quand le discours sur la résilience décharge-t-il les institutions de leurs responsabilités ?","Comment distinguer une persévérance admirable d’un entêtement aveugle ?","Une tentative infructueuse peut-elle avoir plus de valeur qu’un résultat favorable ?"],"explanations":["Le discours sur la résilience encourage les gens à faire face seuls aux difficultés. Quand pourrait-il faire passer la responsabilité de l’école, des employeurs ou de l’État vers les individus ?","Ne pas abandonner est souvent admiré. Mais comment faire la différence entre une persévérance admirable et le fait de s’obstiner sans vouloir revoir un objectif qui n’a plus de sens ?","On valorise généralement plus les résultats que les tentatives. Une tentative qui a échoué pourrait-elle parfois valoir plus qu’une réussite ? Dans quel sens ?"],"support":["Cela revient à confondre … et …","Un contre-exemple fragiliserait l’affirmation selon laquelle …","Je reformulerais la question ainsi : …"],"challenge":"Reformulez « l’échec est le meilleur professeur » de sorte que la formule reste vraie pour ceux qui n’ont aucun filet de sécurité, et défendez votre version.","stretch":"Distinguez les échecs formateurs de ceux qui ne font que nuire, et identifiez qui décide de ce qui relève de l’un ou de l’autre."},{"title":"Toujours occupés","subtitle":"Ambition, repos et épuisement.","scenario":"Un camarade affirme : « Se reposer ne sert à rien si cela ne rend pas plus productif. »","main":"Quel jugement moral se cache dans cette idée, et peut-on le défendre ?","mainExplain":"Cette affirmation ne donne de la valeur au repos que s’il permet de travailler davantage. Qu’est-ce que cela dit de notre façon de juger les gens, et le repos peut-il avoir une valeur en soi ?","questions":["Quelles contradictions surgissent lorsque les loisirs deviennent eux aussi des projets d’optimisation ?","Comment entretenir une ambition porteuse de sens sans tomber dans l’auto-exploitation ?","Que signifierait défendre un droit inconditionnel au repos ?"],"explanations":["Même le temps libre est parfois organisé pour être aussi utile et efficace que possible. Quelles contradictions pourraient apparaître quand les loisirs deviennent une chose de plus à optimiser ?","L’ambition peut donner du sens à la vie, mais aussi pousser à trop exiger de soi. Comment rester ambitieux sans s’exploiter soi-même ?","Un droit inconditionnel au repos voudrait dire que le repos n’a pas besoin d’être mérité. Que signifierait concrètement défendre un tel droit ?"],"support":["Cela revient à confondre … et …","Un contre-exemple fragiliserait l’affirmation selon laquelle …","Je reformulerais la question ainsi : …"],"challenge":"Défendez le repos comme une fin en soi, sans invoquer la santé, la productivité ni le bien-être.","stretch":"Identifiez quel travail invisible rend possibles les loisirs des autres, et ce que cela implique pour une répartition juste du temps."},{"title":"Passion ou salaire ?","subtitle":"Choisir son avenir sans solution parfaite.","main":"L’opposition entre épanouissement et stabilité financière est-elle un faux dilemme ?","mainExplain":"On parle souvent comme s’il fallait choisir entre un métier qu’on aime et un métier bien payé. Est-ce vraiment le seul choix, ou existe-t-il d’autres possibilités ?","questions":["Quand la professionnalisation d’une passion finit-elle par l’abîmer ?","Comment reconnaître la valeur du travail indispensable mais peu prestigieux ?","L’orientation professionnelle peut-elle jamais être politiquement neutre ?"],"explanations":["Faire d’un loisir ou d’une passion son métier peut être un rêve. Quand l’exercer professionnellement pourrait-il abîmer le plaisir qui en faisait une passion ?","Certains travaux sont indispensables à la société mais apportent peu de prestige. Comment la société devrait-elle montrer la valeur de ce travail ?","L’orientation professionnelle peut sembler purement pratique. Pourrait-elle jamais être totalement libre de valeurs et de présupposés politiques ? Pourquoi, ou pourquoi pas ?"],"support":["Cela revient à confondre … et …","Un contre-exemple fragiliserait l’affirmation selon laquelle …","Je reformulerais la question ainsi : …"],"challenge":"Soutenez que l’idéal « fais ce que tu aimes » sert davantage les employeurs que les travailleurs, puis concédez ce qu’il a de juste.","stretch":"Proposez des critères de la valeur sociale du travail qui ne dépendent ni du salaire ni du prestige."},{"title":"Le droit d’être ordinaire","subtitle":"Faut-il vraiment se distinguer ?","scenario":"Un adolescent souhaite un métier modeste et une vie tranquille.","main":"Qui pourrait qualifier cette vie d’« ordinaire » ou de « ratée », et que révèle ce jugement ?","mainExplain":"Qualifier une vie d’« ordinaire » semble être une simple description, mais cela peut aussi être un jugement. Qui décide de ce qui est ordinaire, et quelles valeurs se cachent derrière ce mot ?","questions":["L’exigence d’authenticité peut-elle devenir une performance concurrentielle ?","Le contentement est-il résistance, conformisme ou autre chose ?","Quelle conception d’une vie accomplie subsiste après l’abandon de l’idéal d’exception ?"],"explanations":["Être « authentique » est souvent présenté comme un idéal. L’effort pour paraître authentique pourrait-il lui-même devenir une nouvelle forme de compétition ?","Être satisfait de sa vie peut être vu de différentes manières. Est-ce une façon de résister à la pression, de se résigner, ou tout autre chose ?","Si l’on n’accepte plus qu’une bonne vie doive être exceptionnelle, quelle idée d’une vie accomplie reste-t-il ? En quoi consisterait-elle ?"],"support":["Cela revient à confondre … et …","Un contre-exemple fragiliserait l’affirmation selon laquelle …","Je reformulerais la question ainsi : …"],"challenge":"Défendez l’ordinaire sans en faire un nouvel idéal à atteindre.","stretch":"Examinez si le langage de l’« authenticité » échappe à la logique de la compétition ou ne fait que la raffiner."}],"vocab":[["la contingence","rôle du hasard et des circonstances"],["le récit méritocratique","discours qui présente les résultats comme mérités"],["le jugement normatif","affirmation sur ce qui devrait être valorisé"],["la valeur morale","valeur d’une personne selon une perspective éthique"],["la réciprocité","principe d’obligations ou d’échanges mutuels"],["la marchandisation","transformation de quelque chose en produit marchand"],["la valeur instrumentale","utilité comme moyen d’obtenir autre chose"],["l’auto-exploitation","exigence excessive qu’on s’impose à soi-même"],["la hiérarchie de prestige","classement fondé sur le statut social"],["l’épanouissement humain","fait de mener une vie riche de sens"],["le biais épistémique","déformation systématique de la production du savoir"],["le faux dilemme","choix trompeur limité à deux possibilités"]],"toolkit":[["Cerner l’enjeu","Le cœur du problème réside dans … / Cela présuppose que …"],["Introduire des nuances","Certes, … ; néanmoins, … / La distinction n’est pas que terminologique."],["Réfuter précisément","Cette conclusion n’est valable que si … / Je contesterais la prémisse."],["Synthétiser","Pourrait-on concilier ces positions const STORAGE = 'conversation-lab-pressure-revision-2026-v1';

let lang='en', level='B1', theme='dark', current=0;

const ui=()=>{const c=CONTENT[lang];if(ORDER.indexOf(level)<2&&c.uiSimple)return {...c.ui,...c.uiSimple};if(level==='B1'&&c.uiB1)return {...c.ui,...c.uiB1};return c.ui;};
const data=()=>CONTENT[lang].levels[level];
function setText(id,value){const n=$(id),s=String(value);if(n.textContent!==s)n.textContent=s;}
function setButtonText(id,value){setText(id,value);}
function savePrefs(){try{localStorage.setItem(STORAGE,JSON.stringify({lang,level,theme,current}));}catch(_){}}
function loadPrefs(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(CONTENT[x.lang])lang=x.lang;if(ORDER.includes(x.level))level=x.level;if(['light','dark'].includes(x.theme))theme=x.theme;if(Number.isInteger(x.current)&&x.current>=0&&x.current<8)current=x.current;}catch(_){}}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function replaceChildren(id,items){$(id).replaceChildren(...items);}
function toggleDetails(name,open){const panel=$(name+'Reveal'),button=$(name+'Btn');panel.hidden=!open;button.setAttribute('aria-expanded',String(open));const u=ui();setText(name+'Btn',u[name+(open?'Hide':'Show')]);}
function refreshDetails(){for(const name of ['support','challenge','stretch'])toggleDetails(name,false);}
function renderStation(){
 const u=ui(),s=data().stations[current];
 setText('stationNum',current+1);setText('stationEyebrow',`${u.station} ${current+1} / 8`);
 setText('stationTitle',s.title);setText('stationSubtitle',s.subtitle);
 setText('mainLabel',u.main);setMainQuestion(s.main,typeof s.scenario==='string'&&!!s.scenario.trim());setText('questionsLabel',u.questions);
 setText('stationAnnouncement',`${u.station} ${current+1}: ${s.title}`);
 const hasScenario=typeof s.scenario==='string'&&!!s.scenario.trim();
 $('mainScenario').hidden=!hasScenario;
 if(hasScenario){setText('mainScenarioLabel',u.scenarioLabel);setText('mainScenarioText',s.scenario);}else setText('mainScenarioText','');
 const hasMainExplain=ORDER.indexOf(level)>=3&&typeof s.mainExplain==='string'&&!!s.mainExplain.trim();
 $('mainExplainRow').hidden=!hasMainExplain;$('mainExplainPanel').hidden=true;
 $('mainExplainBtn').setAttribute('aria-expanded','false');
 if(hasMainExplain){setText('mainExplainBtn','ⓘ '+u.mainExplainLabel);setText('mainExplainCaption',u.questionHelpMeaning);setText('mainExplainText',s.mainExplain);}else setText('mainExplainText','');
 
 const advanced=ORDER.indexOf(level)>=3;
 $('questionsHelpTip').hidden=!advanced;
 if(advanced)setText('questionsHelpTip',u.questionHelpTip);
 replaceChildren('questions',s.questions.map((q,i)=>{
  const hint=advanced?s.explanations?.[i]:null;
  if(typeof hint!=='string'||!hint.trim()){const e=make('div','question');e.append(make('span','qnum',i+1),make('span','question-text',q));return e;}
  // Only the Explain button opens the explanation; the question text itself stays available for the word lookup.
  const d=make('div','question question-expandable'),row=make('div','question-summary');

const normLookup=s=>String(s).toLocaleLowerCase().replace(/[’‘]/g,"'").replace(/[‐‑‒–—]/g,'-');
const isLookupLetter=c=>/^[\p{L}\p{M}\p{N}]$/u.test(c||'');
function hideLookup(){$('lookupPopover').hidden=true;}
function readWordAt(text,offset){
 const words=[...text.matchAll(/[\p{L}\p{M}]+(?:[’'-][\p{L}\p{M}]+)*/gu)];
 let selected=words.find(m=>m.index<=offset&&offset<m.index+m[0].length);
 if(!selected)selected=words.find(m=>Math.abs(offset-(m.index+m[0].length))<=1);
 return selected?{word:selected[0],index:selected.index}:null;
}
function localPhraseFor(text,index,sourceLang){
 const flat=normLookup(text), phrases=CZ_GLOSSARY.phrases[sourceLang]||{};
 let best=null;
 for(const [phrase,translation] of Object.entries(phrases)){
  const needle=normLookup(phrase);
  let from=0;
  for(let at;(at=flat.indexOf(needle,from))!==-1;){
   const end=at+needle.length;from=at+1;
   if(index<at||index>=end)continue;
   if((at>0&&isLookupLetter(flat[at-1]))||(end<flat.length&&isLookupLetter(flat[end])))continue;
   if(!best||needle.length>best.expression.length)best={expression:text.slice(at,end),translation,kind:'phrase'};
  }
 }
 return best;
}
function sentenceForLookup(text,index){
 const breaks=[...text.matchAll(/[.!?]+(?=\s|$)/g)];
 let start=0,end=text.length;
 for(const br of breaks){const after=br.index+br[0].length;if(after<=index)start=after;else{end=after;break;}}
 return text.slice(start,end).trim().slice(0,500)||text.trim().slice(0,500);
}
function locateWord(evt,block){
 const x=evt.clientX,y=evt.clientY;
 let caret=null;
 if(typeof document.caretRangeFromPoint==='function')caret=document.caretRangeFromPoint(x,y);
 else if(typeof document.caretPositionFromPoint==='function'){
  const pos=document.caretPositionFromPoint(x,y);
  if(pos){caret=document.createRange();caret.setStart(pos.offsetNode,pos.offset);caret.collapse(true);}
 }
 if(!caret){const s=getSelection();if(s?.rangeCount)caret=s.getRangeAt(0).cloneRange();}
 if(!caret||!block.contains(caret.startContainer))return null;
 try{
  const upto=document.createRange();upto.selectNodeContents(block);
  upto.setEnd(caret.startContainer,caret.startOffset);
  return readWordAt(block.textContent,upto.toString().length);
 }catch(_){return null;}
}

 ihr:['vy; jí; její'],ihre:['její; jejich'],ihren:['jejího; jejich'],ihrem:['jejímu; jejich'],ihrer:['její; jejich']
};
function lookupWordMeaning(word,sourceLang,initial){
 if(sourceLang==='de'&&Object.prototype.hasOwnProperty.call(DE_CASE,word)){const e=DE_CASE[word];return {translation:initial&&e[1]?e[1]:e[0],base:null};}
 const dict=CZ_GLOSSARY.words[sourceLang]||{};
 const norm=normLookup(word);
 if(Object.prototype.hasOwnProperty.call(dict,norm))return {translation:dict[norm],base:null};
 const candidate=[];
 const add=stem=>{if(stem.length>=3&&!candidate.includes(stem))candidate.push(stem);};
 if(sourceLang==='en'){
  if(norm.endsWith("'s"))add(norm.slice(0,-2));
  if(norm.endsWith('ies'))add(norm.slice(0,-3)+'y');
  if(norm.endsWith('ied'))add(norm.slice(0,-3)+'y');
  if(norm.endsWith('ing')){
   const stem=norm.slice(0,-3);add(stem);add(stem+'e');
   if(stem.length>3&&stem.at(-1)===stem.at(-2))add(stem.slice(0,-1));
  }
  if(norm.endsWith('ed')){const stem=norm.slice(0,-2);add(stem);add(stem+'e');}
  if(norm.endsWith('es')){add(norm.slice(0,-2));add(norm.slice(0,-1));}
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='es'){
  if(norm.endsWith('ces'))add(norm.slice(0,-3)+'z');
  if(norm.endsWith('es'))add(norm.slice(0,-2));
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='fr'){
  let base=norm.replace(/^(?:qu|[dljnstmc])'(?=.)/,'');
  const addLoose=x=>{if(x&&!candidate.includes(x))candidate.push(x);};
  if(base!==norm)addLoose(base);
  for(let i=0;i<3;i++){const cut=base.replace(/-(?:t-)?(?:je|tu|il|elle|on|nous|vous|ils|elles|le|la|les|lui|leur|en|y|moi|toi|ce)$/,'');if(cut===base)break;base=cut;addLoose(base);}
  if(base.endsWith('s'))add(base.slice(0,-1));
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='de'){
  if(norm.endsWith('innen'))add(norm.slice(0,-5));
 }
 for(const stem of candidate){if(Object.prototype.hasOwnProperty.call(dict,stem))return {translation:dict[stem],base:stem};}
 return null;
}
function triggerLookup(evt){
 const element=evt.target instanceof Element?evt.target:null;
 if(element?.closest('.question-action'))return;
 const block=evt.__block||element?.closest(LOOKUP_SELECTOR);if(!block||$('lookupPopover').contains(element))return;
 const text=block.textContent?.trim();if(!text)return;
 const hit=evt.__hit||locateWord(evt,block);if(!hit)return;
 const word=hit.word,sentence=sentenceForLookup(text,hit.index);
 const phrase=localPhraseFor(text,hit.index,lang);
 const initial=/^\s*$|[.!?:„“"«(\/–—…]\s*$/.test(text.slice(0,hit.index));
 const meaning=lookupWordMeaning(word,lang,initial);
 lastLookup={block,index:hit.index,kbd:!!evt.__kbd};
 if(phrase){
  setLookupCard(phrase,sentence,evt.clientX,evt.clientY,'Překlad celé fráze · rozšířený offline slovník');
 }else if(meaning){
  setLookupCard({expression:word,translation:meaning.translation,kind:'word'},sentence,evt.clientX,evt.clientY,
   meaning.base?'Základní význam odvozený od „'+meaning.base+'“ · offline slovník':'Základní význam · offline slovník; přesný význam může záviset na větě');
 }else{
  setLookupCard({expression:word,translation:'Tento výraz zatím v rozšířeném offline slovníku není.',kind:'word'},sentence,evt.clientX,evt.clientY,
    'Bez připojení · zkus odvodit význam z kontextu nebo se zeptej vyučujícího');
 }
}
function initLookups(){
 const set=(ORDER.indexOf(level)<2?LOOKUP_HINTS_SIMPLE:LOOKUP_HINTS);
 const [label,text]=set[lang]||set.en;

// Desktop: preserve native double-click selection; iPads/iPhones: one tap avoids Safari double-tap zoom.

let tapStart=null;
document.querySelector('.app').addEventListener('pointerdown',e=>{
 tapStart=(e.pointerType==='touch'||e.pointerType==='pen')?{x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId}:null;
});
document.querySelector('.app').addEventListener('pointercancel',()=>{tapStart=null;});
document.querySelector('.app').addEventListener('pointerup',e=>{
 if(!(e.pointerType==='touch'||e.pointerType==='pen')||!tapStart||tapStart.id!==e.pointerId)return;
 const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y),held=performance.now()-tapStart.t;tapStart=null;
 if(moved<=10&&held<=600&&!(e.target instanceof Element&&e.target.closest('.question-action,.main-explain-btn,button,summary')))triggerLookup(e);
});
function lookupSelection(){
 const sel=getSelection();if(!sel||!sel.rangeCount||sel.isCollapsed)return false;
 const range=sel.getRangeAt(0),node=range.startContainer,el=node.nodeType===1?node:node.parentElement;
 const block=el?.closest(LOOKUP_SELECTOR);if(!block)return false;
 const upto=document.createRange();upto.selectNodeContents(block);upto.setEnd(range.startContainer,range.startOffset);
 const offset=upto.toString().length,text=block.textContent,box=range.getBoundingClientRect();
 const hit=readWordAt(text,offset+Math.max(0,text.slice(offset).search(/[\p{L}\p{M}]/u)));if(!hit)return false;
 triggerLookup({target:el,clientX:box.left,clientY:box.bottom,__hit:hit,__block:block});return true;
}
$('lookupClose').addEventListener('click',hideLookup);
let lastLookup=null;
const LOOKUP_WORD_RE=/[\p{L}\p{M}]+(?:[’'-][\p{L}\p{M}]+)*/gu;
const KBD_LOOKUP_SELECTOR='#mainScenarioText,#mainQuestion,#mainExplainText,#questions .question-text,#questions .question-meaning,#supportList li,#challengeReveal,#stretchReveal,#vocabGrid .vocab-item,#toolkitGrid .vocab-item';
function markLookupTargets(){document.querySelectorAll(KBD_LOOKUP_SELECTOR).forEach(el=>{el.tabIndex=0;el.classList.add('kbd-lookup');});}
function lookupWordsIn(block){return [...block.textContent.matchAll(LOOKUP_WORD_RE)];}
function openLookupAt(block,m,kbd){const r=block.getBoundingClientRect();triggerLookup({target:block,clientX:r.left,clientY:r.bottom,__hit:{word:m[0],index:m.index},__block:block,__kbd:kbd});}
function openFirstWord(block){const w=lookupWordsIn(block);if(w.length)openLookupAt(block,w[0],true);}
function stepLookup(dir){if(!lastLookup||!document.contains(lastLookup.block))return;const w=lookupWordsIn(lastLookup.block);let i=w.findIndex(m=>m.index===lastLookup.index);if(i<0)i=0;const prev=$('lookupExpression').textContent,blk=lastLookup.block,kbd=lastLookup.kbd;for(let n=i+dir;n>=0&&n<w.length;n+=dir){openLookupAt(blk,w[n],kbd);if($('lookupExpression').textContent!==prev)return;}}
$('lookupPrev').addEventListener('click',()=>stepLookup(-1));
$('lookupNext').addEventListener('click',()=>stepLookup(1));
document.addEventListener('pointerdown',e=>{
 if(!$('lookupPopover').hidden&&!$('lookupPopover').contains(e.target)&&!(e.target instanceof Element&&e.target.closest(LOOKUP_SELECTOR)))hideLookup();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('lookupPopover').hidden){hideLookup();if(lastLookup?.kbd&&document.contains(lastLookup.block))lastLookup.block.focus();e.preventDefault();return;}
 if(e.key==='Enter'&&!e.target.closest?.('input,select,textarea,button,a,summary,#timerEditor')){
  const sel=getSelection();if(sel&&!sel.isCollapsed&&e.target.contains?.(sel.anchorNode)&&lookupSelection()){e.preventDefault();return;}
  const blk=e.target.closest?.('.kbd-lookup');if(blk){openFirstWord(blk);e.preventDefault();return;}
 }
 if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!$('lookupPopover').hidden&&lastLookup&&(e.target===lastLookup.block||$('lookupPopover').contains(e.target))){stepLookup(e.key==='ArrowRight'?1:-1);e.preventDefault();}
});

const timeText=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
function updateTimerTranslations(){
 const u=ui();setText('timerLabel',u.timerLabel);$('timerPanel').setAttribute('aria-label',u.timerLabel);

 updateFloatingControls();refreshTimer();
}
function mountTimer(){
 const p=$('timerPanel');
 if(p.parentElement!==$('timerDock'))$('timerDock').appendChild(p);
 if(!mobileTimerQuery.matches)p.classList.remove('mobile-expanded');
 p.hidden=false;updateFloatingControls();
}
function updateFloatingControls(){const expanded=$('timerPanel').classList.contains('mobile-expanded'),u=ui();
 const b=$('timerFloatToggle');b.textContent=expanded?'⌄':'⌃';b.setAttribute('aria-expanded',String(expanded));b.setAttribute('aria-label',expanded?u.timerCollapse:u.timerExpand);b.title=expanded?u.timerCollapse:u.timerExpand;

function setFloatingExpanded(expand){if(!mobileTimerQuery.matches)return;const p=$('timerPanel');if(!expand)closeEditor();p.classList.toggle('mobile-expanded',expand);updateFloatingControls();}
function refreshTimer(){
 if(ticker!==null){left=Math.max(0,endAt-Date.now());if(left===0){clearInterval(ticker);ticker=null;dropWake();showToast(ui().timerFinishToast);}}
 const seconds=Math.ceil(left/1000),u=ui();
 setText('clock',timeText(seconds));$('clock').classList.toggle('almost',seconds>0&&seconds<=15);$('clock').classList.toggle('finished',seconds===0&&duration>0);
 setText('timerStart',ticker!==null?`Ⅱ ${u.timerPause}`:`▶ ${u.timerStart}`);$('timerStart').disabled=seconds===0;$('timerReset').disabled=duration===0||(ticker===null&&left===duration*1000);
 setText('timerHint',ticker!==null?u.timerRunning:duration===0?u.timerInit:seconds===0?u.timerDone:left<duration*1000?u.timerPaused:u.timerReady);
}
let wakeLock=null;
async function holdWake(){try{if('wakeLock' in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(_){wakeLock=null;}}
function dropWake(){try{wakeLock?.release();}catch(_){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ticker!==null)holdWake();});
function stopTimer(){if(ticker!==null){left=Math.max(0,endAt-Date.now());clearInterval(ticker);ticker=null;}dropWake();}
function toggleTimer(){if(!$('timerEditor').hidden)return;if(ticker!==null){stopTimer();refreshTimer();return;}if(left<=0)return;endAt=Date.now()+left;ticker=setInterval(refreshTimer,100);holdWake();refreshTimer();}
function openEditor(reset=false){stopTimer();if(reset){duration=0;left=0;}refreshTimer();const secs=Math.ceil(left/1000);$('timerEditor').hidden=false;setText('timeError','');$('timerMinutes').value=duration?String(Math.floor(secs/60)).padStart(2,'0'):'';$('timerSeconds').value=duration?String(secs%60).padStart(2,'0'):'';$('timerMinutes').focus();$('timerMinutes').select();}
function closeEditor(){$('timerEditor').hidden=true;setText('timeError','');}
function parseTime(mm,ss){const m=mm.trim(),s=ss.trim();if(!/^\d{0,2}$/.test(m)||!/^\d{0,2}$/.test(s)||(!m&&!s))return null;const minutes=Number(m||0),seconds=Number(s||0);if(seconds>59)return null;const total=minutes*60+seconds;return total>=5&&total<=99*60+59?total:null;}
function submitTime(e){e.preventDefault();const seconds=parseTime($('timerMinutes').value,$('timerSeconds').value);if(seconds===null){setText('timeError',ui().timerError);(Number($('timerSeconds').value)>59?$('timerSeconds'):$('timerMinutes')).focus();return;}stopTimer();duration=seconds;left=seconds*1000;closeEditor();refreshTimer();$('clock').focus();showToast(ui().timerSetToast);}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('timerEditor').hidden){closeEditor();refreshTimer();$('clock').focus();e.preventDefault();}});
document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;const t=e.target;
 // Arrows change stations on the page itself and inside station navigation (list + Previous/Next);
