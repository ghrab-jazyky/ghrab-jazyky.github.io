d of failing. What might they lose by not trying at all?","questions":["What makes a risk worth taking?","How might failing in public differ from failing in private?","Is the claim that failure builds character always true?"],"explanations":["Every risk can end well or badly. How do you decide whether a risk is worth taking? What would make it worth it?","Failing in front of others can feel very different from failing when nobody is watching. How might these two experiences differ, and why?","People often say that failure makes us stronger. Is this always true, or are there situations where it does not work like that?"],"support":["The main trade-off seems to be …","I would draw the line at …","How would you respond to the objection that …?"],"challenge":"A talented student never enters competitions for fear of losing. Give realistic advice.","stretch":"Debate when it makes sense to stop trying rather than continue, and agree on one criterion that would help someone decide."},{"title":"Always busy, never enough","subtitle":"Ambition, rest and exhaustion.","main":"Is hard work admirable if it leaves no room to enjoy life?","mainExplain":"Imagine someone who works or studies all the time and has no time for anything else. Should we admire this, or is something important missing?","questions":["Why does society sometimes celebrate overwork?","A classmate studies late every night and no longer enjoys hobbies. Is this ambition or a warning sign? What else would you need to know?","What compromises would you refuse to make?"],"explanations":["In some places, working very long hours is admired and talked about proudly. Why might society sometimes praise people who work too much?","Wanting to achieve a lot can be healthy, but it can also exhaust people over a long time. How could someone tell the difference between the two in their own life?","Reaching a goal often means giving something up. What would you never be willing to give up, even for success?"],"support":["The main trade-off seems to be …","I would draw the line at …","How would you respond to the objection that …?"],"challenge":"A student sleeps only five hours a night because of clubs and homework, but says the activities are worth it. Give practical advice that respects their priorities.","stretch":"Propose a school rule that protects students’ well-being and answer the strongest objection to it."},{"title":"Passion or pay?","subtitle":"Choosing a future without perfect options.","main":"Would you accept lower pay for work you genuinely value?","mainExplain":"Imagine two jobs: one you really care about but with lower pay, and one that pays well but means little to you. What would make you choose one or the other?","questions":["How much does financial security affect freedom?","Can a dream job turn into a burden?","How would you weigh meaning, salary and personal time?"],"explanations":["Having enough money can give people more choices in life. How might financial security, or the lack of it, affect how free someone really is?","A dream job sounds like something that can only make people happy. Could it also become stressful or a burden? How?","A job can offer meaning, a good salary and free time, but rarely all three in full. How would you decide what matters most to you?"],"support":["The main trade-off seems to be …","I would draw the line at …","How would you respond to the objection that …?"],"challenge":"Choose between a meaningful low-paid job and a secure but dull job. Defend the trade-off.","stretch":"Describe a third option and explain which trade-off it still cannot avoid."},{"title":"The right to be ordinary","subtitle":"Do we really have to stand out?","main":"Is it reasonable to aim for a happy life without trying to stand out?","mainExplain":"Some people do not want to be famous or the best at anything; they just want a good, quiet life. Is that a reasonable goal, or should young people aim higher?","questions":["Why do we celebrate exceptional achievements?","Can the pursuit of excellence become unhealthy?","How would you define a life that is enough?"],"explanations":["People are often fascinated by exceptional achievements, such as records, prizes or great discoveries. Why might we admire them so much?","Always trying to be the best can bring great results. Could it also become harmful for a person? When?","Many people talk about a life full of big achievements. How would you describe a life that would feel “enough” for you?"],"support":["The main trade-off seems to be …","I would draw the line at …","How would you respond to the objection that …?"],"challenge":"Write a three-line ‘success manifesto’ (We refuse to… / We value… / We remember…), then test one line against a strong counterexample.","stretch":"Challenge one unrealistic idea about success in your society and explain who benefits from it."}],"vocab":[["self-worth","how valuable you believe you are"],["social recognition","public approval for achievements"],["perfectionism","feeling everything must be flawless"],["burnout","exhaustion from prolonged stress"],["trade-off","losing one benefit to gain another"],["privilege","an advantage not everyone has"],["fulfilling","giving deep personal satisfaction"],["financial security","reliable access to enough money"],["stigma","unfair disapproval attached to something"],["resilience","capacity to recover from setbacks"],["conformity","following accepted expectations"],["external validation","approval that comes from other people"]],"toolkit":[["State a view","I’d argue that … / It seems to me that …"],["Justify it","One reason is … / A case in point is …"],["Disagree constructively","I see where you’re coming from, but … / I’d question whether …"],["Probe further","What makes you say that? / Would that still apply if …?"]]},"C1":{"warm":"Define success in one sentence, then refine it after your partner presents a counterexample.","stations":[{"title":"What counts as success?","subtitle":"Start by asking what we are really aiming for.","main":"To what extent do public expectations shape what we consider personal success?","mainExplain":"We often think our idea of success is our own. But how much of it comes from what other people expect of us?","questions":["Two equally talented students want an unpaid internship, but only one can afford it. What does that reveal about the freedom to pursue success?","Can a person reject conventional success without feeling judged?","What would a more inclusive definition of achievement look like?"],"explanations":["Some people can afford to choose a path that fulfils them, others have to think mainly about earning money. How might social background affect who can follow their own idea of a good life?","Some people choose not to follow the usual idea of success, like a high income or a prestigious job. Can they make this choice without feeling judged by others? Why, or why not?","Our usual idea of achievement leaves out some people and some kinds of lives. What might a definition of success look like that includes more people?"],"support":["That argument rests on the assumption that …","The unintended consequence might be …","Could we distinguish between … and …?"],"challenge":"Develop a definition of success that accounts for unequal starting points.","stretch":"Test whether your definition works for someone who rejects all public recognition."},{"title":"The grade trap","subtitle":"When achievements become numbers.","main":"Do grades primarily measure learning, or conformity to a particular system?","mainExplain":"A high grade may show that a student has learned a lot, or that they know exactly what the school wants to see. How can we tell the difference?","questions":["How can assessment distort students’ priorities?","Could removing grades create new forms of inequality?","What balance between standards and individual growth seems defensible?"],"explanations":["When students know how they will be assessed, they may change what they focus on. How might assessment change what students see as important?","Removing grades is sometimes suggested to reduce pressure. Could this create new kinds of unfairness? How?","Schools want to keep high standards but also support each student’s personal development. What balance between these two would you be able to defend?"],"support":["That argument rests on the assumption that …","The unintended consequence might be …","Could we distinguish between … and …?"],"challenge":"Propose a school assessment model that values learning without abandoning standards.","stretch":"Identify an unintended consequence of your own proposal."},{"title":"Whose dream is it?","subtitle":"Expectations from family and other people.","main":"How do we distinguish supportive guidance from subtle control over someone’s life choices?","mainExplain":"Parents or teachers often give advice about the future. When does this advice help someone choose freely, and when does it quietly make the choice for them?","questions":["Under what conditions, if any, might family sacrifices create obligations?","How might cultural expectations change your answer?","Can autonomy coexist with a genuine duty to others?"],"explanations":["Under what conditions, if any, could the sacrifices a family has made for someone create a duty for that person? What kind of duty would it be?","Ideas about duty towards family are not the same in every culture. How might the cultural background change the way people answer the question about family sacrifices?","Being free to make your own decisions and feeling responsible for others can seem to pull in different directions. Can both exist together in a person’s life? How?"],"support":["That argument rests on the assumption that …","The unintended consequence might be …","Could we distinguish between … and …?"],"challenge":"Argue both for and against an obligation to meet family expectations.","stretch":"Reconcile personal autonomy with duties arising from relationships."},{"title":"The comparison trap","subtitle":"Why does everybody else seem ahead?","main":"How do digital platforms shape our sense of what a successful life looks like?","mainExplain":"Online, we mostly see other people’s best moments and achievements. How might this change our idea of what a normal or successful life looks like?","questions":["Does comparison depend more on personality or social structures?","Under what conditions might public recognition help or harm someone?","How might you define progress without external benchmarks?"],"explanations":["Some people compare themselves with others much more than others do. Is this mainly a matter of personality, or does society and its structure play a larger role?","Being publicly recognised can make people feel valued, but it can also put them under pressure. Under what conditions might public recognition help, and when might it harm someone?","We often measure our progress by comparing ourselves with others. How could you judge your own progress without using other people as a measure?"],"support":["That argument rests on the assumption that …","The unintended consequence might be …","Could we distinguish between … and …?"],"challenge":"Design a thought experiment about a society without public rankings.","stretch":"Examine how status competition might reappear in less visible forms."},{"title":"The fear of failure","subtitle":"Mistakes, risk and trying again.","main":"Under what conditions does failure genuinely lead to learning?","mainExplain":"People often say that we learn from our mistakes. What has to happen after a failure for someone to actually learn something, rather than just feel bad?","questions":["What personal and social factors may affect recovery from setbacks?","When is celebrating resilience insensitive?","Should institutions reward intelligent risk-taking even when it fails?"],"explanations":["People recover from setbacks very differently. What personal and social circumstances might make it easier or harder to recover?","Praising people for being resilient can sound encouraging. When might such praise feel insensitive to someone who is struggling?","Institutions like schools or companies often reward only success. Should they also reward people who took a well-considered risk that did not work out? Why, or why not?"],"support":["That argument rests on the assumption that …","The unintended consequence might be …","Could we distinguish between … and …?"],"challenge":"Critique the phrase ‘failure is the best teacher’ from two social positions.","stretch":"Formulate conditions under which failure can genuinely be productive."},{"title":"Always busy, never enough","subtitle":"Ambition, rest and exhaustion.","scenario":"A student feels guilty whenever they rest instead of studying.","main":"Why might others admire this attitude, and when could it become harmful?","mainExplain":"Some people see constant work as a sign of good character. Why might that be, and at what point does this attitude start to hurt the person who has it?","questions":["Can ambition be driven by both genuine interest and anxiety?","Who might benefit from, or be harmed by, a culture that glorifies exhaustion?","What would a healthier account of achievement require?"],"explanations":["People can work hard because they love what they do, or because they are afraid of what happens if they do not. Can both reasons drive the same person at the same time?","Some cultures praise people for being constantly tired and busy. Who might gain from such a culture, and who might suffer from it?","Our current idea of achievement often leaves little room for rest. What would have to change for a healthier understanding of achievement?"],"support":["That argument rests on the assumption that …","The unintended consequence might be …","Could we distinguish between … and …?"],"challenge":"Defend a right to leisure without presenting it as a tool for productivity.","stretch":"Examine who bears the cost of other people’s work–life balance."},{"title":"Passion or paycheck?","subtitle":"Choosing a future without perfect options.","scenario":"Two teenagers hear the advice “Follow your passion”. One must help support their family financially; the other does not.","main":"Is the advice equally fair to both?","mainExplain":"The same advice can sound very different depending on someone’s situation. What would “following your passion” cost each of the two teenagers?","questions":["Who benefits when young people are told that loving their job matters more than their pay?","Can meaningful work compensate for insecure conditions?","Is there a moral duty to seek a socially useful career?"],"explanations":["Advice such as “Follow your passion” is often given to all young people in the same way. Who gains when people accept lower pay for work they love, and who might lose? Think of employers, families and the young people themselves.","A job can feel very meaningful but offer little security or a low income. Can meaning make up for poor working conditions? For whom, and for how long?","Some jobs clearly help society more than others. Is there a moral duty to choose such a job, or is that a personal decision? Why?"],"support":["That argument rests on the assumption that …","The unintended consequence might be …","Could we distinguish between … and …?"],"challenge":"Critically assess the advice ‘turn your passion into a career’.","stretch":"Reframe the debate in terms of essential but poorly paid work."},{"title":"The right to be ordinary","subtitle":"Do we really have to stand out?","main":"Does the expectation to be exceptional undermine everyday happiness?","mainExplain":"If everyone is expected to be special or outstanding, what happens to the value of a normal, happy everyday life?","questions":["Can ambition be detached from status?","What assumptions lie behind the word ‘ordinary’?","How might a society value lives that attract little attention?"],"explanations":["Ambition is often connected with wanting to be admired or to have a high position. Can people be ambitious without caring about status?","The word “ordinary” can sound neutral, positive or negative. What hidden judgements might people make when they call a life “ordinary”?","Many people live quiet lives that rarely attract attention. How could a society show that it values such lives?"],"support":["That argument rests on the assumption that …","The unintended consequence might be …","Could we distinguish between … and …?"],"challenge":"Write a short counterargument to the claim that everyone must become extraordinary.","stretch":"Debate whether contentment is a choice, an achievement or a social privilege."}],"vocab":[["meritocracy","the idea that rewards should follow ability and effort"],["social mobility","movement between positions in a social hierarchy"],["agency","the ability to make meaningful choices"],["structural inequality","disadvantage built into institutions"],["precarity","ongoing insecurity in work or life"],["self-determination","control over one’s own direction"],["productivity culture","social pressure to be constantly useful"],["normative assumption","an unstated belief about what should be"],["collective responsibility","duties shared by a group or society"],["social status","position or prestige within a community"],["fulfilment","lasting sense of meaning and satisfaction"],["counterargument","a reason against a particular claim"]],"toolkit":[["Qualify a claim","To a large extent, … / This is not to suggest that …"],["Build a case","The underlying assumption is … / This becomes clear when …"],["Challenge tactfully","I’d be reluctant to accept that premise because …"],["Develop dialogue","Could you elaborate on …? / How would that work in practice?"]]},"C2":{"warm":"State a popular belief about achievement, identify its hidden assumption and construct a counterexample.","stations":[{"title":"What counts as success?","subtitle":"Start by asking what we are really aiming for.","scenario":"One student wins a major prize; another spends a year caring for a relative and receives no award.","main":"Who is seen as successful, and what does that reveal about social status?","mainExplain":"Both students put in a great deal of effort, but only one is publicly recognised. What decides which kinds of effort count as success in a society?","questions":["What hidden assumptions underpin meritocratic narratives?","How might contingency undermine claims that achievements are entirely deserved?","Can success be defined without ranking lives against one another?"],"explanations":["Stories about merit say that success comes from talent and effort. What unspoken beliefs might lie behind such stories?","Many things in life depend on chance, not only on effort. If chance plays a part, can we still say that people fully deserve their success?","Definitions of success often put lives in an order from more to less successful. Is it possible to talk about success without ranking people’s lives?"],"support":["This conflates … with …","A counterexample would undermine the claim that …","I would reformulate the issue as …"],"challenge":"Argue that “success” is an irreducibly social category, then try to defend a purely private definition against that argument.","stretch":"Decide whether luck can ever be fully separated from merit, and what follows for how we reward people."},{"title":"The grade trap","subtitle":"When achievements become numbers.","scenario":"Imagine a school that grades only how quickly students answer.","main":"How might that change what they learn – and what teachers call ability?","mainExplain":"If speed were the only thing rewarded, students would start practising speed. Could the way we test change what we think ability actually is?","questions":["Can ostensibly objective grades conceal structural advantages?","What would a credible alternative to conventional ranking need to preserve?","Can demanding academic standards coexist with substantial efforts to reduce inequality?"],"explanations":["Grades often look neutral and objective. Could they still hide advantages that some students have because of their background? How?","Imagine replacing the usual ranking of students with something else. What would such an alternative need to keep in order to be taken seriously?","High academic standards and strong efforts to reduce inequality are sometimes seen as conflicting. Can they exist together? How?"],"support":["This conflates … with …","A counterexample would undermine the claim that …","I would reformulate the issue as …"],"challenge":"Argue that any assessment reform merely relocates inequality, then test that argument against the strongest counterexamples.","stretch":"Specify which features of grading are indispensable and which are mere convention, and justify the distinction."},{"title":"Whose dream is it?","subtitle":"Expectations from family and other people.","main":"Where does a legitimate sense of familial obligation end and coercion begin?","mainExplain":"Family members may owe each other something, such as help or loyalty. At what point does a sense of duty turn into pressure that takes away someone’s freedom?","questions":["Can inherited expectations be freely embraced rather than merely obeyed?","How should conflicting ideals of autonomy and reciprocity be reconciled?","When does the language of ‘following your dreams’ obscure material dependence?"],"explanations":["Many young people take over expectations from their family. Can someone truly choose to accept such expectations as their own, rather than simply following them?","Personal freedom and the idea of giving back what one has received can come into conflict. How should these two values be balanced when they clash?","“Follow your dreams” sounds encouraging. When might this phrase hide the fact that some people depend on others financially and cannot freely choose?"],"support":["This conflates … with …","A counterexample would undermine the claim that …","I would reformulate the issue as …"],"challenge":"Reconstruct a strong case for filial obligation in terms your opponent would accept, then identify the point at which it turns into coercion.","stretch":"Assess whether gratitude can ever generate a binding duty, or only a moral expectation."},{"title":"The comparison trap","subtitle":"Why does everybody else seem ahead?","scenario":"One student shares every achievement online; another avoids social media.","main":"Can either of them really escape comparison, and why?","mainExplain":"Leaving social media might seem to end comparison, but people may still compare themselves in other ways. Is it possible to step outside comparison at all?","questions":["Under what conditions might platforms profit from insecurity while presenting visibility as empowering?","Can we meaningfully opt out of the attention economy?","Is self-comparison less corrosive than competition with others?"],"explanations":["Platforms often present visibility as something that gives people power. Under what conditions could they at the same time earn money from people’s insecurity?","Our attention is constantly competed for by apps and media. Can a person really step out of this, or is it almost impossible today?","Some people compare themselves only with their earlier self instead of with others. Is this kind of comparison less harmful? Why, or why not?"],"support":["This conflates … with …","A counterexample would undermine the claim that …","I would reformulate the issue as …"],"challenge":"Construct the strongest defence of social comparison as a source of progress, then expose its hidden costs.","stretch":"Consider whether withdrawing from public visibility is a genuine form of freedom or merely another privilege."},{"title":"The fear of failure","subtitle":"Mistakes, risk and trying again.","main":"To what extent is celebrating failure easier for people with financial or social security?","mainExplain":"Saying “it’s fine to fail” is easier if your family can support you when things go wrong. How does someone’s safety net change what failure means for them?","questions":["When does resilience rhetoric shift responsibility away from institutions?","How should we distinguish admirable persistence from a refusal to reassess?","Can an unsuccessful attempt possess more value than a successful outcome?"],"explanations":["Talk about resilience encourages people to cope with difficulties themselves. When might it move responsibility away from schools, employers or the state onto individuals?","Not giving up is often admired. But how can we tell the difference between admirable persistence and refusing to rethink a goal that no longer makes sense?","We usually value results more than attempts. Could an attempt that failed sometimes be worth more than a success? In what sense?"],"support":["This conflates … with …","A counterexample would undermine the claim that …","I would reformulate the issue as …"],"challenge":"Rewrite ‘failure is the best teacher’ so that it remains true for people with no safety net, and defend your formulation.","stretch":"Distinguish failures that teach from failures that merely harm, and identify who decides which is which."},{"title":"Always busy, never enough","subtitle":"Ambition, rest and exhaustion.","scenario":"A classmate says: “Rest is a waste of time unless it makes you more productive.”","main":"What moral judgement is hidden in that claim, and is it defensible?","mainExplain":"The statement treats rest as valuable only when it leads to more work. What does that say about how we judge people, and can rest have value of its own?","questions":["Which contradictions arise when leisure is framed as another optimisation project?","How might meaningful ambition be sustained without self-exploitation?","What would it mean to defend an unconditional right to rest?"],"explanations":["Even free time is sometimes planned to be as useful and efficient as possible. What contradictions might arise when leisure becomes another thing to optimise?","Ambition can give life meaning, but it can also lead people to push themselves too hard. How could someone stay ambitious without exploiting themselves?","An unconditional right to rest would mean that rest does not have to be earned. What would it mean in practice to defend such a right?"],"support":["This conflates … with …","A counterexample would undermine the claim that …","I would reformulate the issue as …"],"challenge":"Make the case for rest as an end in itself, without appealing to health, productivity or well-being.","stretch":"Identify whose invisible labour makes other people’s leisure possible, and what that implies for a just distribution of time."},{"title":"Passion or paycheck?","subtitle":"Choosing a future without perfect options.","main":"Is the choice between fulfilment and financial stability a false dichotomy?","mainExplain":"People often talk as if you must choose between a job you love and a job that pays well. Is that really the only choice, or are there other possibilities?","questions":["When does turning one’s passion into a profession undermine that passion?","How should society value necessary work that offers little prestige?","Can career advice ever be politically neutral?"],"explanations":["Turning a hobby or passion into a job can be a dream. When might doing it professionally destroy the joy that made it a passion?","Some jobs are necessary for society but bring little respect or prestige. How should society show the value of such work?","Career advice may seem purely practical. Could it ever be completely free of political values and assumptions? Why, or why not?"],"support":["This conflates … with …","A counterexample would undermine the claim that …","I would reformulate the issue as …"],"challenge":"Argue that the ideal of ‘doing what you love’ serves employers better than workers, then concede what it gets right.","stretch":"Propose criteria for the social value of work that depend on neither pay nor prestige."},{"title":"The right to be ordinary","subtitle":"Do we really have to stand out?","scenario":"A teenager wants a modest job and a quiet life.","main":"Who might call that life “ordinary” or “unsuccessful”, and what does that label reveal?","mainExplain":"Calling a life “ordinary” sounds like a simple description, but it can also be a judgement. Who decides what counts as ordinary, and what values lie behind that word?","questions":["Could the demand for authenticity become another competitive performance?","Is contentment a form of resistance, complacency, or neither?","What account of a flourishing life survives the rejection of exceptionalism?"],"explanations":["Being “authentic” is often presented as an ideal. Could the effort to appear authentic itself become a new kind of competition?","Being content with one’s life can be seen in different ways. Is it a way of resisting pressure, a way of giving up, or something else entirely?","If we no longer accept that a good life must be exceptional, what idea of a flourishing life remains? What would it consist of?"],"support":["This conflates … with …","A counterexample would undermine the claim that …","I would reformulate the issue as …"],"challenge":"Defend ordinariness without turning it into a new ideal to be achieved.","stretch":"Examine whether the language of ‘authenticity’ escapes the logic of competition or merely refines it."}],"vocab":[["contingency","the role of chance and circumstances"],["meritocratic narrative","a story that treats outcomes as deserved"],["normative judgement","a claim about what ought to be valued"],["moral worth","a person’s value understood in ethical terms"],["reciprocity","mutual responsibility or exchange"],["commodification","turning something into a marketable product"],["instrumental value","usefulness as a means to another end"],["self-exploitation","pushing oneself beyond reasonable limits"],["status hierarchy","a ranking based on prestige"],["flourishing","living well in a rich and meaningful sense"],["epistemic bias","a systematic distortion in how knowledge is formed"],["false dichotomy","a misleading choice between two options"]],"toolkit":[["Frame the issue","The crux of the matter is … / This presupposes that …"],["Handle nuance","Granted, …; nevertheless, … / The distinction is not merely semantic."],["Rebut precisely","That inference holds only if … / I would challenge the premise."],["Synthesise","Might we reconcile these views by …? / A more defensible position is …"]]}},"uiSimple":{"eyebrow":"SPEAK · ASK · ANSWER · LISTEN","hero":"School, family, friends, money, the future. What is important to you? Talk about it with a partner.","privacy":"You can invent examples. You don’t need to talk about your grades, your family or your private life.","step3":"Ask your partner a question.","step4":"Need more? Open the next task.","questions":"More questions","supportTitle":"Need help?","supportDesc":"Words to start your sentence.","supportShow":"Show help","supportHide":"Hide help","challengeTitle":"More to talk about","challengeDesc":"When you finish the main question.","challengeShow":"Show task","challengeHide":"Hide task","stretchTitle":"A harder task","stretchDesc":"When you want more.","stretchShow":"Show harder task","stretchHide":"Hide harder task","progress":"Say why. Give an example. Ask your partner.","vocabLabel":"USEFUL WORDS","vocabDesc":"Use the words that help you.","toolkitLabel":"USEFUL PHRASES","toolkitDesc":"Talk together: ask and answer.","title":"Is Success Important?","strap":"What is a good life for you?"},"uiB1":{"stretchTitle":"Go one step further","stretchDesc":"A harder task for confident speakers.","vocabDesc":"Choose words that are useful; you don’t need to use them all.","strap":"Who decides what success is?","progress":"Give reasons, examples and real reactions."}},"es":{"ui":{"title":"La presión por triunfar","strap":"¿Quién decide qué es el éxito?","brand":"LABORATORIO DE CONVERSACIÓN","subbrand":"Una conversación, no un examen","eyebrow":"HABLA · CUESTIONA · JUSTIFICA · RESPONDE","hero":"Las notas. Las expectativas. La competencia. El fracaso. El futuro. ¿Quién decide en qué consiste tener éxito? Explóralo con otra persona, conversación a conversación.","privacy":"Puedes usar ejemplos ficticios. Nadie tiene que compartir sus notas, problemas familiares o experiencias privadas.","format":"En parejas","estimated":"45 min · 5 estaciones","changeLevel":"Nivel MCER","changeLanguage":"Idioma","themeDay":"Claro","themeNight":"Oscuro","fullscreen":"Pantalla completa","exitFullscreen":"Salir de pantalla completa","resetLesson":"Reiniciar","levelGoal":"Objetivo oral","step1":"Piensa un momento.","step2":"Da una razón o un ejemplo.","step3":"Haz una pregunta a tu compañero o compañera.","step4":"Abre el reto si quieres seguir hablando.","warmTitle":"Calentamiento","warmTime":"2–3 min · opcional","warmHint":"Opcional: una actividad corta para empezar.","stations":"Estaciones de conversación","station":"Estación","of":"de","main":"PREGUNTA PRINCIPAL","questions":"Explora la pregunta","supportTitle":"¿Necesitas ayuda para expresarte?","supportDesc":"Frases útiles si no sabes cómo continuar.","supportShow":"Mostrar ayuda","supportHide":"Ocultar ayuda","challengeTitle":"Profundiza en la conversación","challengeDesc":"Usadlo cuando ya hayáis explorado la pregunta principal.","challengeShow":"Ver reto","challengeHide":"Ocultar reto","stretchTitle":"Ve un paso más allá","stretchDesc":"Una perspectiva más compleja para quien quiera profundizar.","stretchShow":"Ver ampliación","stretchHide":"Ocultar ampliación","previous":"Anterior","next":"Siguiente","stay":"Última estación","progress":"Da razones, ejemplos y respuestas auténticas.","vocabLabel":"VOCABULARIO ÚTIL","vocabDesc":"Elige las palabras que te sirvan; no tienes que usarlas todas.","toolkitLabel":"RECURSOS PARA CONVERSAR","toolkitDesc":"Dialogad: no hagá do las mismas metas?","mainExplain":"Imagina que nadie, ni siquiera tus amigos o tu familia, supiera de tus éxitos. ¿Seguirían siendo iguales tus metas o algunas dependen de lo que piensan los demás?","questions":["¿Puede existir el éxito sin reconocimiento social?","¿Hasta qué punto es tuya tu idea del éxito?","¿Pueden tener el mismo éxito personas con vidas muy distintas?"],"explanations":["El éxito suele relacionarse con elogios, «me gusta» o la admiración de los demás. ¿Podría alguien sentirse exitoso aunque nadie notara ni elogiara lo que ha conseguido?","Nuestra idea del éxito puede venir de la familia, la escuela, los amigos o los medios. ¿Cuánto de tu propia idea del éxito has elegido realmente tú?","Dos personas pueden vivir vidas muy distintas, por ejemplo con trabajos, lugares u objetivos diferentes. ¿Podrían tener las dos el mismo éxito? ¿De qué dependería?"],"support":["El principal dilema parece ser …","Yo pondría el límite en …","¿Qué responderías a quien afirma que …?"],"challenge":"Ordenad libertad, dinero, amistad, reconocimiento y sentido vital. Defended vuestra primera opción.","stretch":"Imaginad que perdierais todo el reconocimiento público por vuestros logros. ¿Qué cambiaría?"},{"title":"La trampa de las notas","subtitle":"Cuando los logros se convierten en números.","main":"¿Predicen las notas excelentes un futuro de éxito?","mainExplain":"Piensa en personas con notas excelentes y en otras con notas normales. ¿Indican las notas quién tendrá éxito más adelante o importan más otras cosas?","questions":["¿Qué aspectos importantes no recoge una calificación?","¿Preferirías dominar una materia o sacar la mejor nota?","¿Cómo se podría evaluar el progreso de forma más justa?"],"explanations":["Las notas muestran algunas cosas de un alumno, pero no todas. ¿Qué cualidades o capacidades importantes podría no mostrar una nota?","A veces se puede sacar buena nota sin entender de verdad una materia, o entenderla bien sin la mejor nota. ¿Qué elegirías si solo pudieras tener una de las dos cosas y por qué?","Mucha gente siente que la forma de evaluar en la escuela no siempre es justa. ¿Cómo se podría medir el progreso de los alumnos de forma más justa?"],"support":["El principal dilema parece ser …","Yo pondría el límite en …","¿Qué responderías a quien afirma que …?"],"challenge":"Dos alumnos: uno saca notas excelentes durmiendo cinco horas cada noche; el otro aprende despacio pero disfruta en clase. Argumentad a cuál de los dos premia más el sistema escolar y si debería hacerlo.","stretch":"Diseñad un sistema de evaluación más justo y defendedlo ante un profesor que teme que baje el nivel."},{"title":"¿De quién es ese sueño?","subtitle":"Expectativas familiares y decisiones propias.","scenario":"Un estudiante quiere estudiar música, pero su familia prefiere Derecho.","main":"¿Cuándo debería defender su decisión?","mainExplain":"El estudiante y su familia quieren cosas distintas. ¿Cuándo es correcto seguir el propio plan y cuándo deberían pesar más las preocupaciones de la familia?","questions":["¿En qué momento el apoyo familiar se transforma en presión?","¿Cómo influyen el dinero, las obligaciones y las oportunidades en la libertad de elegir?","¿Cómo negociarías un desacuerdo importante sobre tu futuro?"],"explanations":["Los padres suelen apoyar a sus hijos porque quieren lo mejor para ellos. ¿Cuándo podría ese apoyo empezar a sentirse como presión?","No todo el mundo tiene la misma libertad para elegir su futuro. ¿Cómo podrían el dinero, las obligaciones en casa o las oportunidades del entorno influir en lo que alguien puede elegir?","Imagina que tú y tu familia no estáis nada de acuerdo sobre tu futuro. ¿Cómo intentarías hablarlo y encontrar una solución?"],"support":["El principal dilema parece ser …","Yo pondría el límite en …","¿Qué responderías a quien afirma que …?"],"challenge":"Tu familia solo pagará tus estudios si puede elegir la carrera. Negociad una solución.","stretch":"Proponed un acuerdo que respete vuestra autonomía y vuestras responsabilidades, y nombrad un riesgo que cada parte tendría que aceptar."},{"title":"La trampa de la comparación","subtitle":"¿Por qué parece que los demás van por delante?","main":"¿Competimos con los demás incluso cuando nadie nos lo pide?","mainExplain":"Nadie organiza una competición y, aun así, la gente compara notas, aspecto o seguidores. ¿Por qué ocurre y es siempre algo negativo?","questions":["¿Cómo deforman las redes nuestra percepción de los logros?","¿Puede ser positiva la comparación sin dañar la autoestima?","¿Qué podría ayudar a quien siente que se está quedando atrás?"],"explanations":["En las redes sociales, la gente muestra sobre todo sus éxitos. ¿Cómo podría esto cambiar la forma en que vemos nuestros logros y los de los demás?","Compararnos con otros puede motivarnos, pero también hacernos sentir mal. ¿Cuándo puede ayudar la comparación sin dañar la imagen que tenemos de nosotros mismos?","Algunas personas sienten que todos avanzan mientras ellas se quedan atrás. ¿Qué podría ayudar a alguien que se siente así?"],"support":["El principal dilema parece ser …","Yo pondría el límite en …","¿Qué responderías a quien afirma que …?"],"challenge":"Ves en redes que una amiga ha conseguido una gran beca. Explica cómo te sientes.","stretch":"Propón dos hábitos para compararte menos y explica por qué uno de ellos podría no servirle a todo el mundo."},{"title":"El miedo al fracaso","subtitle":"Errores, riesgos y nuevas oportunidades.","main":"¿Es a veces peor evitar el fracaso que fracasar?","mainExplain":"Algunas personas nunca intentan algo difícil por miedo a fracasar. ¿Qué podrían perder por no intentarlo siquiera?","questions":["¿Cuándo merece la pena arriesgarse?","¿En qué podría diferenciarse fracasar en público de hacerlo en privado?","¿Es siempre cierto que el fracaso nos hace más fuertes?"],"explanations":["Todo riesgo puede salir bien o mal. ¿Cómo decides si merece la pena arriesgarse? ¿Qué haría que valiera la pena?","Fracasar delante de otros puede sentirse muy distinto de fracasar cuando nadie mira. ¿En qué podrían diferenciarse estas dos experiencias y por qué?","Se dice a menudo que el fracaso nos hace más fuertes. ¿Es siempre así o hay situaciones en las que no funciona de esa manera?"],"support":["El principal dilema parece ser …","Yo pondría el límite en …","¿Qué responderías a quien afirma que …?"],"challenge":"Un alumno con talento no participa en concursos por miedo a perder. Aconséjalo.","stretch":"Debatid cuándo es mejor dejar de intentarlo y acordad un criterio que ayude a decidirlo."},{"title":"Siempre ocupados","subtitle":"Ambición, descanso y agotamiento.","main":"¿Es admirable trabajar mucho si no queda tiempo para vivir?","mainExplain":"Imagina a alguien que trabaja o estudia todo el tiempo y no tiene tiempo para nada más. ¿Deberíamos admirarlo o le falta algo importante?","questions":["¿Por qué se celebra a veces el exceso de trabajo?","Una compañera estudia hasta tarde cada noche y ya no disfruta de sus aficiones. ¿Es ambición o una señal de alarma? ¿Qué más necesitarías saber?","¿A qué no renunciarías para alcanzar una meta?"],"explanations":["En algunos ambientes se admira trabajar muchísimas horas y se habla de ello con orgullo. ¿Por qué podría la sociedad elogiar a veces a quien trabaja demasiado?","Querer lograr mucho puede ser sano, pero también puede agotar a alguien durante mucho tiempo. ¿Cómo podría una persona distinguir entre ambas cosas en su propia vida?","Alcanzar una meta suele significar renunciar a algo. ¿A qué no estarías dispuesto a renunciar nunca, ni siquiera por el éxito?"],"support":["El principal dilema parece ser …","Yo pondría el límite en …","¿Qué responderías a quien afirma que …?"],"challenge":"Un estudiante solo duerme cinco horas cada noche por sus actividades y los deberes, pero dice que merece la pena. Dale consejos prácticos que respeten sus prioridades.","stretch":"Propón una norma escolar que proteja el bienestar del alumnado y responde a la objeción más fuerte contra ella."},{"title":"¿Vocación o sueldo?","subtitle":"Elegir un futuro sin opciones perfectas.","main":"¿Aceptarías cobrar menos por un trabajo que te apasione?","mainExplain":"Imagina dos trabajos: uno que te importa de verdad pero está peor pagado, y otro bien pagado que significa poco para ti. ¿Qué decidiría tu elección?","questions":["¿Cómo influye la estabilidad económica en la libertad personal?","¿Puede un trabajo soñado convertirse en una carga?","¿Cómo equilibrarías sueldo, sentido y tiempo libre?"],"explanations":["Tener suficiente dinero puede dar más opciones en la vida. ¿Cómo podría la estabilidad económica, o su falta, influir en lo libre que es realmente alguien?","Un trabajo soñado parece algo que solo puede hacer feliz. ¿Podría también volverse estresante o una carga? ¿Cómo?","Un trabajo puede ofrecer sentido, buen sueldo y tiempo libre, pero rara vez las tres cosas por completo. ¿Cómo decidirías qué es lo más importante para ti?"],"support":["El principal dilema parece ser …","Yo pondría el límite en …","¿Qué responderías a quien afirma que …?"],"challenge":"Elegid entre un trabajo interesante mal pagado y otro seguro pero aburrido. Defended vuestra elección.","stretch":"Propón una tercera alternativa y explica qué inconveniente sigue sin poder evitar."},{"title":"El derecho a ser corriente","subtitle":"¿De verdad tenemos que destacar?","main":"¿Es razonable aspirar a una vida feliz sin intentar destacar?","mainExplain":"Algunas personas no quieren ser famosas ni las mejores en nada; solo quieren una vida buena y tranquila. ¿Es una meta razonable o deberían los jóvenes aspirar a más?","questions":["¿Por qué admiramos los logros excepcionales?","¿Puede ser perjudicial buscar siempre la excelencia?","¿Cómo definirías una vida que te baste?"],"explanations":["La gente suele fascinarse con los logros excepcionales, como récords, premios o grandes descubrimientos. ¿Por qué podríamos admirarlos tanto?","Intentar ser siempre el mejor puede dar grandes resultados. ¿Podría también volverse perjudicial para una persona? ¿Cuándo?","Mucha gente habla de una vida llena de grandes logros. ¿Cómo describirías una vida que te bastara?"],"support":["El principal dilema parece ser …","Yo pondría el límite en …","¿Qué responderías a quien afirma que …?"],"challenge":"Escribid un manifiesto de tres frases (Nos negamos a… / Valoramos… / Recordamos…) y poned a prueba una de ellas con un contraejemplo fuerte.","stretch":"Cuestionad una idea poco realista del éxito y explicad a quién beneficia."}],"vocab":[["la autoestima","valoración que una persona hace de sí misma"],["el reconocimiento social","aprobación pública de los logros"],["el perfeccionismo","necesidad de hacerlo todo sin errores"],["el agotamiento","cansancio muy intenso y prolongado"],["el precio que hay que pagar","lo que pierdes a cambio de una ventaja"],["el privilegio","ventaja de la que no disfruta todo el mundo"],["la realización personal","sensación de que la vida tiene sentido"],["la estabilidad económica","seguridad de contar con dinero suficiente"],["el estigma","rechazo injusto asociado a una situación"],["la resiliencia","capacidad de superar los reveses"],["el conformismo","aceptación pasiva de lo establecido"],["la validación externa","aprobación que se busca en los demás"]],"toolkit":[["Expresa un punto de vista","Sostendría que … / Me da la impresión de que …"],["Arguméntalo","Una razón es que … / Un ejemplo claro sería …"],["Discrepa de forma constructiva","Entiendo tu postura, pero … / Me pregunto si realmente …"],["Profundiza","¿Qué te hace pensar eso? / ¿Seguiría siendo así si …?"]]},"C1":{"warm":"Definid el éxito en una frase y reformuladla tras escuchar un contraejemplo.","stations":[{"title":"¿Qué es tener éxito?","subtitle":"Empecemos por lo que de verdad queremos conseguir.","main":"¿Hasta qué punto las expectativas sociales moldean lo que consideramos éxito personal?","mainExplain":"A menudo creemos que nuestra idea del éxito es solo nuestra. Pero ¿cuánto de ella viene de lo que los demás esperan de nosotros?","questions":["Dos jóvenes igual de talentosos quieren hacer unas prácticas no remuneradas, pero solo uno puede permitírselo. ¿Qué revela eso sobre la libertad de perseguir metas?","¿Se puede rechazar el éxito convencional sin sentirse juzgado?","¿Qué definición del éxito sería más inclusiva?"],"explanations":["Algunas personas pueden permitirse elegir un camino que las llene; otras tienen que pensar sobre todo en ganar dinero. ¿Cómo podría el origen social influir en quién puede buscar una vida plena?","Algunas personas deciden no seguir la idea habitual de éxito, como unos ingresos altos o un puesto prestigioso. ¿Pueden hacerlo sin sentirse juzgadas por los demás? ¿Por qué sí o por qué no?","Nuestra idea habitual del éxito deja fuera a algunas personas y algunos tipos de vida. ¿Cómo podría ser una definición del éxito que incluyera a más gente?"],"support":["Ese argumento presupone que …","Una consecuencia imprevista podría ser …","¿No convendría distinguir entre … y …?"],"challenge":"Elaborad una definición del éxito que tenga en cuenta las desigualdades de partida.","stretch":"Comprobad si sirve para alguien que rechaza todo reconocimiento público."},{"title":"La trampa de las notas","subtitle":"Cuando los logros se convierten en números.","main":"¿Miden las notas el aprendizaje o la adaptación a un sistema?","mainExplain":"Una nota alta puede mostrar que un alumno ha aprendido mucho o que sabe exactamente lo que el centro quiere ver. ¿Cómo podemos distinguirlo?","questions":["¿Cómo pueden las evaluaciones alterar las prioridades del alumnado?","¿Podría la eliminación de las notas generar nuevas desigualdades?","¿Qué equilibrio entre exigencia y crecimiento personal defenderías?"],"explanations":["Cuando los alumnos saben cómo se les va a evaluar, pueden cambiar aquello en lo que se centran. ¿Cómo podría la evaluación cambiar lo que los alumnos consideran importante?","A veces se propone eliminar las notas para reducir la presión. ¿Podría esto crear nuevas formas de injusticia? ¿Cómo?","La escuela quiere mantener un nivel alto, pero también apoyar el desarrollo personal de cada alumno. ¿Qué equilibrio entre estas dos cosas podrías defender?"],"support":["Ese argumento presupone que …","Una consecuencia imprevista podría ser …","¿No convendría distinguir entre … y …?"],"challenge":"Diseñad un modelo de evaluación que valore el aprendizaje sin renunciar a la exigencia.","stretch":"Identificad una consecuencia imprevista de vuestra propuesta."},{"title":"¿De quién es ese sueño?","subtitle":"Expectativas familiares y decisiones propias.","main":"¿Cómo distinguimos una orientación familiar legítima de un control sutil?","mainExplain":"Padres y profesores suelen dar consejos sobre el futuro. ¿Cuándo ayudan esos consejos a elegir libremente y cuándo deciden en silencio por la otra persona?","questions":["¿Bajo qué condiciones, si las hay, pueden los sacrificios familiares generar obligaciones?","¿Cómo cambiaría tu respuesta según el contexto cultural?","¿Puede convivir la autonomía con la responsabilidad hacia los demás?"],"explanations":["¿En qué condiciones, si es que hay alguna, podrían los sacrificios que una familia ha hecho por alguien crear una obligación para esa persona? ¿Qué tipo de obligación sería?","Las ideas sobre el deber hacia la familia no son iguales en todas las culturas. ¿Cómo podría el contexto cultural cambiar la forma de responder a la pregunta sobre los sacrificios familiares?","Ser libre para tomar tus propias decisiones y sentirte responsable de otros pueden parecer cosas opuestas. ¿Pueden convivir en la vida de una persona? ¿Cómo?"],"support":["Ese argumento presupone que …","Una consecuencia imprevista podría ser …","¿No convendría distinguir entre … y …?"],"challenge":"Defended primero y cuestionad después el deber de cumplir las expectativas familiares.","stretch":"Intentad conciliar la autonomía personal con las obligaciones hacia los seres queridos."},{"title":"La trampa de la comparación","subtitle":"¿Por qué parece que los demás van por delante?","main":"¿Cómo influyen las plataformas digitales en nuestra imagen de una vida lograda?","mainExplain":"En internet vemos sobre todo los mejores momentos y logros de los demás. ¿Cómo puede cambiar eso nuestra idea de una vida normal o exitosa?","questions":["¿Depende la comparación más de la personalidad o del entorno social?","¿En qué condiciones podría beneficiar o perjudicar a alguien el reconocimiento público?","¿Cómo evaluarías tu progreso sin referentes externos?"],"explanations":["Algunas personas se comparan con los demás mucho más que otras. ¿Es sobre todo una cuestión de personalidad o influye más el entorno social?","Recibir reconocimiento público puede hacer que alguien se sienta valorado, pero también puede presionarlo. ¿En qué condiciones podría ayudar y cuándo podría perjudicar?","A menudo medimos nuestro progreso comparándonos con otros. ¿Cómo podrías valorar tu propio progreso sin usar a otras personas como medida?"],"support":["Ese argumento presupone que …","Una consecuencia imprevista podría ser …","¿No convendría distinguir entre … y …?"],"challenge":"Imaginad una sociedad sin clasificaciones públicas de personas.","stretch":"Analizad cómo podría reaparecer la competencia por el estatus."},{"title":"El miedo al fracaso","subtitle":"Errores, riesgos y nuevas oportunidades.","main":"¿En qué condiciones conduce realmente el fracaso al aprendizaje?","mainExplain":"Se suele decir que aprendemos de los errores. ¿Qué tiene que ocurrir después de un fracaso para que alguien aprenda de verdad, en lugar de solo sentirse mal?","questions":["¿Qué factores personales y sociales pueden influir en la recuperación tras un revés?","¿Cuándo resulta insensible idealizar la resiliencia?","¿Deberían las instituciones premiar riesgos razonados aunque salgan mal?"],"explanations":["La gente se recupera de los reveses de maneras muy distintas. ¿Qué circunstancias personales y sociales podrían hacer más fácil o más difícil recuperarse?","Elogiar a alguien por ser resiliente puede sonar alentador. ¿Cuándo podría ese elogio resultar insensible para alguien que lo está pasando mal?","Instituciones como escuelas o empresas suelen premiar solo el éxito. ¿Deberían premiar también a quien asumió un riesgo bien pensado que no salió bien? ¿Por qué sí o por qué no?"],"support":["Ese argumento presupone que …","Una consecuencia imprevista podría ser …","¿No convendría distinguir entre … y …?"],"challenge":"Criticad «el fracaso es el mejor maestro» desde dos posiciones sociales distintas.","stretch":"Definid cuándo puede convertirse el fracaso en aprendizaje real."},{"title":"Siempre ocupados","subtitle":"Ambición, descanso y agotamiento.","scenario":"Un estudiante se siente culpable cada vez que descansa en lugar de estudiar.","main":"¿Por qué podrían admirar otros esa actitud y cuándo sería perjudicial?","mainExplain":"Algunas personas ven el trabajo constante como señal de buen carácter. ¿Por qué ocurre y a partir de qué momento esa actitud perjudica a quien la tiene?","questions":["¿Puede la ambición surgir tanto del interés auténtico como de la ansiedad?","¿A quién puede beneficiar o perjudicar una cultura que glorifica el agotamiento?","¿Qué idea más saludable del éxito propondrías?"],"explanations":["Se puede trabajar duro porque te encanta lo que haces o porque temes lo que pasará si no lo haces. ¿Pueden ambos motivos empujar a la misma persona al mismo tiempo?","Algunas culturas elogian a la gente por estar siempre cansada y ocupada. ¿Quién podría salir ganando con una cultura así y quién podría sufrir por ella?","Nuestra idea actual del éxito suele dejar poco espacio para descansar. ¿Cómo sería una idea del éxito más saludable?"],"support":["Ese argumento presupone que …","Una consecuencia imprevista podría ser …","¿No convendría distinguir entre … y …?"],"challenge":"Defended el derecho al ocio sin justificarlo por sus efectos sobre la productividad.","stretch":"Examina quién paga el coste del equilibrio vital de otras personas."},{"title":"¿Vocación o sueldo?","subtitle":"Elegir un futuro sin opciones perfectas.","scenario":"Dos jóvenes reciben el consejo «sigue tu pasión». Uno tiene que ayudar económicamente a su familia y el otro no.","main":"¿Es igual de justo para ambos?","mainExplain":"El mismo consejo puede sonar muy distinto según la situación de cada uno. ¿Qué le costaría a cada uno de los dos jóvenes «seguir su pasión»?","questions":["¿A quién beneficia que se diga a los jóvenes que disfrutar del trabajo importa más que el sueldo?","¿Compensa un trabajo con sentido unas condiciones precarias?","¿Existe una obligación moral de elegir una profesión útil para la sociedad?"],"explanations":["Consejos como «Sigue tu pasión» se dan a todos los jóvenes por igual. ¿Quién gana cuando la gente acepta cobrar menos por un trabajo que le gusta y quién podría perder? Piensa en las empresas, las familias y los propios jóvenes.","Un trabajo puede tener mucho sentido pero ofrecer poca seguridad o un sueldo bajo. ¿Puede el sentido compensar unas malas condiciones? ¿Para quién y durante cuánto tiempo?","Algunas profesiones ayudan claramente más a la sociedad que otras. ¿Existe la obligación moral de elegir una de ellas o es una decisión personal? ¿Por qué?"],"support":["Ese argumento presupone que …","Una consecuencia imprevista podría ser …","¿No convendría distinguir entre … y …?"],"challenge":"Evaluad críticamente «convierte tu pasión en tu profesión».","stretch":"Reformulad el debate pensando en los trabajos esenciales y mal remunerados."},{"title":"El derecho a ser corriente","subtitle":"¿De verdad tenemos que destacar?","main":"¿Perjudica la exigencia de destacar al bienestar cotidiano?","mainExplain":"Si se espera que todo el mundo sea especial o excepcional, ¿qué pasa con el valor de una vida cotidiana normal y feliz?","questions":["¿Puede separarse la ambición del estatus social?","¿Qué supuestos esconde la palabra «corriente»?","¿Cómo podría valorarse una vida discreta?"],"explanations":["La ambición suele relacionarse con querer ser admirado o tener una posición alta. ¿Puede alguien ser ambicioso sin que le importe el estatus?","La palabra «corriente» puede sonar neutra, positiva o negativa. ¿Qué juicios ocultos podría hacer la gente cuando llama «corriente» a una vida?","Mucha gente vive vidas tranquilas que rara vez llaman la atención. ¿Cómo podría una sociedad mostrar que valora esas vidas?"],"support":["Ese argumento presupone que …","Una consecuencia imprevista podría ser …","¿No convendría distinguir entre … y …?"],"challenge":"Refutad la afirmación «todos debemos ser extraordinarios».","stretch":"Debatid si estar satisfecho es una decisión, un logro o un privilegio."}],"vocab":[["la meritocracia","idea de recompensar según talento y esfuerzo"],["la movilidad social","cambio de posición dentro de la sociedad"],["la capacidad de decisión","posibilidad real de elegir y actuar"],["la desigualdad estructural","desventaja creada por instituciones y sistemas"],["la precariedad","falta de seguridad económica o laboral"],["la autodeterminación","capacidad de decidir el propio rumbo"],["la cultura de la productividad","presión social por rendir sin pausa"],["el supuesto normativo","idea implícita sobre lo que debería ser"],["la responsabilidad colectiva","deberes compartidos por la sociedad"],["el estatus social","posición o prestigio en un grupo"],["la plenitud personal","sensación duradera de sentido y satisfacción"],["el contraargumento","razonamiento opuesto a una afirmación"]],"toolkit":[["Matiza","En gran medida, … / Eso no significa necesariamente que …"],["Argumenta","El supuesto de partida es … / Esto se aprecia cuando …"],["Cuestiona con tacto","Me cuesta aceptar esa premisa porque …"],["Haz avanzar el diálogo","¿Podrías profundizar en …? / ¿Cómo funcionaría en la práctica?"]]},"C2":{"warm":"Formulad una creencia popular sobre el éxito, localizad su supuesto implícito e inventad un contraejemplo.","stations":[{"title":"¿Qué es tener éxito?","subtitle":"Empecemos por lo que de verdad queremos conseguir.","scenario":"Una estudiante gana un premio importante; otro joven pasa un año cuidando a un familiar sin recibir ningún reconocimiento.","main":"¿A quién consideramos exitoso y qué revela eso sobre el estatus social?","mainExplain":"Los dos se esfuerzan mucho, pero solo una recibe reconocimiento público. ¿Qué decide qué tipo de esfuerzo cuenta como éxito en una sociedad?","questions":["¿Qué supuestos implícitos sostienen el discurso meritocrático?","¿Hasta qué punto el azar debilita la idea de que los logros son completamente merecidos?","¿Cabe definir el éxito sin jerarquizar las vidas?"],"explanations":["El discurso del mérito dice que el éxito viene del talento y del esfuerzo. ¿Qué creencias no dichas podrían estar detrás de ese discurso?","Muchas cosas en la vida dependen del azar, no solo del esfuerzo. Si el azar influye, ¿se puede seguir diciendo que la gente merece por completo su éxito?","Las definiciones del éxito suelen ordenar las vidas de más a menos exitosas. ¿Es posible hablar de éxito sin clasificar las vidas de las personas?"],"support":["Aquí se confunde … con …","Un contraejemplo debilitaría la tesis de que …","Reformularía el problema en estos términos: …"],"challenge":"Sostén que el «éxito» es una categoría irreductiblemente social y después intenta defender una definición puramente privada frente a ese argumento.","stretch":"Decidid si la suerte puede separarse alguna vez por completo del mérito y qué se sigue de ello para nuestra forma de recompensar a las personas."},{"title":"La trampa de las notas","subtitle":"Cuando los logros se convierten en números.","scenario":"Imagina un centro que solo califica la rapidez de las respuestas.","main":"¿Cómo podría cambiar lo que aprenden los estudiantes y lo que el profesorado considera capacidad?","mainExplain":"Si solo se premiara la rapidez, los alumnos practicarían sobre todo la rapidez. ¿Podría la forma de evaluar cambiar lo que entendemos por capacidad?","questions":["¿Pueden unas calificaciones aparentemente objetivas ocultar ventajas estructurales?","¿Qué debería conservar una alternativa rigurosa a la clasificación habitual?","¿Pueden coexistir unas exigencias académicas altas con medidas ambiciosas contra la desigualdad?"],"explanations":["Las notas suelen parecer neutras y objetivas. ¿Podrían aun así ocultar ventajas que algunos alumnos tienen por su origen? ¿Cómo?","Imagina sustituir la clasificación habitual de los alumnos por otra cosa. ¿Qué tendría que conservar esa alternativa para que se tomara en serio?","A veces se piensa que un nivel académico alto y los esfuerzos fuertes contra la desigualdad son incompatibles. ¿Pueden existir a la vez? ¿Cómo?"],"support":["Aquí se confunde … con …","Un contraejemplo debilitaría la tesis de que …","Reformularía el problema en estos términos: …"],"challenge":"Sostened que toda reforma de la evaluación se limita a desplazar la desigualdad y poned después a prueba ese argumento con los contraejemplos más sólidos.","stretch":"Precisad qué rasgos de la calificación son imprescindibles y cuáles mera convención, y justificad la distinción."},{"title":"¿De quién es ese sueño?","subtitle":"Expectativas familiares y decisiones propias.","main":"¿Dónde termina la responsabilidad familiar legítima y comienza la coacción?","mainExplain":"Los miembros de una familia quizá se deben algo, como ayuda o lealtad. ¿En qué momento el sentido del deber se convierte en una presión que quita libertad a alguien?","questions":["¿Pueden asumirse libremente expectativas heredadas?","¿Cómo conciliar autonomía y reciprocidad cuando entran en conflicto?","¿Cuándo oculta la consigna «persigue tus sueños» una dependencia material?"],"explanations":["Muchos jóvenes heredan expectativas de su familia. ¿Puede alguien elegir de verdad aceptar esas expectativas como propias, en lugar de simplemente cumplirlas?","La libertad personal y la idea de devolver lo que se ha recibido pueden entrar en conflicto. ¿Cómo deberían equilibrarse estos dos valores cuando chocan?","«Persigue tus sueños» suena alentador. ¿Cuándo podría esta frase ocultar que algunas personas dependen económicamente de otras y no pueden elegir libremente?"],"support":["Aquí se confunde … con …","Un contraejemplo debilitaría la tesis de que …","Reformularía el problema en estos términos: …"],"challenge":"Reconstruid un argumento sólido a favor de la obligación filial en términos que aceptaría alguien que piensa distinto y señalad después el punto en que se convierte en coacción.","stretch":"Valorad si la gratitud puede generar alguna vez un deber vinculante o solo una expectativa moral."},{"title":"La trampa de la comparación","subtitle":"¿Por qué parece que los demás van por delante?","scenario":"Una estudiante publica todos sus logros en redes; otro evita las redes sociales.","main":"¿Puede alguno escapar realmente a la comparación? ¿Por qué?","mainExplain":"Dejar las redes sociales parece acabar con la comparación, pero la gente puede compararse de otras formas. ¿Es posible salir del todo de la comparación?","questions":["¿En qué condiciones pueden las plataformas aprovechar económicamente la inseguridad y presentar la visibilidad como emancipación?","¿Podemos salir realmente de la economía de la atención?","¿Es menos corrosiva la comparación con uno mismo que con los demás?"],"explanations":["Las plataformas presentan a menudo la visibilidad como algo que da poder a la gente. ¿En qué condiciones podrían, al mismo tiempo, ganar dinero con la inseguridad de las personas?","Las aplicaciones y los medios compiten constantemente por nuestra atención. ¿Puede una persona salir realmente de esto o es casi imposible hoy?","Algunas personas solo se comparan con quienes eran antes, en lugar de con los demás. ¿Es este tipo de comparación menos dañina? ¿Por qué sí o por qué no?"],"support":["Aquí se confunde … con …","Un contraejemplo debilitaría la tesis de que …","Reformularía el problema en estos términos: …"],"challenge":"Construid la defensa más sólida de la comparación social como motor de progreso y poned después al descubierto sus costes ocultos.","stretch":"Plantéate si retirarse de la visibilidad pública es una forma genuina de libertad o solo otro privilegio."},{"title":"El miedo al fracaso","subtitle":"Errores, riesgos y nuevas oportunidades.","main":"¿Hasta qué punto es más fácil celebrar el fracaso cuando se cuenta con seguridad económica o social?","mainExplain":"Decir «no pasa nada por fracasar» es más fácil si tu familia puede apoyarte cuando algo sale mal. ¿Cómo cambia una red de seguridad lo que significa fracasar?","questions":["¿Cuándo traslada el discurso de la resiliencia la responsabilidad de las instituciones al individuo?","¿Cómo distinguir la perseverancia de la incapacidad de rectificar?","¿Puede valer más un intento fallido que un resultado exitoso?"],"explanations":["El discurso de la resiliencia anima a la gente a afrontar sola las dificultades. ¿Cuándo podría trasladar la responsabilidad de escuelas, empresas o el Estado a las personas?","No rendirse suele admirarse. Pero ¿cómo distinguir la perseverancia de la incapacidad de replantearse una meta que ya no tiene sentido?","Solemos valorar más los resultados que los intentos. ¿Podría un intento fallido valer a veces más que un éxito? ¿En qué sentido?"],"support":["Aquí se confunde … con …","Un contraejemplo debilitaría la tesis de que …","Reformularía el problema en estos términos: …"],"challenge":"Reformulad «el fracaso es el mejor maestro» de modo que siga siendo cierto para quien no tiene red de seguridad y defended vuestra formulación.","stretch":"Distinguid los fracasos que enseñan de los que solo dañan, e identificad quién decide cuáles son cuáles."},{"title":"Siempre ocupados","subtitle":"Ambición, descanso y agotamiento.","scenario":"Un compañero afirma: «Descansar es perder el tiempo si no te hace más productivo».","main":"¿Qué juicio moral esconde esa idea y se puede defender?","mainExplain":"La afirmación solo valora el descanso si lleva a trabajar más. ¿Qué dice eso de cómo juzgamos a las personas y puede el descanso tener valor por sí mismo?","questions":["¿Qué contradicciones surgen al convertir el ocio en otra tarea de optimización?","¿Cómo se puede mantener una ambición con sentido sin caer en la autoexplotación?","¿Qué implica defender el derecho incondicional al descanso?"],"explanations":["Incluso el tiempo libre se planifica a veces para que sea lo más útil y eficiente posible. ¿Qué contradicciones podrían surgir cuando el ocio se convierte en otra cosa que optimizar?","La ambición puede dar sentido a la vida, pero también puede llevar a exigirse demasiado. ¿Cómo podría alguien seguir siendo ambicioso sin explotarse a sí mismo?","Un derecho incondicional al descanso significaría que el descanso no hay que ganárselo. ¿Qué significaría en la práctica defender ese derecho?"],"support":["Aquí se confunde … con …","Un contraejemplo debilitaría la tesis de que …","Reformularía el problema en estos términos: …"],"challenge":"Defended el descanso como un fin en sí mismo, sin apelar a la salud, la productividad ni el bienestar.","stretch":"Identificad qué trabajo invisible hace posible el ocio de otras personas y qué implica eso para un reparto justo del tiempo."},{"title":"¿Vocación o sueldo?","subtitle":"Elegir un futuro sin opciones perfectas.","main":"¿Es falsa la disyuntiva entre realización personal y estabilidad económica?","mainExplain":"A menudo se habla como si hubiera que elegir entre un trabajo que te encanta y uno bien pagado. ¿Es realmente la única opción o hay otras posibilidades?","questions":["¿Cuándo profesionalizar una pasión termina por destruirla?","¿Cómo valorar los trabajos imprescindibles que carecen de prestigio?","¿Puede ser políticamente neutral la orientación profesional?"],"explanations":["Convertir una afición o pasión en un trabajo puede ser un sueño. ¿Cuándo podría hacerlo profesionalmente acabar con la alegría que la convertía en pasión?","Algunos trabajos son imprescindibles para la sociedad, pero tienen poco prestigio. ¿Cómo debería la sociedad mostrar el valor de ese trabajo?","La orientación profesional puede parecer puramente práctica. ¿Podría estar alguna vez totalmente libre de valores y supuestos políticos? ¿Por qué sí o por qué no?"],"support":["Aquí se confunde … con …","Un contraejemplo debilitaría la tesis de que …","Reformularía el problema en estos términos: …"],"challenge":"Sostened que el ideal de «dedicarse a lo que a uno le apasiona» beneficia más a los empleadores que a los trabajadores y conceded después lo que tiene de acertado.","stretch":"Proponed criterios para el valor social del trabajo que no dependan ni del sueldo ni del prestigio."},{"title":"El derecho a ser corriente","subtitle":"¿De verdad tenemos que destacar?","scenario":"Un adolescente desea un trabajo sencillo y una vida tranquila.","main":"¿Quién podría llamar a esa vida «corriente» o «fracasada», y qué revela esa etiqueta?","mainExplain":"Llamar «corriente» a una vida parece una simple descripción, pero también puede ser un juicio. ¿Quién decide qué es corriente y qué valores hay detrás de esa palabra?","questions":["¿Puede la exigencia de autenticidad convertirse en otra competición?","¿Es la satisfacción personal resistencia, conformismo o ninguna de las dos cosas?","¿Qué idea de vida plena queda al rechazar el ideal de excepcionalidad?"],"explanations":["Ser «auténtico» se presenta a menudo como un ideal. ¿Podría el esfuerzo por parecer auténtico convertirse en un nuevo tipo de competición?","Estar satisfecho con la propia vida puede verse de distintas maneras. ¿Es una forma de resistir la presión, de conformarse o algo completamente distinto?","Si dejamos de aceptar que una buena vida tiene que ser excepcional, ¿qué idea de una vida plena queda? ¿En qué consistiría?"],"support":["Aquí se confunde … con …","Un contraejemplo debilitaría la tesis de que …","Reformularía el problema en estos términos: …"],"challenge":"Defended lo corriente sin convertirlo en un nuevo ideal que haya que alcanzar.","stretch":"Examina si el lenguaje de la «autenticidad» escapa a la lógica de la competición o simplemente la refina."}],"vocab":[["la contingencia","influencia del azar y las circunstancias"],["el relato meritocrático","discurso que presenta los resultados como merecidos"],["el juicio normativo","afirmación sobre lo que debería valorarse"],["el valor moral","valor de una persona desde una perspectiva ética"],["la reciprocidad","obligaciones o beneficios mutuos"],["la mercantilización","conversión de algo en mercancía"],["el valor instrumental","utilidad como medio para otro fin"],["la autoexplotación","exigencia desmedida que una persona se impone"],["la jerarquía de prestigio","clasificación social según reconocimiento"],["la vida plena","existencia rica en sentido y bienestar"],["el sesgo epistémico","distorsión sistemática al formar conocimiento"],["la falsa dicotomía","presentación engañosa de solo dos opciones"]],"toolkit":[["Plantea el problema","El núcleo de la cuestión es … / Eso presupone que …"],["Introduce matices","Admitido esto, …; aun así, … / La distinción no es meramente terminológica."],["Refuta con precisión","Esa inferencia solo se sostiene si … / Cuestionaría la premisa."],["Sintetiza","¿Podríamos conciliar ambas posturas si …? / Una tesis más sólida sería …"]]}},"uiSimple":{"eyebrow":"HABLA · PREGUNTA · RESPONDE · ESCUCHA","hero":"Las clases, la familia, los amigos, el dinero, el futuro. ¿Qué es importante para ti? Habla con tu compañero o compañera.","privacy":"Puedes inventar ejemplos. No tienes que hablar de tus notas, de tu familia ni de tu vida privada.","step4":"¿Quieres más? Abre la siguiente tarea.","questions":"Más preguntas","supportTitle":"¿ t in diesem Browser nicht verfügbar.","formatHint":"PARTNERGESPRÄCH","goalA1":"Einfache Fragen über dich und dein Leben stellen und beantworten.","goalA2":"Sagen, was man denkt, und einfache Gründe nennen.","goalB1":"Meinungen äußern, begründen und nachfragen.","goalB2":"Standpunkte begründen und auf andere Sichtweisen eingehen.","goalC1":"Komplexe Fragen differenziert und kooperativ diskutieren.","goalC2":"Abstrakte Argumente und unausgesprochene Annahmen präzise erörtern.","tipA1":"Wähle 3–4 Stationen. Hör dir zuerst ein Beispiel an. Kurze Antworten sind in Ordnung. Du kannst Wörter wiederholen und mit den Händen zeigen.","tipA2":"Wähle 4 Stationen. Bereite deine Frage kurz vor. Dann sprich.","tipB1":"Wähle etwa 5 Stationen. Nenne bei jeder Antwort einen Grund und stell eine Rückfrage.","tipB2":"Wähle 5–6 Stationen. Bring Beispiele und Gegenargumente und widersprich respektvoll.","tipC1":"Wähle 5–6 Stationen. Achte auf Differenzierung und eine faire Gesprächsführung.","tipC2":"Wähle 5–6 Stationen. Hinterfrage unausgesprochene Annahmen und paraphrasiere die Argumente deines Gegenübers.","startLesson":"Gespräch beginnen →","offline":"Offline","controlsAria":"Steuerung der Unterrichtseinheit","stationNavAria":"Gesprächsstationen","questionHelpTip":"Wenn eine Frage unklar ist, öffne „Erklären“. Du siehst sie mit anderen Worten, ohne Antwort.","questionHelpOpen":"Erklären","questionHelpClose":"Schließen","questionHelpMeaning":"ANDERS GESAGT","scenarioLabel":"KONTEXT","mainExplainLabel":"Leitfrage erklären","timeByLevel":{"A1":"45 Min. · 3–4 Stationen","A2":"45 Min. · 4 Stationen","B1":"45 Min. · 5 Stationen","B2":"45 Min. · 5–6 Stationen","C1":"45 Min. · 5–6 Stationen","C2":"45 Min. · 5–6 Stationen"},"explainAria":"Frage {n} erklären"},"levels":{"A1":{"warm":"Wähle zwei Dinge: Schule, Freunde, Geld, Familie, Ferien oder Freizeit. Sage: „Ich wähle …, denn …“.","stations":[{"title":"Was ist Erfolg?","subtitle":"Was ist im Leben wichtig?","main":"Was ist für dich ein guter Tag?","questions":["Was macht dich glücklich?","Magst du Schule oder Freizeit lieber? Warum?","Wer hilft dir?"],"support":["Ein guter Tag ist für mich, wenn …","Das ist gut / schlecht, denn …","Und du?"],"challenge":"Wähle drei Dinge für ein gutes Leben. Sag deinem Partner oder deiner Partnerin, warum.","stretch":"Beschreibe deinen perfekten Tag: Wo bist du? Wer ist bei dir? Was machst du?"},{"title":"Noten, Noten, Noten","subtitle":"Sind gute Noten das Wichtigste?","main":"Sind gute Noten in der Schule wichtig? Warum?","questions":["Welches Fach magst du?","Sind Tests für dich leicht oder schwer? Warum?","Was ist eine gute Note?"],"support":["Gute Noten sind wichtig, weil …","Das ist gut / schlecht, denn …","Und du?"],"challenge":"Zwei Schüler: Der eine hat gute Noten, der andere ist sehr nett. Wer ist ein guter Schüler? Warum?","stretch":"Was machen gute Schüler? Nenne drei Dinge – aber nicht „gute Noten bekommen“."},{"title":"Mein Traum oder dein Traum?","subtitle":"Was will meine Familie? Was will ich?","main":"Welchen Beruf möchtest du haben?","questions":["Welche Berufe sind in deiner Klasse beliebt?","Ein Elternteil sagt: „Werde Arzt!“ Was kann das Kind sagen?","Was möchtest du lernen?"],"support":["Ich möchte … werden, weil …","Das ist gut / schlecht, denn …","Und du?"],"challenge":"Eine Familie möchte für ihr Kind einen Beruf, aber das Kind möchte einen anderen. Hilf dem Kind, es nett zu sagen: „Ich möchte … werden, weil …“.","stretch":"Spielt ein Gespräch: Eine Person ist Vater oder Mutter, die andere ist Sohn oder Tochter. Sprecht über den späteren Beruf."},{"title":"Ich und die anderen","subtitle":"Sind die anderen immer besser?","main":"Wer ist dein Held oder deine Heldin? Warum?","questions":["Was kann dein Freund gut?","Was kannst du gut?","Was magst du? Was mag dein Partner oder deine Partnerin?"],"support":["Mein Held / Meine Heldin ist …, weil …","Das ist gut / schlecht, denn …","Und du?"],"challenge":"Erfindet zwei nette Komplimente für eine erfundene Person aus eurer Klasse. Stellt eine freundliche Frage.","stretch":"Was kannst du von deinem Partner oder deiner Partnerin lernen? Und was kann er oder sie von dir lernen? Nenne je eine Sache."},{"title":"Fehler sind normal","subtitle":"Was machen wir nach einem Fehler?","main":"Jemand macht im Unterricht einen Fehler. Wie fühlt sich die Person?","questions":["Was ist für dich schwer?","Wer hilft dir beim zweiten Versuch?","Was sagst du nach einem Fehler?"],"support":["Nach einem Fehler kann ich …","Das ist gut / schlecht, denn …","Und du?"],"challenge":"Dein Freund bekommt eine schlechte Note. Sag ihm zwei nette Dinge.","stretch":"Was kannst du nach einem Fehler machen? Nenne drei Dinge."},{"title":"Zu viel zu tun","subtitle":"Schule, Freizeit und Ruhe.","main":"Wie viele Hobbys und Kurse hast du nach der Schule?","questions":["Was machst du am Nachmittag?","Wann ruhst du dich aus?","Eine Schülerin schläft sechs Stunden. Ist das genug? Warum?"],"support":["Nach der Schule …","Das ist gut / schlecht, denn …","Und du?"],"challenge":"Was machst du am Montag, Dienstag und Mittwoch nach der Schule? Erzähl.","stretch":"Plant einen guten Tag mit Lernen, Freunden und Ruhe. Vergleicht eure Pläne."},{"title":"Geld oder Traumberuf?","subtitle":"Welchen Beruf möchte ich?","main":"Welcher Beruf ist für dich interessant?","questions":["Arbeitest du gern mit Menschen? Warum (nicht)?","Ist Geld für dich wichtig? Warum (nicht)?","Möchtest du drinnen oder draußen arbeiten?"],"support":["Ich möchte mit Menschen / draußen / drinnen arbeiten.","Das ist gut / schlecht, denn …","Und du?"],"challenge":"Wähle einen Beruf: Koch, Ärztin oder Künstler. Sag, warum.","stretch":"Beschreibe deinen Traumberuf: den Ort, die Menschen und die Arbeitszeit."},{"title":"Ein normales Leben","subtitle":"Muss ich etwas Besonderes sein?","main":"Welche einfachen Dinge machen dich glücklich?","questions":["Möchtest du berühmt sein? Warum (nicht)?","Was machst du jeden Tag gern?","Was ist gut in deinem enge":"Vergleiche zwei Schüler: Einer hat die besten Noten, aber keine Freizeit. Der andere hat normale Noten und viele Freunde. Wer ist glücklicher?","stretch":"Erfinde eine neue Art, in der Schule „Gut gemacht!“ ohne Note zu sagen. Erkläre, wie sie funktioniert."},{"title":"Mein Traum oder dein Traum?","subtitle":"Was will meine Familie? Was will ich?","main":"Eine Schülerin möchte Künstlerin werden, aber ihre Familie will etwas anderes. Was kann sie sagen?","questions":["Welche Ratschläge kann eine Familie zum Thema Beruf geben?","Sind diese Tipps immer gut? Warum (nicht)?","Wie kannst du eine andere Entscheidung erklären?"],"support":["Für mich bedeutet Erfolg …","Ich stimme zu / nicht zu, weil …","Kannst du ein Beispiel nennen?"],"challenge":"Eine Familie möchte für ihre Tochter einen Beruf, aber sie möchte einen anderen. Spielt ein höfliches Gespräch.","stretch":"Spielt das Gespräch noch einmal, aber findet jetzt eine gute Lösung für beide."},{"title":"Ich und die anderen","subtitle":"Sind die anderen immer besser?","main":"Zwei Freunde bekommen verschiedene Noten. Hilft es, die Noten zu vergleichen? Warum?","questions":["Helfen soziale Medien oder schaden sie? Warum?","Wann kann ein Vergleich nützlich sein?","Was macht dich selbstbewusst?"],"support":["Für mich bedeutet Erfolg …","Ich stimme zu / nicht zu, weil …","Kannst du ein Beispiel nennen?"],"challenge":"Sag deinem Partner oder deiner Partnerin: „Das kannst du gut!“ (zwei Dinge). Frag dann: „Wie hast du das gelernt?“","stretch":"Andere scheinen besser als du. Was hilft dann? Gib zwei Tipps und erkläre sie."},{"title":"Fehler sind normal","subtitle":"Was machen wir nach einem Fehler?","main":"Was machst du, wenn etwas schiefgeht?","questions":["Jemand macht im Sprachunterricht einen Fehler. Was kann die Person dann tun?","Wie kann ein Freund nach einem Misserfolg helfen?","Was würdest du einem Freund nach einem Misserfolg sagen?"],"support":["Für mich bedeutet Erfolg …","Ich stimme zu / nicht zu, weil …"
