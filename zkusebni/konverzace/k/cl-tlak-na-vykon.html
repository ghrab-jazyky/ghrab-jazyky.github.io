ihm realistische Tipps.","stretch":"Diskutiert, wann Aufhören sinnvoll sein kann."},{"title":"Immer beschäftigt","subtitle":"Ehrgeiz, Ruhe und Stress.","main":"Ist ständige Beschäftigung ein Zeichen für Erfolg?","questions":["Warum haben manche beim Ausruhen ein schlechtes Gewissen?","Woran könnte man erkennen, dass jemand zu viel Stress hat?","Wie sieht eine gesunde Woche aus?"],"support":["Ein Vorteil / Nachteil ist …","Das könnte problematisch werden, weil …","Was würdest du in der Situation tun?"],"challenge":"Ein Jugendlicher schläft wegen Hausaufgaben und Hobbys nur fünf Stunden pro Nacht. Gib ihm praktische Tipps.","stretch":"Schlage eine Schulregel zum Schutz des Wohlbefindens vor."},{"title":"Traumjob oder Gehalt?","subtitle":"Eine Zukunft ohne perfekte Lösungen wählen.","main":"Ist Freude an der Arbeit wichtiger als das Gehalt?","questions":["Wann ist ein Beruf sinnvoll?","Wie wichtig ist ein sicherer Arbeitsplatz, wenn man jung ist?","Kann ein langweiliger Beruf ein glückliches Leben ermöglichen?"],"support":["Ein Vorteil / Nachteil ist …","Das könnte problematisch werden, weil …","Was würdest du in der Situation tun?"],"challenge":"Wählt zwischen einem sinnvollen, schlecht bezahlten Beruf und einem sicheren, langweiligen Job. Begründet eure Wahl.","stretch":"Entwickle eine dritte Option mit Vor- und Nachteilen."},{"title":"Das Recht, gewöhnlich zu sein","subtitle":"Müssen wir wirklich etwas Besonderes sein?","main":"Reicht es, ein gewöhnlicher, glücklicher Mensch zu sein?","questions":["Wer entscheidet, was ein beeindruckendes Leben ist?","Passen Ehrgeiz und Zufriedenheit zusammen?","Welche gesellschaftliche Erwartung würdest du hinterfragen?"],"support":["Ein Vorteil / Nachteil ist …","Das könnte problematisch werden, weil …","Was würdest du in der Situation tun?"],"challenge":"Schreibt ein Manifest aus drei Sätzen: Wir lehnen … ab. / Wir schätzen … / Wir vergessen nicht, dass …","stretch":"Hinterfragt eine unrealistische Erfolgserwartung."}],"vocab":[["die Leistung","etwas Wichtiges, das man geschafft hat"],["die Erwartung","Vorstellung davon, was passieren soll"],["der Gruppendruck","Einfluss von Gleichaltrigen"],["das Selbstbewusstsein","Vertrauen in die eigenen Fähigkeiten"],["die Motivation","der Grund, warum man etwas tun möchte"],["aufgeben","aufhören, es zu versuchen"],["die Work-Life-Balance","Gleichgewicht zwischen Arbeit und Privatleben"],["die Laufbahn","beruflicher Weg über mehrere Jahre"],["der Ehrgeiz","starker Wunsch, Ziele zu erreichen"],["das Wohlbefinden","körperlich und seelisch gutes Gefühl"],["der Kompromiss","Einigung, bei der beide Seiten nachgeben"],["die Anerkennung","Lob oder Wertschätzung durch andere"]],"toolkit":[["Meinung äußern","Ich glaube, dass … / Persönlich würde ich sagen, dass …"],["Begründen","Der wichtigste Grund ist … / Zum Beispiel …"],["Höflich widersprechen","Ich verstehe, was du meinst, aber … / Das stimmt zum Teil."],["Gespräch vertiefen","Kannst du erklären, warum? / Hast du ein Beispiel?"]]},"B2":{"warm":"Ordnet Freiheit, Leistung, Glück und Sicherheit. Begründet eure Reihenfolge und hinterfragt eine Annahme.","stations":[{"title":"Was bedeutet Erfolg?","subtitle":"Worauf arbeiten wir eigentlich hin?","main":"Würdest du dieselben Ziele verfolgen, wenn niemand deine Erfolge sehen könnte?","mainExplain":"Stell dir vor, niemand – nicht einmal Freunde oder Familie – wüsste von deinen Erfolgen. Würden deine Ziele gleich bleiben, oder hängen manche davon ab, was andere denken?","questions":["Kann Erfolg ohne gesellschaftliche Anerkennung existieren?","Wie selbstbestimmt ist deine Vorstellung von Erfolg?","Können sehr unterschiedliche Lebenswege gleich erfolgreich sein?"],"explanations":["Erfolg wird oft mit Lob, Likes oder Bewunderung durch andere verbunden. Könnte sich jemand erfolgreich fühlen, auch wenn niemand bemerkt oder lobt, was er erreicht hat?","Unsere Vorstellung von Erfolg kann von Familie, Schule, Freunden oder Medien kommen. Wie viel von deiner eigenen Vorstellung von Erfolg hast du wirklich selbst gewählt?","Zwei Menschen können sehr unterschiedlich leben, etwa mit verschiedenen Berufen, Orten oder Zielen. Könnten beide gleich erfolgreich sein? Wovon würde das abhängen?"],"support":["Der entscheidende Zielkonflikt ist …","Ich würde die Grenze bei … ziehen.","Was entgegnest du dem Einwand, dass …?"],"challenge":"Ordnet Freiheit, Geld, Freundschaft, Anerkennung und Sinn. Begründet Platz eins.","stretch":"Stellt euch vor, ihr würdet jede öffentliche Anerkennung für eure Leistungen verlieren. Was würde sich ändern?"},{"title":"Die Notenfalle","subtitle":"Wenn Leistungen zu Zahlen werden.","main":"Sagen sehr gute Noten etwas über den späteren Erfolg aus?","mainExplain":"Denk an Menschen mit sehr guten und mit durchschnittlichen Schulnoten. Zeigen Noten, wer später im Leben erfolgreich ist, oder sind andere Dinge wichtiger?","questions":["Was kann ein Notensystem nicht erfassen?","Würdest du lieber ein Fach wirklich verstehen oder Bestnoten bekommen?","Wie könnte eine gerechtere Leistungsbewertung aussehen?"],"explanations":["Noten zeigen manches über einen Schüler, aber nicht alles. Welche wichtigen Eigenschaften oder Fähigkeiten kann ein Notensystem gar nicht abbilden?","Manchmal bekommt man eine gute Note, ohne ein Fach wirklich zu verstehen, oder man versteht es gut, ohne die beste Note zu haben. Was würdest du wählen, wenn du nur eines haben könntest, und warum?","Viele haben das Gefühl, dass die Bewertung in der Schule nicht immer gerecht ist. Wie könnte man die Fortschritte von Schülern gerechter bewerten?"],"support":["Der entscheidende Zielkonflikt ist …","Ich würde die Grenze bei … ziehen.","Was entgegnest du dem Einwand, dass …?"],"challenge":"Zwei Schüler: Einer hat perfekte Noten und schläft nur fünf Stunden pro Nacht, der andere lernt langsamer, hat aber Spaß an der Schule. Begründet, wen das Schulsystem stärker belohnt und ob das richtig ist.","stretch":"Entwickelt ein faireres Feedbacksystem und verteidigt es gegenüber einer Lehrkraft, die ein sinkendes Niveau befürchtet."},{"title":"Wessen Traum ist das?","subtitle":"Erwartungen von Familie und Umfeld.","scenario":"Eine Schülerin möchte Musik studieren, ihre Familie erwartet aber Jura.","main":"Wann sollte sie bei ihrer Entscheidung bleiben?","mainExplain":"Die Schülerin und ihre Familie wollen Unterschiedliches. Wann ist es richtig, dem eigenen Plan zu folgen, und wann sollten die Sorgen der Familie mehr Gewicht haben?","questions":["Ab wann wird familiäre Unterstützung zu Druck?","Wie beeinflussen Geld, Verpflichtungen und Chancen die Freiheit, den eigenen Weg zu wählen?","Wie würdest du einen ernsthaften Streit über deine Zukunft lösen?"],"explanations":["Eltern unterstützen ihre Kinder oft, weil sie das Beste für sie wollen. Wann könnte sich diese Unterstützung wie Druck anfühlen?","Nicht alle haben dieselbe Freiheit, ihre Zukunft zu wählen. Wie könnten Geld, Pflichten zu Hause oder die Chancen im Umfeld beeinflussen, welche Wege jemandem offenstehen?","Stell dir vor, du und deine Familie seid euch über deine Zukunft überhaupt nicht einig. Wie würdest du versuchen, darüber zu sprechen und eine Lösung zu finden?"],"support":["Der entscheidende Zielkonflikt ist …","Ich würde die Grenze bei … ziehen.","Was entgegnest du dem Einwand, dass …?"],"challenge":"Deine Familie finanziert das Studium nur, wenn sie das Fach bestimmen darf. Verhandelt.","stretch":"Findet einen Kompromiss zwischen Freiheit und Verantwortung und nennt ein Risiko, das jede Seite akzeptieren müsste."},{"title":"Die Vergleichsfalle","subtitle":"Warum scheinen alle anderen weiter zu sein?","main":"Konkurrieren wir mit anderen, ohne dass uns jemand darum bittet?","mainExplain":"Niemand veranstaltet einen Wettbewerb, und trotzdem vergleichen Menschen Noten, Aussehen oder Follower. Warum passiert das, und ist es immer schlecht?","questions":["Wie verzerren soziale Medien unser Bild von Leistung?","Kann ein Vergleich motivieren, ohne das Selbstvertrauen zu schwächen?","Was könnte jemandem helfen, der das Gefühl hat, zurückzufallen?"],"explanations":["In sozialen Medien zeigen Menschen vor allem ihre Erfolge. Wie könnte das verändern, wie wir unsere eigenen Leistungen und die anderer sehen?","Sich mit anderen zu vergleichen, kann anspornen, aber auch das Selbstvertrauen schwächen. Wann kann ein Vergleich motivieren, ohne dass man sich selbst schlechter fühlt?","Manche haben das Gefühl, dass alle anderen vorankommen, während sie selbst zurückfallen. Was könnte jemandem helfen, der sich so fühlt?"],"support":["Der entscheidende Zielkonflikt ist …","Ich würde die Grenze bei … ziehen.","Was entgegnest du dem Einwand, dass …?"],"challenge":"Du siehst online, dass ein Freund ein großes Stipendium bekommt. Beschreibe deine Reaktion.","stretch":"Nenne zwei Gewohnheiten gegen ungesunde Vergleiche und erkläre, warum eine davon nicht für alle funktionieren könnte."},{"title":"Angst vor dem Scheitern","subtitle":"Fehler, Risiken und neue Versuche.","main":"Ist es manchmal schlimmer, das Scheitern um jeden Preis zu vermeiden, als zu scheitern?","mainExplain":"Manche Menschen versuchen nie etwas Schwieriges, weil sie Angst vor dem Scheitern haben. Was könnten sie verlieren, wenn sie es gar nicht erst versuchen?","questions":["Wann lohnt sich ein Risiko?","Wie könnte sich öffentliches Scheitern von einem Misserfolg im Privaten unterscheiden?","Macht Scheitern wirklich immer stärker?"],"explanations":["Jedes Risiko kann gut oder schlecht ausgehen. Wie entscheidest du, ob sich ein Risiko lohnt? Was würde es lohnenswert machen?","Vor anderen zu scheitern, kann sich ganz anders anfühlen als zu scheitern, wenn niemand zusieht. Worin könnten sich diese beiden Erfahrungen unterscheiden, und warum?","Oft heißt es, Scheitern mache uns stärker. Stimmt das immer, oder gibt es Situationen, in denen es nicht so ist?"],"support":["Der entscheidende Zielkonflikt ist …","Ich würde die Grenze bei … ziehen.","Was entgegnest du dem Einwand, dass …?"],"challenge":"Ein talentierter Schüler macht aus Angst vor Niederlagen nie bei Wettbewerben mit. Gib ihm realistische Tipps.","stretch":"Diskutiert, wann Aufhören sinnvoll sein kann, und einigt euch auf ein Kriterium, das bei dieser Entscheidung hilft."},{"title":"Immer beschäftigt","subtitle":"Ehrgeiz, Erholung und Erschöpfung.","main":"Ist harte Arbeit bewundernswert, wenn keine Zeit zum Leben bleibt?","mainExplain":"Stell dir jemanden vor, der ständig arbeitet oder lernt und für nichts anderes Zeit hat. Sollte man das bewundern, oder fehlt etwas Wichtiges?","questions":["Warum wird es manchmal gefeiert, wenn jemand zu viel arbeitet?","Eine Mitschülerin lernt jeden Abend bis spät und hat keine Freude mehr an Hobbys. Ist das Ehrgeiz oder ein Warnsignal? Was müsstest du noch wissen?","Worauf würdest du für deinen Erfolg niemals verzichten?"],"explanations":["In manchen Umfeldern wird es bewundert, sehr lange zu arbeiten, und man spricht stolz darüber. Warum könnte die Gesellschaft manchmal feiern, dass jemand zu viel arbeitet?","Viel erreichen zu wollen, kann gesund sein, aber auf Dauer auch erschöpfen. Wie könnte jemand in seinem eigenen Leben den Unterschied zwischen beidem erkennen?","Ein Ziel zu erreichen, bedeutet oft, auf etwas zu verzichten. Worauf wärst du niemals bereit zu verzichten, selbst für deinen Erfolg?"],"support":["Der entscheidende Zielkonflikt ist …","Ich würde die Grenze bei … ziehen.","Was entgegnest du dem Einwand, dass …?"],"challenge":"Ein Jugendlicher schläft wegen Hausaufgaben und Hobbys nur fünf Stunden pro Nacht, findet seine Aktivitäten aber wichtig. Gib ihm praktische Tipps, die seine Prioritäten respektieren.","stretch":"Schlage eine Schulregel zum Schutz des Wohlbefindens vor und antworte auf den stärksten Einwand dagegen."},{"title":"Traumjob oder Gehalt?","subtitle":"Eine Zukunft ohne perfekte Lösungen wählen.","main":"Würdest du für eine erfüllende Arbeit weniger Geld akzeptieren?","mainExplain":"Stell dir zwei Jobs vor: einen, der dir wirklich wichtig ist, aber weniger einbringt, und einen gut bezahlten, der dir wenig bedeutet. Was würde deine Wahl bestimmen?","questions":["Wie beeinflusst finanzielle Sicherheit unsere Freiheit?","Kann der Traumjob zur Belastung werden?","Wie würdest du Sinn, Gehalt und Freizeit abwägen?"],"explanations":["Genug Geld zu haben, kann mehr Möglichkeiten im Leben eröffnen. Wie könnte finanzielle Sicherheit, oder ihr Fehlen, beeinflussen, wie frei jemand wirklich ist?","Ein Traumjob klingt nach etwas, das nur glücklich machen kann. Könnte er auch stressig oder zur Belastung werden? Wie?","Ein Beruf kann Sinn, gutes Gehalt und Freizeit bieten, aber selten alles drei ganz. Wie würdest du entscheiden, was dir am wichtigsten ist?"],"support":["Der entscheidende Zielkonflikt ist …","Ich würde die Grenze bei … ziehen.","Was entgegnest du dem Einwand, dass …?"],"challenge":"Wählt zwischen einem sinnvollen, schlecht bezahlten Beruf und einem sicheren, langweiligen Job. Begründet eure Wahl.","stretch":"Entwickle eine dritte Option und erkläre, welchen Zielkonflikt auch sie nicht lösen kann."},{"title":"Das Recht, gewöhnlich zu sein","subtitle":"Müssen wir wirklich etwas Besonderes sein?","main":"Ist es vernünftig, ein glückliches Leben anzustreben, ohne unbedingt herausragen zu wollen?","mainExplain":"Manche Menschen wollen weder berühmt noch die Besten sein; sie wünschen sich einfach ein gutes, ruhiges Leben. Ist das ein vernünftiges Ziel, oder sollten junge Menschen höher hinaus?","questions":["Warum bewundern wir außergewöhnliche Leistungen?","Kann das ständige Streben nach Höchstleistungen ungesund werden?","Wie würdest du ein Leben definieren, das dir genügt?"],"explanations":["Menschen sind oft fasziniert von außergewöhnlichen Leistungen wie Rekorden, Preisen oder großen Entdeckungen. Warum könnten wir sie so sehr bewundern?","Immer der oder die Beste sein zu wollen, kann zu großen Ergebnissen führen. Könnte es für einen Menschen auch schädlich werden? Wann?","Viele sprechen von einem Leben voller großer Leistungen. Wie würdest du ein Leben beschreiben, das dir „genug“ wäre?"],"support":["Der entscheidende Zielkonflikt ist …","Ich würde die Grenze bei … ziehen.","Was entgegnest du dem Einwand, dass …?"],"challenge":"Schreibt ein Manifest aus drei Sätzen (Wir lehnen … ab. / Wir schätzen … / Wir vergessen nicht, dass …) und prüft einen Satz an einem starken Gegenbeispiel.","stretch":"Hinterfragt eine unrealistische Erfolgserwartung und erklärt, wem sie nützt."}],"vocab":[["der Selbstwert","Gefühl, als Mensch wertvoll zu sein"],["die gesellschaftliche Anerkennung","öffentliche Wertschätzung einer Leistung"],["der Perfektionismus","Anspruch, alles fehlerfrei zu machen"],["die Erschöpfung","starke Müdigkeit nach langer Belastung"],["der Zielkonflikt","Situation, in der Vorteile miteinander konkurrieren"],["das Privileg","Vorteil, den nicht alle haben"],["erfüllend","sinnvoll und persönlich befriedigend"],["die finanzielle Sicherheit","verlässliche wirtschaftliche Grundlage"],["das Stigma","ungerechte negative Bewertung einer Eigenschaft"],["die Resilienz","Fähigkeit, nach Rückschlägen weiterzumachen"],["die Anpassung","Orientierung an Erwartungen anderer"],["die Fremdbestätigung","Anerkennung, die man von anderen sucht"]],"toolkit":[["Standpunkt nennen","Ich würde behaupten, dass … / Mir scheint, dass …"],["Begründen","Ein Grund dafür ist … / Ein gutes Beispiel ist …"],["Konstruktiv widersprechen","Ich verstehe deinen Ansatz, aber … / Ich bezweifle, dass …"],["Vertiefen","Wie kommst du darauf? / Würde das auch gelten, wenn …?"]]},"C1":{"warm":"Definiert Erfolg in einem Satz und verbessert die Definition nach einem Gegenbeispiel.","stations":[{"title":"Was bedeutet Erfolg?","subtitle":"Worauf arbeiten wir eigentlich hin?","main":"Inwiefern prägen gesellschaftliche Erwartungen unser Verständnis von persönlichem Erfolg?","mainExplain":"Wir glauben oft, dass unsere Vorstellung von Erfolg ganz unsere eigene ist. Aber wie viel davon kommt aus dem, was andere von uns erwarten?","questions":["Zwei gleich talentierte Jugendliche möchten ein unbezahltes Praktikum machen, doch nur einer kann es sich leisten. Was sagt das über die Freiheit aus, eigene Ziele zu verfolgen?","Kann man herkömmliche Erfolgsmaßstäbe ablehnen, ohne sich verurteilt zu fühlen?","Wie könnte eine inklusivere Definition von Erfolg aussehen?"],"explanations":["Manche können es sich leisten, einen Weg zu wählen, der sie erfüllt, andere müssen vor allem ans Geldverdienen denken. Wie könnte die soziale Herkunft beeinflussen, wer sich selbst verwirklichen kann?","Manche entscheiden sich bewusst gegen die übliche Vorstellung von Erfolg, etwa ein hohes Einkommen oder einen angesehenen Beruf. Können sie das tun, ohne sich von anderen verurteilt zu fühlen? Warum oder warum nicht?","Unsere übliche Vorstellung von Erfolg lässt manche Menschen und Lebensweisen außen vor. Wie könnte eine Definition von Erfolg aussehen, die mehr Menschen einschließt?"],"support":["Das Argument setzt voraus, dass …","Eine unbeabsichtigte Folge könnte sein, dass …","Sollten wir nicht zwischen … und … unterscheiden?"],"challenge":"Entwickelt eine Definition von Erfolg, die ungleiche Startbedingungen berücksichtigt.","stretch":"Prüft sie an einem Menschen, der jede öffentliche Anerkennung ablehnt."},{"title":"Die Notenfalle","subtitle":"Wenn Leistungen zu Zahlen werden.","main":"Messen Noten vor allem Lernen oder die Anpassung an ein System?","mainExplain":"Eine gute Note kann zeigen, dass jemand viel gelernt hat – oder dass er genau weiß, was die Schule sehen will. Wie lässt sich das unterscheiden?","questions":["Wie kann Leistungsbewertung die Prioritäten von Lernenden verändern?","Könnte die Abschaffung von Noten neue Ungleichheiten schaffen?","Welches Verhältnis zwischen Anspruch und persönlicher Entwicklung wäre vertretbar?"],"explanations":["Wenn Schüler wissen, wie sie bewertet werden, richten sie ihre Aufmerksamkeit vielleicht anders aus. Wie könnte Bewertung verändern, was Lernende für wichtig halten?","Manchmal wird vorgeschlagen, Noten abzuschaffen, um Druck zu verringern. Könnte das neue Formen von Ungerechtigkeit schaffen? Wie?","Schule will ein hohes Niveau halten, aber auch die persönliche Entwicklung jedes Einzelnen fördern. Welches Verhältnis zwischen beidem könntest du verteidigen?"],"support":["Das Argument setzt voraus, dass …","Eine unbeabsichtigte Folge könnte sein, dass …","Sollten wir nicht zwischen … und … unterscheiden?"],"challenge":"Entwerft ein Bewertungssystem, das Lernfortschritte würdigt und Standards wahrt.","stretch":"Nennt eine unbeabsichtigte Folge eures Modells."},{"title":"Wessen Traum ist das?","subtitle":"Erwartungen von Familie und Umfeld.","main":"Wie unterscheiden wir unterstützende Beratung von verdeckter Einflussnahme?","mainExplain":"Eltern oder Lehrkräfte geben oft Ratschläge für die Zukunft. Wann helfen diese Ratschläge, frei zu wählen, und wann treffen sie die Entscheidung unbemerkt für jemanden?","questions":["Unter welchen Bedingungen, wenn überhaupt, können familiäre Opfer Verpflichtungen begründen?","Welche Rolle spielen kulturelle Erwartungen?","Sind Selbstbestimmung und Verantwortung für andere miteinander vereinbar?"],"explanations":["Unter welchen Bedingungen, wenn überhaupt, könnten die Opfer, die eine Familie für jemanden gebracht hat, für diese Person eine Verpflichtung begründen? Welche Art von Verpflichtung wäre das?","Vorstellungen davon, was man seiner Familie schuldet, sind nicht in allen Kulturen gleich. Welche Rolle könnten solche kulturellen Erwartungen dabei spielen, wie Menschen diese Frage beantworten?","Selbst über das eigene Leben zu bestimmen und sich für andere verantwortlich zu fühlen, kann in verschiedene Richtungen ziehen. Kann beides im Leben eines Menschen nebeneinander bestehen? Wie?"],"support":["Das Argument setzt voraus, dass …","Eine unbeabsichtigte Folge könnte sein, dass …","Sollten wir nicht zwischen … und … unterscheiden?"],"challenge":"Begründet und kritisiert nacheinander die Pflicht, familiäre Erwartungen zu erfüllen.","stretch":"Verbindet Selbstbestimmung mit gegenseitiger Verantwortung."},{"title":"Die Vergleichsfalle","subtitle":"Warum scheinen alle anderen weiter zu sein?","main":"Wie prägen digitale Plattformen unser Bild eines erfolgreichen Lebens?","mainExplain":"Online sehen wir vor allem die besten Momente und Erfolge anderer. Wie könnte das unsere Vorstellung davon verändern, wie ein normales oder erfolgreiches Leben aussieht?","questions":["Hängt das Vergleichen eher von der Persönlichkeit oder von gesellschaftlichen Strukturen ab?","Unter welchen Umständen kann öffentliche Anerkennung helfen oder schaden?","Wie ließe sich Fortschritt ohne äußere Maßstäbe beurteilen?"],"explanations":["Manche vergleichen sich viel häufiger mit anderen als andere. Ist das vor allem eine Frage der Persönlichkeit, oder spielen gesellschaftliche Strukturen eine größere Rolle?","Öffentlich anerkannt zu werden, kann das Gefühl geben, geschätzt zu sein, aber auch unter Druck setzen. Unter welchen Umständen könnte Anerkennung helfen, und wann könnte sie schaden?","Oft messen wir unseren Fortschritt daran, wie wir im Vergleich zu anderen dastehen. Wie könntest du deinen eigenen Fortschritt beurteilen, ohne andere als Maßstab zu nehmen?"],"support":["Das Argument setzt voraus, dass …","Eine unbeabsichtigte Folge könnte sein, dass …","Sollten wir nicht zwischen … und … unterscheiden?"],"challenge":"Entwerft ein Gedankenexperiment über eine Gesellschaft ohne öffentliche Ranglisten.","stretch":"Erörtert, wo neuer Statuswettbewerb entstehen könnte."},{"title":"Angst vor dem Scheitern","subtitle":"Fehler, Risiken und neue Versuche.","main":"Unter welchen Bedingungen führt Scheitern tatsächlich zu Lernprozessen?","mainExplain":"Man sagt oft, dass man aus Fehlern lernt. Was muss nach einem Misserfolg geschehen, damit jemand wirklich etwas lernt, statt sich nur schlecht zu fühlen?","questions":["Welche persönlichen und gesellschaftlichen Faktoren beeinflussen, wie Menschen Rückschläge bewältigen?","Wann wirkt die Verherrlichung von Resilienz unsensibel?","Sollten Institutionen kluge Risikobereitschaft belohnen, auch wenn sie nicht zum Erfolg führt?"],"explanations":["Menschen erholen sich sehr unterschiedlich von Rückschlägen. Welche persönlichen und gesellschaftlichen Umstände könnten es leichter oder schwerer machen, mit ihnen fertigzuwerden?","Menschen dafür zu loben, dass sie widerstandsfähig sind, kann ermutigend klingen. Wann könnte solches Lob für jemanden, dem es gerade schlecht geht, unsensibel wirken?","Einrichtungen wie Schulen oder Unternehmen belohnen oft nur Erfolg. Sollten sie auch jemanden belohnen, der ein gut überlegtes Risiko eingegangen ist, das nicht geklappt hat? Warum oder warum nicht?"],"support":["Das Argument setzt voraus, dass …","Eine unbeabsichtigte Folge könnte sein, dass …","Sollten wir nicht zwischen … und … unterscheiden?"],"challenge":"Kritisiert „Aus Fehlern lernt man am meisten“ aus zwei sozialen Perspektiven.","stretch":"Formuliert Bedingungen, unter denen Scheitern tatsächlich produktiv wird."},{"title":"Immer beschäftigt","subtitle":"Ehrgeiz, Erholung und Erschöpfung.","scenario":"Ein Schüler hat ein schlechtes Gewissen, sobald er sich ausruht, statt zu lernen.","main":"Warum könnten andere diese Haltung bewundern, und wann wird sie schädlich?","mainExplain":"Manche sehen ständiges Arbeiten als Zeichen eines guten Charakters. Warum könnte das so sein, und ab wann schadet diese Haltung der Person selbst?","questions":["Kann Ehrgeiz sowohl aus echtem Interesse als auch aus Angst entstehen?","Wem könnte eine Kultur nutzen oder schaden, die Erschöpfung glorifiziert?","Was müsste sich an unserem Verständnis von Leistung ändern?"],"explanations":["Man kann hart arbeiten, weil man liebt, was man tut, oder weil man Angst davor hat, was passiert, wenn man es nicht tut. Können beide Gründe denselben Menschen gleichzeitig antreiben?","In manchen Kulturen wird man dafür gelobt, ständig müde und beschäftigt zu sein. Wem könnte eine solche Kultur nützen, und wer könnte darunter leiden?","Unser heutiges Verständnis von Leistung lässt oft wenig Raum für Erholung. Was müsste sich daran ändern, damit es gesünder wird?"],"support":["Das Argument setzt voraus, dass …","Eine unbeabsichtigte Folge könnte sein, dass …","Sollten wir nicht zwischen … und … unterscheiden?"],"challenge":"Verteidigt ein Recht auf Freizeit, ohne sie mit höherer Produktivität zu rechtfertigen.","stretch":"Untersucht, wer die Kosten fremder Work-Life-Balance trägt."},{"title":"Traumjob oder Gehalt?","subtitle":"Eine Zukunft ohne perfekte Lösungen wählen.","scenario":"Zwei Jugendliche hören den Rat „Folge deiner Leidenschaft“. Einer muss die Familie finanziell unterstützen, der andere nicht.","main":"Ist der Rat für beide gleichermaßen fair?","mainExplain":"Derselbe Rat kann je nach Lebenslage ganz anders klingen. Was würde es die beiden Jugendlichen jeweils kosten, „ihrer Leidenschaft zu folgen“?","questions":["Wer profitiert davon, wenn man jungen Menschen sagt, Freude am Beruf sei wichtiger als das Gehalt?","Kann sinnvolle Arbeit unsichere Bedingungen aufwiegen?","Gibt es eine moralische Pflicht, einen gesellschaftlich nützlichen Beruf zu wählen?"],"explanations":["Ratschläge wie „Folge deiner Leidenschaft“ bekommen alle Jugendlichen gleichermaßen. Wer profitiert, wenn Menschen für eine Arbeit, die sie lieben, weniger Geld akzeptieren, und wer könnte verlieren? Denk an Arbeitgeber, Familien und die Jugendlichen selbst.","Eine Arbeit kann sehr sinnvoll sein, aber wenig Sicherheit oder ein niedriges Einkommen bieten. Kann der Sinn schlechte Bedingungen ausgleichen? Für wen, und wie lange?","Manche Berufe helfen der Gesellschaft deutlich mehr als andere. Gibt es eine moralische Pflicht, einen solchen Beruf zu wählen, oder ist das eine persönliche Entscheidung? Warum?"],"support":["Das Argument setzt voraus, dass …","Eine unbeabsichtigte Folge könnte sein, dass …","Sollten wir nicht zwischen … und … unterscheiden?"],"challenge":"Hinterfragt den Rat „Mach deine Leidenschaft zum Beruf“.","stretch":"Berücksichtigt dabei gesellschaftlich notwendige, aber schlecht bezahlte Arbeit."},{"title":"Das Recht, gewöhnlich zu sein","subtitle":"Müssen wir wirklich etwas Besonderes sein?","main":"Untergräbt der Anspruch, außergewöhnlich zu sein, die alltägliche Zufriedenheit?","mainExplain":"Wenn alle etwas Besonderes oder Herausragendes sein sollen, was passiert dann mit dem Wert eines normalen, glücklichen Alltags?","questions":["Kann man Ehrgeiz von Statusdenken trennen?","Welche Wertungen stecken im Wort „gewöhnlich“?","Wie könnte eine Gesellschaft unauffällige Lebenswege anerkennen?"],"explanations":["Ehrgeiz wird oft damit verbunden, bewundert zu werden oder eine hohe Stellung zu haben. Kann man ehrgeizig sein, ohne dass einem Status wichtig ist?","Das Wort „gewöhnlich“ kann neutral, positiv oder abwertend klingen. Welche versteckten Urteile könnten Menschen fällen, wenn sie ein Leben „gewöhnlich“ nennen?","Viele Menschen führen ein ruhiges Leben, das selten Aufmerksamkeit erregt. Wie könnte eine Gesellschaft zeigen, dass sie solche Lebenswege schätzt?"],"support":["Das Argument setzt voraus, dass …","Eine unbeabsichtigte Folge könnte sein, dass …","Sollten wir nicht zwischen … und … unterscheiden?"],"challenge":"Formuliert ein Gegenargument zur Forderung, jeder müsse außergewöhnlich sein.","stretch":"Diskutiert: Ist Zufriedenheit eine Entscheidung, eine Leistung oder ein Privileg?"}],"vocab":[["die Meritokratie","Vorstellung einer Ordnung nach Leistung und Verdienst"],["der soziale Aufstieg","Wechsel in eine höhere gesellschaftliche Position"],["die Handlungsmacht","Möglichkeit, wirksam selbst zu entscheiden"],["die strukturelle Ungleichheit","Benachteiligung durch gesellschaftliche Strukturen"],["die Prekarität","dauerhaft unsichere Lebens- oder Arbeitsbedingungen"],["die Selbstbestimmung","freie Entscheidung über den eigenen Lebensweg"],["die Leistungskultur","gesellschaftlicher Druck zu ständigem Erfolg"],["die normative Annahme","unausgesprochene Vorstellung davon, was gelten sollte"],["die kollektive Verantwortung","gemeinsam getragene Pflichten"],["der soziale Status","Ansehen und Stellung innerhalb einer Gruppe"],["die Selbstverwirklichung","Entfaltung eigener Fähigkeiten und Bedürfnisse"],["das Gegenargument","Grund, der gegen eine These spricht"]],"toolkit":[["Differenzieren","Weitgehend gilt … / Das bedeutet allerdings nicht, dass …"],["Argumentieren","Die zugrunde liegende Annahme ist … / Das zeigt sich daran, dass …"],["Höflich hinterfragen","Diese Prämisse überzeugt mich nicht ganz, weil …"],["Weiterdenken","Kannst du … genauer erläutern? / Wie sähe das praktisch aus?"]]},"C2":{"warm":"Formuliert eine verbreitete Erfolgsbehauptung, deckt ihre Annahme auf und findet ein Gegenbeispiel.","stations":[{"title":"Was bedeutet Erfolg?","subtitle":"Worauf arbeiten wir eigentlich hin?","scenario":"Eine Schülerin gewinnt einen großen Preis; ein anderer Jugendlicher kümmert sich ein Jahr lang um ein Familienmitglied und erhält keine Auszeichnung.","main":"Wen nennt man erfolgreich, und was zeigt das über sozialen Status?","mainExplain":"Beide strengen sich sehr an, aber nur eine wird öffentlich anerkannt. Was entscheidet darüber, welche Art von Anstrengung in einer Gesellschaft als Erfolg gilt?","questions":["Welche unausgesprochenen Annahmen tragen meritokratische Erzählungen?","Inwiefern relativiert der Zufall den Anspruch, Erfolge vollständig verdient zu haben?","Lässt sich Erfolg bestimmen, ohne menschliche Lebensläufe hierarchisch zu ordnen?"],"explanations":["Erzählungen über Leistung behaupten, Erfolg komme von Begabung und Anstrengung. Welche unausgesprochenen Annahmen könnten hinter solchen Erzählungen stecken?","Vieles im Leben hängt vom Zufall ab, nicht nur von Anstrengung. Wenn der Zufall mitspielt, kann man dann noch sagen, dass Menschen ihren Erfolg vollständig verdient haben?","Definitionen von Erfolg ordnen Leben oft von mehr zu weniger erfolgreich. Ist es möglich, über Erfolg zu sprechen, ohne Lebensläufe in eine Rangordnung zu bringen?"],"support":["Hier werden … und … unzulässig gleichgesetzt.","Ein Gegenbeispiel würde die These erschüttern, dass …","Ich würde das Problem folgendermaßen neu fassen: …"],"challenge":"Argumentiert, dass „Erfolg“ eine grundlegend gesellschaftliche Kategorie ist, und versucht dann, eine rein private Definition gegen dieses Argument zu verteidigen.","stretch":"Entscheidet, ob sich Zufall jemals vollständig von Verdienst trennen lässt und was daraus für die Art folgt, wie wir Menschen belohnen."},{"title":"Die Notenfalle","subtitle":"Wenn Leistungen zu Zahlen werden.","scenario":"Stell dir eine Schule vor, die nur bewertet, wie schnell Schülerinnen und Schüler antworten.","main":"Wie könnte das ihr Lernen verändern – und das, was Lehrkräfte als Begabung ansehen?","mainExplain":"Würde nur Schnelligkeit belohnt, würden Schüler vor allem Schnelligkeit üben. Könnte die Art zu prüfen verändern, was wir überhaupt unter Begabung verstehen?","questions":["Können scheinbar objektive Noten strukturelle Vorteile verdecken?","Was müsste eine glaubwürdige Alternative zu herkömmlichen Rangordnungen bewahren?","Können hohe Bildungsansprüche mit weitreichenden Maßnahmen gegen Ungleichheit vereinbar sein?"],"explanations":["Noten wirken oft neutral und objektiv. Könnten sie trotzdem Vorteile verdecken, die manche Schüler durch ihre Herkunft haben? Wie?","Stell dir vor, die übliche Rangordnung von Schülern würde durch etwas anderes ersetzt. Was müsste eine solche Alternative bewahren, damit man sie ernst nimmt?","Hohe Bildungsansprüche und starke Bemühungen gegen Ungleichheit gelten manchmal als Gegensatz. Können sie gleichzeitig bestehen? Wie?"],"support":["Hier werden … und … unzulässig gleichgesetzt.","Ein Gegenbeispiel würde die These erschüttern, dass …","Ich würde das Problem folgendermaßen neu fassen: …"],"challenge":"Argumentiert, dass jede Reform der Leistungsbewertung Ungleichheit lediglich verlagert, und prüft das Argument anschließend an den stärksten Gegenbeispielen.","stretch":"Bestimmt, welche Merkmale der Notengebung unverzichtbar und welche bloße Konvention sind, und begründet diese Unterscheidung."},{"title":"Wessen Traum ist das?","subtitle":"Erwartungen von Familie und Umfeld.","main":"Wo endet berechtigte familiäre Verpflichtung und wo beginnt Zwang?","mainExplain":"Familienmitglieder schulden einander vielleicht etwas, etwa Hilfe oder Loyalität. Ab wann wird aus Pflichtgefühl ein Druck, der jemandem die Freiheit nimmt?","questions":["Lassen sich übernommene Erwartungen tatsächlich frei bejahen?","Wie sind Autonomie und Gegenseitigkeit bei einem Konflikt zu gewichten?","Wann verschleiert die Rede vom „eigenen Traum“ materielle Abhängigkeiten?"],"explanations":["Viele junge Menschen übernehmen Erwartungen ihrer Familie. Kann jemand solche Erwartungen wirklich als eigene annehmen, statt ihnen einfach nur zu folgen?","Persönliche Freiheit und der Gedanke, etwas zurückzugeben, was man bekommen hat, können in Konflikt geraten. Wie sollte man diese beiden Werte gewichten, wenn sie aneinandergeraten?","„Folge deinem Traum“ klingt ermutigend. Wann könnte dieser Satz verdecken, dass manche Menschen finanziell von anderen abhängig sind und nicht frei wählen können?"],"support":["Hier werden … und … unzulässig gleichgesetzt.","Ein Gegenbeispiel würde die These erschüttern, dass …","Ich würde das Problem folgendermaßen neu fassen: …"],"challenge":"Rekonstruiert ein starkes Argument für die Verpflichtung von Kindern gegenüber ihren Eltern – in Begriffen, die auch die Gegenseite akzeptieren würde – und benennt dann den Punkt, an dem daraus Zwang wird.","stretch":"Prüft, ob Dankbarkeit jemals eine bindende Pflicht begründen kann oder nur eine moralische Erwartung."},{"title":"Die Vergleichsfalle","subtitle":"Warum scheinen alle anderen weiter zu sein?","scenario":"Eine Schülerin zeigt online jeden Erfolg, ein anderer Schüler meidet soziale Medien.","main":"Kann sich einer von beiden dem Vergleichen wirklich entziehen? Warum?","mainExplain":"Wer soziale Medien verlässt, scheint dem Vergleichen zu entkommen, doch Menschen vergleichen sich auch auf andere Weise. Kann man sich dem Vergleichen überhaupt entziehen?","questions":["Unter welchen Bedingungen könnten Plattformen an Unsicherheit verdienen und Sichtbarkeit zugleich als Selbstermächtigung darstellen?","Kann man sich der Aufmerksamkeitsökonomie tatsächlich entziehen?","Ist der Vergleich mit dem früheren Selbst weniger zermürbend als Konkurrenz?"],"explanations":["Plattformen stellen Sichtbarkeit oft als etwas dar, das Menschen stark macht. Unter welchen Bedingungen könnten sie zugleich mit der Unsicherheit der Menschen Geld verdienen?","Apps und Medien kämpfen ständig um unsere Aufmerksamkeit. Kann sich ein Mensch dem wirklich entziehen, oder ist das heute fast unmöglich?","Manche vergleichen sich nur mit ihrem früheren Selbst statt mit anderen. Ist diese Art des Vergleichs weniger belastend? Warum oder warum nicht?"],"support":["Hier werden … und … unzulässig gleichgesetzt.","Ein Gegenbeispiel würde die These erschüttern, dass …","Ich würde das Problem folgendermaßen neu fassen: …"],"challenge":"Formuliert die stärkste Verteidigung des sozialen Vergleichs als Motor des Fortschritts und legt dann seine verborgenen Kosten offen.","stretch":"Erwägt, ob der Rückzug aus der öffentlichen Sichtbarkeit eine echte Form von Freiheit ist oder bloß ein weiteres Privileg."},{"title":"Angst vor dem Scheitern","subtitle":"Fehler, Risiken und neue Versuche.","main":"Inwiefern fällt es finanziell oder sozial abgesicherten Menschen leichter, Scheitern positiv zu bewerten?","mainExplain":"Der Satz „Scheitern ist in Ordnung“ fällt leichter, wenn die Familie einen auffängt. Wie verändert ein Sicherheitsnetz, was Scheitern für jemanden bedeutet?","questions":["Wann verlagert die Resilienzrhetorik Verantwortung von Institutionen auf Einzelne?","Wie trennt man bewundernswerte Ausdauer von der Weigerung, Ziele neu zu bewerten?","Kann ein gescheiterter Versuch wertvoller sein als ein erfolgreicher Ausgang?"],"explanations":["Die Rede von Resilienz ermutigt Menschen, mit Schwierigkeiten selbst fertigzuwerden. Wann könnte sie Verantwortung von Schulen, Arbeitgebern oder dem Staat auf Einzelne abschieben?","Nicht aufzugeben, wird oft bewundert. Aber wie unterscheidet man bewundernswerte Ausdauer davon, sich zu weigern, ein Ziel zu überdenken, das keinen Sinn mehr ergibt?","Meist schätzen wir Ergebnisse mehr als Versuche. Könnte ein gescheiterter Versuch manchmal mehr wert sein als ein Erfolg? In welchem Sinn?"],"support":["Hier werden … und … unzulässig gleichgesetzt.","Ein Gegenbeispiel würde die These erschüttern, dass …","Ich würde das Problem folgendermaßen neu fassen: …"],"challenge":"Formuliert „Aus Fehlern lernt man am meisten“ so um, dass der Satz auch für Menschen ohne Sicherheitsnetz gilt, und verteidigt eure Fassung.","stretch":"Unterscheidet Misserfolge, aus denen man lernt, von solchen, die nur schaden, und klärt, wer darüber entscheidet."},{"title":"Immer beschäftigt","subtitle":"Ehrgeiz, Erholung und Erschöpfung.","scenario":"Ein Mitschüler sagt: „Ausruhen ist Zeitverschwendung, wenn man dadurch nicht produktiver wird.“","main":"Welches moralische Urteil steckt darin, und lässt es sich rechtfertigen?","mainExplain":"Die Aussage sieht Ausruhen nur dann als wertvoll an, wenn es zu mehr Arbeit führt. Was sagt das darüber, wie wir Menschen beurteilen, und kann Ruhe einen eigenen Wert haben?","questions":["Welche Widersprüche entstehen, wenn sogar Freizeit optimiert werden soll?","Wie kann sinnstiftender Ehrgeiz ohne Selbstausbeutung erhalten bleiben?","Was würde ein bedingungsloses Recht auf Erholung bedeuten?"],"explanations":["Selbst Freizeit wird manchmal so geplant, dass sie möglichst nützlich und effizient ist. Welche Widersprüche könnten entstehen, wenn Freizeit zu etwas wird, das man optimieren muss?","Ehrgeiz kann dem Leben Sinn geben, aber auch dazu führen, sich selbst zu viel abzuverlangen. Wie könnte jemand ehrgeizig bleiben, ohne sich selbst auszubeuten?","Ein bedingungsloses Recht auf Erholung hieße, dass man sich Erholung nicht verdienen muss. Was würde es praktisch bedeuten, ein solches Recht zu verteidigen?"],"support":["Hier werden … und … unzulässig gleichgesetzt.","Ein Gegenbeispiel würde die These erschüttern, dass …","Ich würde das Problem folgendermaßen neu fassen: …"],"challenge":"Verteidigt Erholung als Selbstzweck, ohne mit Gesundheit, Produktivität oder Wohlbefinden zu argumentieren.","stretch":"Untersucht, wessen unsichtbare Arbeit die Freizeit anderer erst ermöglicht und was daraus für eine gerechte Verteilung von Zeit folgt."},{"title":"Traumjob oder Gehalt?","subtitle":"Eine Zukunft ohne perfekte Lösungen wählen.","main":"Ist die Gegenüberstellung von Erfüllung und finanzieller Stabilität ein falscher Gegensatz?","mainExplain":"Oft wird so geredet, als müsse man zwischen einem Beruf, den man liebt, und einem gut bezahlten Beruf wählen. Ist das wirklich die einzige Wahl, oder gibt es andere Möglichkeiten?","questions":["Wann zerstört die Professionalisierung einer Leidenschaft deren ursprünglichen Reiz?","Wie sollten wir notwendige, aber wenig angesehene Arbeit bewerten?","Kann Berufsberatung überhaupt politisch neutral sein?"],"explanations":["Ein Hobby oder eine Leidenschaft zum Beruf zu machen, kann ein Traum sein. Wann könnte die berufliche Ausübung die Freude zerstören, die daraus eine Leidenschaft gemacht hat?","Manche Arbeiten sind für die Gesellschaft notwendig, bringen aber wenig Ansehen. Wie sollte eine Gesellschaft den Wert solcher Arbeit zeigen?","Berufsberatung wirkt oft rein praktisch. Könnte sie jemals völlig frei von politischen Werten und Annahmen sein? Warum oder warum nicht?"],"support":["Hier werden … und … unzulässig gleichgesetzt.","Ein Gegenbeispiel würde die These erschüttern, dass …","Ich würde das Problem folgendermaßen neu fassen: …"],"challenge":"Argumentiert, dass das Ideal „Mach, was du liebst“ eher Arbeitgebern als Beschäftigten dient, und räumt dann ein, was daran richtig ist.","stretch":"Schlagt Kriterien für den gesellschaftlichen Wert von Arbeit vor, die weder vom Gehalt noch vom Prestige abhängen."},{"title":"Das Recht, gewöhnlich zu sein","subtitle":"Müssen wir wirklich etwas Besonderes sein?","scenario":"Ein Jugendlicher wünscht sich einen einfachen Beruf und ein ruhiges Leben.","main":"Wer würde das als „gewöhnlich“ oder „erfolglos“ bezeichnen, und was verrät dieses Urteil?","mainExplain":"Ein Leben „gewöhnlich“ zu nennen klingt wie eine Beschreibung, kann aber auch ein Urteil sein. Wer entscheidet, was gewöhnlich ist, und welche Werte stecken hinter dem Wort?","questions":["Kann Authentizität selbst zur Wettbewerbsdisziplin werden?","Ist Zufriedenheit Widerstand, Anpassung oder keines von beidem?","Welche Vorstellung eines gelingenden Lebens bleibt nach dem Abschied vom Ideal des Außergewöhnlichen?"],"explanations":["„Authentisch“ zu sein, wird oft als Ideal dargestellt. Könnte das Bemühen, authentisch zu wirken, selbst zu einem neuen Wettbewerb werden?","Mit dem eigenen Leben zufrieden zu sein, kann man unterschiedlich sehen. Ist es eine Form, sich dem Druck zu widersetzen, eine Form der Anpassung oder etwas ganz anderes?","Wenn wir nicht mehr annehmen, dass ein gutes Leben außergewöhnlich sein muss, welche Vorstellung eines gelingenden Lebens bleibt dann? Woraus würde es bestehen?"],"support":["Hier werden … und … unzulässig gleichgesetzt.","Ein Gegenbeispiel würde die These erschüttern, dass …","Ich würde das Problem folgendermaßen neu fassen: …"],"challenge":"Verteidigt das Gewöhnliche, ohne es zu einem neuen Ideal zu machen, das man erreichen muss.","stretch":"Untersucht, ob die Rede von „Authentizität“ der Logik des Wettbewerbs entkommt oder sie nur verfeinert."}],"vocab":[["die Kontingenz","Einfluss zufälliger und nicht notwendiger Umstände"],["die meritokratische Erzählung","Darstellung von Ergebnissen als vollständig verdient"],["das normative Urteil","Aussage darüber, was gelten oder wertvoll sein soll"],["der moralische Wert","ethisch verstandener Wert eines Menschen"],["die Reziprozität","Prinzip gegenseitiger Verpflichtungen"],["die Kommodifizierung","Verwandlung von Dingen in verkäufliche Waren"],["der instrumentelle Wert","Nützlichkeit als Mittel für einen anderen Zweck"],["die Selbstausbeutung","übermäßige Beanspruchung durch eigene Ansprüche"],["die Statushierarchie","Rangordnung nach gesellschaftlichem Prestige"],["das gelingende Leben","Vorstellung eines erfüllten, sinnvollen Daseins"],["die epistemische Verzerrung","systematischer Fehler bei der Wissensbildung"],["die falsche Dichotomie","irreführende Reduktion auf zwei Möglichkeiten"]],"toolkit":[["Problem zuspitzen","Der Kern der Frage liegt darin, dass … / Das setzt voraus, dass …"],["Nuancieren","Zugegeben, …; dennoch … / Die Unterscheidung ist nicht nur begrifflich."],["Präzise entgegnen","Dieser Schluss gilt nur unter der Voraussetzung, dass …"],["Zusammenführen","Ließen sich beide Sichtweisen verbinden, wenn …? / Plausibler wäre die These, dass …"]]}},"uiSimple":{"eyebrow":"SPRECHEN · FRAGEN · ANTWORTEN · ZUHÖREN","hero":"Schule, Familie, Freunde, Geld, Zukunft. Was ist für dich wichtig? Sprich mit deinem Partner oder deiner Partnerin.","privacy":"Du kannst Beispiele erfinden. Du musst nicht über deine Noten, deine Familie oder dein Privatleben sprechen.","step3":"Stelle deinem Partner oder deiner Partnerin eine Frage.","step4":"Mehr? Öffne die nächste Aufgabe.","main":"HAUPTFRAGE","questions":"Weitere Fragen","supportTitle":"Brauchst du Hilfe?","supportDesc":"Wörter für den Satzanfang.","supportShow":"Hilfe zeigen","supportHide":"Hilfe ausblenden","challengeTitle":"Noch mehr sprechen","challengeDesc":"Nach der Hauptfrage.","challengeShow":"Aufgabe zeigen","challengeHide":"Aufgabe ausblenden","stretchTitle":"Eine schwierigere Aufgabe","stretchDesc":"Möchtest du mehr sprechen?","stretchShow":"Schwierige Aufgabe zeigen","stretchHide":"Schwierige Aufgabe ausblenden","progress":"Sag, warum. Gib ein Beispiel. Stell eine Frage.","vocabLabel":"NÜTZLICHE WÖRTER","vocabDesc":"Benutze diese Wörter beim Sprechen.","toolkitLabel":"NÜTZLICHE SÄTZE","toolkitDesc":"Sprecht zusammen: Fragt und antwortet.","title":"Ist Erfolg wichtig?","strap":"Was ist für dich ein gutes Leben?"},"uiB1":{"stretchTitle":"Geh einen Schritt weiter","stretchDesc":"Eine schwierigere Aufgabe, wenn ihr schon sicher sprecht.","vocabDesc":"Wähle passende Wörter; du musst nicht alle benutzen.","progress":"Nennt Gründe und Beispiele und reagiert aufeinander."}},"fr":{"ui":{"title":"La pression de réussir","strap":"Qui décide de ce qu’est la réussite ?","brand":"LABORATOIRE DE CONVERSATION","subbrand":"Une conversation, pas un examen","eyebrow":"PARLE · QUESTIONNE · JUSTIFIE · RÉAGIS","hero":"Les notes. Les attentes. La compétition. L’échec. L’avenir. Qui décide de ce que signifie réussir ? Explore cette question à deux, échange après échange.","privacy":"Vous pouvez inventer des exemples. Personne n’a besoin de révéler ses notes, ses problèmes familiaux ou sa vie privée.","format":"En binômes","estimated":"45 min · 5 stations","changeLevel":"Niveau CECRL","changeLanguage":"Langue","themeDay":"Clair","themeNight":"Sombre","fullscreen":"Plein écran","exitFullscreen":"Quitter le plein écran","resetLesson":"Réinitialiser","levelGoal":"Objectif oral","step1":"Réfléchis un instant.","step2":"Donne une raison ou un exemple.","step3":"Pose une question à ton partenaire.","step4":"Ouvre le défi pour prolonger la discussion.","warmTitle":"Mise en route","warmTime":"2–3 min · si tu veux","warmHint":"Si tu veux : une courte activité pour commencer.","stations":"Étapes de discussion","station":"Étape","of":"sur","main":"QUESTION PRINCIPALE","questions":"Explore la question","supportTitle":"Besoin d’aide pour par
