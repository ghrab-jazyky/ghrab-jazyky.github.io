name: LSH unlock Stage B checks

on:
  push:
    branches:
      - feat/lsh-unlock-gestures-v124
    paths:
      - "language-skills-hub/**"
      - ".github/workflows/lsh-unlock-stageb.yml"
  pull_request:
    paths:
      - "language-skills-hub/self-check/session/**"
      - "language-skills-hub/self-check/reading/index.html"
      - "language-skills-hub/self-check/reading/teacher.html"
      - "language-skills-hub/self-check/listening/student.html"
      - "language-skills-hub/self-check/listening/teacher.html"
      - "language-skills-hub/tests/lsh-unlock-*.cjs"
      - "language-skills-hub/tests/lsh-asteroids-lock-*.cjs"
      - "language-skills-hub/tests/lsh-asteroids-mobile-layout.browser.test.cjs"
      - "language-skills-hub/tests/lsh-asteroids-all-gestures-mobile-layout.browser.test.cjs"
      - "language-skills-hub/assets/hub.js"
      - "language-skills-hub/index.html"
      - ".github/workflows/lsh-unlock-stageb.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lsh-stageb-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stageb:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Match the already-certified teacher gesture workflow: browsers and
      # OS libraries ship inside Playwright's pinned official runner image.
      - name: Install matching Playwright JS bindings
        timeout-minutes: 8
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 jsqr@1.4.0 pngjs@7.0.0
      - name: T1 deterministic unit tests and 250k random sequences
        run: node --test language-skills-hub/tests/lsh-unlock-gestures.test.cjs language-skills-hub/tests/lsh-unlock-fuzz-t1.test.cjs
      - name: C deterministic timing, geometry and pointer-capture boundary tests
        run: node --test language-skills-hub/tests/lsh-unlock-stagec-boundaries.test.cjs
      - name: B2 deterministic F-17 unit tests
        run: node --test language-skills-hub/tests/lsh-unlock-b2.test.cjs
      - name: Independent audit lifecycle, persistence and input regressions
        run: node --test language-skills-hub/tests/lsh-unlock-audit-runtime.test.cjs language-skills-hub/tests/lsh-unlock-audit-input.test.cjs
      - name: Start local static web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-unlock-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/language-skills-hub/self-check/reading/teacher.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lsh-unlock-http.log
          exit 1
      - name: Diagnose legacy mouse completion after reload (B2)
        run: node --test language-skills-hub/tests/lsh-unlock-b2-legacy-diagnostic.browser.test.cjs
      - name: T4 forced-denial decision matrix and one-shot controls
        run: node --test language-skills-hub/tests/lsh-unlock-stageb-t4.browser.test.cjs
      - name: R64 URL/registry and R30 counter lifecycle
        run: node --test language-skills-hub/tests/lsh-unlock-stageb-state.browser.test.cjs
      - name: T2 trusted mouse events and T4 forced fullscreen in both browsers
        run: node --test language-skills-hub/tests/lsh-unlock-stageb.browser.test.cjs
      - name: T2 viewport and touch matrix, T5 WebKit synth, T3 genuine Fullscreen API
        run: node --test language-skills-hub/tests/lsh-unlock-stageb-matrix.browser.test.cjs
      - name: B2 fullscreen rearming and F-17 browser matrix
        run: node --test language-skills-hub/tests/lsh-unlock-b2.browser.test.cjs
      - name: C teacher UI geometry, accessibility, themes and runner-local screenshots
        run: node --test language-skills-hub/tests/lsh-unlock-stagec-visual.browser.test.cjs
      - name: D independent review regression - teacher QR confirmation
        run: node --test language-skills-hub/tests/lsh-unlock-staged-teacher-confirmation.browser.test.cjs
      - name: Independent audit browser regressions in both labs and engines
        run: node --test language-skills-hub/tests/lsh-unlock-audit-regressions.browser.test.cjs
      - name: R56 Reading test and 120 decoded QR variants
        run: node --test language-skills-hub/tests/r56-reading-test-qr.browser.test.cjs
      - name: Report on failure
        if: failure()
        run: |
          echo 'NO-GO: LSH unlock Stage B failed. Do not merge or deploy the affected gesture changes.'
          test -f /tmp/lsh-unlock-http.log && tail -n 60 /tmp/lsh-unlock-http.log || true
