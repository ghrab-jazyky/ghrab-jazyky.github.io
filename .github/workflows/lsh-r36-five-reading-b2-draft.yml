name: LSH R36 five Reading topics EN/B2 independent bank draft QA
on:
  pull_request:
    branches: [feat/lsh-r35-generic-independent-reading-loader-2026-11-10]
  workflow_dispatch:
concurrency:
  group: lsh-r36-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  r36-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: New and historical contract checks
        run: |
          node --check language-skills-hub/tests/r36-all-reading-topic-b2.test.cjs
          node --check language-skills-hub/tests/r36-all-reading-topic-b2.browser.test.cjs
          node --test language-skills-hub/tests/r32-independent-reading-pilot.test.cjs language-skills-hub/tests/r33-independent-reading-b1.test.cjs language-skills-hub/tests/r34-six-level-independent-reading.test.cjs language-skills-hub/tests/r34-coverage-and-schema.test.cjs language-skills-hub/tests/r36-all-reading-topic-b2.test.cjs
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs
  r36-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium/WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Independent B2 cross-topic QA
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r36-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r32-independent-reading.browser.test.cjs language-skills-hub/tests/r33-independent-reading-b1.browser.test.cjs language-skills-hub/tests/r34-six-level-reading.browser.test.cjs language-skills-hub/tests/r35-generic-reading-preview.browser.test.cjs language-skills-hub/tests/r36-all-reading-topic-b2.browser.test.cjs
