name: LSH Human Rights R35-HR2 release and compatibility gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-human-rights-r35-hr2.yml'
  push:
    branches: [release/lsh-human-rights-r35-hr2-20261113, main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-human-rights-r35-hr2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JS syntax
        run: |
          node --check language-skills-hub/assets/hub.js
          node --check language-skills-hub/assets/lsh/v3/card-bridge.js
          node --check language-skills-hub/tests/r35-hr2-release.test.cjs
          node --check language-skills-hub/tests/r35-hr2-release.browser.test.cjs
          git diff --check
      - name: Run all static LSH regressions, including R24 Listening
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import subprocess,sys
          files=sorted(str(p) for p in Path('language-skills-hub/tests').glob('*.test.cjs')
            if not p.name.endswith('.browser.test.cjs') and not p.name.endswith('-browser.test.cjs'))
          assert len(files)>=30, len(files)
          sys.exit(subprocess.run(['node','--test','--test-concurrency=4',*files]).returncode)
          PYTEST
  chromium-and-webkit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Browser QA with actual LSH modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-hr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test             language-skills-hub/tests/r35-hr2-release.browser.test.cjs             language-skills-hub/tests/conversation-audit-2026-11-11.browser.test.cjs             language-skills-hub/tests/r32-conversation-countdown.browser.test.cjs             language-skills-hub/tests/r40-vocabulary-integration.browser.test.cjs             language-skills-hub/tests/r39-catalog-cefr-badges.browser.test.cjs             language-skills-hub/tests/r49-unified-vocabulary.browser.test.cjs
