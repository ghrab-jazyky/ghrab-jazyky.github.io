name: LSH R35 generic independent Reading QA – stacked draft
on:
  pull_request:
    branches: [feat/lsh-r34-first-reading-all-en-levels-2026-11-10]
  workflow_dispatch:
concurrency:
  group: lsh-r35-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate runtime and test syntax
        run: |
          node --check language-skills-hub/self-check/test-banks/reading/generic-bank-core.js
          node --check language-skills-hub/self-check/test-banks/reading/universal-preview.js
          node --check language-skills-hub/tests/r35-generic-independent-reading.test.cjs
          node --check language-skills-hub/tests/r35-generic-independent-reading.browser.test.cjs
      - name: Verify deterministic bank coverage against source files
        run: node language-skills-hub/scripts/rebuild-test-bank-coverage.cjs --check
      - name: New generic bank and all legacy Reading drafts
        run: |
          node --test language-skills-hub/tests/r32-independent-reading-pilot.test.cjs language-skills-hub/tests/r33-independent-reading-b1.test.cjs language-skills-hub/tests/r34-english-six-level-coverage.test.cjs language-skills-hub/tests/r35-generic-independent-reading.test.cjs
      - name: Stable R31 production behavior contracts
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Full independent Reading browser regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r35-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r32-independent-reading.browser.test.cjs language-skills-hub/tests/r33-independent-reading-b1.browser.test.cjs language-skills-hub/tests/r34-english-six-level-coverage.browser.test.cjs language-skills-hub/tests/r35-generic-independent-reading.browser.test.cjs
