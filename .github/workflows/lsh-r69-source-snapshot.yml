name: LSH R69 preproduction source snapshot
on:
  push:
    branches:
      - feature/lsh-r69-conlangs-preprod-20261114
    paths:
      - '.github/workflows/lsh-r69-source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package current R68 baseline for R69 isolated development
        uses: actions/upload-artifact@v4
        with:
          name: lsh-r69-baseline
          path: |
            language-skills-hub/
            .github/workflows/
            README.md
          retention-days: 1
