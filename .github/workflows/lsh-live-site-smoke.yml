name: LSH LIVE – verify published practice catalog and every card
on:
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-live-site-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-github-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Verify public R70 Pages, 34 cards incl. PLURAL and six Listening topics via HTTPS
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error,sys,hashlib
          base='https://ghrab-jazyky.github.io'
          def get(path):
              req=urllib.request.Request(base+path,headers={
                'User-Agent':'LSH-live-deployment-healthcheck/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          def head(path):
              req=urllib.request.Request(base+path,method='HEAD',headers={
                'User-Agent':'LSH-live-deployment-healthcheck/1.0'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  assert r.status==200,(path,r.status)
          for attempt in range(1,51):
              try:
                  home=get('/language-skills-hub/?verify='+str(attempt)).decode('utf-8')
                  assert 'Tři dovednosti.' in home and 'id="catalog"' in home and 'id="skillChooser"' in home
                  data=json.loads(get('/language-skills-hub/data/cards.json?verify='+str(attempt)))
                  assert data['kind']=='LSH_PUBLIC_PRACTICE_R17'
                  assert data['gradedTestsEnabled'] is False
                  release=json.loads(get('/language-skills-hub/version.json?verify='+str(attempt)))
                  # R76: verify public teacher notes only after the new Reading release is published.
                  teacher_notes=json.loads(get('/language-skills-hub/data/teacher-changelog.json?verify='+str(attempt)))
                  assert teacher_notes['latestAnnouncementSequence']>=6, 'Reading changelog not yet published'
                  reading_note=next((r for r in teacher_notes['releases'] if r['id']=='lsh-2026-11-18-reading-cefr-guidance'),None)
                  assert reading_note and reading_note['sequence']==6 and reading_note['publishedAt']=='2026-11-18'
                  assert any(c.get('area')=='reading' and 'B2–C2' in c.get('description','') for c in reading_note['changes']), 'Reading CEFR teacher note missing'

                  assert release['version']=='R70-LISTENING-STUDIO-UNIFICATION'
                  assert release['localGradeProposalsEnabled'] is True
                  assert release['localTeacherReviewPersistenceEnabled'] is True
                  assert release['localAnonymousCsvExportEnabled'] is True
                  assert release['localFullPdfReportEnabled'] is True
                  assert release['readingFullSourcePdfEnabled'] is True
                  assert release['listeningTestAutoClosed'] is True
                  assert release['listeningTestClosedFactualCloze'] is True
                  assert release['listeningTestVisibleAnswerBank'] is False
                  assert release['officialSchoolLogoPdfEnabled'] is True
                  assert release['selfCheckEnabled'] is True
                  assert release['gradedTestsEnabled'] is False
                  assert release['officialGradesEnabled'] is False
                  policy=json.loads(get('/language-skills-hub/data/test-mode-policy.json?verify='+str(attempt)))
                  assert policy['status']=='PUBLIC_LOCAL_GRADE_PROPOSALS'
                  assert policy['localGradeProposalsEnabled'] is True
                  assert policy['selfCheckEnabled'] is True and policy['testUiEnabled'] is True
                  assert policy['gradedTestsEnabled'] is False and policy['officialGradesEnabled'] is False
                  assert policy['futureSelfCheck']['listeningTestOpenAnswersEnabled'] is False
                  assert policy['futureSelfCheck']['listeningRequiresManualWrittenReviewForGrade'] is False
                  assert policy['futureSelfCheck']['listeningTestObjectiveFillIn'] is True
                  assert policy['futureSelfCheck']['listeningTestVisibleAnswerBank'] is False
                  hub=get('/language-skills-hub/assets/hub.js?verify='+str(attempt)).decode('utf-8')
                  assert "one('a','action test','TEST')" in hub
                  assert 'Test – známka 1–5' not in hub
                  assert "self-check/reading/teacher.html" in hub
                  assert "self-check/listening/teacher.html" in hub
                  assert "if(localSelfCheck&&['cteni','poslech']" in hub
                  entries=data['entries']
                  assert len(entries)==34
                  skills={}
                  for e in entries:skills[e['skill']]=skills.get(e['skill'],0)+1
                  assert skills=={'konverzace':23,'cteni':5,'poslech':6}
                  plural=next(e for e in entries if e['id']=='cl-plural')
                  assert plural['skill']=='konverzace'
                  assert plural['languages']==['de','es','fr']
                  assert plural['levels']==['A1','A2','B1','B2','C1','C2']
                  assert plural['relative']=='konverzace/plural/index.html'
                  plural_bytes=get('/language-skills-hub/'+plural['relative']+'?verify='+str(attempt))
                  assert hashlib.sha256(plural_bytes).hexdigest()==release['contentHashes']['cl-plural'], 'PLURAL V6 HTML digest mismatch'
                  assert b'data-lsh-topic-id="cl-plural"' in plural_bytes, 'PLURAL V6 page identifier missing'
                  sad=next(e for e in entries if e['id']=='ll-sad')
                  assert sad['levels']==['A1','A2','B1','B2','C1','C2']
                  assert release['topicCount']==34 and release['variantCount']==702
                  conlangs=next(e for e in entries if e['id']=='ll-conlangs')
                  assert conlangs['levels']==['A1','A2','B1','B2','C1','C2']
                  assert conlangs['languages']==['en']
                  # R70: verify both updated listening cards and their shared student UI assets.
                  sad_bytes=get('/language-skills-hub/'+sad['relative']+'?verify='+str(attempt))
                  assert hashlib.sha256(sad_bytes).hexdigest()==release['contentHashes']['ll-sad']
                  assert b'class="studio-levelbar"' in sad_bytes and b'class="hero-aside"' in sad_bytes
                  assert b'href="#finish"' in sad_bytes
                  for asset in ['assets/lsh/listening-studio.css','assets/lsh/listening-studio.js']:
                      head('/language-skills-hub/'+asset)
                  conlangs_bytes=get('/language-skills-hub/'+conlangs['relative']+'?verify='+str(attempt))
                  assert hashlib.sha256(conlangs_bytes).hexdigest()==release['contentHashes']['ll-conlangs']
                  assert b'class="studio-levelbar"' in conlangs_bytes and b'class="hero-aside"' in conlangs_bytes
                  assert b'href="#finish"' in conlangs_bytes
                  import re
                  matched=re.search(rb'const DATA=(\{.*?\});\s*const SOURCES=',conlangs_bytes,re.S)
                  assert matched is not None, 'Conlangs source DATA block missing'
                  conlangs_data=json.loads(matched.group(1).decode('utf-8'))
                  assert conlangs_data['levels']==['A1','A2','B1','B2','C1','C2']
                  assert all(len(conlangs_data['variants'][lv]['questionBank'])==17 and len(conlangs_data['practiceVariants'][lv]['questionBank'])==17 for lv in conlangs_data['levels'])
                  news=next(e for e in entries if e['id']=='ll-how-to-choose-your-news')
                  assert news['levels']==['A1','A2','B1','B2','C1','C2']
                  assert news['languages']==['en']
                  assert news['relative']=='poslech/how-to-choose-your-news/index.html'
                  news_bytes=get('/language-skills-hub/'+news['relative']+'?verify='+str(attempt))
                  assert hashlib.sha256(news_bytes).hexdigest()==release['contentHashes']['ll-how-to-choose-your-news']
                  assert b'class="studio-levelbar"' in news_bytes and b'class="hero-aside"' in news_bytes
                  assert b'href="#finish"' in news_bytes
                  news_match=re.search(rb'const DATA=(\{.*?\});\s*const SOURCES=',news_bytes,re.S)
                  assert news_match is not None, 'NEWS source DATA block missing'
                  news_data=json.loads(news_match.group(1).decode('utf-8'))
                  assert news_data['id']=='ll-how-to-choose-your-news'
                  assert news_data['levels']==['A1','A2','B1','B2','C1','C2']
                  assert all(len(news_data['variants'][lv]['questionBank'])==17 and len(news_data['practiceVariants'][lv]['questionBank'])==17 for lv in news_data['levels'])
                  for asset in ['news-core.js','news-practice.js','news-practice-extras.css']:
                      head('/language-skills-hub/poslech/how-to-choose-your-news/'+asset)
                  # R75 live sequencing: do not accept an old Pages asset after squash merge.
                  studio=get('/language-skills-hub/assets/lsh/listening-studio.js?verify='+str(attempt)).decode('utf-8')
                  assert 'window.LSHListeningSequence=Object.freeze' in studio, 'R75 shared sequencing runtime not published'
                  assert "'ll-sad'" in studio and "'ll-conlangs'" in studio
                  assert 'function defaultOrder(n)' in studio and 'function mount({' in studio
                  studio_css=get('/language-skills-hub/assets/lsh/listening-studio.css?verify='+str(attempt)).decode('utf-8')
                  assert '.lsq .seq-card' in studio_css and '.lsq .seq-grip' in studio_css
                  for topic in ['sad','conlangs']:
                      practice=get('/language-skills-hub/poslech/'+topic+'/'+topic+'-practice.js?verify='+str(attempt)).decode('utf-8')
                      assert 'function installSequence()' in practice and 'window.LSHListeningSequence' in practice, topic+' R75 missing'
                      assert 'sequence.mount({' in practice and 'sequenceKey=lv' in practice
                  news_practice=get('/language-skills-hub/poslech/how-to-choose-your-news/news-practice.js?verify='+str(attempt)).decode('utf-8')
                  assert 'window.LSHListeningSequence' in news_practice and 'sequence.mount({' in news_practice
                  assert 'news-sequence-move' not in news_practice, 'NEWS still uses old up/down controls'
                  key_html=get('/language-skills-hub/self-check/practice-answers/teacher.html?verify='+str(attempt)).decode('utf-8')
                  key_js=get('/language-skills-hub/self-check/practice-answers/teacher-key.js?verify='+str(attempt)).decode('utf-8')
                  assert 'assets/lsh/listening-studio.js' in key_html
                  assert 'host.LSHListeningSequence?.bankFor(e.id,level)' in key_js, 'R75 teacher key parity missing'
                  root=get('/?verify='+str(attempt)).decode('utf-8')
                  assert 'href="language-skills-hub/"' in root
                  head('/zkusebni/')
                  for e in entries:
                      head('/language-skills-hub/'+e['relative'])
                      if e.get('lockSource'):
                          head('/language-skills-hub/'+e['lockSource'])
                  for asset in [
                    'self-check/reading/teacher.html',
                    'self-check/reading/index.html',
                    'self-check/reading/reading-teacher.js',
                    'self-check/listening/teacher.html',
                    'self-check/listening/student.html',
                    'self-check/listening/listening-teacher.js',
                    'self-check/results/result-core.js',
                    'self-check/results/grade-core.js',
                    'self-check/results/export-core.js',
                    'self-check/results/pdf-report.js',
                    'assets/school-logo.png',
                    'self-check/results/share-tools.js',
                    'self-check/results/share.css',
                    'self-check/session/attempt-core.js',
                    'self-check/session/session-ui.js',
                    'self-check/session/session.css',
                    'assets/hub.css','assets/hub.js','assets/qr.js',
                    'assets/lsh/v2/lock.js','assets/lsh/v3/model.js',
                    'assets/lsh/v3/card-bridge.js','assets/lsh/v3/card-bridge.css',
                    'assets/lsh/v3/store.js']:
                      head('/language-skills-hub/'+asset)
                  assert 'id="exportPdf"' in get('/language-skills-hub/self-check/reading/index.html').decode('utf-8')
                  assert 'id="exportPdf"' in get('/language-skills-hub/self-check/listening/student.html').decode('utf-8')
                  student_js=get('/language-skills-hub/self-check/listening/listening-student.js').decode('utf-8')
                  assert 'core.assessAuto(' in student_js
                  assert 'clozeTask()' in student_js
                  assert 'function matching()' in student_js
                  assert 'school-logo.png' in get('/language-skills-hub/self-check/results/pdf-report.js').decode('utf-8')
                  logo=get('/language-skills-hub/assets/school-logo.png')
                  assert logo[:8]==b'\x89PNG\r\n\x1a\n' and len(logo)>1000
                  assert int.from_bytes(logo[16:20],'big')==384 and int.from_bytes(logo[20:24],'big')==384
                  assert hashlib.sha1(b'blob '+str(len(logo)).encode()+b'\0'+logo).hexdigest()=='0b23733540b01fe70f35feda45037b0cd2c995cb'
                  print('PASS LIVE HTTPS R75: 34 cards, 6 Listening topics, shared Harrison-style reconstruction assets, teacher key parity and school logo PDF',flush=True)
                  print('PRODUCTION URL:',base+'/language-skills-hub/',flush=True)
                  sys.exit(0)
              except Exception as ex:
                  print(f'Attempt {attempt}/50: {type(ex).__name__}: {ex}',flush=True)
                  if attempt==50:raise
                  time.sleep(12)
          PY
