name: LSH LIVE – verify published practice catalog and every card
on:
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-live-site-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-github-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Verify public R69 Pages, 32 cards, five Listening topics via HTTPS
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error,sys,hashlib
          base='https://ghrab-jazyky.github.io'
          def get(path):
              req=urllib.request.Request(base+path,headers={
                'User-Agent':'LSH-live-deployment-healthcheck/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          def head(path):
              req=urllib.request.Request(base+path,method='HEAD',headers={
                'User-Agent':'LSH-live-deployment-healthcheck/1.0'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  assert r.status==200,(path,r.status)
          for attempt in range(1,36):
              try:
                  home=get('/language-skills-hub/?verify='+str(attempt)).decode('utf-8')
                  assert 'Tři dovednosti.' in home and 'id="catalog"' in home and 'id="skillChooser"' in home
                  data=json.loads(get('/language-skills-hub/data/cards.json?verify='+str(attempt)))
                  assert data['kind']=='LSH_PUBLIC_PRACTICE_R17'
                  assert data['gradedTestsEnabled'] is False
                  release=json.loads(get('/language-skills-hub/version.json?verify='+str(attempt)))
                  assert release['version']=='R69-CONLANGS-A1C2'
                  assert release['localGradeProposalsEnabled'] is True
                  assert release['localTeacherReviewPersistenceEnabled'] is True
                  assert release['localAnonymousCsvExportEnabled'] is True
                  assert release['localFullPdfReportEnabled'] is True
                  assert release['readingFullSourcePdfEnabled'] is True
                  assert release['listeningTestAutoClosed'] is True
                  assert release['listeningTestClosedFactualCloze'] is True
                  assert release['listeningTestVisibleAnswerBank'] is False
                  assert release['officialSchoolLogoPdfEnabled'] is True
                  assert release['selfCheckEnabled'] is True
                  assert release['gradedTestsEnabled'] is False
                  assert release['officialGradesEnabled'] is False
                  policy=json.loads(get('/language-skills-hub/data/test-mode-policy.json?verify='+str(attempt)))
                  assert policy['status']=='PUBLIC_LOCAL_GRADE_PROPOSALS'
                  assert policy['localGradeProposalsEnabled'] is True
                  assert policy['selfCheckEnabled'] is True and policy['testUiEnabled'] is True
                  assert policy['gradedTestsEnabled'] is False and policy['officialGradesEnabled'] is False
                  assert policy['futureSelfCheck']['listeningTestOpenAnswersEnabled'] is False
                  assert policy['futureSelfCheck']['listeningRequiresManualWrittenReviewForGrade'] is False
                  assert policy['futureSelfCheck']['listeningTestObjectiveFillIn'] is True
                  assert policy['futureSelfCheck']['listeningTestVisibleAnswerBank'] is False
                  hub=get('/language-skills-hub/assets/hub.js?verify='+str(attempt)).decode('utf-8')
                  assert "one('a','action test','TEST')" in hub
                  assert 'Test – známka 1–5' not in hub
                  assert "self-check/reading/teacher.html" in hub
                  assert "self-check/listening/teacher.html" in hub
                  assert "if(localSelfCheck&&['cteni','poslech']" in hub
                  entries=data['entries']
                  assert len(entries)==32
                  skills={}
                  for e in entries:skills[e['skill']]=skills.get(e['skill'],0)+1
                  assert skills=={'konverzace':22,'cteni':5,'poslech':5}
                  sad=next(e for e in entries if e['id']=='ll-sad')
                  assert sad['levels']==['A1','A2','B1','B2','C1','C2']
                  assert release['topicCount']==32 and release['variantCount']==678
                  conlangs=next(e for e in entries if e['id']=='ll-conlangs')
                  assert conlangs['levels']==['A1','A2','B1','B2','C1','C2']
                  assert conlangs['languages']==['en']
                  conlangs_bytes=get('/language-skills-hub/'+conlangs['relative']+'?verify='+str(attempt))
                  assert hashlib.sha256(conlangs_bytes).hexdigest()==release['contentHashes']['ll-conlangs']
                  import re
                  matched=re.search(rb'const DATA=(\{.*?\});\s*const SOURCES=',conlangs_bytes,re.S)
                  assert matched is not None, 'Conlangs source DATA block missing'
                  conlangs_data=json.loads(matched.group(1).decode('utf-8'))
                  assert conlangs_data['levels']==['A1','A2','B1','B2','C1','C2']
                  assert all(len(conlangs_data['variants'][lv]['questionBank'])==17 and len(conlangs_data['practiceVariants'][lv]['questionBank'])==17 for lv in conlangs_data['levels'])
                  root=get('/?verify='+str(attempt)).decode('utf-8')
                  assert 'href="language-skills-hub/"' in root
                  head('/zkusebni/')
                  for e in entries:
                      head('/language-skills-hub/'+e['relative'])
                      if e.get('lockSource'):
                          head('/language-skills-hub/'+e['lockSource'])
                  for asset in [
                    'self-check/reading/teacher.html',
                    'self-check/reading/index.html',
                    'self-check/reading/reading-teacher.js',
                    'self-check/listening/teacher.html',
                    'self-check/listening/student.html',
                    'self-check/listening/listening-teacher.js',
                    'self-check/results/result-core.js',
                    'self-check/results/grade-core.js',
                    'self-check/results/export-core.js',
                    'self-check/results/pdf-report.js',
                    'assets/school-logo.png',
                    'self-check/results/share-tools.js',
                    'self-check/results/share.css',
                    'self-check/session/attempt-core.js',
                    'self-check/session/session-ui.js',
                    'self-check/session/session.css',
                    'assets/hub.css','assets/hub.js','assets/qr.js',
                    'assets/lsh/v2/lock.js','assets/lsh/v3/model.js',
                    'assets/lsh/v3/card-bridge.js','assets/lsh/v3/card-bridge.css',
                    'assets/lsh/v3/store.js']:
                      head('/language-skills-hub/'+asset)
                  assert 'id="exportPdf"' in get('/language-skills-hub/self-check/reading/index.html').decode('utf-8')
                  assert 'id="exportPdf"' in get('/language-skills-hub/self-check/listening/student.html').decode('utf-8')
                  student_js=get('/language-skills-hub/self-check/listening/listening-student.js').decode('utf-8')
                  assert 'core.assessAuto(' in student_js
                  assert 'clozeTask()' in student_js
                  assert 'function matching()' in student_js
                  assert 'school-logo.png' in get('/language-skills-hub/self-check/results/pdf-report.js').decode('utf-8')
                  logo=get('/language-skills-hub/assets/school-logo.png')
                  assert logo[:8]==b'\x89PNG\r\n\x1a\n' and len(logo)>1000
                  assert int.from_bytes(logo[16:20],'big')==384 and int.from_bytes(logo[20:24],'big')==384
                  assert hashlib.sha1(b'blob '+str(len(logo)).encode()+b'\0'+logo).hexdigest()=='0b23733540b01fe70f35feda45037b0cd2c995cb'
                  print('PASS LIVE HTTPS R69: 32 practice cards, 5 Listening topics, 102+102 Conlangs questions, A1-C2, original school logo PDF',flush=True)
                  print('PRODUCTION URL:',base+'/language-skills-hub/',flush=True)
                  sys.exit(0)
              except Exception as ex:
                  print(f'Attempt {attempt}/35: {type(ex).__name__}: {ex}',flush=True)
                  if attempt==35:raise
                  time.sleep(12)
          PY
