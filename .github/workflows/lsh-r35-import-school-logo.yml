name: LSH R35 import official school logo (branch only)
on:
  push:
    branches: [fix/lsh-r35-school-logo-and-closed-cloze]
    paths: [.github/workflows/lsh-r35-import-school-logo.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/lsh-r35-school-logo-and-closed-cloze
      - name: Download unmodified official school branding
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 2 --max-time 40 \
            'https://www.ghrabuvka.cz/build/images/logo.b31efe12.png' \
            -o language-skills-hub/assets/school-logo.png
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          p=Path('language-skills-hub/assets/school-logo.png')
          data=p.read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n','Official logo is not a PNG'
          w,h=struct.unpack('>II',data[16:24])
          assert 100<=w<=3000 and 100<=h<=3000 and len(data)>1000,(w,h,len(data))
          print('School logo:',w,'x',h,'bytes:',len(data))
          print('SHA256',hashlib.sha256(data).hexdigest())
          PY
      - name: Commit exact binary into isolated R35 branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add language-skills-hub/assets/school-logo.png
          if git diff --cached --quiet; then echo 'Logo already imported'; exit 0; fi
          git commit -m 'assets(LSH): import authentic Gymnázium Ostrava-Hrabůvka school logo'
          git push origin HEAD:fix/lsh-r35-school-logo-and-closed-cloze
