name: LSH R20 multilingual teacher catalog (NO deployment)
on:
  push:
    branches:
      - feat/lsh-r20-catalog-i18n-29-2026-11-09
    paths:
      - 'language-skills-hub/index.html'
      - 'language-skills-hub/assets/hub.js'
      - 'language-skills-hub/assets/hub.css'
      - 'language-skills-hub/data/catalog-i18n.json'
      - 'zkusebni/tests/r20-*.test.cjs'
      - '.github/workflows/lsh-r20-catalog-i18n-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: R20 static coverage, language QA and SHA-256 source integrity
        run: |
          node --check language-skills-hub/assets/hub.js
          node --test zkusebni/tests/r20-catalog-localization.test.cjs
          node --test zkusebni/tests/r19-welcome-skill-selection.test.cjs
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: R20 136-language rendering, phone/desktop layout and QR
        run: node --test zkusebni/tests/r20-catalog-localization.browser.test.cjs
      - name: R19 opening flow and history full regression
        run: node --test zkusebni/tests/r19-welcome-skill-selection.browser.test.cjs
