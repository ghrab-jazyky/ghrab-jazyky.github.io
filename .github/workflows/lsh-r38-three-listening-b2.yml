name: LSH R38 three independent Listening EN B2 draft topic QA
on:
  pull_request:
    branches: [feat/lsh-r37-independent-listening-reference-2026-11-10]
  workflow_dispatch:
concurrency:
  group: lsh-r38-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  r38-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: All independent Listening B2 topics and previous R37 contract
        run: |
          node --check language-skills-hub/self-check/test-banks/listening/independent-schema.js
          node --check language-skills-hub/self-check/test-banks/listening/preview.js
          node --check language-skills-hub/tests/r38-three-listening-b2.test.cjs
          node --check language-skills-hub/tests/r38-three-listening-b2.browser.test.cjs
          node --test language-skills-hub/tests/r37-independent-listening.test.cjs language-skills-hub/tests/r38-three-listening-b2.test.cjs
          node --test language-skills-hub/tests/r32-independent-reading-pilot.test.cjs language-skills-hub/tests/r33-independent-reading-b1.test.cjs language-skills-hub/tests/r34-six-level-independent-reading.test.cjs language-skills-hub/tests/r34-coverage-and-schema.test.cjs language-skills-hub/tests/r36-all-reading-topic-b2.test.cjs
  r38-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test browsers
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: All three independent Listening topic browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r38-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r37-independent-listening.browser.test.cjs language-skills-hub/tests/r38-three-listening-b2.browser.test.cjs
