name: LSH R58 Reading TEST skill tabs parity with practice
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/self-check/reading/index.html'
      - 'language-skills-hub/self-check/reading/reading.js'
      - 'language-skills-hub/self-check/reading/reading.css'
      - 'language-skills-hub/tests/r58-*'
      - '.github/workflows/lsh-r58-reading-test-skill-tabs.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/self-check/reading/index.html'
      - 'language-skills-hub/self-check/reading/reading.js'
      - 'language-skills-hub/self-check/reading/reading.css'
      - 'language-skills-hub/tests/r58-*'
      - '.github/workflows/lsh-r58-reading-test-skill-tabs.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check language-skills-hub/self-check/reading/reading.js
          node --check language-skills-hub/tests/r58-reading-test-tabs.test.cjs
          node --check language-skills-hub/tests/r58-reading-test-tabs.browser.test.cjs
          node --test language-skills-hub/tests/r58-reading-test-tabs.test.cjs
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Validate every test tab across 120 Reading variants in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r58-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/self-check/reading/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r58-reading-test-tabs.browser.test.cjs
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Wait for GitHub Pages to publish R58
        run: |
          READY=0
          for i in $(seq 1 42); do
            if node -e 'fetch("https://ghrab-jazyky.github.io/language-skills-hub/self-check/reading/reading.js?r58="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(s=>process.exit(s.includes("selectSkillTab")&&s.includes("reading-skill-panel")?0:1)).catch(()=>process.exit(1))'; then READY=1; break; fi
            sleep 10
          done
          test "$READY" -eq 1
      - name: Verify public Reading TEST tabs in Chromium
        env:
          LSH_R58_LIVE: '1'
          LSH_R58_BASE: https://ghrab-jazyky.github.io/language-skills-hub/
        run: node --test language-skills-hub/tests/r58-reading-test-tabs.browser.test.cjs
