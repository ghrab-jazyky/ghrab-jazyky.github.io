name: LSH R30 timed local attempts - QA only
on:
  push:
    branches: [feat/lsh-r30-timed-local-attempt-2026-11-09, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  r30-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate browser and test syntax
        run: |
          node --check language-skills-hub/self-check/session/attempt-core.js
          node --check language-skills-hub/self-check/session/session-ui.js
          node --check language-skills-hub/self-check/reading/reading.js
          node --check language-skills-hub/self-check/listening/listening-student.js
          node --check language-skills-hub/self-check/reading/reading-teacher.js
          node --check language-skills-hub/self-check/listening/listening-teacher.js
          node --check language-skills-hub/tests/r30-attempt.test.cjs
          node --check language-skills-hub/tests/r30-attempt.browser.test.cjs
      - name: Existing and new local graded test contracts
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs
  r30-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        timeout-minutes: 8
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Test old and timed student links, teacher QR and local restore
        timeout-minutes: 10
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r30-server.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-r30-server.log 2>&1 &
          fi
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r23-reading-selfcheck.browser.test.cjs language-skills-hub/tests/r24-listening-selfcheck.browser.test.cjs language-skills-hub/tests/r25-result-browser.test.cjs language-skills-hub/tests/r27-public-release.browser.test.cjs language-skills-hub/tests/r28-grade-proposal.browser.test.cjs language-skills-hub/tests/r29-feedback.browser.test.cjs
          node --test language-skills-hub/tests/r30-attempt.browser.test.cjs
