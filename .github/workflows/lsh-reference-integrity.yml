name: LSH reference integrity
on:
  pull_request:
    paths:
      - 'zkusebni/reference/**'
      - 'zkusebni/nahledy/cteni/asteroids/**'
      - 'zkusebni/integrace/**'
      - 'zkusebni/assets/lsh/v4/**'
      - 'zkusebni/data/reference-pilots.json'
      - 'zkusebni/data/claude-audit-queue.json'
      - 'zkusebni/tools/**'
      - 'zkusebni/podklady/**'
      - 'zkusebni/pridat-kartu/**'
      - 'zkusebni/revize-claude/**'
      - 'zkusebni/data/claude-audit-queue.json'
      - 'zkusebni/tools/**'
      - 'zkusebni/podklady/**'
      - 'zkusebni/pridat-kartu/**'
      - 'zkusebni/revize-claude/**'
      - 'zkusebni/reference-karty/**'
      - 'zkusebni/tests/reference-integrity.cjs'
      - '.github/workflows/lsh-reference-integrity.yml'
  push:
    branches:
      - main
      - 'feat/lsh-*'
    paths:
      - 'zkusebni/reference/**'
      - 'zkusebni/nahledy/cteni/asteroids/**'
      - 'zkusebni/integrace/**'
      - 'zkusebni/assets/lsh/v4/**'
      - 'zkusebni/data/reference-pilots.json'
      - 'zkusebni/reference-karty/**'
      - 'zkusebni/tests/reference-integrity.cjs'
      - '.github/workflows/lsh-reference-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source cards and practice adapters
        run: |
          node zkusebni/tests/reference-integrity.cjs
          node zkusebni/tools/card-intake.cjs --verify
          node zkusebni/tools/card-intake.cjs --self-test
          node --check zkusebni/tools/claude-audit-import.cjs
      - name: End-to-end intake smoke test (runner only, never committed)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/lsh-intake-example"
          cp zkusebni/nahledy/cteni/asteroids/index.html "$RUNNER_TEMP/lsh-intake-example/asteroids.html"
          node -e 'const fs=require("node:fs");const d={schemaVersion:1,cards:[{id:"rl-intake-smoke",skill:"cteni",title:"Asteroids intake smoke test",summary:"Automated disposable validation of the complete multilingual reference reading card.",focus:"Structural import test, not a publication",version:"v2.3-fixture",sourceFile:"asteroids.html"}]};fs.writeFileSync(process.env.RUNNER_TEMP+"/lsh-intake-example/cards.json",JSON.stringify(d,null,2));'
          node zkusebni/tools/card-intake.cjs --batch "$RUNNER_TEMP/lsh-intake-example/cards.json"
          node zkusebni/tools/card-intake.cjs --batch "$RUNNER_TEMP/lsh-intake-example/cards.json" --apply
          node zkusebni/tools/card-intake.cjs --verify
          node zkusebni/tools/card-intake.cjs --audit-export "$RUNNER_TEMP/lsh-claude-export"
          test -f "$RUNNER_TEMP/lsh-claude-export/rl-intake-smoke.md"

