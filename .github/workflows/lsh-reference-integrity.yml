name: LSH reference integrity
on:
  pull_request:
    paths:
      - 'zkusebni/reference/**'
      - 'zkusebni/nahledy/cteni/**'
      - 'zkusebni/integrace/**'
      - 'zkusebni/assets/lsh/v4/**'
      - 'zkusebni/data/reference-pilots.json'
      - 'zkusebni/data/claude-audit-queue.json'
      - 'zkusebni/data/reading-r7-matching-proposals.json'
      - 'zkusebni/tools/**'
      - 'zkusebni/podklady/**'
      - 'zkusebni/pridat-kartu/**'
      - 'zkusebni/revize-claude/**'
      - 'zkusebni/reference-karty/**'
      - 'zkusebni/tests/catalog-ledger-consistency.test.cjs'
      - 'zkusebni/tests/reference-integrity.cjs'
      - '.github/workflows/lsh-reference-integrity.yml'
  push:
    branches:
      - main
      - 'feat/lsh-*'
    paths:
      - 'zkusebni/reference/**'
      - 'zkusebni/nahledy/cteni/**'
      - 'zkusebni/integrace/**'
      - 'zkusebni/assets/lsh/v4/**'
      - 'zkusebni/data/reference-pilots.json'
      - 'zkusebni/data/claude-audit-queue.json'
      - 'zkusebni/data/reading-r7-matching-proposals.json'
      - 'zkusebni/tools/**'
      - 'zkusebni/podklady/**'
      - 'zkusebni/konverzace/**'
      - 'zkusebni/reference-karty/**'
      - 'zkusebni/tests/catalog-ledger-consistency.test.cjs'
      - 'zkusebni/tests/reference-integrity.cjs'
      - '.github/workflows/lsh-reference-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source cards and practice adapters
        run: |
          node zkusebni/tests/reference-integrity.cjs
          node --test zkusebni/tests/catalog-ledger-consistency.test.cjs
          node zkusebni/tools/card-intake.cjs --verify
          node zkusebni/tools/card-intake.cjs --self-test
          node --check zkusebni/tools/claude-audit-import.cjs
      - name: Audit all five original Reading sources (120 variants, no answer keys)
        run: |
          node zkusebni/tools/reading-content-audit.cjs "$RUNNER_TEMP/lsh-reading-source-qa"
          node -e 'const a=require(process.argv[1]);if(a.topicCount!==5||a.variantCount!==120||a.questionCount!==1800||a.approval!==false||a.teacherApproval!==false)throw Error("Reading QA coverage or release gate mismatch");console.log("PASS five Reading sources and 120 CEFR variants audited")' "$RUNNER_TEMP/lsh-reading-source-qa/READING_5_SOURCE_QA.json"
      - name: Attach Reading content and evidence QA (not teacher approval)
        uses: actions/upload-artifact@v4
        with:
          name: lsh-reading-five-content-evidence-qa
          path: |
            ${{ runner.temp }}/lsh-reading-source-qa/*.json
            ${{ runner.temp }}/lsh-reading-source-qa/*.md
          if-no-files-found: error
          retention-days: 30
      - name: Build and verify R7 Reading matching fixes as private-to-run CI candidates
        run: |
          node zkusebni/tools/reading-r7-candidates.cjs "$RUNNER_TEMP/lsh-reading-r7-candidates"
          node -e 'const a=require(process.argv[1]);if(a.cards.length!==2||a.cards.reduce((s,c)=>s+c.repairedQuestions.length,0)!==16||a.teacherApproval!==false||a.approvedForRelease!==false)throw Error("R7 verification mismatch");console.log("PASS 16 exact replacements across 2 isolated Reading candidates")' "$RUNNER_TEMP/lsh-reading-r7-candidates/R7_CANDIDATES_MANIFEST.json"
      - name: Attach unapproved R7 Reading student candidate HTML and change manifest
        uses: actions/upload-artifact@v4
        with:
          name: lsh-reading-r7-16-matching-repairs-candidates
          path: |
            ${{ runner.temp }}/lsh-reading-r7-candidates/*.html
            ${{ runner.temp }}/lsh-reading-r7-candidates/*.json
            ${{ runner.temp }}/lsh-reading-r7-candidates/*.md
          if-no-files-found: error
          retention-days: 30
      - name: End-to-end batch intake for all THREE skills (runner only, no deployment)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/lsh-intake-fixture"
          cp zkusebni/nahledy/cteni/asteroids/index.html "$RUNNER_TEMP/lsh-intake-fixture/asteroids.html"
          cp zkusebni/reference/poslech/matthew-mcconaughey/index.html "$RUNNER_TEMP/lsh-intake-fixture/matthew.html"
          node -e 'const fs=require("node:fs");const root=process.env.RUNNER_TEMP+"/lsh-intake-fixture";const a=fs.readFileSync("zkusebni/konverzace/socialni-media/index.html","utf8");if(!a.includes("data-lsh-topic-id=\"cl-socialni-media\""))throw Error("Conversation fixture missing");fs.writeFileSync(root+"/conversation.html",a.replace("data-lsh-topic-id=\"cl-socialni-media\"","data-lsh-topic-id=\"cl-smoke-conversation\""));const d={schemaVersion:1,cards:[{id:"cl-smoke-conversation",skill:"konverzace",title:"Conversation intake smoke",summary:"Disposable automated check of a shared-asset multilingual conversation source.",version:"smoke",sourceFile:"conversation.html"},{id:"rl-smoke-reading",skill:"cteni",title:"Reading intake smoke",summary:"Disposable automated check of the multilingual reading reference and integrated source.",version:"smoke",sourceFile:"asteroids.html"},{id:"ll-smoke-listening",skill:"poslech",title:"Listening intake smoke",summary:"Disposable automated check of the single-language listening reference and its URL adapter.",version:"smoke",sourceFile:"matthew.html"}]};fs.writeFileSync(root+"/cards.json",JSON.stringify(d,null,2));'
          node zkusebni/tools/card-intake.cjs --batch "$RUNNER_TEMP/lsh-intake-fixture/cards.json"
          node zkusebni/tools/card-intake.cjs --batch "$RUNNER_TEMP/lsh-intake-fixture/cards.json" --apply
          node zkusebni/tools/card-intake.cjs --verify
          node -e 'const fs=require("node:fs");const j=JSON.parse(fs.readFileSync("zkusebni/data/reference-pilots.json"));const q=JSON.parse(fs.readFileSync("zkusebni/data/claude-audit-queue.json"));if(j.entries.length!==32||q.topics.length!==32)throw Error("Batch intake counts wrong");for(const [id,skill,self,offline] of [["cl-smoke-conversation","konverzace",false,"clb-v1"],["rl-smoke-reading","cteni",true,undefined],["ll-smoke-listening","poslech",true,undefined]]){const e=j.entries.find(x=>x.id===id);if(!e||e.skill!==skill||e.selfContainedHtml!==self||e.offlineBundle!==offline||e.test!=="not-ready")throw Error("Incorrect "+id)}console.log("PASS bulk import of all three skills, 32/32 audit queue entries")'
          node zkusebni/tools/card-intake.cjs --audit-export "$RUNNER_TEMP/lsh-claude-export"
          test -f "$RUNNER_TEMP/lsh-claude-export/cl-smoke-conversation.md"
          test -f "$RUNNER_TEMP/lsh-claude-export/rl-smoke-reading.md"
          test -f "$RUNNER_TEMP/lsh-claude-export/ll-smoke-listening.md"
          node zkusebni/tests/claude-audit-coverage.test.cjs
          node zkusebni/tools/card-intake.cjs --verify
          if node zkusebni/tools/card-intake.cjs --batch "$RUNNER_TEMP/lsh-intake-fixture/cards.json"; then
            echo "ERROR: duplicate IDs were accepted by the importer"
            exit 1
          fi
