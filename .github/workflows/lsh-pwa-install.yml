name: LSH PWA install QA (no deployment)
on:
  push:
    branches:
      - feature/lsh-installable-pwa-20261123
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-pwa-install.yml'
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-pwa-install.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript
        run: |
          node --check language-skills-hub/assets/pwa-install.js
          node --check language-skills-hub/sw.js
          node --check language-skills-hub/tests/pwa-install.test.cjs
          node --check language-skills-hub/tests/pwa-install.browser.test.cjs
      - name: Static PWA regression
        run: node --test language-skills-hub/tests/pwa-install.test.cjs
  pwa-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright test API
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium and WebKit behavior
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-pwa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/pwa-install.browser.test.cjs
