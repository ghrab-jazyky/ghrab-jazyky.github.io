name: LSH R34 six independent English Reading levels – draft QA
on:
  pull_request:
    branches: [feat/lsh-r33-independent-reading-b1-pilot-2026-11-10]
  workflow_dispatch:
concurrency:
  group: lsh-r34-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate independent pilot syntax
        run: |
          node --check language-skills-hub/self-check/test-banks/reading/test-bank-core.js
          node --check language-skills-hub/self-check/test-banks/reading/preview.js
          node --check language-skills-hub/tests/r34-english-six-level-coverage.test.cjs
          node --check language-skills-hub/tests/r34-english-six-level-coverage.browser.test.cjs
      - name: Validate all six English independent banks
        run: |
          node --test language-skills-hub/tests/r32-independent-reading-pilot.test.cjs language-skills-hub/tests/r33-independent-reading-b1.test.cjs language-skills-hub/tests/r34-english-six-level-coverage.test.cjs
      - name: R31 production baseline regression
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Exercise all six levels and legacy B1/B2 independent tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r34-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r32-independent-reading.browser.test.cjs language-skills-hub/tests/r33-independent-reading-b1.browser.test.cjs language-skills-hub/tests/r34-english-six-level-coverage.browser.test.cjs
