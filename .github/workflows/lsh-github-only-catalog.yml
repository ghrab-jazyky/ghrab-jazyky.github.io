name: LSH GitHub-only unified activity catalog (no Cloudflare)
on:
  push:
    branches:
      - main
      - fix/lsh-r2-publication-gate-main-ci-2026-11-06
    paths:
      - 'zkusebni/**'
      - 'cteni/**'
      - 'poslech/**'
      - 'data/manifest.json'
      - '.github/workflows/lsh-github-only-catalog.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'zkusebni/**'
      - 'cteni/**'
      - 'poslech/**'
      - 'data/manifest.json'
      - '.github/workflows/lsh-github-only-catalog.yml'
permissions:
  contents: read
jobs:
  static-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check zkusebni/assets/lsh/v2/app.js
          node --check zkusebni/assets/lsh/v2/core.js
          node --check zkusebni/sw.js
          node --check zkusebni/tests/github-only-catalog.browser.test.cjs
          node --check zkusebni/tests/r2-publication-gate.test.cjs
          node --check zkusebni/tests/r3a-reading-publication.test.cjs
          node --check zkusebni/assets/lsh/v3/qr-scanner.js
          node --check zkusebni/assets/lsh/v3/inventory.js
          node --check zkusebni/tests/r3b-editorial-inventory.test.cjs
          node --check zkusebni/tests/online-previews.test.cjs
          node --check zkusebni/tests/r4a-reference-preflight.test.cjs
          node --check zkusebni/tests/r4a-notebook-security.test.cjs
          node --check zkusebni/tests/r4b-asteroids-reference.test.cjs
          node --check zkusebni/tests/r4c-conversation-reference.test.cjs
      - name: Existing RC1 and new public-only security regression
        run: |
          node --test zkusebni/tests/e3a.test.cjs zkusebni/tests/e3b.static.test.cjs zkusebni/tests/e3c.test.cjs zkusebni/tests/e3d.test.cjs zkusebni/tests/rc1-gates.test.cjs zkusebni/tests/github-only-catalog.test.cjs zkusebni/tests/r2-publication-gate.test.cjs zkusebni/tests/r3a-reading-publication.test.cjs zkusebni/tests/r3b-editorial-inventory.test.cjs zkusebni/tests/online-previews.test.cjs zkusebni/tests/r4a-reference-preflight.test.cjs zkusebni/tests/r4a-notebook-security.test.cjs zkusebni/tests/r4b-asteroids-reference.test.cjs zkusebni/tests/r4c-conversation-reference.test.cjs
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test unified teacher-facing catalog on actual browser engines and offline SW
        run: node --test zkusebni/tests/github-only-catalog.browser.test.cjs
