name: LSH teacher changelog Stage D candidate QA
on:
  push:
    branches: [feat/lsh-teacher-changelog-stage-d-20261116]
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-teacher-changelog-stage-d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-and-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and integration contracts
        run: |
          node --check language-skills-hub/assets/hub.js
          node --check language-skills-hub/assets/whats-new-data.js
          node --check language-skills-hub/assets/whats-new-view.js
          node --check language-skills-hub/assets/whats-new-app.js
          node --test language-skills-hub/tests/teacher-changelog-integration.test.cjs
          node --test language-skills-hub/tests/hub-audit-2026-11-11.test.cjs
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium and WebKit integration regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-whatsnew-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/teacher-changelog-integration.browser.test.cjs
          node --test language-skills-hub/tests/hub-audit-2026-11-11.browser.test.cjs
          node --test language-skills-hub/tests/r61-school-logo-header.browser.test.cjs
