name: LSH R64 audit fixes QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r64-audit-fixes.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r64-audit-fixes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mirror copies, cloze fairness and card integrity
        run: |
          node --test language-skills-hub/tests/r64-real-catalog-sources.test.cjs \
            language-skills-hub/tests/r64-listening-cloze-fairness.test.cjs \
            language-skills-hub/tests/r64-incident-kinds.test.cjs \
            language-skills-hub/tests/conversation-audit-2026-11-11.test.cjs
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Real catalog URLs and one attempt per device, Chromium + WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r64-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r64-real-catalog-sources.browser.test.cjs \
            language-skills-hub/tests/r64-one-attempt-per-device.browser.test.cjs \
            language-skills-hub/tests/r64-pdf-logo-required.browser.test.cjs
