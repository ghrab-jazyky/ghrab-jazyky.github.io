name: LSH E3D full regression (no deployment)
on:
  push:
    branches:
      - feat/lsh-e3d-pwa-qr-2026-11-05
  pull_request:
    paths:
      - 'zkusebni/**'
      - '.github/workflows/lsh-e3d-tests.yml'
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: E3A E3B E3C E3D regression
        run: node --test zkusebni/tests/e3a.test.cjs zkusebni/tests/e3b.static.test.cjs zkusebni/tests/e3c.test.cjs zkusebni/tests/e3d.test.cjs
  browser-regression:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test engines (CI only)
        timeout-minutes: 8
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Run Chromium and WebKit against an isolated self-hosted HTTP fixture
        timeout-minutes: 10
        run: node --test zkusebni/tests/e3d.browser.test.cjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsh-e3d-browser-qa
          path: qa/e3d-*.png
          if-no-files-found: warn
