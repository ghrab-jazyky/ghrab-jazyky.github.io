name: LSH R44 Reading Lab bidirectional navigation QA (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r44-reading-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r44-reading-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate navigation code and tests
        run: |
          node --check language-skills-hub/assets/lsh/reading-return.js
          node --check language-skills-hub/tests/r44-reading-return.test.cjs
          node --check language-skills-hub/tests/r44-reading-return.browser.test.cjs
      - name: Assert five cards, 120 variants, 1800 questions and exact source targets
        run: node --test language-skills-hub/tests/r44-reading-return.test.cjs

  navigation-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright matching container browser engines
        timeout-minutes: 8
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium and WebKit mobile tests for all five cards and all language-level variants
        timeout-minutes: 32
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r44-server.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-r44-server.log 2>&1 &
          fi
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/cteni/asteroids/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r44-reading-return.browser.test.cjs
