name: LSH R53 fixed Listening TEST topic and direct source video
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r53-fixed-listening-test.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r53-fixed-listening-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listening-teacher:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source parity and syntax
        run: |
          node --check language-skills-hub/self-check/listening/listening-teacher.js
          node --check language-skills-hub/tests/r53-listening-fixed-topic-video.browser.test.cjs
          node --check language-skills-hub/tests/r53-live-listening-teacher.browser.test.cjs
          node --test language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r53-listening-fixed-topic-video.test.cjs
      - name: Browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium and WebKit teacher UI, student links, originals and responsive layout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r53-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r24-listening-selfcheck.browser.test.cjs language-skills-hub/tests/r27-public-release.browser.test.cjs language-skills-hub/tests/r53-listening-fixed-topic-video.browser.test.cjs
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: listening-teacher
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Production HTTPS after Pages deploy - all three topics on Chromium and WebKit
        run: node language-skills-hub/tests/r53-live-listening-teacher.browser.test.cjs
