name: LSH R37 independent Listening B2 teacher-supervised draft QA
on:
  pull_request:
    branches: [feat/lsh-r36-all-reading-topics-en-b2-2026-11-10]
  workflow_dispatch:
concurrency:
  group: lsh-r37-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  r37-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate schema and independent Listening pilot
        run: |
          node --check language-skills-hub/self-check/test-banks/listening/independent-schema.js
          node --check language-skills-hub/self-check/test-banks/listening/preview.js
          node --check language-skills-hub/tests/r37-independent-listening.test.cjs
          node --check language-skills-hub/tests/r37-independent-listening.browser.test.cjs
          node --test language-skills-hub/tests/r37-independent-listening.test.cjs
          node --test language-skills-hub/tests/r32-independent-reading-pilot.test.cjs language-skills-hub/tests/r33-independent-reading-b1.test.cjs language-skills-hub/tests/r34-six-level-independent-reading.test.cjs language-skills-hub/tests/r34-coverage-and-schema.test.cjs language-skills-hub/tests/r36-all-reading-topic-b2.test.cjs
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs
  r37-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Independent Listening pilot and fail-closed browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r37-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r37-independent-listening.browser.test.cjs
