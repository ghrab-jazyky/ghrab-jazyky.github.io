name: LSH R21 teacher/student sharing QA (NO deployment)
on:
  push:
    branches:
      - feat/lsh-r21-share-student-choice-2026-11-09
    paths:
      - 'language-skills-hub/index.html'
      - 'language-skills-hub/assets/hub.js'
      - 'language-skills-hub/assets/hub.css'
      - 'zkusebni/tests/r21-*.test.cjs'
      - 'zkusebni/tests/r19-*.test.cjs'
      - 'zkusebni/tests/r20-*.test.cjs'
      - '.github/workflows/lsh-r21-student-share-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source syntax and all language/URL invariants
        run: |
          node --check language-skills-hub/assets/hub.js
          node --test zkusebni/tests/r21-sharing.test.cjs
          node --test zkusebni/tests/r20-catalog-localization.test.cjs
          node --test zkusebni/tests/r19-welcome-skill-selection.test.cjs
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: R21 teacher/student free and fixed sharing, clipboard and QR
        run: node --test zkusebni/tests/r21-sharing.browser.test.cjs
      - name: R20 regression – 136 multilingual views and phone displays
        run: node --test zkusebni/tests/r20-catalog-localization.browser.test.cjs
      - name: R19 regression – timed welcome, filters, QR and navigation
        run: node --test zkusebni/tests/r19-welcome-skill-selection.browser.test.cjs
