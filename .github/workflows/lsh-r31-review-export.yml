name: LSH R31 teacher marks and local anonymous export QA
on:
  push:
    branches: [feat/lsh-r31-local-grade-review-export-2026-11-10, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r31-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and correctness checks
        run: |
          node --check language-skills-hub/self-check/session/attempt-core.js
          node --check language-skills-hub/self-check/session/session-ui.js
          node --check language-skills-hub/self-check/results/export-core.js
          node --check language-skills-hub/self-check/listening/listening-student.js
          node --check language-skills-hub/self-check/reading/reading.js
          node --check language-skills-hub/tests/r31-review-export.test.cjs
          node --check language-skills-hub/tests/r31-review-export.browser.test.cjs
      - name: R22-R31 contracts and backward compatibility
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs
  r31-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium/WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Old and new browser behavior (offline result receipts)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r31-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r23-reading-selfcheck.browser.test.cjs language-skills-hub/tests/r24-listening-selfcheck.browser.test.cjs language-skills-hub/tests/r25-result-browser.test.cjs language-skills-hub/tests/r27-public-release.browser.test.cjs language-skills-hub/tests/r28-grade-proposal.browser.test.cjs language-skills-hub/tests/r29-feedback.browser.test.cjs language-skills-hub/tests/r30-attempt.browser.test.cjs
          node --test language-skills-hub/tests/r31-review-export.browser.test.cjs
