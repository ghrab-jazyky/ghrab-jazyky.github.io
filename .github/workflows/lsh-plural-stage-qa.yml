name: LSH Plural staged QA (NO DEPLOY)
on:
  push:
    branches:
      - feat/lsh-plural-cards-r70-stage
      - feat/lsh-plural-v6-editorial
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-plural-stage-qa.yml'
permissions:
  contents: read
concurrency:
  group: lsh-plural-stage-qa
  cancel-in-progress: true
jobs:
  full-node-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Plural authoring reproduces tracked HTML byte-for-byte
        run: node language-skills-hub/authoring/plural/build.cjs --check
      - name: Check new Plural Node contract
        run: node --test language-skills-hub/tests/plural-grammar-contract.test.cjs
      - name: Run every existing static Node test
        run: find language-skills-hub/tests -maxdepth 1 -type f -name '*.test.cjs' ! -name '*.browser.test.cjs' ! -name 'r25-result-browser.test.cjs' -print0 | xargs -0 node --test
  real-browser-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching Playwright CI package
        run: npm install --no-save --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.14.0
        timeout-minutes: 8
      - name: Start local HTTP server and test real browser routes, lock and vocabulary
        timeout-minutes: 20
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/plural-stage-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/plural-grammar.browser.test.cjs
          node --test language-skills-hub/tests/r39-catalog-cefr-badges.browser.test.cjs
          node --test language-skills-hub/tests/r49-unified-vocabulary.browser.test.cjs
          node --test language-skills-hub/tests/r27-public-release.browser.test.cjs
          node --test language-skills-hub/tests/r25-result-browser.test.cjs
          node --test language-skills-hub/tests/r70-live-listening-studio.browser.test.cjs
          node --test language-skills-hub/tests/plural-v6-a11y.browser.test.cjs
