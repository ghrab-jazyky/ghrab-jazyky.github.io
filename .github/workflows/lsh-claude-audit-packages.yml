name: LSH Claude source audit packages (NO deployment)
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/lsh-*'
    paths:
      - 'zkusebni/data/reference-pilots.json'
      - 'zkusebni/data/claude-audit-queue.json'
      - 'zkusebni/konverzace/**'
      - 'zkusebni/nahledy/**'
      - 'zkusebni/reference/**'
      - 'zkusebni/podklady/**'
      - 'zkusebni/tools/claude-audit-export.py'
      - '.github/workflows/lsh-claude-audit-packages.yml'
permissions:
  contents: read
jobs:
  build-claude-review-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and prepare source-bound Claude audit archives
        run: |
          python3 zkusebni/tools/claude-audit-export.py --output "$RUNNER_TEMP/lsh-claude-audit"
          python3 -c 'import json,math,pathlib,sys,zipfile; q=json.loads(pathlib.Path("zkusebni/data/claude-audit-queue.json").read_text()); z=list(pathlib.Path(sys.argv[1]).glob("*.zip")); expected=sum(math.ceil(sum(t["skill"]==s for t in q["topics"])/5) for s in ("konverzace","cteni","poslech")); print("Expected audit batches:",expected,"actual:",len(z)); assert len(z)==expected>0; assert all(zipfile.ZipFile(f).testzip() is None for f in z)' "$RUNNER_TEMP/lsh-claude-audit"
          test -f "$RUNNER_TEMP/lsh-claude-audit/INDEX.md"
      - name: Attach audit packages for teacher and Claude (no source changes)
        uses: actions/upload-artifact@v4
        with:
          name: lsh-claude-source-batches
          path: |
            ${{ runner.temp }}/lsh-claude-audit/*.zip
            ${{ runner.temp }}/lsh-claude-audit/INDEX.md
          if-no-files-found: error
          retention-days: 30
