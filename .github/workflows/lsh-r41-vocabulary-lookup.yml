name: LSH R41 vocabulary popup regression and cross-card checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/lsh-vocabulary-lookup-audit-2026-11-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vocabulary-popups:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browsers
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test real-word lookup windows in 21 Conversation and 5 Reading cards
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r41-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r41-vocabulary-lookup.browser.test.cjs
