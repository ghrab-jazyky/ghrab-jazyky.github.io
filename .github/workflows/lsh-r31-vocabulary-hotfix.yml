name: LSH R31 production vocabulary recovery (no auto-deployment)
on:
  push:
    branches: [fix/lsh-r31-prod-vocabulary-isolation-2026-11-10]
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/slovnicek/**'
      - 'language-skills-hub/assets/lsh/v3/**'
      - 'language-skills-hub/assets/lsh/v2/styles.css'
      - 'language-skills-hub/tests/r31-vocabulary-*.cjs'
      - '.github/workflows/lsh-r31-vocabulary-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vocabulary-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static and isolation regression
        run: |
          node --check language-skills-hub/assets/lsh/v3/config.js
          node --check language-skills-hub/assets/lsh/v3/card-bridge.js
          node --check language-skills-hub/assets/lsh/v3/vocab.js
          node --test language-skills-hub/tests/r31-vocabulary-production.test.cjs
          node --test language-skills-hub/tests/r27-public-release.test.cjs
  vocabulary-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Exercise production vocabulary in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-vocabulary-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/slovnicek/ >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r31-vocabulary-production.browser.test.cjs
