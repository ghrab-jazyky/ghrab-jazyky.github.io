name: LSH R28 local 1-5 grade proposals gate (no secure exams)
on:
  push:
    branches:
      - release/lsh-r28-teacher-assisted-grades-2026-11-09
    paths:
      - 'language-skills-hub/**'
      - 'README.md'
      - '.github/workflows/lsh-r28-grade-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - 'README.md'
      - '.github/workflows/lsh-r28-grade-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate grading source syntax
        run: |
          node --check language-skills-hub/self-check/results/grade-core.js
          node --check language-skills-hub/self-check/reading/reading.js
          node --check language-skills-hub/self-check/listening/listening-student.js
          node --check language-skills-hub/tests/r28-grade-proposal.test.cjs
          node --check language-skills-hub/tests/r28-grade-proposal.browser.test.cjs
      - name: Full public-data, local-score and grading safety regression
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs
  grade-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install actual Chromium and WebKit engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Public catalog and Reading/Listening grading end-to-end QA
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r28-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r23-reading-selfcheck.browser.test.cjs language-skills-hub/tests/r24-listening-selfcheck.browser.test.cjs language-skills-hub/tests/r25-result-browser.test.cjs language-skills-hub/tests/r27-public-release.browser.test.cjs language-skills-hub/tests/r28-grade-proposal.browser.test.cjs
