name: LSH R27 release gate (public local Reading/Listening, NO grades)
on:
  push:
    branches:
      - release/lsh-r27-public-nongraded-reading-listening-2026-11-09
    paths:
      - 'language-skills-hub/**'
      - 'README.md'
      - '.github/workflows/lsh-r27-release-gate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'language-skills-hub/**'
      - 'README.md'
      - '.github/workflows/lsh-r27-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate new and modified JavaScript
        run: |
          node --check language-skills-hub/assets/hub.js
          node --check language-skills-hub/self-check/reading/reading-teacher.js
          node --check language-skills-hub/self-check/listening/listening-teacher.js
          node --check language-skills-hub/self-check/results/share-tools.js
          node --check language-skills-hub/tests/r27-public-release.test.cjs
          node --check language-skills-hub/tests/r27-public-release.browser.test.cjs
      - name: Full R22-R27 regression for live practice, self-checks, grading block and QR
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs
  release-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        timeout-minutes: 8
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Test catalog, QR, Reading and Listening students in browsers
        timeout-minutes: 10
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r27-server.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-r27-server.log 2>&1 &
          fi
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r23-reading-selfcheck.browser.test.cjs language-skills-hub/tests/r24-listening-selfcheck.browser.test.cjs language-skills-hub/tests/r25-result-browser.test.cjs language-skills-hub/tests/r27-public-release.browser.test.cjs
