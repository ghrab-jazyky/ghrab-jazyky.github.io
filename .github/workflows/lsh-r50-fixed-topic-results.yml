name: LSH R50 fixed topic and lab practice keys
on:
  pull_request:
    branches: [main]
    paths: ['language-skills-hub/**', '.github/workflows/lsh-r50-fixed-topic-results.yml']
  push:
    branches: [main]
    paths: ['language-skills-hub/**', '.github/workflows/lsh-r50-fixed-topic-results.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r50:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static and model tests
        run: |
          node --check language-skills-hub/assets/hub.js
          node --check language-skills-hub/self-check/practice-answers/teacher-key.js
          node --test language-skills-hub/tests/r36-practice-answer-keys.test.cjs language-skills-hub/tests/r50-fixed-topic-results.test.cjs
      - name: Browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium and WebKit regressions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r50-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r36-practice-answer-keys.browser.test.cjs language-skills-hub/tests/r39-catalog-cefr-badges.browser.test.cjs language-skills-hub/tests/r50-fixed-topic-results.browser.test.cjs
