name: LSH R35 independent Listening B2 teacher QA (stacked draft)
on:
  pull_request:
    branches: [feat/lsh-r34-reading-six-level-reference-2026-11-10]
  workflow_dispatch:
concurrency:
  group: lsh-r35-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source/checksum, independent B2 scoring and privacy
        run: |
          node --check language-skills-hub/self-check/test-banks/listening/test-bank-core.js
          node --check language-skills-hub/self-check/test-banks/listening/preview.js
          node --check language-skills-hub/tests/r35-independent-listening-b2.test.cjs
          node --check language-skills-hub/tests/r35-independent-listening-b2.browser.test.cjs
          node --test language-skills-hub/tests/r35-independent-listening-b2.test.cjs
      - name: Old standalone Reading pilot contracts
        run: |
          node --test language-skills-hub/tests/r32-independent-reading-pilot.test.cjs language-skills-hub/tests/r33-independent-reading-b1.test.cjs language-skills-hub/tests/r34-reading-six-level-reference.test.cjs language-skills-hub/tests/r34-coverage-ledger.test.cjs
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run isolated Listening B2 teacher QA and restore scenarios
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r35-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r35-independent-listening-b2.browser.test.cjs
