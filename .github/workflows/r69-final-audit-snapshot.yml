name: R69 final audit exact code snapshot (no deploy)
on:
  push:
    branches:
      - audit/lsh-r69-final-20261114
    paths:
      - .github/workflows/r69-final-audit-snapshot.yml
permissions:
  contents: read
jobs:
  audit-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export exact audited LSH commit
        uses: actions/upload-artifact@v4
        with:
          name: r69-final-audit-code
          path: |
            language-skills-hub/
            .github/workflows/
            README.md
          retention-days: 1
