name: LSH Asteroids Smart Feedback F4 exact-head certification (NO DEPLOY)
on:
  push:
    branches: ['feature/lsh-smart-feedback-asteroids-f2']
    paths:
      - '.github/workflows/lsh-smart-feedback-f4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lsh-smart-feedback-f4-${{ github.ref }}
  cancel-in-progress: true
env:
  BASELINE: d8d032ee1fc51a009df3d20d8fb64135f9b23be3
  ORIGINAL_SOURCE_BASELINE: fde581f864093a0b87d60afbc552e5c4e021e7e5
jobs:
  contracts:
    if: github.ref == 'refs/heads/feature/lsh-smart-feedback-asteroids-f2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact candidate, scoring, source, archives, timer and unlock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sf-f4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASELINE" HEAD)" = "$BASELINE"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASELINE"
          git diff --exit-code "$ORIGINAL_SOURCE_BASELINE" "$BASELINE" -- language-skills-hub/cteni/asteroids/index.html language-skills-hub/self-check/reading/reading-core.js language-skills-hub/self-check/reading/reading.js language-skills-hub/printouts/rl-asteroids
          git rev-parse HEAD | tee sf-f4/HEAD.txt
          git diff --exit-code fcfa2e4d7fb8a910d24c240e049cbf36ed86bd32 HEAD -- language-skills-hub/self-check language-skills-hub/data language-skills-hub/konverzace ':(exclude)language-skills-hub/data/teacher-changelog.json'
          git diff --exit-code 03ab6d28e68e559222ea2b221b96a033ce11bbd9 HEAD -- language-skills-hub/cteni language-skills-hub/self-check language-skills-hub/assets language-skills-hub/poslech language-skills-hub/konverzace language-skills-hub/printouts language-skills-hub/version.json language-skills-hub/index.html
          node --check language-skills-hub/self-check/reading/reading-core.js
          node --check language-skills-hub/self-check/reading/reading.js
          node --check language-skills-hub/self-check/results/pdf-report.js
          node --test language-skills-hub/tests/smart-feedback-asteroids-f1.test.cjs language-skills-hub/tests/smart-feedback-asteroids-f3.test.cjs language-skills-hub/tests/smart-feedback-asteroids-f42.test.cjs language-skills-hub/tests/city-quest-d3-integrity.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r55-reading-real-catalog-sources.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r34-full-pdf-export.test.cjs language-skills-hub/tests/r48-errors-only-feedback.test.cjs language-skills-hub/tests/rl-pdf-all-variants.test.cjs language-skills-hub/tests/rl-pdf-annotations-pilot.test.cjs language-skills-hub/tests/rl-pdf-content-sha256.test.cjs language-skills-hub/tests/rl-pdf-asteroids-c1-didactic.test.cjs language-skills-hub/tests/r63-test-security.test.cjs language-skills-hub/tests/lsh-unlock-gestures.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs language-skills-hub/tests/r33-auto-listening-and-export.test.cjs language-skills-hub/tests/lsh-unlock-fuzz-t1.test.cjs language-skills-hub/tests/lsh-unlock-stagec-boundaries.test.cjs language-skills-hub/tests/lsh-unlock-b2.test.cjs language-skills-hub/tests/lsh-unlock-audit-runtime.test.cjs language-skills-hub/tests/lsh-unlock-audit-input.test.cjs language-skills-hub/tests/christmas-quest-catalog-release.test.cjs language-skills-hub/tests/lsh-asteroids-lock-cache.test.cjs language-skills-hub/tests/pwa-install.test.cjs language-skills-hub/tests/r39-catalog-cefr-badges.test.cjs language-skills-hub/tests/teacher-changelog-stage-f.test.cjs language-skills-hub/tests/r73-news-security.test.cjs | tee sf-f4/unit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-feedback-f4-contracts
          path: sf-f4/
  browsers:
    if: github.ref == 'refs/heads/feature/lsh-smart-feedback-asteroids-f2'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [smart, regression, extended, unlock, timed-offline, parallel-release, legacy-opt-in, hub-stability]
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 jsqr@1.4.0 pngjs@7.0.0
      - name: Run read-only exact-head browser certification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sf-f4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee sf-f4/HEAD.txt
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sf-f4-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          if [ "$SUITE" = smart ] || [ "$SUITE" = hub-stability ]; then
            git worktree add --detach /tmp/sf-f4-baseline "$BASELINE"
            python3 -m http.server 8766 --bind 127.0.0.1 --directory /tmp/sf-f4-baseline >/tmp/sf-f4-base.log 2>&1 &
            BASE_PID=$!
            trap 'kill "$PID" "$BASE_PID" 2>/dev/null || true' EXIT
          fi
          READY=0
          for i in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:8765/language-skills-hub/index.html").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          if [ "$SUITE" = smart ] || [ "$SUITE" = hub-stability ]; then
            BASE_READY=0
            for i in $(seq 1 30); do
              if node -e 'fetch("http://127.0.0.1:8766/language-skills-hub/index.html").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then BASE_READY=1; break; fi
              sleep 1
            done
            test "$BASE_READY" -eq 1
          fi
          case "$SUITE" in
            smart)
              export SF_EVIDENCE=sf-f4/smart
              node --test --test-concurrency=1 language-skills-hub/tests/smart-feedback-asteroids-f1.browser.test.cjs | tee sf-f4/browser.log ;;
            regression)
              node --test --test-concurrency=1 language-skills-hub/tests/r29-feedback.browser.test.cjs language-skills-hub/tests/r48-errors-only-feedback.browser.test.cjs language-skills-hub/tests/rl-pdf-annotations-pilot.browser.test.cjs language-skills-hub/tests/rl-pdf-hardening.browser.test.cjs language-skills-hub/tests/r62-test-screen-guard.browser.test.cjs language-skills-hub/tests/r63-test-security.browser.test.cjs | tee sf-f4/browser.log ;;
            extended)
              node --test --test-concurrency=1 language-skills-hub/tests/r30-attempt.browser.test.cjs language-skills-hub/tests/r34-full-pdf-export.browser.test.cjs language-skills-hub/tests/r60-school-rounding.browser.test.cjs | tee sf-f4/browser.log ;;
            unlock)
              node --test --test-concurrency=1 language-skills-hub/tests/lsh-unlock-stageb-state.browser.test.cjs language-skills-hub/tests/lsh-unlock-stageb-t4.browser.test.cjs language-skills-hub/tests/lsh-unlock-stageb.browser.test.cjs language-skills-hub/tests/lsh-unlock-stageb-matrix.browser.test.cjs language-skills-hub/tests/lsh-unlock-b2.browser.test.cjs language-skills-hub/tests/lsh-unlock-audit-regressions.browser.test.cjs | tee sf-f4/browser.log ;;
            parallel-release)
              node --test --test-concurrency=1 language-skills-hub/tests/christmas-quest-developer-lock.browser.test.cjs language-skills-hub/tests/teacher-changelog-stage-f.browser.test.cjs language-skills-hub/tests/r39-catalog-cefr-badges.browser.test.cjs | tee sf-f4/browser.log ;;
            legacy-opt-in)
              node --test --test-concurrency=1 language-skills-hub/tests/r23-reading-selfcheck.browser.test.cjs language-skills-hub/tests/r25-result-browser.test.cjs language-skills-hub/tests/r58-reading-test-tabs.browser.test.cjs | tee sf-f4/browser.log ;;
            hub-stability)
              # No exception filter or retry-to-green: every run must pass.
              # The catalog assets are unchanged by this release. Reproduce
              # the exact previously failing path against both real origins.
              git diff --exit-code "$BASELINE" HEAD -- language-skills-hub/index.html language-skills-hub/assets/pwa-install.js language-skills-hub/assets/pwa-install.css language-skills-hub/assets/hub.js language-skills-hub/assets/hub.css language-skills-hub/assets/whats-new-app.js language-skills-hub/assets/whats-new-view.js
              for i in 1 2 3; do
                echo "Strict baseline changelog replay $i" | tee -a sf-f4/browser.log
                LSH_TEACHER_CHANGELOG_BASELINE=1 LSH_TEACHER_CHANGELOG_BASE=http://127.0.0.1:8766/language-skills-hub/ node --test --test-concurrency=1 --test-name-pattern='previously seen release is offered the next release' language-skills-hub/tests/teacher-changelog-stage-f.browser.test.cjs | tee -a sf-f4/browser.log
                echo "Strict candidate changelog replay $i" | tee -a sf-f4/browser.log
                node --test --test-concurrency=1 --test-name-pattern='previously seen release is offered the next release' language-skills-hub/tests/teacher-changelog-stage-f.browser.test.cjs | tee -a sf-f4/browser.log
              done ;;
            timed-offline)
              cat > sf-f4/timed-offline.test.cjs <<'TEST'
          'use strict';
          const test=require('node:test'),assert=require('node:assert/strict'),fs=require('node:fs');
          const {chromium,webkit}=require('playwright');
          const URL='http://127.0.0.1:8765/language-skills-hub/self-check/reading/index.html?topic=rl-asteroids&lang=en&level=B1&timer=5&attempt=';
          for(const [name,engine] of [['chromium',chromium],['webkit',webkit]])for(const mode of ['manual','timeout']){
            test('F4 '+name+' '+mode+' timed offline submit, complete PDF and reload summary',{timeout:120000},async()=>{
              const browser=await engine.launch({headless:true});
              const context=await browser.newContext({viewport:{width:390,height:844},acceptDownloads:true,serviceWorkers:'block'});
              const traffic={bootstrap:[],afterReady:[],reloadBootstrap:[],afterReloadReady:[],websocket:[],workers:[],errors:[]};
              let phase='bootstrap';
              context.on('request',r=>{if(/^https?:/.test(r.url()))traffic[phase].push({url:r.url(),method:r.method(),type:r.resourceType()})});
              context.on('serviceworker',w=>traffic.workers.push(w.url()));
              await context.route('**/*',r=>r.continue());
              const page=await context.newPage();
              page.on('pageerror',e=>traffic.errors.push(e.message));
              page.on('websocket',w=>traffic.websocket.push(w.url()));
              page.on('worker',w=>traffic.workers.push(w.url()));
              page.on('dialog',d=>d.accept());
              await page.addInitScript(()=>Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async text=>{window.__sfCopy=text;}}}));
              const summary=async()=>{
                await page.locator('#results:not([hidden])').waitFor();
                assert.equal(await page.locator('#resultDetails').getAttribute('data-sf-phase'),'SUMMARY');
                assert.equal(await page.locator('#resultDetails article').count(),0);
                assert.ok(await page.locator('#sfAccept').isVisible());
                assert.ok(await page.locator('#sfDecline').isVisible());
              };
              const exportPdf=async()=>{
                const pending=page.waitForEvent('download',{timeout:30000});
                await page.locator('#exportPdf').click();
                const d=await pending,buf=fs.readFileSync(await d.path());
                assert.equal(buf.subarray(0,8).toString('ascii'),'%PDF-1.4');
                assert.ok(buf.length>10000);
              };
              try{
                await page.clock.install();
                await page.goto(URL+'f4-'+mode+'-'+name);
                await page.locator('#sessionIntro:not([hidden])').waitFor();
                await page.locator('#loading[hidden]').waitFor({state:'attached'});
                assert.ok(await page.locator('#results').isHidden());
                assert.equal(await page.locator('#resultDetails article').count(),0);
                phase='afterReady';
                await context.setOffline(true);
                await page.locator('#sessionStart').click();
                await page.locator('#workspace:not([hidden])').waitFor();
                await page.locator('fieldset.question').first().locator('input[type=radio]').first().check();
                if(mode==='timeout')await page.clock.fastForward(6*60*1000);
                else await page.locator('#submitButton').click();
                await summary();
                await exportPdf();
                await page.locator(mode==='timeout'?'#sfDecline':'#sfAccept').click();
                assert.equal(await page.locator('#resultDetails').getAttribute('data-sf-phase'),mode==='timeout'?'DECLINED':'FEEDBACK');
                await exportPdf();
                assert.deepEqual(traffic.afterReady,[]);
                phase='reloadBootstrap';
                await context.setOffline(false);
                await page.reload();
                await summary();
                await page.locator('#loading[hidden]').waitFor({state:'attached'});
                phase='afterReloadReady';
                await context.setOffline(true);
                await exportPdf();
                await page.locator('#sfAccept').click();
                assert.equal(await page.locator('#resultDetails').getAttribute('data-sf-phase'),'FEEDBACK');
                await page.locator('#sfDone').click();
                await exportPdf();
                assert.deepEqual(traffic.afterReloadReady,[]);
                assert.deepEqual(traffic.websocket,[]);
                assert.deepEqual(traffic.workers,[]);
                assert.deepEqual(traffic.errors,[]);
              }finally{
                fs.writeFileSync('sf-f4/'+name+'-'+mode+'-network.json',JSON.stringify(traffic,null,2));
                await context.close();await browser.close();
              }
            });
          }
          TEST
              node --test --test-concurrency=1 sf-f4/timed-offline.test.cjs | tee sf-f4/browser.log ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-feedback-f4-${{ matrix.suite }}
          path: |
            sf-f4/
            qa/r34/
  corpus-and-review-inputs:
    if: github.ref == 'refs/heads/feature/lsh-smart-feedback-asteroids-f2'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify final committed corpus and publication preview (no regeneration)
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p sf-f4/review/variants /tmp/sf-f4-pdfs
          git rev-parse HEAD | tee sf-f4/HEAD.txt
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qpdf poppler-utils
          git archive "$BASELINE" language-skills-hub/printouts/rl-asteroids | tar -xf - -C /tmp/sf-f4-pdfs
          F42_PDF_REPORT=sf-f4/PDF_DELTA.json node language-skills-hub/scripts/verify-smart-feedback-f42-pdfs.cjs /tmp/sf-f4-pdfs/language-skills-hub/printouts/rl-asteroids | tee sf-f4/corpus.log
          node tools/build-lsh-pages-preview.cjs | tee sf-f4/publication-preview.log
          cp release-preview/evidence/publication-manifest.json sf-f4/
          cp language-skills-hub/printouts/rl-asteroids/manifest-all.json sf-f4/pdf-manifest.json
          git diff --exit-code
      - name: Prepare precise independent reviewer inputs (NOT a sign-off)
        shell: bash
        run: |
          set -euo pipefail
          D=sf-f4/review
          printf '%s\n' "$GITHUB_SHA" > "$D/CANDIDATE_SHA.txt"
          printf '%s\n' "$BASELINE" > "$D/BASELINE_SHA.txt"
          printf '%s\n' "$ORIGINAL_SOURCE_BASELINE" > "$D/ORIGINAL_SOURCE_BASELINE_SHA.txt"
          git diff --name-status "$BASELINE" "$GITHUB_SHA" > "$D/CHANGE_MATRIX_RAW.tsv"
          git diff --stat "$BASELINE" "$GITHUB_SHA" > "$D/diff-stat.txt"
          git diff --no-ext-diff --binary "$BASELINE" "$GITHUB_SHA" -- . ':(exclude,glob)language-skills-hub/printouts/rl-asteroids/**/*.pdf' > "$D/source.diff"
          git show "$BASELINE:language-skills-hub/cteni/asteroids/index.html" > "$D/baseline-asteroids.html"
          git archive --format=tar.gz "$GITHUB_SHA" language-skills-hub/cteni/asteroids/index.html language-skills-hub/self-check language-skills-hub/docs/smart-feedback-asteroids-f1 language-skills-hub/docs/smart-feedback-asteroids-f2 language-skills-hub/docs/smart-feedback-asteroids-f3 language-skills-hub/docs/smart-feedback-asteroids-f41 language-skills-hub/docs/smart-feedback-asteroids-f42 language-skills-hub/tests language-skills-hub/version.json language-skills-hub/scripts tools/build-lsh-pages-preview.cjs .github/workflows/lsh-smart-feedback-f4.yml > "$D/candidate-source.tar.gz"
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const core=require('./language-skills-hub/self-check/reading/reading-core.js');
          const html=fs.readFileSync('language-skills-hub/cteni/asteroids/index.html','utf8');
          const data=core.parseReadingData(html),bank=core.parseSmartFeedback(html);
          const correction=JSON.parse(fs.readFileSync('language-skills-hub/docs/smart-feedback-asteroids-f42/REVIEW_CHANGES.json','utf8'));
          assert.equal(correction.cardSha256,'6776eb422a143ed03a442abb057aa9e39d8175fdcbe9b01d4e126076630a8bc1');
          assert.equal(correction.edits.length,6);
          const root='sf-f4/review',rows=['variant\tquestionId\tkind\tchoices\tcorrectIndex\tdistractorIndices\tevidenceVerbatim\tindependentReview'];
          let questions=0,distractors=0;
          for(const lang of core.LANGUAGES)for(const level of core.LEVELS){
            const key=lang+'/'+level,v=core.variantFromData(data,lang,level),b=bank.variants[key];
            fs.writeFileSync(root+'/variants/'+lang+'-'+level+'.json',JSON.stringify({candidate:process.env.GITHUB_SHA,variant:key,source:v,feedback:b},null,2)+'\n');
            for(const q of v.questions){
              const f=b.questions[q.id],ids=Object.keys(f.distractors);
              assert.equal(ids.length,q.choices.length-1);
              assert.equal(f.correctIndex,q.answer);
              assert.ok(f.evidence.every(e=>v.paragraphs[e.p].includes(e.text)));
              rows.push([key,q.id,q.kind,q.choices.length,q.answer,ids.join(','),'PASS','PENDING'].join('\t'));
              questions++;distractors+=ids.length;
            }
          }
          assert.equal(questions,360);assert.equal(distractors,969);
          fs.writeFileSync(root+'/COVERAGE.tsv',rows.join('\n')+'\n');
          fs.writeFileSync(root+'/DECISION.txt','Candidate '+process.env.GITHUB_SHA+'\nF4.1/F4.2 corrective review and source approvals recorded; 24 finding groups addressed.\nSeparate external model/person sign-off: PENDING (24 variants, 360 questions, 969 distractors, 360 unanswered tips)\nPhysical devices: PENDING\nDeployment: NO\nNo reviewer sign-off implied by technical coverage.\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-feedback-f4-corpus-and-review-inputs
          path: sf-f4/
