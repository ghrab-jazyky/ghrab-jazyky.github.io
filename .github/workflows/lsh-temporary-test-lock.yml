name: LSH temporary TEST lock regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-temporary-test-lock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check language-skills-hub/assets/temporary-test-lock.js
          node --check language-skills-hub/assets/hub.js
          node --check language-skills-hub/self-check/reading/reading-teacher.js
          node --check language-skills-hub/self-check/listening/listening-teacher.js
          node --check language-skills-hub/self-check/practice-answers/teacher-key.js
          node --check language-skills-hub/tests/temporary-test-lock.test.cjs
      - name: Maintenance unit regressions
        run: node --test language-skills-hub/tests/temporary-test-lock.test.cjs language-skills-hub/tests/christmas-quest-catalog-release.test.cjs
      - name: Public policy and release contract regressions
        run: node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r27-public-release.test.cjs
  simulated-public-origin-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright compatible with container
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify locked production origin and developer exception in Chromium/WebKit
        run: node --test language-skills-hub/tests/temporary-test-lock.browser.test.cjs language-skills-hub/tests/christmas-quest-developer-lock.browser.test.cjs
