name: LSH Conversation R8 source content recovery (NO deployment)
on:
  pull_request:
    paths:
      - 'zkusebni/tools/conversation-r8-source-recovery.cjs'
      - 'zkusebni/tools/r6-content-audit.cjs'
      - 'zkusebni/data/conversation-r8-minimal-content-fixes.json'
      - 'zkusebni/data/conversation-r8-targeted-language-proposals.json'
      - 'zkusebni/data/conversation-r6-candidates.json'
      - 'zkusebni/konverzace/k/**'
      - 'zkusebni/konverzace/**/index.html'
      - '.github/workflows/lsh-conversation-r8-recovery.yml'
  push:
    branches:
      - 'feat/lsh-*'
    paths:
      - 'zkusebni/tools/conversation-r8-source-recovery.cjs'
      - 'zkusebni/tools/r6-content-audit.cjs'
      - 'zkusebni/data/conversation-r8-minimal-content-fixes.json'
      - 'zkusebni/data/conversation-r8-targeted-language-proposals.json'
      - 'zkusebni/data/conversation-r6-candidates.json'
      - 'zkusebni/konverzace/k/**'
      - 'zkusebni/konverzace/**/index.html'
      - '.github/workflows/lsh-conversation-r8-recovery.yml'
permissions:
  contents: read
jobs:
  verify-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate 21 source-preserving R8 candidates outside repository
        run: node zkusebni/tools/conversation-r8-source-recovery.cjs "$RUNNER_TEMP/lsh-r8-conversation"
      - name: Screen recovered R8 content (504 variants; findings are review items, not approvals)
        env:
          LSH_R8_CANDIDATES_DIR: ${{ runner.temp }}/lsh-r8-conversation
        run: |
          node zkusebni/tools/r6-content-audit.cjs "$RUNNER_TEMP/lsh-r8-conversation"
          node -e 'const a=require(process.argv[1]); if(a.source!=="R8_SOURCE_PRESERVING_CANDIDATES_ONLY"||a.totalCards!==21||a.totalVariants!==504||a.totalStations!==4032||a.totalPrompts!==16128||a.teacherApproval!==false||a.releaseApproved!==false)throw Error("R8 content audit coverage/approval invariant");console.log("PASS source-restored content QA report across all 21 cards")' "$RUNNER_TEMP/lsh-r8-conversation/R8_CONTENT_AUDIT.json"
      - name: Assert all originals and R6 candidates remain untouched
        run: |
          node zkusebni/tests/conversation-r6-candidates.test.cjs
          node -e 'const r=require(process.argv[1]);if(r.cards.length!==21||r.statistics.variantCount!==504||r.statistics.stationCount!==4032||r.cards.reduce((n,c)=>n+c.exactPatches.length,0)!==7||r.cards.reduce((n,c)=>n+c.targetedLanguagePatches.length,0)!==5||r.cards.some(c=>c.targetedLanguagePatches.some(p=>p.teacherApproval!==false))||r.teacherApproval!==false||r.published!==false||r.catalogUpdated!==false||r.approvedForRelease!==false)throw Error("R8 candidate/source contract mismatch");console.log("PASS R8 source-content recovery, 21 cards/504 variants/7 A1 plus 5 narrow language proposals")' "$RUNNER_TEMP/lsh-r8-conversation/R8_RECOVERY_MANIFEST.json"
      - name: Verify human-readable 7 A1 and 5 language review queue exists
        run: |
          test -s "$RUNNER_TEMP/lsh-r8-conversation/R8_QUESTION_CHANGE_REVIEW.md"
          grep -q 'Pět dalších cílených jazykových' "$RUNNER_TEMP/lsh-r8-conversation/R8_QUESTION_CHANGE_REVIEW.md"
      - name: Attach unapproved content-preserving R8 student HTML candidates
        uses: actions/upload-artifact@v4
        with:
          name: lsh-r8-source-preserving-conversation-candidates
          path: |
            ${{ runner.temp }}/lsh-r8-conversation/*.html
            ${{ runner.temp }}/lsh-r8-conversation/*.json
            ${{ runner.temp }}/lsh-r8-conversation/*.md
          if-no-files-found: error
          retention-days: 30
