name: SAD R68 integration candidate (fail closed)
on:
  push:
    branches: [feature/sad-r68-preprod-20261114]
    paths:
      - 'release/sad-r68-source.tar.gz'
      - '.github/workflows/sad-r68-staging.yml'
permissions:
  contents: write
jobs:
  integrate-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unpack sources and validate authoring bank
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sad-r68
          tar -xzf release/sad-r68-source.tar.gz -C /tmp/sad-r68
          cp release/qa_r68_node.cjs /tmp/sad-r68/INSTALL_AND_QA/qa_r68_node.cjs
          python3 release/r68_r64_compat.py /tmp/sad-r68/INSTALL_AND_QA/r66_base_patch.py
          python3 /tmp/sad-r68/INSTALL_AND_QA/qa_r68.py
      - name: Fail-closed integration and inspect diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
          echo "DEBUG_PRE_PWD=$(pwd) GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -ld "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" || true
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel || true
          python3 /tmp/sad-r68/INSTALL_AND_QA/install_sad_r68.py --repo "$GITHUB_WORKSPACE" --write-diff /tmp/sad-r68.diff
          python3 /tmp/sad-r68/INSTALL_AND_QA/install_sad_r68.py --repo "$GITHUB_WORKSPACE" --apply --backup-dir /tmp/sad-r68-backups
          echo "DEBUG_POST_PWD=$(pwd)"
          ls -ld "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" || true
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel || true
          git -C "$GITHUB_WORKSPACE" diff --check
          git -C "$GITHUB_WORKSPACE" diff --stat
          test "$(python3 -c 'import json;v=json.load(open("language-skills-hub/data/cards.json"));print(len(v["entries"]))')" = "31"
      - name: All static Node regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mapfile -t files < <(find language-skills-hub/tests -maxdepth 1 -name '*.test.cjs' ! -name '*.browser.test.cjs' -print | sort)
          test "${#files[@]}" -gt 65
          node --test --test-concurrency=4 "${files[@]}"
      - name: Install tested browser runtime
        shell: bash
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium and WebKit end-to-end for SAD and existing labs
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sad-r68-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:8765/language-skills-hub/index.html").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test --test-concurrency=2 \
            language-skills-hub/tests/r68-sad-a1c2.browser.test.cjs \
            language-skills-hub/tests/r27-public-release.browser.test.cjs \
            language-skills-hub/tests/r39-catalog-cefr-badges.browser.test.cjs \
            language-skills-hub/tests/r45-test-ui-layout.browser.test.cjs \
            language-skills-hub/tests/r51-dual-mode-answer-keys.browser.test.cjs \
            language-skills-hub/tests/r64-one-attempt-per-device.browser.test.cjs \
            language-skills-hub/tests/r64-real-catalog-sources.browser.test.cjs
      - name: Publish tested changes to review branch, never main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add language-skills-hub
          git rm -f release/sad-r68-source.tar.gz release/qa_r68_node.cjs release/r68_r64_compat.py .github/workflows/sad-r68-staging.yml
          git diff --cached --check
          git commit -m "feat(lsh): integrate SAD A1-C2 into canonical Listening Lab R68"
          git push origin HEAD:feature/sad-r68-preprod-20261114
