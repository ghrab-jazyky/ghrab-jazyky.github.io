name: LSH Asteroids PDF release gate (NO DEPLOY)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/lsh-asteroids-pdf-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lsh-asteroids-pdf-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detect:
    name: pdf-scope
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test PDF scope classifier (always)
        run: node --test language-skills-hub/tests/rl-pdf-scope.test.cjs
      - name: Determine whether PDF inputs changed
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/pdf-changed.txt"
          elif [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ] &&
               [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > "$RUNNER_TEMP/pdf-changed.txt"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Assignment propagates a classifier error under set -e (fail closed).
          scope="$(bash language-skills-hub/scripts/pdf-scope.sh < "$RUNNER_TEMP/pdf-changed.txt")"
          case "$scope" in
            true|false) echo "relevant=$scope" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Invalid PDF scope classifier result: '$scope'"; exit 1 ;;
          esac
  unit:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate source projections and existing annotation contracts
        run: |
          node --check language-skills-hub/self-check/reading/print-core.js
          node --check language-skills-hub/self-check/reading/print-page.js
          node --check language-skills-hub/scripts/build-reading-print-pdfs.cjs
          node --check language-skills-hub/scripts/verify-reading-print-assets.cjs
          node --check language-skills-hub/scripts/pdf-content-sha256.cjs
          node --test language-skills-hub/tests/rl-pdf-all-variants.test.cjs language-skills-hub/tests/rl-pdf-annotations-pilot.test.cjs language-skills-hub/tests/rl-pdf-content-sha256.test.cjs
  browser:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Browser checks in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-pdf-qa-browser.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          node --test language-skills-hub/tests/rl-pdf-hardening.browser.test.cjs language-skills-hub/tests/rl-pdf-annotations-pilot.browser.test.cjs
  corpus:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install PDF inspection tools and pinned Chromium renderer
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qpdf poppler-utils
          npm install --no-save --ignore-scripts playwright@1.56.1 hyphen@1.14.1
      - name: Verify committed PDF corpus and manifest provenance
        run: |
          node language-skills-hub/scripts/verify-reading-print-assets.cjs
      - name: Rebuild from checked-out source and compare semantic content
        run: |
          cp -a language-skills-hub/printouts/rl-asteroids /tmp/lsh-asteroids-pdfs-before
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-pdf-qa-corpus.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          node language-skills-hub/scripts/build-reading-print-pdfs.cjs --all
          node language-skills-hub/scripts/verify-reading-print-assets.cjs --compare /tmp/lsh-asteroids-pdfs-before
      - name: Render representative PDF pages for visual review
        if: always()
        run: |
          mkdir -p /tmp/lsh-pdf-visual-qa
          for item in en/A1/practice-text en/B1/practice-all en/B1/test-all en/B2/test-all en/C1/practice-text en/C1/test-text en/C2/test-text es/B2/practice-all de/C2/test-all fr/C1/practice-all; do
            pdf="language-skills-hub/printouts/rl-asteroids/${item}.pdf"
            if [ ! -f "$pdf" ]; then continue; fi
            name=$(echo "$item" | tr '/' '-')
            last=$(pdfinfo "$pdf" | awk '/^Pages:/{print $2}')
            pdftoppm -f 1 -l 1 -scale-to 1500 -png -singlefile "$pdf" "/tmp/lsh-pdf-visual-qa/${name}-first"
            if [ "$last" -gt 1 ]; then
              pdftoppm -f "$last" -l "$last" -scale-to 1500 -png -singlefile "$pdf" "/tmp/lsh-pdf-visual-qa/${name}-last"
            fi
          done
      - name: Upload visual-review samples (not publication)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lsh-asteroids-pdf-visual-qa
          path: |
            /tmp/lsh-pdf-visual-qa/*.png
            language-skills-hub/printouts/rl-asteroids/en/A1/practice-text.pdf
            language-skills-hub/printouts/rl-asteroids/en/B1/practice-all.pdf
            language-skills-hub/printouts/rl-asteroids/en/B1/test-all.pdf
            language-skills-hub/printouts/rl-asteroids/en/C1/practice-text.pdf
            language-skills-hub/printouts/rl-asteroids/en/C1/test-text.pdf
            language-skills-hub/printouts/rl-asteroids/en/C2/test-text.pdf
            language-skills-hub/printouts/rl-asteroids/en/B2/test-text.pdf
            language-skills-hub/printouts/rl-asteroids/en/B2/test-all.pdf
            language-skills-hub/printouts/rl-asteroids/de/C2/test-text.pdf
            language-skills-hub/printouts/rl-asteroids/fr/C1/practice-all.pdf
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: pdf-release-gate
    if: always()
    needs: [detect, unit, browser, corpus]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce success for PDF changes, pass unrelated PRs
        env:
          DETECT: ${{ needs.detect.result }}
          RELEVANT: ${{ needs.detect.outputs.relevant }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          CORPUS: ${{ needs.corpus.result }}
        run: |
          set -eu
          if [ "$DETECT" != "success" ]; then
            echo "PDF change detection failed."
            exit 1
          fi
          if [ "$RELEVANT" = "false" ]; then
            if [ "$UNIT" = "skipped" ] && [ "$BROWSER" = "skipped" ] && [ "$CORPUS" = "skipped" ]; then
              echo "PASS: PR does not affect Asteroids PDFs."
              exit 0
            fi
            echo "Unexpected PDF jobs ran for unrelated changes."
            exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then
            echo "Missing PDF change decision."
            exit 1
          fi
          if [ "$UNIT" = "success" ] && [ "$BROWSER" = "success" ] && [ "$CORPUS" = "success" ]; then
            echo "PASS: all Asteroids PDF release gates succeeded."
          else
            echo "FAIL: unit=$UNIT browser=$BROWSER corpus=$CORPUS"
            exit 1
          fi
