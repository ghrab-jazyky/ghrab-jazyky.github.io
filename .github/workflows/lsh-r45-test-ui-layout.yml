name: LSH R45 TEST buttons, QR clarity and responsive question layout
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - 'README.md'
      - '.github/workflows/lsh-r45-test-ui-layout.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - 'README.md'
      - '.github/workflows/lsh-r45-test-ui-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax
        run: |
          node --check language-skills-hub/assets/hub.js
          node --check language-skills-hub/self-check/reading/reading.js
          node --check language-skills-hub/self-check/listening/listening-student.js
          node --check language-skills-hub/tests/r45-test-ui-layout.test.cjs
          node --check language-skills-hub/tests/r45-test-ui-layout.browser.test.cjs
      - name: Check public-only mode, original content, student notices, labels and grade safety
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r45-test-ui-layout.test.cjs
  visual-regressions:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install tested Chromium and WebKit Playwright
        timeout-minutes: 8
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Browser regression across phone, tablet and desktop
        timeout-minutes: 25
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r45-server.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-r45-server.log 2>&1 &
          fi
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r23-reading-selfcheck.browser.test.cjs language-skills-hub/tests/r27-public-release.browser.test.cjs language-skills-hub/tests/r45-test-ui-layout.browser.test.cjs
