name: LSH R62 secure test screen guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/self-check/session/**'
      - 'language-skills-hub/tests/r30-attempt.browser.test.cjs'
      - 'language-skills-hub/tests/r62-test-screen-guard.browser.test.cjs'
      - '.github/workflows/lsh-r62-test-screen-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check language-skills-hub/self-check/session/attempt-core.js
          node --check language-skills-hub/self-check/session/session-ui.js
          node --check language-skills-hub/tests/r62-test-screen-guard.browser.test.cjs
          node --test language-skills-hub/tests/r30-attempt.test.cjs
          node --test language-skills-hub/tests/r62-test-screen-guard.browser.test.cjs --test-name-pattern="incident kinds"
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium and WebKit timed test guard regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r62-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r62-test-screen-guard.browser.test.cjs language-skills-hub/tests/r30-attempt.browser.test.cjs
