name: LSH R62-R63 secure test screen and report QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/self-check/session/**'
      - 'language-skills-hub/self-check/reading/**'
      - 'language-skills-hub/self-check/listening/**'
      - 'language-skills-hub/self-check/results/pdf-report.js'
      - 'language-skills-hub/tests/r30-attempt*'
      - 'language-skills-hub/tests/r34-full-pdf-export*'
      - 'language-skills-hub/tests/r62-test-screen-guard*'
      - 'language-skills-hub/tests/r63-test-security*'
      - '.github/workflows/lsh-r62-test-screen-guard.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/self-check/session/**'
      - 'language-skills-hub/self-check/reading/**'
      - 'language-skills-hub/self-check/listening/**'
      - 'language-skills-hub/self-check/results/pdf-report.js'
      - 'language-skills-hub/tests/r63-test-security*'
      - '.github/workflows/lsh-r62-test-screen-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and local security contracts
        run: |
          for file in \
            language-skills-hub/self-check/session/attempt-core.js \
            language-skills-hub/self-check/session/tab-guard.js \
            language-skills-hub/self-check/session/session-ui.js \
            language-skills-hub/self-check/results/pdf-report.js \
            language-skills-hub/self-check/reading/reading.js \
            language-skills-hub/self-check/listening/listening-student.js \
            language-skills-hub/tests/r63-test-security.test.cjs \
            language-skills-hub/tests/r63-test-security.browser.test.cjs; do node --check "$file"; done
          node --test language-skills-hub/tests/r30-attempt.test.cjs \
            language-skills-hub/tests/r34-full-pdf-export.test.cjs \
            language-skills-hub/tests/r63-test-security.test.cjs
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Browser security and PDF regressions Chromium + WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r63-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r30-attempt.browser.test.cjs \
            language-skills-hub/tests/r34-full-pdf-export.browser.test.cjs \
            language-skills-hub/tests/r62-test-screen-guard.browser.test.cjs \
            language-skills-hub/tests/r63-test-security.browser.test.cjs
