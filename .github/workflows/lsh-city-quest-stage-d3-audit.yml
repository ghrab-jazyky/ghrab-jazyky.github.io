name: City Quest D3 isolated integration audit (NO DEPLOY)
on:
  push:
    branches: [audit/city-quest-stage-d3-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r39-repeat:
    name: R39 exact repeat (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: baseline-source
            ref: 92c955686750729a1747379077987539c9093435
            filtered: 'no'
          - target: candidate-source
            ref: 6121c3586e006d751a044a3d0d8dbe8d7851c53d
            filtered: 'no'
          - target: candidate-filtered
            ref: 6121c3586e006d751a044a3d0d8dbe8d7851c53d
            filtered: 'yes'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Repeat unchanged R39 browser tests 3 times
        shell: bash
        env:
          EXPECTED: ${{ matrix.ref }}
          FILTERED: ${{ matrix.filtered }}
        run: |
          set -euo pipefail
          mkdir -p d3-evidence
          # Trust only this checkout in the ephemeral CI container, not arbitrary repositories.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD | tee d3-evidence/actual-sha.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          printf '%s\n' "$EXPECTED" >d3-evidence/tested-sha.txt
          root=.
          if [ "$FILTERED" = yes ]; then
            node tools/build-lsh-pages-preview.cjs
            root=release-preview/site
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$root" >/tmp/d3-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:8765/language-skills-hub/index.html").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
            sleep 1
          done
          failed=0
          for attempt in 1 2 3; do
            if node --test language-skills-hub/tests/r39-catalog-cefr-badges.browser.test.cjs 2>&1 | tee "d3-evidence/r39-$attempt.log"; then
              echo "attempt $attempt PASS" | tee -a d3-evidence/result.txt
            else
              echo "attempt $attempt FAIL" | tee -a d3-evidence/result.txt
              failed=1
            fi
          done
          cp /tmp/d3-http.log d3-evidence/http.log
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-r39-${{ matrix.target }}
          path: d3-evidence/
          retention-days: 30
  broad-regression:
    name: R68 regression (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [source, filtered]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6121c3586e006d751a044a3d0d8dbe8d7851c53d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.10.3
      - name: Unmodified R68 static and browser suite
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p d3-evidence
          # Trust only this checkout in the ephemeral CI container, not arbitrary repositories.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD | tee d3-evidence/actual-sha.txt
          test "$(git rev-parse HEAD)" = 6121c3586e006d751a044a3d0d8dbe8d7851c53d
          git rev-parse HEAD >d3-evidence/tested-sha.txt
          failed=0
          mapfile -t files < <(find language-skills-hub/tests -maxdepth 1 -name '*.test.cjs' ! -name '*.browser.test.cjs' ! -name 'r25-result-browser.test.cjs' -print | sort)
          test "${#files[@]}" -ge 38
          node --test --test-concurrency=4 "${files[@]}" 2>&1 | tee d3-evidence/static.log || failed=1
          root=.
          if [ "$TARGET" = filtered ]; then
            node tools/build-lsh-pages-preview.cjs
            root=release-preview/site
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$root" >/tmp/d3-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:8765/language-skills-hub/index.html").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
            sleep 1
          done
          node --test --test-concurrency=2 \
            language-skills-hub/tests/r68-sad-a1c2.browser.test.cjs \
            language-skills-hub/tests/r25-result-browser.test.cjs \
            language-skills-hub/tests/r27-public-release.browser.test.cjs \
            language-skills-hub/tests/r39-catalog-cefr-badges.browser.test.cjs \
            language-skills-hub/tests/r45-test-ui-layout.browser.test.cjs \
            language-skills-hub/tests/r51-dual-mode-answer-keys.browser.test.cjs \
            language-skills-hub/tests/r64-one-attempt-per-device.browser.test.cjs \
            language-skills-hub/tests/r64-real-catalog-sources.browser.test.cjs 2>&1 | tee d3-evidence/browser.log || failed=1
          cp /tmp/d3-http.log d3-evidence/http.log
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-r68-${{ matrix.target }}
          path: d3-evidence/
          retention-days: 30
