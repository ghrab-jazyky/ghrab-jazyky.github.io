name: LSH R72 News A1-C2 preproduction certification (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r72-news.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run ALL LSH static regression tests plus R72
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find language-skills-hub/tests -maxdepth 1 -name '*.test.cjs' ! -name '*.browser.test.cjs' ! -name 'r25-result-browser.test.cjs' -print | sort)
          test "${#files[@]}" -ge 38
          node --test --test-concurrency=4 "${files[@]}"
      - name: Syntax-check new assets
        run: |
          node --check language-skills-hub/poslech/how-to-choose-your-news/news-core.js
          node --check language-skills-hub/poslech/how-to-choose-your-news/news-practice.js
          node --check language-skills-hub/tests/r72-news.test.cjs
          node --check language-skills-hub/tests/r72-news.browser.test.cjs
          node --check language-skills-hub/tests/r73-news-security.test.cjs
          node --check language-skills-hub/tests/r73-news-security.browser.test.cjs
          node --check language-skills-hub/tests/r74-news-teacher-keys.browser.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser client
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Run R72 and canonical Listening Studio browser regressions
        shell: bash
        timeout-minutes: 28
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r72-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:8765/language-skills-hub/index.html").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test --test-concurrency=2 \
            language-skills-hub/tests/r72-news.browser.test.cjs \
            language-skills-hub/tests/r73-news-security.browser.test.cjs \
            language-skills-hub/tests/r74-news-teacher-keys.browser.test.cjs \
            language-skills-hub/tests/r75-reconstruction-parity.browser.test.cjs \
            language-skills-hub/tests/r69-conlangs.browser.test.cjs \
            language-skills-hub/tests/r68-sad-a1c2.browser.test.cjs \
            language-skills-hub/tests/r70-live-listening-studio.browser.test.cjs \
            language-skills-hub/tests/r71-practice-question-instructions.browser.test.cjs \
            language-skills-hub/tests/r63-test-security.browser.test.cjs
