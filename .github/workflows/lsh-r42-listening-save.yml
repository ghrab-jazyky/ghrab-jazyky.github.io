name: LSH R42 Listening Lab word-save end-to-end
on:
  push:
    branches: [main, fix/lsh-listening-save-word-2026-11-11]
    paths:
      - 'language-skills-hub/assets/lsh/v3/card-vocabulary.*'
      - 'language-skills-hub/tests/r42-listening-vocabulary.browser.test.cjs'
      - '.github/workflows/lsh-r42-listening-save.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listening-vocabulary-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify student save workflow in all three listening cards
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r42-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r42-listening-vocabulary.browser.test.cjs
