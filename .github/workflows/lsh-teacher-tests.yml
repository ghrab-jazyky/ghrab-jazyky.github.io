name: LSH teacher gateway security unit tests (NO DEPLOYMENT)
on:
  push:
    branches:
      - feat/lsh-teacher-cloudflare-access-2026-11-05
  pull_request:
    paths:
      - 'teacher-gateway/**'
      - 'zkusebni/data/manifest.json'
      - '.github/workflows/lsh-teacher-tests.yml'
permissions:
  contents: read
jobs:
  deny-by-default:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check teacher-gateway/src/worker.mjs
          node --check teacher-gateway/src/ui.mjs
          node --check teacher-gateway/src/qr-asset.mjs
          node --check teacher-gateway/tests/worker.test.mjs
      - name: Unit and denial tests (no real Cloudflare authentication)
        run: node --test teacher-gateway/tests/worker.test.mjs
      - name: Verify no production teacher secrets in config
        run: |
          ! grep -E '^AUTHORIZED_TEACHERS[[:space:]]*=' teacher-gateway/wrangler.toml
          ! grep -E '^id = "[a-fA-F0-9]{32}"' teacher-gateway/wrangler.toml
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Chromium and WebKit test engines (CI only)
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test actual teacher UI against local mocked Access
        run: node --test teacher-gateway/tests/ui.browser.test.mjs
  bundle-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare Wrangler dry-run bundle WITHOUT credentials or deployment
        run: |
          npx --yes wrangler@4 deploy --dry-run --config teacher-gateway/wrangler.toml --outdir /tmp/lsh-teacher-gateway
      - name: Check generated Worker bundle exists
        run: test -n "$(find /tmp/lsh-teacher-gateway -name '*.js' -type f -print -quit)"
