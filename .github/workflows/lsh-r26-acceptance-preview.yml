name: LSH R26 local acceptance preview package (NO deployment)
on:
  push:
    branches:
      - feat/lsh-r26-local-preview-and-acceptance-2026-11-09
    paths:
      - 'language-skills-hub/**'
      - 'preview-tools/**'
      - 'PREVIEW-POKYNY-A-PREJIMKA.md'
      - 'START-LSH-PREVIEW-WINDOWS.cmd'
      - '.github/workflows/lsh-r26-acceptance-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preview launcher and server syntax
        run: |
          node --check preview-tools/server.cjs
          node --check preview-tools/server.test.cjs
      - name: R22-R25 integrity and R26 preview safety tests
        run: |
          node --test preview-tools/server.test.cjs language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs
      - name: Assemble exact GitHub Pages folder structure plus Windows launcher
        run: |
          mkdir -p LSH-R26-PREVIEW
          cp -a language-skills-hub LSH-R26-PREVIEW/
          cp -a preview-tools LSH-R26-PREVIEW/
          cp PREVIEW-POKYNY-A-PREJIMKA.md LSH-R26-PREVIEW/
          cp START-LSH-PREVIEW-WINDOWS.cmd LSH-R26-PREVIEW/
          test -f LSH-R26-PREVIEW/language-skills-hub/index.html
          test -f LSH-R26-PREVIEW/language-skills-hub/self-check/reading/index.html
          test -f LSH-R26-PREVIEW/language-skills-hub/self-check/listening/student.html
          test -f LSH-R26-PREVIEW/language-skills-hub/self-check/listening/teacher.html
          test -f LSH-R26-PREVIEW/language-skills-hub/self-check/results/result-core.js
          test -f LSH-R26-PREVIEW/START-LSH-PREVIEW-WINDOWS.cmd
          du -sh LSH-R26-PREVIEW
      - name: Upload local preview ZIP as GitHub Actions artifact (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: LSH-R26-LOCAL-PREVIEW
          path: LSH-R26-PREVIEW/
          if-no-files-found: error
          retention-days: 14

  acceptance-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run full R23-R25 browser acceptance against localhost preview
        run: |
          node preview-tools/server.cjs >/tmp/lsh-r26-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r23-reading-selfcheck.browser.test.cjs language-skills-hub/tests/r24-listening-selfcheck.browser.test.cjs language-skills-hub/tests/r25-result-browser.test.cjs
