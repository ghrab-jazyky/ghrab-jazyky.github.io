name: LSH R54 reading skill explanations (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/assets/lsh/v3/card-vocabulary.js'
      - 'language-skills-hub/assets/lsh/v3/reading-skill-guides.js'
      - 'language-skills-hub/assets/lsh/v3/reading-skill-guides.css'
      - 'language-skills-hub/tests/r54-reading-skill-guides.test.cjs'
      - 'language-skills-hub/tests/r54-reading-skill-guides.browser.test.cjs'
      - '.github/workflows/lsh-r54-reading-skill-guides.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check language-skills-hub/assets/lsh/v3/reading-skill-guides.js
          node --check language-skills-hub/assets/lsh/v3/card-vocabulary.js
          node --check language-skills-hub/tests/r54-reading-skill-guides.test.cjs
          node --test language-skills-hub/tests/r54-reading-skill-guides.test.cjs
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r54-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/cteni/asteroids/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r54-reading-skill-guides.browser.test.cjs
