name: LSH teacher gesture UX candidate

on:
  pull_request:
    paths:
      - "language-skills-hub/self-check/**"
      - "language-skills-hub/tests/lsh-unlock-*.cjs"
      - "language-skills-hub/tests/lsh-asteroids-lock-rehearsal.browser.test.cjs"
      - "language-skills-hub/tests/lsh-asteroids-mobile-layout.browser.test.cjs"
      - "language-skills-hub/tests/lsh-asteroids-all-gestures-mobile-layout.browser.test.cjs"
      - "language-skills-hub/tests/lsh-asteroids-lock-cache.test.cjs"
      - "language-skills-hub/assets/hub.js"
      - "language-skills-hub/index.html"
      - ".github/workflows/lsh-unlock-teacher-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gesture-teacher-ux:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The official Playwright image already contains browsers and Linux
      # dependencies. Avoid the 25-minute apt reinstall timeout seen in #119.
      - name: Install matching Playwright JS bindings
        timeout-minutes: 8
        run: npm install --no-save --ignore-scripts playwright@1.56.1 jsqr@1.4.0 pngjs@7.0.0
      - name: Validate JavaScript syntax
        run: |
          node --check language-skills-hub/self-check/session/unlock-gestures.js
          node --check language-skills-hub/self-check/session/teacher-ux.js
          node --check language-skills-hub/self-check/session/gesture-trainer-page.js
      - name: Deterministic gesture, caching, and timing tests
        run: |
          node --test language-skills-hub/tests/lsh-asteroids-lock-cache.test.cjs
          node --test language-skills-hub/tests/lsh-unlock-gestures.test.cjs
          node --test language-skills-hub/tests/lsh-unlock-stagec-boundaries.test.cjs
      - name: Start local site
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-teacher-ux-http.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-teacher-ux-http.log 2>&1 &
          fi
          for i in $(seq 1 25); do
            if node -e "fetch('http://127.0.0.1:8765/language-skills-hub/self-check/reading/teacher.html').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 1
          done
          cat /tmp/lsh-teacher-ux-http.log
          exit 1
      - name: Teacher trainer in both labs and mobile QR page
        run: node --test language-skills-hub/tests/lsh-unlock-teacher-ux.browser.test.cjs language-skills-hub/tests/lsh-asteroids-lock-rehearsal.browser.test.cjs language-skills-hub/tests/lsh-asteroids-mobile-layout.browser.test.cjs language-skills-hub/tests/lsh-asteroids-all-gestures-mobile-layout.browser.test.cjs
      - name: Existing teacher, URL and gesture regression
        run: |
          node --test --test-concurrency=2 \
            language-skills-hub/tests/lsh-unlock-stageb.browser.test.cjs \
            language-skills-hub/tests/lsh-unlock-staged-teacher-confirmation.browser.test.cjs \
            language-skills-hub/tests/lsh-unlock-stagec-visual.browser.test.cjs \
            language-skills-hub/tests/lsh-unlock-audit-regressions.browser.test.cjs
      - name: Report failure
        if: failure()
        run: |
          echo "NO-GO: teacher gesture candidate failed; main must remain unchanged."
          cat /tmp/lsh-teacher-ux-http.log || true
