name: LSH R35 factual cloze and authentic school-logo PDF gate (NO DEPLOY)
on:
  push:
    branches: [fix/lsh-r35-school-logo-and-closed-cloze]
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r35-school-branding-and-cloze.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and complete static regressions
        run: |
          set -e
          node --check language-skills-hub/self-check/results/pdf-report.js
          node --check language-skills-hub/self-check/listening/listening-core.js
          node --check language-skills-hub/self-check/listening/listening-student.js
          node --check language-skills-hub/self-check/reading/reading.js
          find language-skills-hub/tests -maxdepth 1 -name '*.test.cjs' ! -name '*browser.test.cjs' -print0 | xargs -0 node --test
  browser:
    name: R35 browser shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependencies
        timeout-minutes: 8
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.14.0 axe-core@4.14.1 jsqr@1.4.0 pngjs@7.0.0
      - name: Full legacy and R35 regression suite — disjoint file partition
        timeout-minutes: 35
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p r35-evidence
          node -p "require('axe-core/package.json').version" | tee r35-evidence/axe-version.txt
          mapfile -t all < <(find language-skills-hub/tests -maxdepth 1 -type f -name '*browser.test.cjs' | LC_ALL=C sort)
          test "${#all[@]}" -ge 78
          printf '%s\n' "${all[@]}" > r35-evidence/full-inventory.txt
          selected=()
          for i in "${!all[@]}"; do
            if (( i % 8 == SHARD )); then selected+=("${all[$i]}"); fi
          done
          test "${#selected[@]}" -gt 0
          printf '%s\n' "${selected[@]}" | tee r35-evidence/shard-inventory.txt
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r35-http.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-r35-http.log 2>&1 &
          fi
          SERVER_PID=$!
          BASE_PID=
          trap 'kill "$SERVER_PID" ${BASE_PID:+"$BASE_PID"} 2>/dev/null || true' EXIT
          # The exhaustive shard inventory includes the real two-origin Smart
          # Feedback bootstrap parity test. Serve the pinned baseline, never a
          # second copy of the candidate. Keep the existing disjoint shards.
          if printf '%s\n' "${selected[@]}" | grep -Fxq 'language-skills-hub/tests/smart-feedback-asteroids-f1.browser.test.cjs'; then
            BASE_DIR=/tmp/lsh-r35-sf-baseline
            git worktree add --detach "$BASE_DIR" fde581f864093a0b87d60afbc552e5c4e021e7e5
            test "$(git -C "$BASE_DIR" rev-parse HEAD)" = fde581f864093a0b87d60afbc552e5c4e021e7e5
            if command -v python3 >/dev/null 2>&1; then
              python3 -m http.server 8766 --bind 127.0.0.1 --directory "$BASE_DIR" >/tmp/lsh-r35-sf-baseline.log 2>&1 &
            else
              npx --yes http-server@14.1.1 "$BASE_DIR" -p 8766 -a 127.0.0.1 -s -c-1 >/tmp/lsh-r35-sf-baseline.log 2>&1 &
            fi
            BASE_PID=$!
            BASE_READY=0
            for i in $(seq 1 30); do
              if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8766/language-skills-hub/index.html; then BASE_READY=1; break; fi
              sleep 1
            done
            test "$BASE_READY" -eq 1
          fi
          READY=0
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          export SF_EVIDENCE=r35-evidence/smart-feedback
          node --test --test-concurrency=2 "${selected[@]}" 2>&1 | tee r35-evidence/browser.log
      - name: Keep PDF samples for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsh-r35-logo-pdf-preflight-${{ matrix.shard }}
          path: |
            qa/r34/*.pdf
            r35-evidence/
          if-no-files-found: warn
