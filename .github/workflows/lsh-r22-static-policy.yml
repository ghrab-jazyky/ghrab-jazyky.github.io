name: LSH R22 static-only QA (NO deployment)
on:
  push:
    branches:
      - feat/lsh-r22-static-assessment-policy-2026-11-09
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-static-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax validation
        run: node --check language-skills-hub/tests/r22-static-policy.test.cjs
      - name: Run five static-only and original-card integrity tests
        run: node --test language-skills-hub/tests/r22-static-policy.test.cjs
