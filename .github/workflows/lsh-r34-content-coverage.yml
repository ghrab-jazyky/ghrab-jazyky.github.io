name: LSH R34 independent test coverage and integrity gate
on:
  pull_request:
    branches: [feat/lsh-r33-independent-reading-b1-pilot-2026-11-10]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lsh-r34-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  coverage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate inventory compiler and protect original content
        run: |
          node --check language-skills-hub/tools/independent-coverage.cjs
          node --check language-skills-hub/tools/build-audit-pack.cjs
          node language-skills-hub/tools/independent-coverage.cjs --integrity
      - name: Generate transparent R34 gap report
        run: |
          node language-skills-hub/tools/independent-coverage.cjs --json > independent-test-coverage.json
          node -e "const s=require('./independent-test-coverage.json');if(s.total!==138||s.reading.total!==120||s.listening.total!==18||s.authored<2)process.exit(2);console.log({total:s.total,authored:s.authored,approved:s.approved,missing:s.missing})"
      - uses: actions/upload-artifact@v4
        with:
          name: lsh-r34-coverage-and-backlog
          path: independent-test-coverage.json
          retention-days: 30
      - name: Reproducible offline Claude audit dossier
        run: |
          node language-skills-hub/tools/build-audit-pack.cjs audit-pack
          test -f audit-pack/README-FOR-CLAUDE.md
          test -f audit-pack/coverage.json
          test -f audit-pack/MISSING-VARIANTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: lsh-r34-claude-review-dossier
          path: audit-pack/
          retention-days: 30
      - name: Existing independent B1/B2 draft and R31 regression tests
        run: |
          node --test language-skills-hub/tests/r32-independent-reading-pilot.test.cjs language-skills-hub/tests/r33-independent-reading-b1.test.cjs
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs
