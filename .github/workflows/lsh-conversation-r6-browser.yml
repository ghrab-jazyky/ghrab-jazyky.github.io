name: LSH Conversation R8 source-restored browser QA (NO deployment)
on:
  pull_request:
    paths:
      - 'zkusebni/tests/conversation-r6-browser.test.cjs'
      - 'zkusebni/konverzace/k/**'
      - 'zkusebni/tools/conversation-r8-source-recovery.cjs'
      - 'zkusebni/data/conversation-r8-minimal-content-fixes.json'
      - 'zkusebni/data/conversation-r8-targeted-language-proposals.json'
      - 'zkusebni/data/conversation-r6-candidates.json'
      - 'zkusebni/assets/lsh/v2/lock.js'
      - 'zkusebni/assets/lsh/v3/**'
      - '.github/workflows/lsh-conversation-r6-browser.yml'
  push:
    branches:
      - 'feat/lsh-*'
    paths:
      - 'zkusebni/tests/conversation-r6-browser.test.cjs'
      - 'zkusebni/konverzace/k/**'
      - 'zkusebni/tools/conversation-r8-source-recovery.cjs'
      - 'zkusebni/data/conversation-r8-minimal-content-fixes.json'
      - 'zkusebni/data/conversation-r8-targeted-language-proposals.json'
      - 'zkusebni/data/conversation-r6-candidates.json'
      - 'zkusebni/assets/lsh/v2/lock.js'
      - 'zkusebni/assets/lsh/v3/**'
      - '.github/workflows/lsh-conversation-r6-browser.yml'
permissions:
  contents: read
jobs:
  full-dom-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      LSH_R6_ENGINE: ${{ matrix.engine }}
      LSH_R8_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engine
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps "${LSH_R6_ENGINE}"
      - name: Verify 21 recovered cards, all 24 variants and 8 stations each
        run: node --test --test-concurrency=1 zkusebni/tests/conversation-r6-browser.test.cjs
