name: LSH R48 student mistakes-only feedback and full teacher archive
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r48-errors-only-feedback.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r48-errors-only-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check feedback JavaScript and test syntax
        run: |
          node --check language-skills-hub/self-check/reading/reading.js
          node --check language-skills-hub/self-check/listening/listening-student.js
          node --check language-skills-hub/tests/r48-errors-only-feedback.test.cjs
          node --check language-skills-hub/tests/r48-errors-only-feedback.browser.test.cjs
      - name: Assert exact authored rationales, error-only display and archive contracts
        run: |
          node --test language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r34-full-pdf-export.test.cjs language-skills-hub/tests/r48-errors-only-feedback.test.cjs

  feedback-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install tested browser driver
        timeout-minutes: 8
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify wrong/blank comparisons and complete teacher exports in Chromium and WebKit
        timeout-minutes: 25
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r48-server.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-r48-server.log 2>&1 &
          fi
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r29-feedback.browser.test.cjs language-skills-hub/tests/r34-full-pdf-export.browser.test.cjs language-skills-hub/tests/r48-errors-only-feedback.browser.test.cjs
