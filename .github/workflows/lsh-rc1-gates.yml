name: LSH RC1 staging accuracy and privacy gate (NO deployment)
on:
  push:
    branches:
      - release/lsh-rc1-staging-safe-2026-11-05
  pull_request:
    branches:
      - main
    paths:
      - 'zkusebni/**'
      - '.github/workflows/lsh-rc1-gates.yml'
permissions:
  contents: read
jobs:
  static-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage E3A–E3D and RC1 static QA
        run: |
          node --test zkusebni/tests/e3a.test.cjs zkusebni/tests/e3b.static.test.cjs zkusebni/tests/e3c.test.cjs zkusebni/tests/e3d.test.cjs zkusebni/tests/rc1-gates.test.cjs
      - name: Staging does not include any confidential teacher-key files
        run: |
          ! find zkusebni/cteni zkusebni/poslech -type f \( -iname '*teacher*key*' -o -iname '*ucitel*key*' -o -iname '*answer*key*' \) | grep -q .
