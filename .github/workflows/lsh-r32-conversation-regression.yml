name: LSH R32 conversation countdown and sharing regression (no deployment)
on:
  push:
    branches:
      - fix/lsh-conversation-floating-countdown-2026-11-11
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/assets/lsh/v3/card-bridge.css'
      - 'language-skills-hub/tests/r32-conversation-countdown*.cjs'
      - '.github/workflows/lsh-r32-conversation-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate new regression tests
        run: |
          node --check language-skills-hub/tests/r32-conversation-countdown.test.cjs
          node --check language-skills-hub/tests/r32-conversation-countdown.browser.test.cjs
          node --test language-skills-hub/tests/r32-conversation-countdown.test.cjs
  mobile-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        timeout-minutes: 8
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Test sharing, QR, lock and countdown without deploying
        timeout-minutes: 10
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r32-http.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-r32-http.log 2>&1 &
          fi
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r32-conversation-countdown.browser.test.cjs
