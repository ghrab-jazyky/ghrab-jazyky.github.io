name: LSH R11 all29 + 642 offline review matrix (NO deployment)
on:
  pull_request:
    paths:
      - 'zkusebni/tools/r10-unified-review-bundle.cjs'
      - 'zkusebni/tools/r11-review-matrix.cjs'
      - 'zkusebni/tests/r11-*.test.cjs'
      - 'zkusebni/assets/lsh/r11/**'
      - 'zkusebni/docs/LSH_R11_REVIEW_MATRIX.md'
      - 'zkusebni/tests/r10-*.test.cjs'
      - 'zkusebni/docs/LSH_R10_UNIFIED_REVIEW_BUNDLE.md'
      - 'zkusebni/tools/conversation-r8-source-recovery.cjs'
      - 'zkusebni/tools/reading-r7-candidates.cjs'
      - 'zkusebni/tools/listening-r7-three-phase-candidates.cjs'
      - 'zkusebni/data/reference-pilots.json'
      - 'zkusebni/data/conversation-r8-*.json'
      - 'zkusebni/data/reading-r7-matching-proposals.json'
      - 'zkusebni/konverzace/**'
      - 'zkusebni/nahledy/**'
      - 'zkusebni/integrace/**'
      - 'zkusebni/assets/lsh/v2/lock.js'
      - 'zkusebni/assets/lsh/v3/**'
      - '.github/workflows/lsh-r10-unified-review.yml'
  push:
    branches: ['feat/lsh-*']
    paths:
      - 'zkusebni/tools/r10-unified-review-bundle.cjs'
      - 'zkusebni/tools/r11-review-matrix.cjs'
      - 'zkusebni/tests/r11-*.test.cjs'
      - 'zkusebni/assets/lsh/r11/**'
      - 'zkusebni/docs/LSH_R11_REVIEW_MATRIX.md'
      - 'zkusebni/tests/r10-*.test.cjs'
      - 'zkusebni/docs/LSH_R10_UNIFIED_REVIEW_BUNDLE.md'
      - 'zkusebni/tools/conversation-r8-source-recovery.cjs'
      - 'zkusebni/tools/reading-r7-candidates.cjs'
      - 'zkusebni/tools/listening-r7-three-phase-candidates.cjs'
      - 'zkusebni/data/reference-pilots.json'
      - 'zkusebni/data/conversation-r8-*.json'
      - 'zkusebni/data/reading-r7-matching-proposals.json'
      - 'zkusebni/konverzace/**'
      - 'zkusebni/nahledy/**'
      - 'zkusebni/integrace/**'
      - 'zkusebni/assets/lsh/v2/lock.js'
      - 'zkusebni/assets/lsh/v3/**'
      - '.github/workflows/lsh-r10-unified-review.yml'
permissions:
  contents: read
jobs:
  build-review-29:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and privacy invariants
        run: node --test zkusebni/tests/r10-review-bundle.test.cjs
      - name: Assemble isolated review bundle
        run: node zkusebni/tools/r10-unified-review-bundle.cjs "$RUNNER_TEMP/lsh-r10-review"
      - name: Verify all 642 review rows, protected card data and R7 URL adapters
        run: node --test zkusebni/tests/r11-review-matrix.test.cjs
      - name: Add the private offline review worksheet to the existing R10 folder
        run: node zkusebni/tools/r11-review-matrix.cjs "$RUNNER_TEMP/lsh-r10-review"
      - name: Attach offline index and 29 cards (NO TEACHER KEYS)
        uses: actions/upload-artifact@v4
        with:
          name: lsh-r11-642-variant-review-offline-NO-KEYS
          path: ${{ runner.temp }}/lsh-r10-review/
          retention-days: 7
          if-no-files-found: error
  browser-offline-29:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify all 29 HTML offline in Chromium and WebKit
        run: node --test zkusebni/tests/r10-review-bundle.browser.test.cjs
      - name: Verify review UX, JSON import/export and locked R7 candidate links
        run: node --test zkusebni/tests/r11-review-matrix.browser.test.cjs
