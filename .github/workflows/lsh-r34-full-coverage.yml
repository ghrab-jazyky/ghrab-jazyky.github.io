name: LSH R34 – complete draft Reading and Listening coverage (NO PUBLICATION)
on:
  push:
    branches: [feat/lsh-r34-full-content-candidate-coverage-2026-11-10]
  pull_request:
    branches: [feat/lsh-r33-independent-reading-b1-pilot-2026-11-10]
  workflow_dispatch:
concurrency:
  group: r34-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  full-coverage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JS syntax and all 138 variants
        run: |
          node --check language-skills-hub/self-check/test-banks/candidate-core.js
          node --check language-skills-hub/tests/r34-full-coverage-contract.test.cjs
          node --check language-skills-hub/self-check/test-banks/qa.js
          node --check language-skills-hub/self-check/test-banks/reading/preview.js
          node --check language-skills-hub/self-check/test-banks/listening/preview.js
          node --check language-skills-hub/tests/r34-candidate-preview.browser.test.cjs
          node --test language-skills-hub/tests/r34-full-coverage-contract.test.cjs
      - name: Keep R32, R33 and R31 regression contracts
        run: |
          node --test language-skills-hub/tests/r32-independent-reading-pilot.test.cjs language-skills-hub/tests/r33-independent-reading-b1.test.cjs
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs

  r34-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Browser QA matrix, original reference integrity and unchanged practice
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r34-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r32-independent-reading.browser.test.cjs
          node --test language-skills-hub/tests/r33-independent-reading-b1.browser.test.cjs
          node --test language-skills-hub/tests/r34-candidate-preview.browser.test.cjs
