name: LSH City Quest F1 eight-station QA
on:
  push:
    branches:
      - feature/lsh-city-quest-f1
    paths:
      - "language-skills-hub/authoring/city-quest-f1/**"
      - "language-skills-hub/konverzace/city-quest-f1/**"
      - "language-skills-hub/tests/city-quest-f1*"
      - ".github/workflows/lsh-city-quest-f1.yml"
  pull_request:
    paths:
      - "language-skills-hub/authoring/city-quest-f1/**"
      - "language-skills-hub/konverzace/city-quest-f1/**"
      - "language-skills-hub/tests/city-quest-f1*"
      - ".github/workflows/lsh-city-quest-f1.yml"
permissions:
  contents: read
concurrency:
  group: city-quest-f1
  cancel-in-progress: true
jobs:
  f1-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript syntax checks for F1 and its F0 dependencies
        run: |
          node --check language-skills-hub/authoring/city-quest-f1/engine.js
          node --check language-skills-hub/konverzace/city-quest-f1/f1.js
          node --check language-skills-hub/authoring/city-quest-f1/build-preview.cjs
          node --check language-skills-hub/authoring/city-quest-f0/engine.js
          node --check language-skills-hub/konverzace/city-quest-f0/app.js
      - name: Run all City Quest pure engine regression tests
        run: |
          node --test language-skills-hub/tests/city-quest-f0.test.cjs
          node --test language-skills-hub/tests/city-quest-f1.test.cjs
      - name: Verify static shell and no API requests
        run: |
          node -e "const fs=require('fs'),p='language-skills-hub/konverzace/city-quest-f1/';const h=fs.readFileSync(p+'index.html','utf8');for(const v of ['f1.js','f1.css','city-quest-f1/engine.js','city-quest-f0/app.js'])if(!h.includes(v))throw Error('Missing '+v);"
          grep -Fq "connect-src 'none'" language-skills-hub/konverzace/city-quest-f1/index.html
  f1-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install matching Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
        timeout-minutes: 8
      - name: Build all-in-one offline HTML review file
        run: node language-skills-hub/authoring/city-quest-f1/build-preview.cjs --write
      - name: Real Chromium/WebKit browser regression including offline file
        timeout-minutes: 14
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-city-quest-f1-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/konverzace/city-quest-f1/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/city-quest-f1.browser.test.cjs
      - name: Save F1 desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-quest-f1-screenshots
          path: city-quest-f1-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish standalone F1 HTML preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-quest-f1-standalone-preview
          path: .review-city-quest-f1/CITY_QUEST_F1_OFFLINE_PREVIEW.html
          if-no-files-found: warn
          retention-days: 14
