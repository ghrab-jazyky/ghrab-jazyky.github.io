name: LSH E10 one-shot stale PR run cleanup
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/lsh-e10-one-shot-queue-cleanup.yml'
permissions:
  actions: write
  contents: read
  pull-requests: read
concurrency:
  group: lsh-e10-stale-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cleanup:
    if: github.event.pull_request.number == 108 && github.event.pull_request.head.ref == 'feat/ll-how-to-choose-your-news-e3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Cancel only unfinished runs on older commits of PR 108
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = 108;
            const branch = 'feat/ll-how-to-choose-your-news-e3';
            const maxRuns = 2500;
            const checkHead = async () => {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (pr.state !== 'open' || pr.head.ref !== branch ||
                  pr.head.repo?.full_name !== `${owner}/${repo}` ||
                  pr.head.sha !== context.payload.pull_request.head.sha) {
                throw new Error('Safety stop: PR head, source repository, or state changed.');
              }
              return pr.head.sha;
            };
            const currentHead = await checkHead();
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, branch, per_page: 100 }
            );
            if (runs.length >= maxRuns) throw new Error('Safety stop: unusually many runs.');
            if (!runs.some(r => r.head_sha === currentHead)) {
              throw new Error('Safety stop: no run for exact current PR head.');
            }
            const unfinished = new Set(['queued','pending','waiting','in_progress','requested']);
            const stale = runs.filter(r =>
              r.event === 'pull_request' &&
              r.head_branch === branch &&
              r.head_sha !== currentHead &&
              unfinished.has(r.status));
            core.info(`Current head ${currentHead}; inspected ${runs.length} runs; stale unfinished ${stale.length}`);
            let accepted = 0, completed = 0;
            const errors = [];
            for (const [index, run] of stale.entries()) {
              if (index % 40 === 0) await checkHead();
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: run.id
                });
                accepted++;
              } catch (err) {
                if (err.status === 409 || err.status === 404) completed++;
                else errors.push({ id: run.id, status: err.status, message: err.message });
              }
              await new Promise(resolve => setTimeout(resolve, 250));
            }
            core.summary.addHeading('LSH E10 old-run cleanup', 2)
              .addTable([
                [{data:'Scope',header:true},{data:'Result',header:true}],
                ['Protected exact SHA',currentHead],
                ['Inspected branch runs',String(runs.length)],
                ['Outdated unfinished candidates',String(stale.length)],
                ['Cancellation requests accepted',String(accepted)],
                ['Already completed or unavailable',String(completed)],
                ['Errors',String(errors.length)]
              ]);
            await core.summary.write();
            if (errors.length) {
              core.error(JSON.stringify(errors.slice(0,15)));
              core.setFailed('Some obsolete runs could not be canceled.');
            }
