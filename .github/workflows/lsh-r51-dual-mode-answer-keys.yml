name: LSH R51 practice and test teacher keys (source parity)
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r51-dual-mode-answer-keys.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r51-dual-mode-answer-keys.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r51:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and original test-bank parity (120 Reading and 18 Listening variants)
        run: |
          node --check language-skills-hub/self-check/practice-answers/teacher-key.js
          node --check language-skills-hub/tests/r51-dual-mode-answer-keys.test.cjs
          node --check language-skills-hub/tests/r51-dual-mode-answer-keys.browser.test.cjs
          node --test language-skills-hub/tests/r36-practice-answer-keys.test.cjs language-skills-hub/tests/r51-dual-mode-answer-keys.test.cjs
      - name: Prepare Chromium and WebKit
        timeout-minutes: 8
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Browsers - actual modes, PDF, CEFR, mobile, invalid links, historical R50
        timeout-minutes: 12
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r51-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r50-fixed-topic-results.browser.test.cjs language-skills-hub/tests/r51-dual-mode-answer-keys.browser.test.cjs
