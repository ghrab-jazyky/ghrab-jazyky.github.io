name: LSH Conversation Lab audit 2026-11-11 QA
on:
  push:
    branches: [fix/lsh-conversation-audit-2026-11-11, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit contracts
        run: node --test language-skills-hub/tests/conversation-audit-2026-11-11.test.cjs
  audit-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium/WebKit
        timeout-minutes: 8
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: AI card Explain button, default level and German timer label
        timeout-minutes: 10
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-conv-audit-server.log 2>&1 &
          else
            npx --yes http-server@14.1.1 . -p 8765 -a 127.0.0.1 -s -c-1 >/tmp/lsh-conv-audit-server.log 2>&1 &
          fi
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/conversation-audit-2026-11-11.browser.test.cjs
          node --test language-skills-hub/tests/lock-note-i18n-2026-11-11.browser.test.cjs
