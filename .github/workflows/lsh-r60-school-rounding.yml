name: LSH R60 school language percentage rounding (half-up)
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/self-check/results/**'
      - 'language-skills-hub/self-check/reading/**'
      - 'language-skills-hub/self-check/listening/**'
      - 'language-skills-hub/data/r25-grading-review.json'
      - 'language-skills-hub/tests/r25-result-contract.test.cjs'
      - 'language-skills-hub/tests/r28-grade-proposal.test.cjs'
      - 'language-skills-hub/tests/r31-review-export.test.cjs'
      - 'language-skills-hub/tests/r60-*'
      - '.github/workflows/lsh-r60-school-rounding.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/self-check/results/**'
      - 'language-skills-hub/self-check/reading/**'
      - 'language-skills-hub/self-check/listening/**'
      - 'language-skills-hub/data/r25-grading-review.json'
      - 'language-skills-hub/tests/r60-*'
      - '.github/workflows/lsh-r60-school-rounding.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and 125750 boundary/reference calculations, Reading/Listening and exports
        run: |
          node --check language-skills-hub/self-check/results/grade-core.js
          node --check language-skills-hub/self-check/results/export-core.js
          node --check language-skills-hub/self-check/results/pdf-report.js
          node --check language-skills-hub/self-check/reading/reading.js
          node --check language-skills-hub/self-check/listening/listening-student.js
          node --check language-skills-hub/tests/r60-school-rounding.browser.test.cjs
          node --test language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r31-review-export.test.cjs language-skills-hub/tests/r33-auto-listening-and-export.test.cjs language-skills-hub/tests/r34-full-pdf-export.test.cjs
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Test four Reading languages and Listening in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r60-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/self-check/reading/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r60-school-rounding.browser.test.cjs
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Wait for production grade formula after GitHub Pages publication
        run: |
          READY=0
          for i in $(seq 1 42); do
            if node -e 'fetch("https://ghrab-jazyky.github.io/language-skills-hub/self-check/results/grade-core.js?r60="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(s=>process.exit(s.includes("ROUND_HALF_UP_WHOLE_PERCENT_BEFORE_BANDS")?0:1)).catch(()=>process.exit(1))'; then READY=1; break; fi
            sleep 10
          done
          test "$READY" -eq 1
      - name: Verify live student Reading and Listening results
        env:
          LSH_R60_LIVE: '1'
          LSH_R60_BASE: https://ghrab-jazyky.github.io/language-skills-hub/
        run: node --test language-skills-hub/tests/r60-school-rounding.browser.test.cjs
