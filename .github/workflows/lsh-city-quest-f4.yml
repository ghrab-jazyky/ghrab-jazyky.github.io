name: LSH City Quest F4 Independent Preproduction Audit
on:
  push:
    branches:
      - feature/lsh-city-quest-f4-independent-preproduction-audit
    paths:
      - "language-skills-hub/authoring/city-quest-f2-1b/**"
      - "language-skills-hub/authoring/city-quest-f2-1c/**"
      - "language-skills-hub/authoring/city-quest-f2-1d/**"
      - "language-skills-hub/authoring/city-quest-f2-1e/**"
      - "language-skills-hub/authoring/city-quest-f3b/**"
      - "language-skills-hub/konverzace/city-quest-f2/**"
      - "language-skills-hub/authoring/city-quest-f2/build-preview.cjs"
      - "language-skills-hub/authoring/city-quest-f2/stage-public.cjs"
      - "language-skills-hub/tests/city-quest-f5c.publication.test.cjs"
      - "language-skills-hub/tests/city-quest-f2-1b*"
      - "language-skills-hub/tests/city-quest-f2-1c*"
      - "language-skills-hub/tests/city-quest-f2-1d*"
      - "language-skills-hub/tests/city-quest-f2-1e*"
      - "language-skills-hub/tests/city-quest-f3a*"
      - "language-skills-hub/tests/city-quest-f3b*"
      - "language-skills-hub/tests/city-quest-f3c*"
      - "language-skills-hub/tests/city-quest-f3d*"
      - "language-skills-hub/tests/city-quest-f4*"
      - "language-skills-hub/authoring/city-quest-f4/**"
      - "language-skills-hub/authoring/city-quest-f3d/**"
      - ".github/workflows/lsh-city-quest-f4.yml"
  pull_request:
    paths:
      - "language-skills-hub/authoring/city-quest-f2-1b/**"
      - "language-skills-hub/authoring/city-quest-f2-1c/**"
      - "language-skills-hub/authoring/city-quest-f2-1d/**"
      - "language-skills-hub/authoring/city-quest-f2-1e/**"
      - "language-skills-hub/authoring/city-quest-f3b/**"
      - "language-skills-hub/konverzace/city-quest-f2/**"
      - "language-skills-hub/authoring/city-quest-f2/build-preview.cjs"
      - "language-skills-hub/authoring/city-quest-f2/stage-public.cjs"
      - "language-skills-hub/tests/city-quest-f5c.publication.test.cjs"
      - "language-skills-hub/tests/city-quest-f2-1b*"
      - "language-skills-hub/tests/city-quest-f2-1c*"
      - "language-skills-hub/tests/city-quest-f2-1d*"
      - "language-skills-hub/tests/city-quest-f2-1e*"
      - "language-skills-hub/tests/city-quest-f3a*"
      - "language-skills-hub/tests/city-quest-f3b*"
      - "language-skills-hub/tests/city-quest-f3c*"
      - "language-skills-hub/tests/city-quest-f3d*"
      - "language-skills-hub/tests/city-quest-f4*"
      - "language-skills-hub/authoring/city-quest-f4/**"
      - "language-skills-hub/authoring/city-quest-f3d/**"
      - ".github/workflows/lsh-city-quest-f4.yml"
permissions:
  contents: read
concurrency:
  group: city-quest-f4-${{ github.sha }}
  cancel-in-progress: true
jobs:
  f4-static-independent-and-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and graph validation
        run: |
          node --check language-skills-hub/authoring/city-quest-f2-1b/metro-network.js
          node --check language-skills-hub/authoring/city-quest-f2-1c/metro-game.js
          node --check language-skills-hub/authoring/city-quest-f2-1d/metro-language.js
          node --check language-skills-hub/authoring/city-quest-f3b/metro-public-address.js
          node --check language-skills-hub/konverzace/city-quest-f2/f2.js
          node --check language-skills-hub/konverzace/city-quest-f2/metro-preview.js
          node --check language-skills-hub/konverzace/city-quest-f2/f3-premium.js
          node --check language-skills-hub/konverzace/city-quest-f2/metro-preview.js
          node --check language-skills-hub/authoring/city-quest-f2/build-preview.cjs
          node --check language-skills-hub/tests/city-quest-f2-1b.metro.test.cjs
          node --check language-skills-hub/tests/city-quest-f2-1b.metro.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f2-1c.metro-game.test.cjs
          node --check language-skills-hub/tests/city-quest-f2-1c.metro.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f2-1d.metro-language.test.cjs
          node --check language-skills-hub/tests/city-quest-f2-1d.metro.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f2-1e.integration.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f2-1e.pedagogy.test.cjs
          node --check language-skills-hub/tests/city-quest-f3a.premium.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f3b.public-address.test.cjs
          node --check language-skills-hub/tests/city-quest-f3b.scenes.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f3c.mobile.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f3d.pedagogy.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f3d.acceptance-matrix.test.cjs
          node --check language-skills-hub/tests/city-quest-f4.independent.static.test.cjs
          node --check language-skills-hub/tests/city-quest-f4.independent.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f4r.remediation.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f4r.linguistic.test.cjs
          node --check language-skills-hub/tests/city-quest-f5c.mobile.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f5c.state.browser.test.cjs
          node --check language-skills-hub/tests/city-quest-f5c.language.test.cjs
          node --test language-skills-hub/tests/city-quest-f5c.language.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1b.metro.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1c.metro-game.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1d.metro-language.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1e.pedagogy.test.cjs
          node --test language-skills-hub/tests/city-quest-f3b.public-address.test.cjs
          node --test language-skills-hub/tests/city-quest-f3d.acceptance-matrix.test.cjs
      - name: Independent F4 distribution integrity and 256-case manual-review matrix
        run: |
          node language-skills-hub/authoring/city-quest-f2/build-preview.cjs --write
          node language-skills-hub/authoring/city-quest-f2/stage-public.cjs --write
          node --test language-skills-hub/tests/city-quest-f5c.publication.test.cjs
          node --test language-skills-hub/tests/city-quest-f4.independent.static.test.cjs
          node --test language-skills-hub/tests/city-quest-f4r.linguistic.test.cjs
      - name: "Regression: route, 8 F1 stations and existing F2 CEFR content"
        run: |
          node --test language-skills-hub/tests/city-quest-f0.test.cjs
          node --test language-skills-hub/tests/city-quest-f1.test.cjs
          node --test language-skills-hub/tests/city-quest-f2.test.cjs
      - name: Verify offline architecture and mark preview ungraded
        run: |
          grep -Fq "connect-src 'none'" language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'f3-premium.css' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'f3-premium.js' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'f3b-scenes.css' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'metro-public-address.js' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'id="metroPublicAddress"' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'f3c-mobile.css' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'f3d-consistency.css' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'id="f3dLearningRail"' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'id="f3dSessionAdvice"' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'id="f3cMetroPicker"' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq 'id="f3cLocate"' language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq "F2.1B VISUAL PROTOTYPE" language-skills-hub/konverzace/city-quest-f2/index.html
          grep -Fq "EN/B1 route reference" language-skills-hub/konverzace/city-quest-f2/index.html
          node - <<'NODE'
          const fs=require('node:fs');
          const a=fs.readFileSync('language-skills-hub/konverzace/city-quest-f2/metro-preview.js','utf8');
          const b=fs.readFileSync('language-skills-hub/authoring/city-quest-f2-1b/metro-network.js','utf8');
          const c=fs.readFileSync('language-skills-hub/authoring/city-quest-f2-1c/metro-game.js','utf8');
          const d=fs.readFileSync('language-skills-hub/authoring/city-quest-f2-1d/metro-language.js','utf8');
          const e=fs.readFileSync('language-skills-hub/konverzace/city-quest-f2/f3-premium.js','utf8');
          const f=fs.readFileSync('language-skills-hub/authoring/city-quest-f3b/metro-public-address.js','utf8');
          const g=fs.readFileSync('language-skills-hub/konverzace/city-quest-f2/f2.js','utf8');
          for(const x of ['fetch(', 'XMLHttpRequest(', 'navigator.geolocation', 'getCurrentPosition(', 'watchPosition(', 'new WebSocket('])
            if(a.includes(x)||b.includes(x)||c.includes(x)||d.includes(x)||e.includes(x)||f.includes(x)||g.includes(x))throw Error('Forbidden remote or location dependency '+x);
          NODE
      - name: Upload isolated City Quest review-only publication candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: city-quest-f5c-isolated-publication-review
          path: .release-city-quest-f5c/public/city-quest/index.html
          if-no-files-found: error
          retention-days: 14
  f4-browser-independent-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install matching Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
        timeout-minutes: 8
      - name: Build single-file offline metro HTML preview
        run: node language-skills-hub/authoring/city-quest-f2/build-preview.cjs --write
      - name: "Browser acceptance: metro + existing city UX + offline"
        timeout-minutes: 45
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cq-f4-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/konverzace/city-quest-f2/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # F4 adversarial and independent checks are first, not F3D helpers.
          node --test language-skills-hub/tests/city-quest-f4r.remediation.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f4.independent.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f5c.mobile.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f5c.state.browser.test.cjs
          # F3D must pass full 192-variant + focus/lesson acceptance.
          node --test language-skills-hub/tests/city-quest-f3d.pedagogy.browser.test.cjs
          # Follow with F3C and the earlier fully certified browser matrix.
          node --test language-skills-hub/tests/city-quest-f3c.mobile.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f2.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1a.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1b.metro.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1c.metro.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1d.metro.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f2-1e.integration.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f3a.premium.browser.test.cjs
          node --test language-skills-hub/tests/city-quest-f3b.scenes.browser.test.cjs
      - name: Export interactive metro mission screenshots and phone reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-quest-f4-independent-screenshots
          path: |
            city-quest-f2-1d-artifacts/
            city-quest-f2-1e-artifacts/
            city-quest-f3a-artifacts/
            city-quest-f3b-artifacts/
            city-quest-f3c-artifacts/
            city-quest-f3d-artifacts/
            city-quest-f4-artifacts/
            city-quest-f4r-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Export portable F2 + interactive metro pilot HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-quest-f4-independent-onefile-offline-html
          path: .review-city-quest-f2/CITY_QUEST_F2_OFFLINE_PREVIEW.html
          if-no-files-found: warn
          retention-days: 14
