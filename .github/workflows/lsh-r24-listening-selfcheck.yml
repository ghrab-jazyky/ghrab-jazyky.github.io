name: LSH R24 Listening teacher/student self-check QA (NO deployment)
on:
  push:
    branches:
      - feat/lsh-r24-listening-selfcheck-pilot-2026-11-09
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r24-listening-selfcheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listening-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node syntax validation
        run: |
          node --check language-skills-hub/self-check/listening/listening-core.js
          node --check language-skills-hub/self-check/listening/listening-student.js
          node --check language-skills-hub/self-check/listening/listening-teacher.js
          node --check language-skills-hub/tests/r24-listening-selfcheck.test.cjs
          node --check language-skills-hub/tests/r24-listening-selfcheck.browser.test.cjs
      - name: R22 no-backend policy + R23 Reading + R24 Listening real-content tests
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs
  listening-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Teacher/student browser QA (two playbacks, three stages, no student media)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r24-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/self-check/listening/student.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r24-listening-selfcheck.browser.test.cjs
