name: LSH R52 diagnose production teacher key fetch
on:
  pull_request:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r52-teacher-live.yml'
  push:
    branches: [main]
    paths:
      - 'language-skills-hub/**'
      - '.github/workflows/lsh-r52-teacher-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-live:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and exact catalog snapshot parity
        run: |
          node --check language-skills-hub/self-check/practice-answers/teacher-key.js
          node --check language-skills-hub/tests/r52-resilient-teacher-key.browser.test.cjs
          node --test language-skills-hub/tests/r52-resilient-teacher-key.test.cjs
      - name: Browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium and WebKit - broken catalog, transient outage and retry
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r52-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r52-resilient-teacher-key.browser.test.cjs
      - name: Real production Pages - teacher key browser and CSP smoke
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          LSH_REQUIRE_R52: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node language-skills-hub/tests/r52-live-teacher-key.browser.test.cjs
