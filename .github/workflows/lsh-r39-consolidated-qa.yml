name: LSH R39 consolidated independent drafts QA (no deployment)
on:
  push:
    branches: [feat/lsh-r39-consolidated-authored-banks-2026-11-10]
  pull_request:
    branches: [feat/lsh-r33-independent-reading-b1-pilot-2026-11-10]
  workflow_dispatch:
concurrency:
  group: lsh-r39-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  structure-and-scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check language-skills-hub/tests/r39-consolidated-independent.test.cjs
          node --check language-skills-hub/self-check/test-banks/listening/test-bank-core.js
          node --check language-skills-hub/self-check/test-banks/listening/preview.js
          node --check language-skills-hub/self-check/test-banks/reading/test-bank-core.js
      - name: Check source integrity and all authored bank data
        run: |
          node --test language-skills-hub/tests/r35-content-coverage.test.cjs language-skills-hub/tests/r37-asteroids-coverage.test.cjs language-skills-hub/tests/r39-consolidated-independent.test.cjs
      - name: Validate baseline R31 compatibility
        run: |
          node --test language-skills-hub/tests/r22-static-policy.test.cjs language-skills-hub/tests/r23-reading-selfcheck.test.cjs language-skills-hub/tests/r24-listening-selfcheck.test.cjs language-skills-hub/tests/r25-result-contract.test.cjs language-skills-hub/tests/r27-public-release.test.cjs language-skills-hub/tests/r28-grade-proposal.test.cjs language-skills-hub/tests/r29-feedback.test.cjs language-skills-hub/tests/r30-attempt.test.cjs language-skills-hub/tests/r31-review-export.test.cjs
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Cross-check independent Reading and Listening draft previews
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lsh-r39-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/language-skills-hub/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --test language-skills-hub/tests/r35-multilingual-reading.browser.test.cjs language-skills-hub/tests/r37-asteroids.browser.test.cjs
          node --test language-skills-hub/tests/r35-independent-listening-b2.browser.test.cjs language-skills-hub/tests/r36-harrison-ford-six-level-listening.browser.test.cjs
