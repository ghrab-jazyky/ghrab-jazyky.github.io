ies play?","How should limited resources shape priorities?","How can people affected take part in evaluating progress?"],"explanations":["Governments, schools and local communities can all make a difference. What can each of them do?","If there is not enough money for everything, what should come first?","How could the people affected help to judge whether things are really getting better?"],"support":["Governments are responsible for …, while communities can …","With limited resources, the first priority should be …","People affected could evaluate progress by …"],"challenge":"Policy meeting: In two fictional countries, young people have very different access to schools and public information. Propose a response and say who might lose out and how you would reduce that cost.","stretch":"Present the issue from the view of a young person in one of the two countries."},{"title":"Make a difference","subtitle":"Turn an idea into a fair action.","main":"How can young people defend rights without speaking over those they wish to support?","mainExplain":"Young people may want to defend the rights of others. How can they do that without speaking for them instead of with them?","questions":["What does meaningful consultation involve?","How might a campaign oversimplify a complex issue?","What would responsible success look like after the publicity ends?"],"explanations":["Asking people for their opinion is not always real consultation. What makes it real?","How could a campaign make a complicated problem look too simple?","When the campaign is no longer in the news, what would show that it really succeeded?"],"support":["Consultation is meaningful when …","A campaign might oversimplify the issue by …","Responsible success would mean that, months later, …"],"challenge":"Policy meeting: Your student council has a small budget for one change to improve inclusion or participation. Propose a proportionate policy and consider an unintended consequence.","stretch":"Rewrite your campaign message so that the people affected would approve of it."}],"vocab":[["proportionality","not restricting more than necessary"],["formal equality","identical treatment under a rule"],["substantive equality","fair chances in real life"],["accountability","having to explain and justify decisions"],["institutional trust","confidence in an organisation"],["structural disadvantage","barriers built into social systems"],["universal rights","rights belonging to everyone"],["legitimate restriction","a justified limit on a freedom"],["consent","freely agreeing to something"],["unintended consequence","an effect nobody planned"],["public interest","what benefits the wider community"],["meaningful participation","having a real say in decisions"]],"toolkit":[["Frame the issue","The underlying problem seems to be …"],["Consider others","From the perspective of …"],["Assess","We could evaluate this by …"],["Concede","I accept the concern; however, …"]]},"C2":{"warm":"A school advertises ‘equal rights for all’, but some students cannot participate. What question would you ask first?","stations":[{"title":"Everyone deserves respect","subtitle":"Start with everyday fairness.","main":"Can a policy be formally neutral yet undermine equal dignity in practice?","mainExplain":"A rule can treat everyone the same and still damage the equal dignity of some people in practice. Can that really happen?","questions":["When can a rule that looks neutral hide a disadvantage built into the system?","How might a well-meant exception create a new injustice?","What principle would allow you to revise a flawed rule?"],"explanations":["Some rules look fair to everyone, yet some people start with a disadvantage the rule does not see. When does that happen?","An exception is meant to help, but it might be unfair to someone else. How could that happen?","If you discover that a rule is flawed, what principle would guide you in changing it?"],"support":["Behind the rule lies the assumption that …","The ks. Who should decide which ones?","What could a school do instead that you would find morally acceptable?"],"support":["In the short term …; in the long run, however, …","The risks a community accepts should be decided by …","An ethically defensible alternative would be …"],"challenge":"Ethics committee: After a safety incident, the school proposes monitoring every student’s messages. Decide which value you would give up last, and justify your choice.","stretch":"Decide at what point surveillance would have to end, and defend that point."},{"title":"Rights around the world","subtitle":"Universal rights, different realities.","main":"What does universality require when cultures, resources and political systems differ?","mainExplain":"If rights apply to everyone, what does that mean when countries have different cultures, money and political systems?","questions":["How do we distinguish legitimate local choices from violations of basic rights?","Can universal principles allow different methods of implementation?","How can help from other countries avoid treating people as if they could not decide for themselves?"],"explanations":["Some differences between countries are acceptable choices; others break basic rights. Where is the line?","Can countries follow the same principles but protect them in different ways?","When one country helps another, how can it avoid deciding everything for the people it wants to help?"],"support":["A local choice becomes a violation when …","The principle stays the same, but the method can …","Help avoids paternalism when …"],"challenge":"Ethics committee: In two fictional countries, young people have very different access to schools and public information. Decide which value you would give up last, and justify your choice.","stretch":"Find a case that tests where local choice ends and a violation begins."},{"title":"Make a difference","subtitle":"Turn an idea into a fair action.","main":"When does human-rights language inspire action, an  de que …","La excepción podría crear una nueva injusticia si …","Revisaría la norma según el principio de que …"],"challenge":"Comité ético: Un club ofrece más oportunidades a unos alumnos que a otros, aunque las normas parecen iguales. Cuestionad los supuestos de dos respuestas y formulad un principio defendible.","stretch":"Busca un contraejemplo que te obligue a revisar tu principio."},{"title":"Tu voz importa","subtitle":"Opiniones, desacuerdo y respeto.","main":"¿Quién debería decidir dónde termina la libertad de expresión y empieza el daño?","mainExplain":"Alguien tiene que decidir dónde termina la libertad de expresión y empieza el daño. ¿Quién debería ser?","questions":["¿Pueden unas normas vagas proteger a las personas sin que tengan miedo de participar en el debate?","¿Cómo ponderar intención, impacto y desigualdad de poder?","¿Qué haría creíble un recurso contra una restricción de expresión?"],"explanations":["Si las normas sobre lo que se puede decir no están claras, la gente puede tener miedo de hablar. ¿Pueden unas normas poco claras proteger aun así a las personas?","Al juzgar un comentario, ¿cuánto deberíamos fijarnos en lo que quería decir quien habla, en el efecto que tuvo y en quién tenía más poder?","Si se borra el comentario de un alumno, ¿qué haría que una reclamación contra esa decisión fuera justa y creíble?"],"support":["La decisión final debería corresponder a …, porque …","Las normas claras importan aquí porque, si no, …","Una reclamación solo sería creíble si …"],"challenge":"Comité ético: El consejo escolar quiere limitar los comentarios públicos después de un debate intenso. Defended un principio y ponedlo a prueba con el caso más difícil que se os ocurra.","stretch":"Aplica tu principio a un comentario ofensivo, pero no ilegal."},{"title":"Lo privado es privado","subtitle":"Fotos, mensajes y consentimiento.","main":"¿Es la privacidad solo una comodidad a la que podemos renunciar, o algo que necesitamos para usar nuestras otras libertades?","mainExplain":"¿Es la privacidad algo a lo que podemos renunciar cuando nos conviene, o la necesitamos para usar nuestras otras libertades?","questions":["¿Puede ser libre el consentimiento si negarse tiene un coste social?","¿Cómo altera la vigilancia la conducta sin necesidad de castigos?","¿Qué límites pondrías a una institución que invoca la seguridad?"],"explanations":["Si decir que no te hace impopular, ¿puede tu sí ser realmente libre?","¿Puede el hecho de sentirse vigilado cambiar cómo se comporta la gente, aunque nadie sea castigado? ¿Cómo?","Una institución dice que necesita más control por seguridad. ¿Qué límites pondrías?"],"support":["El consentimiento pierde su sentido cuando …","Incluso sin castigos, sentirse vigilado puede …","Limitaría el poder de la institución …"],"challenge":"Comité ético: Una cuenta anónima comparte capturas de un grupo de chat privado. Decidid a qué valor renunciaríais en último lugar y justificad vuestra elección.","stretch":"Pon a prueba tu principio con un caso en el que la privacidad podría poner en peligro a otra persona."},{"title":"Una oportunidad para aprender","subtitle":"Educación y distintas necesidades.","main":"¿Cumple el sistema educativo un derecho cuando el acceso es universal pero las oportunidades reales no lo son?","mainExplain":"Puede que todos puedan ir al colegio, pero no todos tienen allí las mismas oportunidades. ¿Cumple entonces el sistema de verdad el derecho a la educación?","questions":["¿Qué diferencia hay entre tener un derecho sobre el papel y poder participar de verdad?","¿Puede una ayuda específica dañar la dignidad que pretende proteger?","¿Qué indicadores mostrarían avances más allá de las notas?"],"explanations":["Tener un derecho es una cosa; poder usarlo de verdad es otra. ¿En qué se diferencian?","La ayuda a algunos alumnos podría hacer que se sientan diferentes o menos respetados. ¿Podría pasar? ¿Cuándo?","Si las notas de los exámenes no bastan, ¿qué más podría mostrar que un centro tiene éxito?"],"support":["Tener un derecho sobre el papel significa …, pero participar de verdad exige …","La ayuda específica podría dañar la dignidad si …","El éxito se vería en … y no solo en las notas de los exámenes."],"challenge":"Comité ético: Una clase en línea no es accesible para todos, pero la escuela la considera igualitaria. Cuestionad los supuestos de dos respuestas y formulad un principio defendible.","stretch":"Di un indicador que podría ser engañoso y sustitúyelo."},{"title":"Que nadie quede fuera","subtitle":"Incluir sin estereotipos.","main":"¿Puede una política de inclusión reforzar las etiquetas que intenta eliminar?","mainExplain":"Una medida contra la exclusión tiene que nombrar a los grupos. ¿Podría eso reforzar todavía más las etiquetas?","questions":["¿Cómo reconocer las desventajas sin reducir a las personas a ellas?","¿Cuándo perpetúa la exclusión un proceso supuestamente neutral?","¿Qué te haría abandonar una política popular pero ineficaz?"],"explanations":["¿Cómo puede un centro ver que alguien está en desventaja sin que eso sea lo único que los demás ven en esa persona?","¿Puede un procedimiento que trata a todos igual seguir dejando fuera a algunas personas? ¿Cuándo?","Una medida puede ser popular y no funcionar. ¿Qué te convencería de abandonarla?"],"support":["Reconocer la desventaja es necesario, pero …","Un procedimiento neutral puede seguir excluyendo a personas cuando …","Abandonaría la medida si los datos mostraran …"],"challenge":"Comité ético: Un alumno dice que las bromas repetidas sobre su origen le hacen sentirse rechazado. Defended un principio y ponedlo a prueba con el caso más difícil que se os ocurra.","stretch":"Defiende tu postura frente a alguien que dice que cualquier etiqueta hace daño."},{"title":"Seguridad y confianza","subtitle":"Proteger sin controlar demasiado.","main":"¿Se justifica una mayor vigilancia por seguridad si debilita la confianza que quiere proteger?","mainExplain":"Más vigilancia puede hacer un centro más seguro, pero también puede destruir la confianza. ¿Sigue estando justificada?","questions":["¿Puede un beneficio inmediato producir un daño institucional duradero?","¿Quién debe decidir qué riesgos acepta una comunidad?","¿Cómo sería una alternativa éticamente defendible?"],"explanations":["Algo puede ayudar rápidamente y causar daño más tarde. ¿Podría pasar eso con la vigilancia en un centro?","Toda comunidad tiene que convivir con algunos riesgos. ¿Quién debería decidir cuáles?","¿Qué podría hacer un centro en su lugar que te pareciera moralmente aceptable?"],"support":["A corto plazo …; a largo plazo, sin embargo, …","Los riesgos que acepta una comunidad debería decidirlos …","Una alternativa éticamente defendible sería …"],"challenge":"Comité ético: Tras un problema de seguridad, la escuela propone vigilar todos los mensajes de los estudiantes. Decidid a qué valor renunciaríais en último lugar y justificad vuestra elección.","stretch":"Decide en qué momento tendría que terminar la vigilancia y defiende ese momento."},{"title":"Derechos en todo el mundo","subtitle":"Derechos universales, realidades distintas.","main":"¿Qué exige la universalidad cuando difieren culturas, recursos y sistemas políticos?","mainExplain":"Si los derechos valen para todos, ¿qué significa eso cuando los países tienen culturas, recursos y sistemas políticos distintos?","questions":["¿Cómo separar decisiones locales legítimas de vulneraciones de derechos básicos?","¿Admiten los principios universales distintas formas de aplicación?","¿Cómo puede la ayuda de otros países evitar tratar a la gente como si no pudiera decidir por sí misma?"],"explanations":["Algunas diferencias entre países son decisiones aceptables; otras violan derechos básicos. ¿Dónde está el límite?","¿Pueden los países seguir los mismos principios, pero protegerlos de formas distintas?","Cuando un país ayuda a otro, ¿cómo puede evitar decidirlo todo por las personas a las que quiere ayudar?"],"support":["Una decisión local se convierte en una violación cuando …","El principio es el mismo, pero el método puede …","La ayuda evita el paternalismo cuando …"],"challenge":"Comité ético: En dos países ficticios, los jóvenes tienen distinto acceso a la escuela y a la información pública. Decidid a qué valor renunciaríais en último lugar y justificad vuestra elección.","stretch":"Busca un caso que ponga a prueba dónde termina una decisión local y empieza una violación."},{"title":"Cambiar las cosas","subtitle":"Convierte una idea en una acción justa.","main":"¿Cuándo moviliza el lenguaje de los derechos humanos y cuándo se convierte en puro simbolismo?","mainExplain":"Las palabras sobre derechos humanos pueden hacer que la gente actúe, pero también pueden convertirse en frases vacías. ¿Cuándo ocurre cada cosa?","questions":["¿Qué distingue el compromiso público de la responsabilidad verificable?","¿Puede una campaña ganar visibilidad y fallar a quienes afecta?","¿Qué pruebas te harían reconsiderar una causa importante para ti?"],"explanations":["Prometer algo en público es distinto de que después te lo comprueben. ¿Cuál es la diferencia?","¿Podría una campaña hacerse famosa y aun así no ayudar a las personas de las que trata? ¿Cómo?","Piensa en una causa que apoyas mucho. ¿Qué te haría volver a pensarla?"],"support":["Un compromiso público solo se puede exigir de verdad cuando …","Una campaña puede ser muy visible y aun así …","Me replantearía la causa si …"],"challenge":"Comité ético: El consejo de alumnos tiene un pequeño presupuesto para mejorar la inclusión o la participación. Cuestionad los supuestos de dos respuestas y formulad un principio defendible.","stretch":"Convierte tu principio en una frase que se pueda comprobar dentro de un año."}],"vocab":[["la imparcialidad","no favorecer a ninguna parte"],["la carga","un deber o una responsabilidad pesada"],["el efecto disuasorio","el miedo que impide a la gente decir lo que piensa"],["el desequilibrio de poder","una situación en la que una parte tiene mucho más poder"],["la reclamación","una petición para cambiar una decisión"],["el coste social","una reacción negativa de los demás"],["el derecho reconocido","algo a lo que tienes derecho"],["la ayuda específica","ayuda para un grupo concreto"],["el indicador","una señal que sirve para medir algo"],["perpetuar","hacer que algo continúe"],["el paternalismo","decidir por otros «por su propio bien»"],["el simbolismo vacío","gestos sin ningún efecto real"]],"toolkit":[["Examina una premisa","Esta afirmación parte del supuesto discutible de que …"],["Reformula","Otra manera de conceptualizarlo sería …"],["Busca una excepción","Consideremos el caso en que …"],["Sintetiza","Un principio defendible podría ser …"]]}},"uiSimple":{"eyebrow":"HABLA · PREGUNTA · RESPONDE · ESCUCHA","hero":"Todas las personas merecen respeto. Hablad de la escuela, los amigos, las fotos, el aprendizaje y la ayuda. Podéis inventar ejemplos. No tenéis que contar nada privado. No hace falta hacer las ocho estaciones. Elegid solo unas pocas.","privacy":"Podéis inventar historias. No tenéis que decir nada personal. Podéis saltar una pregunta. Escuchad con respeto.","step4":"¿Quieres más? Abre la siguiente tarea.","questions":"Más preguntas","supportTitle":"¿Necesitas ayuda?","supportDesc":"Palabras para empezar tus frases.","supportShow":"Ver ayuda","supportHide":"Ocultar ayuda","challengeTitle":"Más para hablar","challengeDesc":"Para después de la pregunta principal.","challengeShow":"Ver tarea","challengeHide":"Ocultar tarea","stretchTitle":"Una tarea más difícil","stretchDesc":"Si quieres hacer más.","stretchShow":"Ver tarea difícil","stretchHide":"Ocultar tarea difícil","progress":"Di por qué. Da un ejemplo. Haz una pregunta.","vocabLabel":"PALABRAS ÚTILES","vocabDesc":"Usa las palabras que te ayudan.","toolkitLabel":"FRASES ÚTILES","toolkitDesc":"Hablad juntos: preguntad y responded.","title":"Derechos humanos: respeto para todos","strap":"¿Qué es justo? ¿Cómo nos sentimos seguros y respetados?","step3":"Haz una pregunta a tu compañero o compañera."},"uiB1":{"stretchTitle":"Un paso más","stretchDesc":"Una tarea más difícil si ya habláis con seguridad.","vocabDesc":"Elige las palabras útiles; no hace falta usarlas todas.","progress":"Dad razones y ejemplos, y reaccionad a lo que dice la otra persona."}},"de":{"ui":{"title":"Menschenrechte","strap":"Deine Rechte. Die Rechte anderer. Entscheidungen im Alltag.","brand":"KONVERSATIONSLABOR","subbrand":"Ein Gespräch, keine Prüfung","eyebrow":"SPRECHEN · HINTERFRAGEN · BEGRÜNDEN · REAGIEREN","hero":"Beginnen Menschenrechte bei großen Gesetzen oder damit, wie wir einander behandeln? Sprecht über Fairness, Meinungsfreiheit, Privatsphäre, Bildung und Sicherheit anhand erfundener Schulsituationen. Hört einander zu, vergleicht Sichtweisen und sucht faire Lösungen. Ihr müsst nicht alle acht Stationen bearbeiten; wählt diejenigen aus, für die ihr Zeit habt.","privacy":"SICHERES GESPRÄCH: Alle Beispiele sind erfunden. Niemand muss persönliche Erfahrungen zu Diskriminierung, Mobbing, Familie, Religion, Politik oder Identität teilen. Fragen dürfen ausgelassen werden. Respektiert andere Meinungen und sprecht über Ideen statt über Mitschüler.","format":"Partnerarbeit","changeLevel":"GER-Niveau","changeLanguage":"Sprache","themeDay":"Hell","themeNight":"Dunkel","fullscreen":"Vollbild","exitFullscreen":"Vollbild beenden","resetLesson":"Zurücksetzen","levelGoal":"Sprechziel","step1":"Denk kurz nach.","step2":"Nenne einen Grund oder ein Beispiel.","step3":"Stelle deinem Gegenüber eine Rückfrage.","step4":"Öffne die Zusatzaufgabe, wenn du weiterreden möchtest.","warmTitle":"Einstieg","warmTime":"2–3 Min. · wenn du möchtest","warmHint":"Wenn du möchtest: eine kurze Aufgabe zum Start.","stations":"Gesprächsstationen","station":"Station","of":"von","main":"LEITFRAGE","questions":"Erkunde die Frage","supportTitle":"Brauchst du sprachliche Hilfe?","supportDesc":"Satzanfänge, wenn dir die Worte fehlen.","supportShow":"Hilfe anzeigen","supportHide":"Hilfe ausblenden","challengeTitle":"Vertieft das Gespräch","challengeDesc":"Wenn ihr die Leitfrage schon besprochen habt.","challengeShow":"Zusatzaufgabe zeigen","challengeHide":"Zusatzaufgabe ausblenden","stretchTitle":"Geh einen Schritt weiter","stretchDesc":"Eine anspruchsvollere Perspektive für Fortgeschrittene.","stretchShow":"Vertiefung zeigen","stretchHide":"Vertiefung ausblenden","previous":"Zurück","next":"Weiter","stay":"Letzte Station","progress":"Begründet eure Aussagen und reagiert aufeinander.","vocabLabel":"NÜTZLICHER WORTSCHATZ","vocabDesc":"Wähle Wörter, die dir helfen; du musst nicht alle einbauen.","toolkitLabel":"REDEMITTEL","toolkitDesc":"Führt ein echtes Gespräch, keine zwei Monologe.","tipLabel":"Tipp","timerLabel":"RESTZEIT","timerInit":"Zeit einstellen: auf die Uhr tippen","timerRunning":"Countdown läuft","timerPaused":"Pausiert · zum Ändern tippen","timerReady":"Bereit · zum Ändern tippen","timerDone":"Die Zeit ist um · „Neu“: noch einmal die gleiche Zeit","timerStart":"Start","timerPause":"Pause","timerReset":"Neu","timerEdit":"Countdown einstellen","timerMinutes":"Minuten","timerSeconds":"Sekunden","timerHelp":"Schreib die Minuten und die Sekunden.","timerError":"Zeit: 00:05 bis 99:59. Sekunden: 00 bis 59.","timerSet":"Übernehmen","timerCancel":"Abbrechen","timerSetToast":"Zeit eingestellt. Drücke Start.","timerFinishToast":"Die Zeit ist um!","timerDrag":"Countdown verschieben","timerExpand":"Countdown-Steuerung ausklappen","timerCollapse":"Countdown-Steuerung einklappen","lessonResetToast":"Aktivität zurückgesetzt","fullError":"Vollbild ist in diesem Browser nicht verfügbar.","formatHint":"PARTNERGESPRÄCH","goalA1":"Sprich mit einfachen Wörtern über Respekt, Freundlichkeit, Privatsphäre und Sicherheit.","goalA2":"Beschreibe faire und unfaire Situationen, begründe kurz und mache Vorschläge.","goalB1":"Diskutiere über alltägliche Rechte, Entscheidungen und Pflichten mit Beispielen.","goalB2":"Wäge Rechte in konkreten Schulkonflikten ab und verteidige faire Lösungen.","goalC1":"Beurteile Regeln, unerwartete Folgen und Beteiligung aus verschiedenen Perspektiven.","goalC2":"Hinterfrage Annahmen über Würde, Freiheit und Universalität und entwickle tragfähige Prinzipien.","tipA1":"Nenne deine Meinung, einen Grund und frage „Und du?“","tipA2":"Versuche „Ich denke …, weil …“ und frage nach einem Beispiel.","tipB1":"Nutze eine erfundene Situation und beschreibe zwei Sichtweisen.","tipB2":"Zeige, welche Rechte oder Interessen in Spannung stehen, und suche einen Kompromiss.","tipC1":"Überlege, wessen Perspektive fehlt, und suche eine weniger einschränkende Möglichkeit.","tipC2":"Prüfe deine eigene Ansicht mit einem starken Gegenbeispiel.","startLesson":"Gespräch beginnen →","offline":"Offline","controlsAria":"Steuerung der Unterrichtseinheit","stationNavAria":"Gesprächsstationen","questionHelpTip":"Wenn eine Frage unklar ist, öffne „Erklären“. Du siehst sie mit anderen Worten, ohne Antwort.","questionHelpOpen":"Erklären","questionHelpClose":"Schließen","questionHelpMeaning":"ANDERS GESAGT","scenarioLabel":"KONTEXT","mainExplainLabel":"Leitfrage erklären","explainAria":"Frage {n} erklären"},"levels":{"A1":{"warm":"Wähle ein Wort: fair, sicher, freundlich oder frei. Begründe deine Wahl.","stations":[{"title":"Alle verdienen Respekt","subtitle":"Fairness beginnt im Alltag.","main":"Was ist in einer Klasse fair?","questions":["Darf jeder mal sprechen?","Wie hilfst du jemandem, der allein ist?","Warum sollen wir anderen zuhören?"],"support":["Ja, alle … / Nein, manche Schüler …","Wir können helfen, indem wir … (die Person zum Spielen einladen / uns zu ihr setzen).","Zuhören ist gut, weil …"],"challenge":"Stellt euch vor: Ein Schüler kommt im Unterricht nie zu Wort. Findet gemeinsam eine freundliche Lösung.","stretch":"Erfinde eine faire Regel fürs Sprechen in der Klasse."},{"title":"Deine Stimme zählt","subtitle":"Meinungen, Widerspruch und Respekt.","main":"Dürfen Schüler sagen, was sie denken?","questions":["Wann sagst du deine Meinung?","Wie kannst du freundlich widersprechen?","Wie fühlst du dich, wenn dir jemand zuhört?"],"support":["Ich sage meine Meinung, wenn …","Ich kann sagen: „Ich sehe das anders.“","Wenn jemand mir zuhört, fühle ich mich … (froh / wichtig)."],"challenge":"Stellt euch vor: Ein Schüler schlägt eine neue Schulregel vor. Andere lachen. Was könnt ihr sagen, um zu helfen? Übt es zusammen.","stretch":"Widersprich deinem Partner auf freundliche Art."},{"title":"Privat bleibt privat","subtitle":"Fotos, Nachrichten und Einwilligung.","main":"Darfst du ein Foto von einem Freund ohne Erlaubnis teilen?","questions":["Fragst du, bevor du ein Foto machst?","Welche Informationen sind privat?","Wie kannst du höflich Nein sagen?"],"support":["Ja, ich frage: „Darf ich ein Foto machen?“","… ist privat (meine Adresse / mein Passwort).","Ich kann sagen: „Nein, danke. Bitte nicht.“"],"challenge":"Stellt euch vor: Jemand teilt ein Klassenfoto, ohne die Abgebildeten zu fragen. Findet eine faire Idee und sagt, warum.","stretch":"Frag deinen Partner höflich, ob du ein Foto von ihm machen darfst (nur zum Spiel)."},{"title":"Eine Chance zu lernen","subtitle":"Bildung und unterschiedliche Bedürfnisse.","main":"Warum ist Schule für jedes Kind wichtig?","questions":["Was lernst du gern?","Soll jedes Kind zur Schule gehen können?","Wie kannst du einem Freund beim Lernen helfen?"],"support":["Ich lerne gern … (Englisch / Mathe / Kunst).","Ja, jedes Kind sollte …, weil …","Ich kann helfen, indem ich … (erkläre / mit ihm lese)."],"challenge":"Stellt euch vor: Ein Schüler kann das Arbeitsblatt nicht benutzen. Findet gemeinsam eine freundliche Lösung.","stretch":"Nenne eine Sache, die dir beim Lernen hilft."},{"title":"Niemand bleibt außen vor","subtitle":"Zugehörigkeit ohne Klischees.","main":"Wie begrüßt du einen neuen Schüler?","questions":["Was kannst du zu ihm sagen?","Ist es nett, über einen anderen Akzent zu lachen?","Was kannst du tun, wenn jemand allein ist?"],"support":["Ich kann sagen: „Hallo! Möchtest du mitmachen?“","Nein, das ist nicht nett, weil …","Ich kann … (mich zu ihm setzen / ihn zum Spielen einladen)."],"challenge":"Stellt euch vor: Ein neuer Schüler darf wegen seines Akzents nicht ins Team. Was könnt ihr sagen, um zu helfen? Übt es zusammen.","stretch":"Sag „Willkommen“ in zwei Sprachen."},{"title":"Sicherheit und Vertrauen","subtitle":"Schutz ohne übermäßige Kontrolle.","main":"Was hilft Menschen, sich sicher zu fühlen?","questions":["Wo ist ein sicherer Ort in der Schule?","Wen können Schüler um Hilfe bitten?","Warum sollen wir einander helfen?"],"support":["Ein sicherer Ort ist … (die Bibliothek / mein Klassenzimmer).","Schüler können … fragen (eine Lehrerin / einen Freund).","Wir sollten einander helfen, weil …"],"challenge":"Stellt euch vor: Ein Schüler fühlt sich auf einem überfüllten Schulflur unsicher. Findet eine faire Idee und sagt, warum.","stretch":"Beschreibe eine sichere Ecke für deine Klasse."},{"title":"Rechte weltweit","subtitle":"Universelle Rechte, verschiedene Wirklichkeiten.","main":"Verdienen Kinder auf der ganzen Welt Respekt?","questions":["Soll jedes Kind lernen können?","Soll jedes Kind spielen dürfen?","Warum sollten wir zu Fremden freundlich sein?"],"support":["Ja, jedes Kind sollte … haben.","Ja, Spielen ist wichtig, weil …","Wir sollten zu Fremden freundlich sein, weil …"],"challenge":"Stellt euch vor: Zwei Kinder leben an verschiedenen Orten und haben unterschiedliche Lernchancen. Findet eine faire Idee und sagt, warum.","stretch":"Nenne zwei Dinge, die jedes Kind braucht."},{"title":"Etwas bewegen","subtitle":"Eine faire Idee praktisch umsetzen.","main":"Was kannst du diese Woche Gutes tun?","questions":["Kannst du jemand Neuem zuhören?","Kannst du einem Mitschüler helfen?","Wie wird eure Klasse freundlicher?"],"support":["Ja, ich kann in der Pause mit … sprechen.","Ich kann einem Mitschüler bei … helfen.","Unsere Klasse kann … (Hallo sagen / eine W nge":"Fallbeispiel: Ein anonymes Konto veröffentlicht Screenshots aus einem privaten Gruppenchat. Einigt euch auf eine Reaktion und nennt ein Risiko, das ihr in Kauf nehmen würdet.","stretch":"Erkläre deine Entscheidung einem Schüler, der sich in seiner Privatsphäre verletzt fühlt."},{"title":"Eine Chance zu lernen","subtitle":"Bildung und unterschiedliche Bedürfnisse.","main":"Was bedeutet das Recht auf Bildung über einen Schulplatz hinaus?","mainExplain":"Einen Platz in der Schule zu haben, ist das eine. Was gehört noch zu einem echten Recht auf Bildung?","questions":["Warum nehmen manche trotz Einschreibung weniger am Unterricht teil?","Wie lassen sich Hindernisse beseitigen, ohne Erwartungen zu senken?","Wie können Schüler an Entscheidungen beteiligt werden?"],"explanations":["Manche Schüler sind offiziell an der Schule, machen aber kaum mit. Warum könnte das so sein?","Wie kann eine Schule manchen Schülern das Lernen erleichtern, ohne weniger zu verlangen?","Entscheidungen über die Schule betreffen Schüler jeden Tag. Wie könnten sie dabei mitreden?"],"support":["Ein Schüler beteiligt sich vielleicht weniger, weil …","Hindernisse abzubauen bedeutet nicht …, sondern …","Schüler könnten Entscheidungen mitgestalten, indem …"],"challenge":"Fallbeispiel: Ein Onlinekurs ist für manche schwer zugänglich, gilt aber offiziell als gleiche Chance für alle. Verteidigt zwei Reaktionen und findet eine faire Regel.","stretch":"Verteidige deinen Plan gegen einen Schüler, der sagt, dieser senke das Niveau."},{"title":"Niemand bleibt außen vor","subtitle":"Zugehörigkeit ohne Klischees.","main":"Wann wird ein Witz zur Diskriminierung, und wer entscheidet darüber?","mainExplain":"Ein Witz kann jemanden wegen seiner Herkunft oder Identität verletzen. Wann passiert das, und wer sollte das entscheiden?","questions":["Wie wichtig ist die Absicht des Sprechers?","Wie sollte eine Schule reagieren, wenn sich jemand ausgeschlossen fühlt?","Wie bekämpft man Vorurteile, ohne andere bloßzustellen?"],"explanations":["Jemand sagt: „Das war doch nur Spaß.“ Wie wichtig ist, was die Person gemeint hat?","Ein Schüler sagt, er habe sich ausgeschlossen gefühlt. Was sollte die Schule als Nächstes tun?","Wie kannst du jemandem sagen, dass seine Ansicht unfair ist, ohne ihn vor anderen bloßzustellen?"],"support":["Die Absicht zählt, aber die Wirkung …","Die Schule sollte zuerst …","Man kann Vorurteile hinterfragen, ohne jemanden bloßzustellen, indem man …"],"challenge":"Fallbeispiel: Ein Jugendlicher sagt, dass ständige Witze über seine Herkunft ihn ausgrenzen. Wählt eine Reaktion und verteidigt sie gegen den stärksten Einwand.","stretch":"Antworte jemandem, der sagt: „Die Leute sind einfach zu empfindlich.“"},{"title":"Sicherheit und Vertrauen","subtitle":"Schutz ohne übermäßige Kontrolle.","main":"Wie kann eine Schule Sicherheit und Vertrauen miteinander vereinbaren?","mainExplain":"Eine Schule will ihre Schüler schützen, aber zu viel Kontrolle kann Vertrauen zerstören. Wie findet sie das richtige Gleichgewicht?","questions":["Wann könnten strenge Regeln das Sicherheitsgefühl schwächen?","Welche Rolle sollten Schüler bei Sicherheitsregeln spielen?","Wie lässt sich prüfen, ob eine Maßnahme wirkt?"],"explanations":["Können sehr strenge Regeln Schülern weniger Sicherheit geben? In welchen Situationen?","Sollten Schüler die Regeln mitbestimmen, die sie schützen sollen? Wie?","Wie könnte eine Schule herausfinden, ob ihre Sicherheitsregeln wirklich wirken?"],"support":["Strenge Regeln könnten Schülern weniger Sicherheit geben, wenn …","Schüler sollten bei … mitreden, weil …","Die Schule könnte ihren Ansatz prüfen, indem sie …"],"challenge":"Fallbeispiel: Nach einem Sicherheitsproblem will die Schule alle Nachrichten der Schüler überwachen. Einigt euch auf eine Reaktion und nennt ein Risiko, das ihr in Kauf nehmen würdet.","stretch":"Verteidige deinen Plan gegen jemanden, der mehr Kontrolle will."},{"title":"Rechte weltweit","subtitle":"Universelle Rechte, verschiedene Wirklichkeiten.","main":"Warum unterscheidet sich der Zugang zu Grundrechten zwischen Ländern, obwohl die Rechte universell sind?","mainExplain":"Rechte gelten für alle Menschen auf der Welt. Warum haben Menschen in verschiedenen Ländern trotzdem unterschiedlichen Zugang zu ihnen?","questions":["Was trennt ein Versprechen von der täglichen Wirklichkeit?","Welche Hürden erschweren Bildung oder Sicherheit?","Wie lassen sich Länder ohne Klischees vergleichen?"],"explanations":["Ein Land kann ein Recht versprechen, aber der Alltag kann anders aussehen. Wie können diese beiden Dinge auseinanderfallen?","Was könnte junge Menschen daran hindern, zur Schule zu gehen oder sich sicher zu fühlen?","Wie können wir zwei Länder vergleichen, ohne Unfaires über alle Menschen dort zu sagen?"],"support":["Ein Recht kann versprochen sein, aber in Wirklichkeit …","Der Zugang zu Bildung kann durch … begrenzt sein.","Um Stereotype zu vermeiden, sollten wir … vergleichen, nicht …"],"challenge":"Fallbeispiel: In zwei fiktiven Ländern haben Jugendliche sehr unterschiedlichen Zugang zu Bildung und Informationen. Einigt euch auf eine Reaktion und nennt ein Risiko, das ihr in Kauf nehmen würdet.","stretch":"Formuliere einen Vergleich so um, dass er kein Stereotyp enthält."},{"title":"Etwas bewegen","subtitle":"Eine faire Idee praktisch umsetzen.","main":"Kann eine kleine Schülerkampagne wirklich etwas verändern?","mainExplain":"Kann eine kleine Gruppe von Schülern mit einer eigenen Kampagne wirklich etwas Wichtiges verändern?","questions":["Was unterscheidet eine Aktion von einem Slogan in sozialen Medien?","Wie würdest du betroffene Menschen einbeziehen?","Woran würdest du den Erfolg messen?"],"explanations":["Viele Kampagnen sind nur ein Hashtag oder ein schöner Post. Was macht eine Aktion echter?","Wie könntest du sicherstellen, dass die Menschen, die vom Problem betroffen sind, an der Kampagne beteiligt sind?","Wie könntest du herausfinden, ob deine Aktion wirklich geholfen hat?"],"support":["Eine Aktion ist mehr als ein Slogan, wenn …","Wir könnten die Betroffenen einbeziehen, indem …","Wir würden den Erfolg an … messen."],"challenge":"Fallbeispiel: Die Schülervertretung hat nur ein kleines Budget für mehr Teilhabe und Zusammenhalt. Verteidigt zwei Reaktionen und findet eine faire Regel.","stretch":"Nenne den stärksten Einwand gegen deine Wahl und antworte darauf."}],"vocab":[["die Bevorzugung","manche Menschen unfair besser behandeln als andere"],["die Ausnahme","ein Fall, in dem eine Regel nicht gilt"],["der persönliche Angriff","Worte gegen eine Person, nicht gegen ihre Idee"],["die Transparenz","Entscheidungen offen und klar machen"],["eingreifend","zu stark in das Privatleben eindringend"],["die Untersuchung","eine genaue Prüfung dessen, was passiert ist"],["angemeldet","offiziell an einer Schule eingeschrieben"],["das Hindernis","etwas, das dir im Weg steht"],["das Vorurteil","eine unfaire Meinung ohne guten Grund"],["die Absicht","was jemand tun will"],["die Überwachung","Menschen genau beobachten"],["die Kampagne","geplante Aktionen für eine Veränderung"]],"toolkit":[["Abwägen","Obwohl …, muss man auch … berücksichtigen."],["Einschränken","Das hängt teilweise davon ab, ob …"],["Belege fordern","Welche Belege sprechen dafür?"],["Vermitteln","Ein möglicher Kompromiss wäre …"]]},"C1":{"warm":"Eine Schutzregel schließt ungewollt einige Schüler aus. Was sollte die Schule ändern?","stations":[{"title":"Alle verdienen Respekt","subtitle":"Fairness beginnt im Alltag.","main":"Wann kann die Anwendung identischer Regeln zu ungleichen Ergebnissen führen?","mainExplain":"Wenn alle genau dieselbe Regel befolgen, können die Ergebnisse trotzdem ungleich sein? Wann könnte das passieren?","questions":["Was unterscheidet Gleichbehandlung von Chancengleichheit?","Wie lassen sich Ausnahmen rechtfertigen, ohne Unmut zu erzeugen?","Welche unbeabsichtigten Folgen sollte eine Schule bedenken?"],"explanations":["Alle gleich zu behandeln und allen die gleichen Chancen zu geben, ist nicht immer dasselbe. Worin liegt der Unterschied?","Manchmal macht eine Schule für einen Schüler eine Ausnahme. Wie könnte sie das begründen, damit die anderen es nicht unfair finden?","Eine neue Regel kann Folgen haben, die niemand geplant hat. An welche sollte eine Schule vorher denken?"],"support":["Gleichbehandlung bedeutet …, Chancengleichheit dagegen …","Eine Ausnahme wird leichter akzeptiert, wenn …","Eine Folge, mit der die Schule rechnen sollte, ist …"],"challenge":"Schulkonferenz: Ein Schulclub bietet manchen mehr Chancen als anderen, obwohl die Regeln gleich aussehen. Entwerft eine verhältnismäßige Regel und prüft eine unbeabsichtigte Folge.","stretch":"Ergänze die Sicht eines Schülers, die dein erster Plan übersehen hat."},{"title":"Deine Stimme zählt","subtitle":"Meinungen, Widerspruch und Respekt.","main":"Wie sollten Schulen schädliche Äußerungen von legitimen, aber unpopulären Meinungen unterscheiden?","mainExplain":"Manche Äußerungen verletzen Menschen, manche Meinungen sind nur unbeliebt. Wie sollte eine Schule das unterscheiden?","questions":["Welche Schutzmechanismen verhindern willkürliche Zensur?","Welche Verantwortung geht mit der Meinungsfreiheit einher?","Wie würdest du einen Grenzfall in einer Debatte lösen?"],"explanations":["Wie könnte eine Schule sicherstellen, dass Kommentare nicht einfach gelöscht werden, weil sie den Verantwortlichen nicht gefallen?","Wenn du das Recht hast zu sagen, was du denkst, welche Pflichten gehören dazu?","Stell dir einen Kommentar in einer Schuldebatte vor, der weder eindeutig in Ordnung noch eindeutig schädlich ist. Wie würdest du damit umgehen?"],"support":["Um willkürliche Entscheidungen zu verhindern, könnte die Schule …","Mit dem Recht auf freie Meinungsäußerung kommt die Verantwortung, …","In einem Grenzfall würde ich zuerst …"],"challenge":"Schulkonferenz: Die Schülervertretung möchte nach einer hitzigen Debatte öffentliche Kommentare einschränken. Schlagt eine Reaktion vor und sagt, woran ihr nach einem Halbjahr erkennen würdet, ob sie funktioniert hat.","stretch":"Formuliere einen Satz für ein faires Einspruchsverfahren gegen einen gelöschten Kommentar."},{"title":"Privat bleibt privat","subtitle":"Fotos, Nachrichten und Einwilligung.","main":"Welche Schutzvorkehrungen braucht es, bevor eine Institution Jugendliche online überwacht?","mainExplain":"Bevor eine Schule oder eine andere Institution beobachtet, was junge Menschen online tun, welche Schutzregeln sollte es geben?","questions":["Wie könnte eine Schule entscheiden, ob es wirklich nötig ist, die Nachrichten von Schülern zu kontrollieren?","Wer darf auf gesammelte Daten zugreifen?","Wie könnte Überwachung offene Diskussionen einschränken?"],"explanations":["Die Nachrichten von Schülern zu kontrollieren, ist ein großer Schritt. Wie könnte eine Schule entscheiden, ob er wirklich nötig ist?","Wenn Informationen über Schüler gesammelt werden, wer sollte sie sehen dürfen?","Wenn Schüler wissen, dass ihre Nachrichten kontrolliert werden können, würden sie dann vielleicht nicht mehr offen sprechen? Warum?"],"support":["Nachrichten zu kontrollieren wäre nur nötig, wenn …","Der Zugang zu den Informationen sollte auf … beschränkt sein.","Wenn Schüler wüssten, dass sie beobachtet werden, würden sie vielleicht …"],"challenge":"Schulkonferenz: Ein anonymes Konto veröffentlicht Screenshots aus einem privaten Gruppenchat. Schlagt eine Reaktion vor und sagt, wer verlieren könnte und wie ihr diesen Nachteil verringern würdet.","stretch":"Erkläre deine Regel einem Schüler, der nichts zu verbergen hat, aber trotzdem dagegen ist."},{"title":"Eine Chance zu lernen","subtitle":"Bildung und unterschiedliche Bedürfnisse.","main":"Reicht gleicher Zugang zu Bildung aus, wenn Schüler sehr unterschiedliche Hindernisse erleben?","mainExplain":"Wenn alle Schüler zur Schule gehen können, aber sehr unterschiedliche Probleme haben, reicht das, um Bildung gerecht zu nennen?","questions":["Welche Hindernisse bleiben unsichtbar, wenn man nur zählt, wer zur Schule kommt?","Wie kann Mitbestimmung die Bildungspolitik verbessern?","Wann wird Unterstützung zur Senkung von Erwartungen?"],"explanations":["Manche Probleme sieht man nicht, wenn man nur zählt, wer anwesend ist. Welche könnten das sein?","Wie könnte es Entscheidungen über Bildung verbessern, Schülern zuzuhören?","Schüler zu unterstützen, ist gut, sollte aber nicht heißen, weniger von ihnen zu erwarten. Wo liegt die Grenze?"],"support":["Anwesenheitszahlen können nicht zeigen, …","Die Sicht der Schüler könnte Entscheidungen verbessern, weil …","Unterstützung wird zu niedrigeren Erwartungen, wenn …"],"challenge":"Schulkonferenz: Ein Onlinekurs ist für manche schwer zugänglich, gilt aber offiziell als gleiche Chance für alle. Entwerft eine verhältnismäßige Regel und prüft eine unbeabsichtigte Folge.","stretch":"Erkläre deinen Plan einer Lehrkraft, die sich um die zusätzliche Arbeit sorgt."},{"title":"Niemand bleibt außen vor","subtitle":"Zugehörigkeit ohne Klischees.","main":"Wie sollten Institutionen mit schwer nachweisbarer, subtiler Ausgrenzung umgehen?","mainExplain":"Manche Schüler werden auf leise Weise ausgeschlossen, die schwer zu beweisen ist. Was sollte eine Schule dagegen tun?","questions":["Wie erkennt man Muster, ohne Schuld vorwegzunehmen?","Welche Rolle sollten Betroffene bei Lösungen spielen?","Welche gut gemeinten Regeln könnten das Gegenteil bewirken?"],"explanations":["Wie kann eine Schule bemerken, dass sich etwas wiederholt, ohne jemanden zu früh zu beschuldigen?","Sollten die betroffenen Schüler helfen, eine Lösung zu finden? Wie?","Eine Regel, die helfen soll, kann die Lage manchmal verschlimmern. Welche Regeln könnten das tun?"],"support":["Ein Muster ließe sich erkennen, indem …, ohne …","Betroffene sollten …","Eine Regel könnte nach hinten losgehen, wenn …"],"challenge":"Schulkonferenz: Ein Jugendlicher sagt, dass ständige Witze über seine Herkunft ihn ausgrenzen. Schlagt eine Reaktion vor und sagt, woran ihr nach einem Halbjahr erkennen würdet, ob sie funktioniert hat.","stretch":"Verteidige deinen Plan gegen jemanden, der sagt, man könne nichts beweisen."},{"title":"Sicherheit und Vertrauen","subtitle":"Schutz ohne übermäßige Kontrolle.","main":"Wann ist eine schulische Schutzmaßnahme verhältnismäßig statt übergriffig?","mainExplain":"Wann geht eine Regel, die Schüler schützen soll, zu weit und wird zu kontrollierend?","questions":["Wie sollte man Gefahren gegen verlorene Freiheiten abwägen?","Welche weniger einschränkenden Mittel wären zuerst zu prüfen?","Wie könnte die Maßnahme regelmäßig überprüft werden?"],"explanations":["Mehr Sicherheit kann weniger Freiheit bedeuten. Wie sollten Verantwortliche das eine gegen das andere abwägen?","Welche milderen Möglichkeiten sollte eine Schule ausprobieren, bevor sie strenge Maßnahmen einführt?","Wie könnte eine Schule ihre Sicherheitsregeln regelmäßig überprüfen und bei Bedarf ändern?"],"support":["Beim Abwägen von Risiken und verlorenen Freiheiten sollten Verantwortliche fragen, …","Vor strengeren Maßnahmen könnte die Schule … ausprobieren.","Die Regel könnte von … alle … überprüft werden."],"challenge":"Schulkonferenz: Nach einem Sicherheitsproblem will die Schule alle Nachrichten der Schüler überwachen. Schlagt eine Reaktion vor und sagt, wer verlieren könnte und wie ihr diesen Nachteil verringern würdet.","stretch":"Sag, was dich dazu bringen würde, die Regel nach einem Jahr abzuschaffen."},{"title":"Rechte weltweit","subtitle":"Universelle Rechte, verschiedene Wirklichkeiten.","main":"Wer trägt Verantwortung, wenn ein Recht nur auf dem Papier besteht?","mainExplain":"Manchmal steht ein Recht im Gesetz, aber die Menschen können es nicht wirklich nutzen. Wer ist dann verantwortlich?","questions":["Welche Aufgaben haben Staat, Institutionen und Gemeinschaft?","Wie sollten begrenzte Mittel Prioritäten beeinflussen?","Wie können Betroffene Fortschritte mitbewerten?"],"explanations":["Regierungen, Schulen und Gemeinden vor Ort können alle etwas bewirken. Was kann jede Seite tun?","Wenn das Geld nicht für alles reicht, was sollte zuerst kommen?","Wie könnten die Betroffenen mitbeurteilen, ob es wirklich besser wird?"],"support":["Regierungen sind für … verantwortlich, während Gemeinschaften … können.","Bei begrenzten Mitteln sollte zuerst …","Betroffene könnten Fortschritte bewerten, indem …"],"challenge":"Schulkonferenz: In zwei fiktiven Ländern haben Jugendliche sehr unterschiedlichen Zugang zu Bildung und Informationen. Schlagt eine Reaktion vor und sagt, wer verlieren könnte und wie ihr diesen Nachteil verringern würdet.","stretch":"Stell das Problem aus der Sicht eines jungen Menschen in einem der beiden Länder dar."},{"title":"Etwas bewegen","subtitle":"Eine faire Idee praktisch umsetzen.","main":"Wie können Jugendliche Rechte verteidigen, ohne die Stimmen Betroffener zu übertönen?","mainExplain":"Junge Menschen wollen vielleicht die Rechte anderer verteidigen. Wie können sie das tun, ohne für sie statt mit ihnen zu sprechen?","questions":["Was gehört zu einer ernst gemeinten Beteiligung?","Wie könnte eine Kampagne ein Problem zu stark vereinfachen?","Woran zeigt sich echter Erfolg, wenn die öffentliche Aufmerksamkeit nachgelassen hat?"],"explanations":["Menschen nach ihrer Meinung zu fragen, ist nicht immer echte Beteiligung. Was macht sie echt?","Wie könnte eine Kampagne ein kompliziertes Problem zu einfach aussehen lassen?","Wenn die Kampagne nicht mehr in den Nachrichten ist, was würde zeigen, dass sie wirklich Erfolg hatte?"],"support":["Eine Beteiligung ist sinnvoll, wenn …","Eine Kampagne könnte das Problem zu sehr vereinfachen, indem …","Echter Erfolg hieße, dass Monate später …"],"challenge":"Schulkonferenz: Die Schülervertretung hat nur ein kleines Budget für mehr Teilhabe und Zusammenhalt. Entwerft eine verhältnismäßige Regel und prüft eine unbeabsichtigte Folge.","stretch":"Formuliere deine Kampagnenbotschaft so um, dass die Betroffenen ihr zustimmen würden."}],"vocab":[["die Verhältnismäßigkeit","so wenig Eingriff wie nötig"],["formale Gleichheit","gleiche Regeln für alle"],["wirksame Gleichheit","faire Chancen im Alltag"],["die Rechenschaftspflicht","Entscheidungen erklären müssen"],["institutionelles Vertrauen","Vertrauen in eine Einrichtung"],["struktureller Nachteil","Hürde innerhalb eines Systems"],["universelle Rechte","Rechte, die allen zustehen"],["legitime Einschränkung","begründete Grenze einer Freiheit"],["die Einwilligung","freiwilliges Einverständnis"],["unbeabsichtigte Folge","Wirkung, die nicht geplant war"],["das öffentliche Interesse","Nutzen für die Gesellschaft"],["wirksame Teilhabe","echte Beteiligung an Entscheidungen"]],"toolkit":[["Problem eingrenzen","Das Kernproblem scheint … zu sein."],["Perspektive wechseln","Aus Sicht von …"],["Bewerten","Man könnte die Wirkung daran messen, ob …"],["Zugestehen","Der Einwand ist berechtigt, allerdings …"]]},"C2":{"warm":"Eine Schule verspricht „gleiche Rechte für alle“, doch manche können nicht teilnehmen. Welche Frage stellst du zuerst?","stations":[{"title":"Alle verdienen Respekt","subtitle":"Fairness beginnt im Alltag.","main":"Kann eine formal neutrale Regel die gleiche Würde aller praktisch untergraben?","mainExplain":"Eine Regel kann alle gleich behandeln und trotzdem in der Praxis die gleiche Würde mancher Menschen verletzen. Kann das wirklich passieren?","questions":["Wann kann eine Regel, die neutral wirkt, einen Nachteil verbergen, der im System selbst liegt?","Wie könnte eine gut gemeinte Ausnahme neues Unrecht schaffen?","Nach welchem Grundsatz würdest du eine fehlerhafte Regel überarbeiten?"],"explanations":["Manche Regeln wirken für alle fair, doch manche Menschen starten mit einem Nachteil, den die Regel nicht sieht. Wann ist das so?","Eine Ausnahme soll helfen, könnte aber für jemand anderen unfair sein. Wie könnte das passieren?","Wenn du entdeckst, dass eine Regel fehlerhaft ist, nach welchem Grundsatz würdest du sie ändern?"],"support":["Hinter der Regel steht die Annahme, dass …","Die Ausnahme könnte neues Unrecht schaffen, wenn …","Ich würde die Regel nach dem Grundsatz überarbeiten, dass …"],"challenge":"Ethikrat: Ein Schulclub bietet manchen mehr Chancen als anderen, obwohl die Regeln gleich aussehen. Hinterfragt die Annahmen zweier Reaktionen und formuliert einen vertretbaren Grundsatz.","stretch":"Finde ein Gegenbeispiel, das dich zwingen würde, deinen Grundsatz zu überarbeiten."},{"title":"Deine Stimme zählt","subtitle":"Meinungen, Widerspruch und Respekt.","main":"Wer sollte entscheiden, wo freie Meinungsäußerung endet und Schaden beginnt?","mainExplain":"Jemand muss entscheiden, wo freie Rede aufhört und Schaden beginnt. Wer sollte das sein?","questions":["Können vage Regeln Menschen schützen, ohne ihnen Angst zu machen, sich an Debatten zu beteiligen?","Wie sind Absicht, Wirkung und Machtunterschiede abzuwägen?","Was würde eine Beschwerde gegen ein Redeverbot glaubwürdig machen?"],"explanations":["Wenn Regeln für Äußerungen unklar sind, haben Menschen vielleicht Angst, überhaupt etwas zu sagen. Können unklare Regeln trotzdem schützen?","Wie stark sollten wir bei einem Kommentar darauf achten, was gemeint war, was er bewirkt hat und wer mehr Macht hatte?","Wenn der Kommentar eines Schülers gelöscht wird, was würde einen Einspruch dagegen fair und glaubwürdig machen?"],"support":["Die letzte Entscheidung sollte bei … liegen, weil …","Klare Regeln sind hier wichtig, weil sonst …","Ein Einspruch wäre nur glaubwürdig, wenn …"],"challenge":"Ethikrat: Die Schülervertretung möchte nach einer hitzigen Debatte öffentliche Kommentare einschränken. Verteidigt einen Grundsatz und prüft ihn dann am schwierigsten Fall, der euch einfällt.","stretch":"Wende deinen Grundsatz auf einen Kommentar an, der beleidigend, aber nicht verboten ist."},{"title":"Privat bleibt privat","subtitle":"Fotos, Nachrichten und Einwilligung.","main":"Ist Privatsphäre nur eine Bequemlichkeit, auf die wir verzichten können, oder brauchen wir sie, um unsere anderen Freiheiten zu nutzen?","mainExplain":"Ist Privatsphäre etwas, worauf wir verzichten können, wenn es bequem ist, oder brauchen wir sie, um unsere anderen Freiheiten zu nutzen?","questions":["Wann ist Einwilligung frei, wenn Ablehnung soziale Kosten hat?","Wie verändert Überwachung Verhalten auch ohne Bestrafung?","Welche Grenzen setzt du einer Institution, die sich auf Sicherheit beruft?"],"explanations":["Wenn ein Nein dich unbeliebt macht, kann dein Ja dann wirklich frei sein?","Kann Beobachtung verändern, wie Menschen sich verhalten, auch wenn niemand bestraft wird? Wie?","Eine Institution sagt, sie brauche aus Sicherheitsgründen mehr Kontrolle. Welche Grenzen würdest du setzen?"],"support":["Zustimmung verliert ihre Bedeutung, wenn …","Auch ohne Strafen kann Beobachtung …","Ich würde die Macht der Institution begrenzen, indem …"],"challenge":"Ethikrat: Ein anonymes Konto veröffentlicht Screenshots aus einem privaten Gruppenchat. Entscheidet, auf welchen Wert ihr zuletzt verzichten würdet, und begründet eure Wahl.","stretch":"Prüfe deinen Grundsatz an einem Fall, in dem Privatsphäre jemand anderen gefährden könnte."},{"title":"Eine Chance zu lernen","subtitle":"Bildung und unterschiedliche Bedürfnisse.","main":"Erfüllt ein Bildungssystem ein Recht, wenn der Zugang universal, die reale Chance aber ungleich ist?","mainExplain":"Vielleicht dürfen alle zur Schule gehen, aber nicht alle haben dort die gleichen Chancen. Erfüllt das System dann wirklich das Recht auf Bildung?","questions":["Worin liegt der Unterschied zwischen einem Recht auf dem Papier und der Möglichkeit, wirklich teilzunehmen?","Kann gezielte Förderung die Würde untergraben, die sie schützen soll?","Welche Kriterien zeigen Erfolg jenseits von Prüfungsnoten?"],"explanations":["Ein Recht zu haben, ist das eine; es wirklich nutzen zu können, das andere. Worin liegt der Unterschied?","Unterstützung für manche Schüler könnte dazu führen, dass sie sich anders oder weniger respektiert fühlen. Könnte das passieren? Wann?","Wenn Prüfungsergebnisse nicht reichen, was könnte sonst zeigen, dass eine Schule erfolgreich ist?"],"support":["Ein Recht auf dem Papier bedeutet …, echte Teilhabe verlangt jedoch …","Gezielte Unterstützung könnte die Würde verletzen, wenn …","Erfolg zeigte sich in … und nicht nur in Prüfungsergebnissen."],"challenge":"Ethikrat: Ein Onlinekurs ist für manche schwer zugänglich, gilt aber offiziell als gleiche Chance für alle. Hinterfragt die Annahmen zweier Reaktionen und formuliert einen vertretbaren Grundsatz.","stretch":"Nenne einen Indikator, der irreführend sein könnte, und ersetze ihn."},{"title":"Niemand bleibt außen vor","subtitle":"Zugehörigkeit ohne Klischees.","main":"Kann Inklusionspolitik die Kategorien verfestigen, die sie überwinden will?","mainExplain":"Eine Regel gegen Ausgrenzung muss Gruppen benennen. Könnte das die Etiketten noch verstärken?","questions":["Wie erkennt man Nachteile an, ohne Menschen darauf zu reduzieren?","Wann setzt ein scheinbar neutrales Verfahren Ausgrenzung fort?","Welche Belege brächten dich dazu, eine beliebte, aber wirkungslose Regel abzulehnen?"],"explanations":["Wie kann eine Schule erkennen, dass jemand benachteiligt ist, ohne dass andere nur noch das in ihm sehen?","Kann ein Verfahren, das alle gleich behandelt, trotzdem manche ausschließen? Wann?","Eine Regel kann beliebt sein und trotzdem nicht wirken. Was würde dich überzeugen, sie aufzugeben?"],"support":["Benachteiligung zu erkennen ist nötig, aber …","Ein neutrales Verfahren kann trotzdem Menschen ausschließen, wenn …","Ich würde die Regel aufgeben, wenn die Daten zeigten, dass …"],"challenge":"Ethikrat: Ein Jugendlicher sagt, dass ständige Witze über seine Herkunft ihn ausgrenzen. Verteidigt einen Grundsatz und prüft ihn dann am schwierigsten Fall, der euch einfällt.","stretch":"Verteidige deine Sicht gegen jemanden, der sagt, jede Bezeichnung schade."},{"title":"Sicherheit und Vertrauen","subtitle":"Schutz ohne übermäßige Kontrolle.","main":"Lässt sich mehr Überwachung aus Sicherheitsgründen rechtfertigen, wenn sie Vertrauen zerstört?","mainExplain":"Mehr Überwachung kann eine Schule sicherer machen, aber auch Vertrauen zerstören. Ist sie dann noch gerechtfertigt?","questions":["Kann ein kurzfristiger Nutzen langfristigen institutionellen Schaden bewirken?","Wer entscheidet, welche Risiken eine Gemeinschaft tragen muss?","Wie sähe eine ethisch vertretbare Alternative aus?"],"explanations":["Etwas kann schnell helfen und später schaden. Könnte das bei Überwachung an einer Schule passieren?","Jede Gemeinschaft muss mit manchen Risiken leben. Wer sollte entscheiden, mit welchen?","Was könnte eine Schule stattdessen tun, das du moralisch vertretbar fändest?"],"support":["Kurzfristig …; langfristig jedoch …","Welche Risiken eine Gemeinschaft akzeptiert, sollte … entscheiden.","Eine ethisch vertretbare Alternative wäre …"],"challenge":"Ethikrat: Nach einem Sicherheitsproblem will die Schule alle Nachrichten der Schüler überwachen. Entscheidet, auf welchen Wert ihr zuletzt verzichten würdet, und begründet eure Wahl.","stretch":"Entscheide, ab wann die Überwachung enden müsste, und verteidige diesen Punkt."},{"title":"Rechte weltweit","subtitle":"Universelle Rechte, verschiedene Wirklichkeiten.","main":"Was verlangt Universalität, wenn Kulturen, Ressourcen und politische Systeme unterschiedlich sind?","mainExplain":"Wenn Rechte für alle gelten, was bedeutet das, wenn Länder unterschiedliche Kulturen, Mittel und politische Systeme haben?","questions":["Wie trennt man legitime lokale Entscheidungen von Grundrechtsverletzungen?","Können universale Prinzipien verschiedene Umsetzungen zulassen?","Wie kann Hilfe aus anderen Ländern vermeiden, Menschen so zu behandeln, als könnten sie nicht selbst entscheiden?"],"explanations":["Manche Unterschiede zwischen Ländern sind akzeptable Entscheidungen, andere verletzen Grundrechte. Wo liegt die Grenze?","Können Länder denselben Grundsätzen folgen, sie aber auf unterschiedliche Weise schützen?","Wenn ein Land einem anderen hilft, wie kann es vermeiden, alles für die Menschen zu entscheiden, denen es helfen will?"],"support":["Eine lokale Entscheidung wird zur Verletzung von Rechten, wenn …","Der Grundsatz bleibt gleich, aber die Methode kann …","Hilfe vermeidet Bevormundung, wenn …"],"challenge":"Ethikrat: In zwei fiktiven Ländern haben Jugendliche sehr unterschiedlichen Zugang zu Bildung und Informationen. Entscheidet, auf welchen Wert ihr zuletzt verzichten würdet, und begründet eure Wahl.","stretch":"Finde einen Fall, der prüft, wo eine lokale Entscheidung endet und eine Rechtsverletzung beginnt."},{"title":"Etwas bewegen","subtitle":"Eine faire Idee praktisch umsetzen.","main":"Wann fördert die Sprache der Menschenrechte Handeln, und wann bleibt sie bloß symbolisch?","mainExplain":"Worte über Menschenrechte können Menschen zum Handeln bewegen, aber auch zu leeren Phrasen werden. Wann passiert was?","questions":["Was trennt öffentliche Versprechen von überprüfbarer Verantwortung?","Kann eine Kampagne sichtbar werden und den Betroffenen dennoch nicht helfen?","Welche Erkenntnis ließe dich eine wichtige eigene Überzeugung überprüfen?"],"explanations":["Etwas öffentlich zu versprechen, ist etwas anderes, als später daran gemessen zu werden. Worin liegt der Unterschied?","Könnte eine Kampagne berühmt werden und trotzdem den Menschen, um die es geht, nicht helfen? Wie?","Denk an ein Anliegen, das du stark unterstützt. Was würde dich dazu bringen, noch einmal darüber nachzudenken?"],"support":["Ein öffentliches Versprechen wird erst überprüfbar, wenn …","Eine Kampagne kann sehr sichtbar sein und trotzdem …","Ich würde mein Anliegen überdenken, wenn …"],"challenge":"Ethikrat: Die Schülervertretung hat nur ein kleines Budget für mehr Teilhabe und Zusammenhalt. Hinterfragt die Annahmen zweier Reaktionen und formuliert einen vertretbaren Grundsatz.","stretch":"Mach aus deinem Grundsatz einen Satz, den man in einem Jahr überprüfen könnte."}],"vocab":[["die Unparteilichkeit","keine Seite bevorzugen"],["die Last","eine schwere Pflicht oder Verantwortung"],["die abschreckende Wirkung","Angst, die Menschen davon abhält, ihre Meinung zu sagen"],["das Machtgefälle","eine Lage, in der eine Seite viel mehr Macht hat"],["der Einspruch","eine Bitte, eine Entscheidung zu ändern"],["die sozialen Kosten","negative Reaktionen anderer Menschen"],["der Anspruch","etwas, worauf man ein Recht hat"],["die gezielte Unterstützung","Hilfe für eine bestimmte Gruppe"],["der Indikator","ein Zeichen, mit dem man etwas misst"],["fortschreiben","etwas weiterbestehen lassen"],["die Bevormundung","für andere „zu ihrem Besten“ entscheiden"],["die leere Symbolik","Gesten ohne echte Wirkung"]],"toolkit":[["Prämisse prüfen","Dem liegt die strittige Annahme zugrunde, dass …"],["Anders deuten","Eine andere begriffliche Einordnung wäre …"],["Gegenbeispiel","Man denke an den Fall, dass …"],["Abwägen","Ein vertretbarer Grundsatz wäre …"]]}},"uiSimple":{"eyebrow":"SPRECHEN · FRAGEN · ANTWORTEN · ZUHÖREN","hero":"Alle Menschen verdienen Respekt. Sprecht über Schule, Freunde, Fotos, Lernen und Hilfsbereitschaft. Erfindet Beispiele. Ihr müsst nichts Privates erzählen. Ihr müsst nicht alle acht Stationen machen. Wählt nur einige aus.","privacy":"Ihr dürft Geschichten erfinden. Niemand muss Privates erzählen. Eine Frage darf übersprungen werden. Hört freundlich zu.","step3":"Stelle deinem Partner oder deiner Partnerin eine Frage.","step4":"Mehr? Öffne die nächste Aufgabe.","main":"HAUPTFRAGE","questions":"Weitere Fragen","supportTitle":"Brauchst du Hilfe?","supportDesc":"Wörter für den Satzanfang.","supportShow":"Hilfe zeigen","supportHide":"Hilfe ausblenden","challengeTitle":"Noch mehr sprechen","challengeDesc":"Nach der Hauptfrage.","challengeShow":"Aufgabe zeigen","challengeHide":"Aufgabe ausblenden","stretchTitle":"Eine schwierigere Aufgabe","stretchDesc":"Möchtest du mehr sprechen?","stretchShow":"Schwierige Aufgabe zeigen","stretchHide":"Schwierige Aufgabe ausblenden","progress":"Sag, warum. Gib ein Beispiel. Stell eine Frage.","vocabLabel":"NÜTZLICHE WÖRTER","vocabDesc":"Benutze diese Wörter beim Sprechen.","toolkitLabel":"NÜTZLICHE SÄTZE","toolkitDesc":"Sprecht zusammen: Fragt und antwortet.","title":"Menschenrechte: fair zueinander","strap":"Was ist fair? Was macht Menschen sicher und respektiert?"},"uiB1":{"stretchTitle":"Geh einen Schritt weiter","stretchDesc":"Eine schwierigere Aufgabe, wenn ihr schon sicher sprecht.","vocabDesc":"Wähle passende Wörter; du musst nicht alle benutzen.","progress":"Nennt Gründe und Beispiele und reagiert aufeinander."}},"fr":{"ui":{"title":"Droits humains","strap":"Tes droits. Les droits des autres. Des choix concrets.","brand":"LABORATOIRE DE CONVERSATION","subbrand":"Une conversation, pas un examen","eyebrow":"PARLE · QUESTIONNE · JUSTIFIE · RÉAGIS","hero":"Les droits humains commencent-ils par de grandes lois ou par notre façon de traiter les autres ? Discutez d’équité, de liberté d’expression, de vie privée, d’éducation et de sécurité à travers des situations scolaires imaginaires. Écoutez, comparez et cherchez des solutions justes. Il n’est pas nécessaire de faire les huit stations ; choisissez celles qui correspondent au temps disponible.","privacy":"DISCUSSION SANS PRESSION : Tous les exemples sont fictifs. Personne n’est obligé de raconter des expériences personnelles de discrimination, harcèlement, famille, religion, politique ou identité. On peut passer une question. Respectez les désaccords et discutez des idées, pas des camarades.","format":"En binômes","changeLevel":"Niveau CECRL","changeLanguage":"Langue","themeDay":"Clair","themeNight":"Sombre","fullscreen":"Plein écran","exitFullscreen":"Quitter le plein écran","resetLesson":"Réinitialiser","levelGoal":"Objectif oral","step1":"Réfléchis un instant.","step2":"Donne une raison ou un exemple.","step3":"Pose une question à ton partenaire.","step4":"Ouvre le défi pour prolonger la discussion.","warmTitle":"Mise en route","warmTime":"2–3 min · si tu veux","warmHint":"Si tu veux : une courte activité pour commencer.","stations":"Étapes de discussion","station":"Étape","of":"sur","main":"QUESTION PRINCIPALE","questions":"Explore la question","supportTitle":"Besoin d’aide pour parler ?","supportDesc":"Des débuts de phrases si les mots te manquent.","supportShow":"Afficher l’aide","supportHide":"Masquer l’aide","challengeTitle":"Approfondis la discussion","challengeDesc":"À utiliser après avoir exploré la question principale.","challengeShow":"Afficher le défi","challengeHide":"Masquer le défi","stretchTitle":"Va plus loin","stretchDesc":"Un angle plus exigeant pour les élèves à l’aise à l’oral.","stretchShow":"Afficher le prolongement","stretchHide":"Masquer le prolongement","previous":"Précédent","next":"Suivant","stay":"Dernière étape","progress":"Donnez des raisons, des exemples et réagissez vraiment.","vocabLabel":"VOCABULAIRE UTILE","vocabDesc":"Choisis les mots utiles ; inutile de tous les employer.","toolkitLabel":"OUTILS POUR DISCUTER","toolkitDesc":"Discutez vraiment ensemble : pas deux monologues.","tipLabel":"Conseil","timerLabel":"MINUTEUR","timerInit":"Touche le minuteur pour régler la durée","timerRunning":"Compte à rebours en cours","timerPaused":"En pause · touche pour modifier","timerReady":"Prêt · touche pour modifier","timerDone":"C’est fini · « Réinit. » : la même durée encore une fois","timerStart":"Démarrer","timerPause":"Pause","timerReset":"Réinit.","timerEdit":"Régler le compte à rebours","timerMinutes":"Minutes","timerSeconds":"Secondes","timerHelp":"Écris les minutes et les secondes.","timerError":"Temps : de 00:05 à 99:59. Secondes : de 00 à 59.","timerSet":"Valider","timerCancel":"Annuler","timerSetToast":"Durée réglée. Appuie sur Démarrer.","timerFinishToast":"Temps écoulé !","timerDrag":"Déplacer le minuteur","timerExpand":"Afficher les commandes du minuteur","timerCollapse":"Masquer les commandes du minuteur","lessonResetToast":"Activité réinitialisée","fullError":"Le plein écran n’est pas disponible dans ce navigateur.","formatHint":"CONVERSATION EN BINÔMES","goalA1":"Parle simplement de respect, de gentillesse, de vie privée et de sécurité.","goalA2":"Décris des situations justes ou injustes, donne des raisons et propose des solutions.","goalB1":"Discute de droits, de choix et de responsabilités au quotidien, avec des exemples.","goalB2":"Confronte des droits dans des dilemmes scolaires et défends une solution équitable.","goalC1":"Évalue des règles, leurs effets imprévus et la participation de plusieurs groupes.","goalC2":"Interroge des présupposés sur la dignité, la liberté et l’universalité pour nuancer tes principes.","tipA1":"Donne ton avis, une raison, puis demande « Et toi ? ».","tipA2":"Essaie « Je pense que … parce que … » et demande un exemple.","tipB1":"Décris une situation fictive et imagine deux points de vue.","tipB2":"Explique quels droits ou intérêts s’opposent et cherche un compromis.","tipC1":"Demande quelle voix manque et cherche une solution moins restrictive.","tipC2":"Mets ton raisonnement à l’épreuve avec un contre-exemple solide.","startLesson":"Commencer la discussion →","offline":"Hors ligne","controlsAria":"Commandes de l’activité","stationNavAria":"Étapes de discussion","questionHelpTip":"Si une question n’est pas claire, ouvre « Expliquer ». Tu la verras avec d’autres mots, sans la réponse.","questionHelpOpen":"Expliquer","questionHelpClose":"Masquer","questionHelpMeaning":"AUTREMENT DIT","scenarioLabel":"CONTEXTE","mainExplainLabel":"Expliquer la question principale","explainAria":"Expliquer la question {n}"},"levels":{"A1":{"warm":"Choisis un mot : juste, sûr, gentil ou libre. Explique ton choix.","stations":[{"title":"Tous méritent le respect","subtitle":"L’équité commence au quotidien.","main":"Qu’est-ce qui est juste dans une classe ?","questions":["Est-ce que tout le monde peut parler ?","Comment aider un élève qui est seul ?","Pourquoi faut-il écouter les autres ?"],"support":["Oui, tout le monde … / Non, certains élèves …","On peut aider en … (l’invitant à jouer / s’asseyant ensemble).","Écouter, c’est bien parce que …"],"challenge":"Imaginez ceci : Un élève n’a jamais l’occasion de parler en classe. Choisissez ensemble une solution gentille.","stretch":"Invente une règle juste pour parler en classe."},{"title":"Ta voix compte","subtitle":"Opinions, désaccord et respect.","main":"Les élèves peuvent-ils dire ce qu’ils pensent ?","questions":["Quand donnes-tu ton avis ?","Comment dire non avec gentillesse ?","Comment te sens-tu quand on t’écoute ?"],"support":["Je donne mon avis quand …","Je peux dire : « Je vois les choses autrement. »","Quand quelqu’un m’écoute, je me sens … (content / important)."],"challenge":"Imaginez ceci : Un élève propose de changer une règle. Certains camarades rient. Que pouvez-vous dire pour aider ? Entraînez-vous ensemble.","stretch":"Trouve une façon gentille de dire à ton partenaire que tu n’es pas d’accord."},{"title":"La vie privée compte","subtitle":"Photos, messages et consentement.","main":"Peux-tu partager la photo d’un ami sans demander ?","questions":["Demandes-tu avant de prendre une photo ?","Quelles informations sont privées ?","Comment peux-tu dire non poliment ?"],"support":["Oui, je demande : « Je peux prendre une photo ? »","… est privé (mon adresse / mon mot de passe).","Je peux dire : « Non, merci. S’il te plaît, ne fais pas ça. »"],"challenge":"Imaginez ceci : Une personne partage une photo de classe sans demander l’avis des élèves. Trouvez une idée juste et dites pourquoi.","stretch":"Demande poliment à ton partenaire si tu peux le prendre en photo (pour jouer)."},{"title":"Une chance d’apprendre","subtitle":"Éducation et besoins différents.","main":"Pourquoi l’école est-elle importante pour chaque enfant ?","questions":["Qu’aimes-tu apprendre ?","Tous les enfants doivent-ils pouvoir aller à l’école ?","Comment aider un ami à apprendre ?"],"support":["J’aime apprendre … (l’anglais / les maths / le dessin).","Oui, chaque enfant devrait … parce que …","Je peux aider en … (expliquant / lisant ensemble)."],"challenge":"Imaginez ceci : Un élève ne peut pas utiliser la fiche de travail. Choisissez ensemble une solution gentille.","stretch":"Nomme une chose qui t’aide à apprendre."},{"title":"Personne de côté","subtitle":"Inclusion sans stéréotypes.","main":"Comment accueillir un nouvel élève ?","questions":["Que peux-tu lui dire ?","Est-ce gentil de rire de l’accent de quelqu’un ?","Que peux-tu faire si une personne est seule ?"],"support":["Je peux dire : « Salut ! Tu veux venir avec nous ? »","Non, ce n’est pas gentil parce que …","Je peux … (m’asseoir avec lui / l’inviter à jouer)."],"challenge":"Imaginez ceci : Un nouvel élève n’est pas accepté dans une équipe à cause de son accent. Que pouvez-vous dire pour aider ? Entraînez-vous ensemble.","stretch":"Dis « bienvenue » dans deux langues."},{"title":"Sécurité et confiance","subtitle":"Protéger sans contrôler à l’excès.","main":"Qu’est-ce qui aide les gens à se sentir en sécurité ?","questions":["Où trouves-tu un endroit sûr à l’école ?","À qui les élèves peuvent-ils demander de l’aide ?","Pourquoi faut-il s’entraider ?"],"support":["Un endroit sûr, c’est … (le CDI / ma classe).","Les élèves peuvent demander de l’aide à … (un professeur / un ami).","On doit s’aider parce que …"],"challenge":"Imaginez ceci : Un élève dit qu’un couloir bondé lui semble dangereux. Trouvez une idée juste et dites pourquoi.","stretch":"Décris un coin sûr pour ta classe."},{"title":"Des droits partout","subtitle":"Droits universels, réalités différentes.","main":"Tous les enfants du monde méritent-ils du respect ?","questions":["Tous les enfants doivent-ils pouvoir apprendre ?","Doivent-ils pouvoir jouer ?","Pourquoi être gentil avec des inconnus ?"],"support":["Oui, chaque enfant devrait avoir …","Oui, jouer est important parce que …","On doit être gentil avec les inconnus parce que …"],"challenge":"Imaginez ceci : Deux enfants vivent dans des lieux différents et n’ont pas les mêmes chances d’étudier. Trouvez une idée juste et dites pourquoi.","stretch":"Nomme deux choses dont chaque enfant a besoin."},{"title":"Agir pour changer","subtitle":"Passer d’une idée à une action juste.","main":"Quelle bonne action peux-tu faire cette semaine ?","questions":["Peux-tu écouter une nouvelle personne ?","Peux-tu aider un camarade ?","Comment rendre ta classe plus accueillante ?"],"support":["Oui, je peux parler avec … à la récréation.","Je peux aider un camarade à …","Notre classe peut … (dire bonjour / faire une carte de bienvenue)."],"challenge":"Imaginez ceci : La classe peut choisir entre un système d’entraide et une affiche sur la gentillesse. Choisissez ensemble une solution gentille.","stretch":"Choisis une action gentille pour demain."}],"vocab":[["un droit","ce qui appartient à toute personne"],["juste","qui traite les autres équitablement"],["le respect","attention envers les autres"],["en sécurité","à l’abri du danger"],["une règle","ce que chacun doit suivre"],["la voix","possibilité de donner son avis"],["la vie privée","ce qui est personnel"],["la permission","accord d’une personne"],["l’aide","soutien donné à quelqu’un"],["l’école","lieu pour apprendre"],["égal","de même valeur"],["gentil","aimable avec les autres"]],"toolkit":[["Demander","Qu’en penses-tu ?"],["Répondre","Je pense que …"],["Être gentil","Merci pour ton idée."],["Continuer","Et toi ?"]]},"A2":{"warm":"Un nouvel élève arrive demain. Imagine deux façons de bien l’accueillir.","stations":[{"title":"Tous méritent le respect","subtitle":"L’équité commence au quotidien.","main":"À quoi ressemble une règle scolaire juste ?","questions":["Quand une règle est-elle injuste ?","Les élèves doivent-ils participer à la création des règles de classe ?","Que changerais-tu dans ta classe ?"],"support":["Une règle est injuste quand …","Oui, les élèves devraient … parce que … / Non, parce que …" rs façons d’apprendre ?"],"support":["Quelqu’un ne participe peut-être pas parce que …","Les camarades pourraient … (expliquer / attendre / travailler à deux).","Oui, les professeurs devraient … parce que …"],"challenge":"Imaginez ceci : Un élève ne peut pas utiliser la fiche de travail. Trouvez deux solutions et choisissez-en une.","stretch":"Dis comment tu saurais que ton idée a aidé."},{"title":"Personne de côté","subtitle":"Inclusion sans stéréotypes.","main":"Que peux-tu faire si un nouvel élève se sent exclu ?","questions":["Pourquoi peut-il être nerveux ?","Comment un groupe peut-il accueillir tout le monde ?","Et si ton ami fait une blague blessante ?"],"support":["Un nouvel élève pourrait être stressé à cause de …","Un groupe peut inclure tout le monde en …","Je pourrais dire : « Ce n’est pas drôle. Arrête, s’il te plaît. »"],"challenge":"Imaginez ceci : Un nouvel élève n’est pas accepté dans une équipe à cause de son accent. Proposez une solution et dites ce qui pourrait mal se passer.","stretch":"Trouve une façon d’aider sans que le nouvel élève se sente différent."},{"title":"Sécurité et confiance","subtitle":"Protéger sans contrôler à l’excès.","main":"Qui peut aider une personne qui ne se sent pas en sécurité à l’école ?","questions":["Comment un ami peut-il la soutenir ?","Pourquoi parler à un adulte de confiance ?","Qu’est-ce qui rend une classe rassurante ?"],"support":["Un ami peut … (écouter / rester avec elle).","C’est important d’en parler à un adulte parce que …","Une classe est un endroit sûr quand …"],"challenge":"Imaginez ceci : Un élève dit qu’un couloir bondé lui semble dangereux. Qui pourrait aider ? Prévoyez ce que cette personne pourrait faire.","stretch":"Nomme un lieu ou une personne de l’école qui pourrait aider davantage."},{"title":"Des droits partout","subtitle":"Droits universels, réalités différentes.","main":"Quel droit tous les jeunes devraient-ils avoir ?","questions":["Pourquoi l’éducation est-elle importante ?","Pourquoi le
