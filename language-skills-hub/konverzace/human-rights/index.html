 les élèves peuvent proposer des règles. Que proposerais-tu ?","stations":[{"title":"Tous méritent le respect","subtitle":"L’équité commence au quotidien.","main":"Traiter tout le monde de la même façon, est-ce toujours juste ?","questions":["Quand une personne peut-elle avoir besoin d’aide en plus ?","Une règle juste peut-elle avoir des effets différents ?","Comment les élèves pourraient-ils trouver une solution équitable ?"],"support":["Quelqu’un pourrait avoir besoin d’aide en plus quand …","Oui, la même règle peut être … pour quelqu’un qui …","On pourrait se mettre d’accord en … (votant / écoutant les deux côtés)."],"challenge":"Jeu de rôles : Un club donne plus de possibilités à certains élèves, même si les règles semblent identiques. Défendez des avis différents et accordez-vous sur une action.","stretch":"Explique ta solution à un élève qui la trouve injuste."},{"title":"Ta voix compte","subtitle":"Opinions, désaccord et respect.","main":"Où se trouve la limite entre une opinion et une insulte à l’école ?","questions":["Pourquoi les gens se disputent-ils parfois vivement ?","Comment critiquer une idée sans attaquer une personne ?","Que ferais-tu si une discussion devenait blessante ?"],"support":["Les gens sont très en désaccord quand …","Je peux dire : « Je ne suis pas d’accord avec l’idée, pas avec toi, parce que … »","Si la discussion devenait blessante, je …"],"challenge":"Jeu de rôles : Le conseil des élèves veut limiter les commentaires publics après un débat animé. Jouez la conversation et trouvez une solution que vous acceptez tous les deux.","stretch":"Transforme un commentaire impoli en commentaire respectueux."},{"title":"La vie privée compte","subtitle":"Photos, messages et consentement.","main":"Que ferais-tu si quelqu’un publiait la photo d’un camarade sans sa permission ?","questions":["Pourquoi une publication apparemment innocente peut-elle poser problème ?","À qui faut-il demander avant de partager une photo ?","Comment les élèves pourraient-ils réparer la situation ?"],"support":["Une publication qui semble inoffensive peut … parce que …","Avant de partager une photo, il faut demander à …","Les camarades pourraient réparer la situation en … (la supprimant / s’excusant)."],"challenge":"Jeu de rôles : Un compte anonyme partage des captures d’un groupe de discussion privé. Jouez deux personnes différentes et décidez qui doit faire quoi en premier.","stretch":"Écris une règle courte pour partager des photos dans le groupe de la classe."},{"title":"Une chance d’apprendre","subtitle":"Éducation et besoins différents.","main":"Comment l’école peut-elle aider les élèves qui ont des besoins différents ?","questions":["Quels obstacles peuvent empêcher de participer en classe ?","Quels changements aideraient sans désavantager les autres ?","Pourquoi demander aux élèves ce dont ils ont besoin ?"],"support":["Quelqu’un pourrait ne pas participer à un cours parce que …","Un changement juste pourrait être … (plus de temps / un autre format).","Demander aux élèves est important parce que …"],"challenge":"Jeu de rôles : Un cours en ligne reste difficile d’accès pour certains, mais l’école le dit égalitaire. Défendez des avis différents et accordez-vous sur une action.","stretch":"Explique le point de vue d’un élève qui n’a pas besoin d’aide en plus."},{"title":"Personne de côté","subtitle":"Inclusion sans stéréotypes.","main":"Comment réagir lorsqu’un camarade est traité injustement ?","questions":["Quelle différence y a-t-il entre une blague et une insulte ?","Pourquoi une personne exclue peut-elle garder le silence ?","Comment aider sans parler à sa place ?"],"support":["Une blague devient une insulte quand …","Une personne pourrait se taire parce que …","Je pourrais la soutenir en … (lui demandant ce qu’elle veut / restant avec elle)."],"challenge":"Jeu de rôles : Un élève dit que des blagues répétées sur ses origines le mettent à l’écart. Jouez la conversation et trouvez une solution que vous acceptez tous les deux.","stretch":"Propose ce qu’un professeur devrait dire à toute la classe."},{"title":"Sécurité et confiance","subtitle":"Protéger sans contrôler à l’excès.","main":"Que devraient faire les témoins de harcèlement scolaire ?","questions":["Pourquoi est-il parfois difficile d’intervenir ?","Quelles actions sûres un témoin peut-il entreprendre ?","Que peut faire l’école pour éviter ce problème ?"],"support":["Ça peut être difficile de parler parce que …","Un témoin peut, sans danger, … (prévenir un adulte / soutenir la personne).","L’établissement pourrait l’éviter en …"],"challenge":"Jeu de rôles : Après un incident, l’école propose de surveiller tous les messages des élèves. Jouez deux personnes différentes et décidez qui doit faire quoi en premier.","stretch":"Explique le point de vue d’un élève inquiet pour sa vie privée."},{"title":"Des droits partout","subtitle":"Droits universels, réalités différentes.","main":"Pourquoi certains jeunes ont-ils moins de possibilités d’apprendre ou d’être en sécurité ?","questions":["Quels obstacles pratiques empêchent d’aller à l’école ?","Comment le pays où l’on vit change-t-il les possibilités ?","Comment comparer des pays sans stéréotypes ?"],"support":["Un enfant ne va peut-être pas à l’école à cause de … (la distance / le coût / le travail).","Dans un autre pays, la vie quotidienne pourrait …","On peut éviter les stéréotypes en … (parlant de situations, pas de nationalités)."],"challenge":"Jeu de rôles : Dans deux pays fictifs, les jeunes n’ont pas le même accès à l’école ni à l’information publique. Jouez deux personnes différentes et décidez qui doit faire quoi en premier.","stretch":"Compare les deux pays sans utiliser de stéréotypes."},{"title":"Agir pour changer","subtitle":"Passer d’une idée à une action juste.","main":"Quel petit changement rendrait ton école plus juste ?","questions":["Qui consulterais-tu en premier ?","Quelle serait une première étape réaliste ?","Comment convaincrais-tu une personne qui n’est pas d’accord ?"],"support":["D’abord, je demanderais à … parce que …","Une première étape réaliste serait …","J’essaierais de la convaincre en …"],"challenge":"Jeu de rôles : Le conseil des élèves a un petit budget pour améliorer l’inclusion ou la participation. Défendez des avis différents et accordez-vous sur une action.","stretch":"Explique comment tu saurais, au bout d’un mois, si ça a marché."}],"vocab":[["les droits humains","droits fondamentaux de chacun"],["l’égalité","même dignité et mêmes droits"],["la liberté d’expression","possibilité d’exprimer ses idées"],["la vie privée","protection des informations personnelles"],["le consentement","accord donné librement"],["la discrimination","traitement injuste lié à l’identité"],["l’inclusion","participation de toutes les personnes"],["le droit à l’éducation","droit fondamental d’apprendre"],["le harcèlement","comportement qui blesse ou intimide"],["le témoin","personne qui assiste à une situation"],["l’accessibilité","accès possible pour des besoins variés"],["la responsabilité","devoir envers les autres"]],"toolkit":[["Expliquer une cause","Cela peut arriver parce que …"],["Indiquer une conséquence","Par conséquent, …"],["Donner un exemple","Par exemple, …"],["Réagir","Je comprends ton idée, mais …"]]},"B2":{"warm":"Deux élèves ne sont pas d’accord sur une règle. Comment écouter les deux ?","stations":[{"title":"Tous méritent le respect","subtitle":"L’équité commence au quotidien.","main":"Traiter tout le monde de façon identique est-il toujours le plus juste face à des besoins différents ?","mainExplain":"Si les élèves ont des besoins différents, est-il toujours juste de les traiter exactement de la même façon ?","questions":["Quand une aide supplémentaire favorise-t-elle l’égalité plutôt qu’un privilège ?","Comment l’école pourrait-elle expliquer une exception équitable ?","Comment prouver qu’une mesure fonctionne ?"],"explanations":["Aider davantage certains élèves peut rendre les choses plus justes ou ressembler à un traitement de faveur. Comment faire la différence ?","Parfois, un établissement permet à un élève de ne pas suivre une règle. Comment pourrait-il expliquer cette décision pour que les autres la trouvent juste ?","Comment pourrais-tu savoir si une nouvelle règle aide vraiment ?"],"support":["L’aide supplémentaire est juste quand …, mais elle devient du favoritisme si …","L’établissement pourrait expliquer l’exception en disant que …","On saurait que la mesure fonctionne si …"],"challenge":"Étude de cas : Un club donne plus de possibilités à certains élèves, même si les règles semblent identiques. Défendez deux réactions et négociez une règle juste.","stretch":"Trouve une faiblesse dans ta règle préférée et améliore-la."},{"title":"Ta voix compte","subtitle":"Opinions, désaccord et respect.","main":"Comment l’école peut-elle protéger la liberté d’expression sans tolérer le harcèlement ?","mainExplain":"Les élèves ont le droit de dire ce qu’ils pensent, mais ils ont aussi besoin d’être protégés contre les attaques. Comment un établissement peut-il protéger les deux ?","questions":["Quelle différence y a-t-il entre une opinion impopulaire et une attaque personnelle ?","Qui devrait décider si une limite est franchie ?","Comment rendre ces décisions transparentes ?"],"explanations":["Une opinion peut être impopulaire sans être une attaque. Qu’est-ce qui fait la différence ?","Quelqu’un doit décider quand un commentaire va trop loin. Qui devrait s’en charger ?","Comment un établissement pourrait-il montrer clairement aux élèves comment et pourquoi il prend ces décisions ?"],"support":["Une opinion devient une attaque personnelle quand …","La décision devrait revenir à …, parce que …","Le processus serait plus transparent si …"],"challenge":"Étude de cas : Le conseil des élèves veut limiter les commentaires publics après un débat animé. Choisissez une réaction et défendez-la face à l’objection la plus forte.","stretch":"Rédige en une phrase une règle juste pour les commentaires lors d’un débat scolaire."},{"title":"La vie privée compte","subtitle":"Photos, messages et consentement.","main":"Une école devrait-elle pouvoir examiner les téléphones des élèves pour prévenir le harcèlement ?","mainExplain":"Un établissement veut arrêter le harcèlement. Devrait-il avoir le droit de regarder les téléphones des élèves pour y arriver ?","questions":["Qu’est-ce qui justifierait une mesure aussi intrusive ?","Existe-t-il des solutions moins invasives ?","Comment protéger la vie privée des élèves ?"],"explanations":["Regarder le téléphone de quelqu’un est un pas important. Que faudrait-il pour que ce soit acceptable ?","Existe-t-il d’autres façons de lutter contre le harcèlement qui entrent moins dans la vie privée des élèves ?","Si un établissement enquête sur un cas, comment peut-il quand même respecter la vie privée de l’élève ?"],"support":["Une telle mesure ne serait justifiée que si …","Une option moins intrusive serait de …","Pendant une enquête, l’établissement devrait …"],"challenge":"Étude de cas : Un compte anonyme partage des captures d’un groupe de discussion privé. Mettez-vous d’accord sur une réaction et nommez un risque que vous accepteriez.","stretch":"Explique ta décision à un élève qui pense qu’on n’a pas respecté sa vie privée."},{"title":"Une chance d’apprendre","subtitle":"Éducation et besoins différents.","main":"Que signifie le droit à l’éducation au-delà d’une simple place à l’école ?","mainExplain":"Avoir une place à l’école, c’est une chose. Qu’est-ce qu’un vrai droit à l’éducation comprend d’autre ?","questions":["Pourquoi certains élèves participent-ils moins malgré leur inscription ?","Comment supprimer des obstacles sans diminuer les exigences ?","Comment les élèves devraient-ils participer aux décisions ?"],"explanations":["Certains élèves sont officiellement à l’école, mais participent très peu. Pourquoi cela pourrait-il arriver ?","Comment un établissement peut-il faciliter l’apprentissage de certains élèves sans le rendre moins exigeant ?","Les décisions sur l’école touchent les élèves chaque jour. Comment pourraient-ils avoir leur mot à dire ?"],"support":["Un élève pourrait participer moins parce que …","Supprimer des obstacles ne veut pas dire … ; cela veut dire …","Les élèves pourraient participer aux décisions en …"],"challenge":"Étude de cas : Un cours en ligne reste difficile d’accès pour certains, mais l’école le dit égalitaire. Défendez deux réactions et négociez une règle juste.","stretch":"Défends ton plan face à un élève qui dit que ce plan fait baisser le niveau."},{"title":"Personne de côté","subtitle":"Inclusion sans stéréotypes.","main":"Quand une blague devient-elle discriminatoire, et qui le décide ?","mainExplain":"Une blague peut blesser quelqu’un à cause de ce qu’il est. Quand est-ce que cela arrive, et qui devrait en décider ?","questions":["Quelle importance faut-il donner à l’intention de l’auteur ?","Comment l’école doit-elle réagir si quelqu’un se sent exclu ?","Comment combattre les préjugés sans humilier les autres ?"],"explanations":["Quelqu’un dit : « C’était juste pour rire. » Quelle importance a ce que la personne voulait dire ?","Un élève dit qu’il s’est senti exclu. Que devrait faire l’établissement ensuite ?","Comment dire à quelqu’un que son avis est injuste sans lui faire honte devant les autres ?"],"support":["L’intention compte, mais l’effet …","L’établissement devrait d’abord …","On peut remettre en question un préjugé sans humilier personne en …"],"challenge":"Étude de cas : Un élève dit que des blagues répétées sur ses origines le mettent à l’écart. Choisissez une réaction et défendez-la face à l’objection la plus forte.","stretch":"Réponds à quelqu’un qui dit : « Les gens sont trop sensibles. »"},{"title":"Sécurité et confiance","subtitle":"Protéger sans contrôler à l’excès.","main":"Comment une école peut-elle concilier sécurité et confiance ?","mainExplain":"Un établissement veut protéger ses élèves, mais trop de contrôle peut abîmer la confiance. Comment trouver le bon équilibre ?","questions":["Quand des règles strictes risquent-elles d’affaiblir le sentiment de sécurité ?","Quel rôle donner aux élèves dans ces règles ?","Comment vérifier qu’une mesure est efficace ?"],"explanations":["Des règles très strictes peuvent-elles faire que les élèves se sentent moins en sécurité ? Dans quelles situations ?","Les élèves devraient-ils participer aux règles censées les protéger ? Comment ?","Comment un établissement pourrait-il savoir si ses règles de sécurité fonctionnent vraiment ?"],"support":["Des règles strictes pourraient faire que les élèves se sentent moins en sécurité si …","Les élèves devraient participer à … parce que …","L’établissement pourrait tester son approche en …"],"challenge":"Étude de cas : Après un incident, l’école propose de surveiller tous les messages des élèves. Mettez-vous d’accord sur une réaction et nommez un risque que vous accepteriez.","stretch":"Défends ton plan face à quelqu’un qui veut plus de contrôle."},{"title":"Des droits partout","subtitle":"Droits universels, réalités différentes.","main":"Pourquoi l’accès aux droits fondamentaux varie-t-il entre pays, même si ces droits sont universels ?","mainExplain":"Les droits concernent tout le monde. Pourquoi, dans des pays différents, les gens n’y ont-ils pas le même accès ?","questions":["Quelle différence existe entre une promesse et la réalité quotidienne ?","Quels obstacles peuvent limiter l’éducation ou la sécurité ?","Comment comparer des pays sans clichés ?"],"explanations":["Un pays peut promettre un droit, mais la vie quotidienne peut être différente. Comment ces deux choses peuvent-elles être différentes ?","Qu’est-ce qui pourrait empêcher des jeunes d’aller à l’école ou de se sentir en sécurité ?","Comment comparer deux pays sans dire des choses injustes sur tous leurs habitants ?"],"support":["Un droit peut être promis, mais dans la réalité …","L’accès à l’éducation peut être limité par …","Pour éviter les stéréotypes, on devrait comparer …, et non …"],"challenge":"Étude de cas : Dans deux pays fictifs, les jeunes n’ont pas le même accès à l’école ni à l’information publique. Mettez-vous d’accord sur une réaction et nommez un risque que vous accepteriez.","stretch":"Reformule une comparaison pour qu’elle ne contienne aucun stéréotype."},{"title":"Agir pour changer","subtitle":"Passer d’une idée à une action juste.","main":"Une petite campagne menée par des élèves peut-elle provoquer un vrai changement ?","mainExplain":"Un petit groupe d’élèves peut-il vraiment changer quelque chose d’important avec sa propre campagne ?","questions":["Qu’est-ce qui distingue une action d’un slogan sur les réseaux ?","Comment associer les personnes concernées ?","Comment mesurer les effets concrets de la campagne ?"],"explanations":["Beaucoup de campagnes ne sont qu’un hashtag ou une jolie publication. Qu’est-ce qui rend une action plus réelle ?","Comment pourrais-tu t’assurer que les personnes touchées par le problème participent à la campagne ?","Comment pourrais-tu savoir si ton action a vraiment aidé ?"],"support":["Une action est plus qu’un slogan quand …","On pourrait inclure les personnes concernées en …","On mesurerait le succès à …"],"challenge":"Étude de cas : Le conseil des élèves a un petit budget pour améliorer l’inclusion ou la participation. Défendez deux réactions et négociez une règle juste.","stretch":"Nomme l’objection la plus forte à ton choix et réponds-y."}],"vocab":[["le favoritisme","traiter injustement certaines personnes mieux que d’autres"],["l’exception","un cas où une règle ne s’applique pas"],["l’attaque personnelle","des mots contre une personne, pas contre son idée"],["la transparence","le fait de rendre les décisions ouvertes et claires"],["intrusif","qui entre trop dans la vie privée de quelqu’un"],["l’enquête","un examen attentif de ce qui s’est passé"],["inscrit","enregistré officiellement dans un établissement"],["l’obstacle","quelque chose qui t’empêche de faire quelque chose"],["le préjugé","une opinion injuste formée sans bonne raison"],["l’intention","ce que quelqu’un veut faire"],["la surveillance","le fait d’observer les gens de près"],["la campagne","des actions prévues pour obtenir un changement"]],"toolkit":[["Peser le pour et le contre","Même si …, il faut aussi …"],["Nuancer","Cela dépend notamment de …"],["Demander des preuves","Quelles preuves soutiennent cette idée ?"],["Proposer","Un compromis possible serait …"]]},"C1":{"warm":"Une règle censée protéger exclut certains élèves sans le vouloir. Que faudrait-il changer ?","stations":[{"title":"Tous méritent le respect","subtitle":"L’équité commence au quotidien.","main":"Quand l’application de règles identiques peut-elle produire des résultats inégaux ?","mainExplain":"Si tout le monde suit exactement la même règle, les résultats peuvent-ils quand même être inégaux ? Quand cela pourrait-il arriver ?","questions":["Quelle différence y a-t-il entre égalité de traitement et égalité des chances ?","Comment justifier des exceptions sans créer de ressentiment ?","Quels effets imprévus l’école devrait-elle anticiper ?"],"explanations":["Traiter tout le monde de la même façon et donner à tous les mêmes chances, ce n’est pas toujours pareil. Quelle est la différence ?","Parfois, un établissement fait une exception pour un élève. Comment pourrait-il la justifier pour que les autres ne la trouvent pas injuste ?","Une nouvelle règle peut avoir des effets que personne n’a prévus. Auxquels un établissement devrait-il penser à l’avance ?"],"support":["L’égalité de traitement signifie …, alors que l’égalité des chances signifie …","Une exception est mieux acceptée quand …","Une conséquence que l’établissement devrait anticiper est …"],"challenge":"Conseil scolaire : Un club donne plus de possibilités à certains élèves, même si les règles semblent identiques. Proposez une mesure proportionnée et examinez un effet imprévu.","stretch":"Ajoute le point de vue d’un élève que ton premier plan avait oublié."},{"title":"Ta voix compte","subtitle":"Opinions, désaccord et respect.","main":"Comment l’école devrait-elle distinguer les propos nuisibles des opinions légitimes mais impopulaires ?","mainExplain":"Certains propos blessent, alors que certaines opinions sont seulement impopulaires. Comment un établissement devrait-il les distinguer ?","questions":["Quelles garanties éviteraient une censure arbitraire ?","Quelles responsabilités accompagnent la liberté d’expression ?","Comment gérerais-tu un cas limite dans un débat scolaire ?"],"explanations":["Comment un établissement pourrait-il s’assurer qu’on ne supprime pas des commentaires simplement parce qu’ils déplaisent aux responsables ?","Si tu as le droit de dire ce que tu penses, quels devoirs vont avec ce droit ?","Imagine un commentaire dans un débat scolaire qui n’est ni clairement acceptable ni clairement blessant. Comment le traiterais-tu ?"],"support":["Pour éviter des décisions arbitraires, l’établissement pourrait …","Le droit de s’exprimer librement s’accompagne de la responsabilité de …","Dans un cas limite, je commencerais par …"],"challenge":"Conseil scolaire : Le conseil des élèves veut limiter les commentaires publics après un débat animé. Proposez une réaction et dites comment vous sauriez, à la fin du trimestre, si elle a fonctionné.","stretch":"Rédige en une phrase une procédure juste pour contester un commentaire supprimé."},{"title":"La vie privée compte","subtitle":"Photos, messages et consentement.","main":"Quelles garanties faut-il avant qu’une institution surveille les jeunes en ligne ?","mainExplain":"Avant qu’un établissement ou une autre institution surveille ce que font les jeunes en ligne, quelles protections devraient exister ?","questions":["Comment un établissement pourrait-il décider s’il est vraiment nécessaire de contrôler les messages des élèves ?","Qui devrait accéder aux données recueillies ?","Comment la surveillance peut-elle décourager les échanges ouverts ?"],"explanations":["Contrôler les messages des élèves est un grand pas. Comment un établissement pourrait-il décider s’il est vraiment nécessaire ?","Si on recueille des informations sur les élèves, qui devrait pouvoir les voir ?","Si les élèves savent que leurs messages peuvent être contrôlés, pourraient-ils arrêter de parler librement ? Pourquoi ?"],"support":["Contrôler les messages ne serait nécessaire que si …","L’accès aux informations devrait être limité à …","Si les élèves savaient qu’on les surveille, ils pourraient …"],"challenge":"Conseil scolaire : Un compte anonyme partage des captures d’un groupe de discussion privé. Proposez une réaction et dites qui pourrait y perdre et comment vous réduiriez ce coût.","stretch":"Explique ta mesure à un élève qui n’a rien à cacher mais s’y oppose quand même."},{"title":"Une chance d’apprendre","subtitle":"Éducation et besoins différents.","main":"L’égalité d’accès à l’éducation suffit-elle si les élèves affrontent des obstacles très différents ?","mainExplain":"Si tous les élèves peuvent aller à l’école mais ont des difficultés très différentes, est-ce suffisant pour dire que l’éducation est juste ?","questions":["Quels obstacles restent invisibles si l’on compte seulement qui vient à l’école ?","Comment la participation des élèves améliorerait-elle la politique éducative ?","Où se situe la limite entre soutien et baisse des attentes ?"],"explanations":["Certains problèmes ne se voient pas si on compte seulement qui est présent. Lesquels pourraient-ils être ?","Comment écouter les élèves pourrait-il améliorer les décisions sur l’éducation ?","Aider les élèves, c’est bien, mais cela ne devrait pas vouloir dire attendre moins d’eux. Où est la limite ?"],"support":["Les chiffres de présence ne peuvent pas montrer …","L’avis des élèves pourrait améliorer les décisions parce que …","L’aide devient une baisse d’exigence quand …"],"challenge":"Conseil scolaire : Un cours en ligne reste difficile d’accès pour certains, mais l’école le dit égalitaire. Proposez une mesure proportionnée et examinez un effet imprévu.","stretch":"Explique ton plan à un professeur inquiet du travail en plus."},{"title":"Personne de côté","subtitle":"Inclusion sans stéréotypes.","main":"Comment les institutions devraient-elles réagir à une exclusion subtile difficile à prouver ?","mainExplain":"Certains élèves sont exclus de façon discrète et difficile à prouver. Que devrait faire un établissement ?","questions":["Comment identifier des tendances sans présumer la culpabilité ?","Quel rôle donner aux personnes concernées ?","Quelles politiques pourraient avoir des effets contraires aux intentions ?"],"explanations":["Comment un établissement peut-il remarquer que quelque chose se répète sans accuser quelqu’un trop vite ?","Les élèves concernés devraient-ils aider à trouver la solution ? Comment ?","Une règle censée aider peut parfois aggraver les choses. Quelles règles pourraient le faire ?"],"support":["On pourrait reconnaître une tendance en … sans …","Les personnes concernées devraient …","Une mesure pourrait avoir l’effet inverse si …"],"challenge":"Conseil scolaire : Un élève dit que des blagues répétées sur ses origines le mettent à l’écart. Proposez une réaction et dites comment vous sauriez, à la fin du trimestre, si elle a fonctionné.","stretch":"Défends ton plan face à quelqu’un qui dit qu’on ne peut rien prouver."},{"title":"Sécurité et confiance","subtitle":"Protéger sans contrôler à l’excès.","main":"Qu’est-ce qui rend une mesure de protection proportionnée plutôt qu’intrusive ?","mainExplain":"Quand une règle censée protéger les élèves va-t-elle trop loin et devient-elle trop contrôlante ?","questions":["Comment comparer les risques avec les libertés perdues ?","Quelles solutions moins restrictives faudrait-il examiner d’abord ?","Comment réévaluer cette mesure avec le temps ?"],"explanations":["Plus de sécurité peut vouloir dire moins de liberté. Comment les responsables devraient-ils peser l’une par rapport à l’autre ?","Avant d’introduire des mesures strictes, quelles options plus douces un établissement devrait-il essayer ?","Comment un établissement pourrait-il revoir régulièrement ses règles de sécurité et les changer si nécessaire ?"],"support":["Pour comparer les risques et les libertés perdues, les responsables devraient se demander …","Avant des mesures plus strictes, l’établissement pourrait essayer …","La mesure pourrait être réexaminée par … tous les …"],"challenge":"Conseil scolaire : Après un incident, l’école propose de surveiller tous les messages des élèves. Proposez une réaction et dites qui pourrait y perdre et comment vous réduiriez ce coût.","stretch":"Dis ce qui te ferait supprimer la mesure au bout d’un an."},{"title":"Des droits partout","subtitle":"Droits universels, réalités différentes.","main":"Qui doit rendre des comptes lorsqu’un droit existe sur le papier mais reste inaccessible ?","mainExplain":"Parfois, un droit existe dans la loi, mais les gens ne peuvent pas vraiment l’utiliser. Qui est responsable alors ?","questions":["Quels rôles jouent les gouvernements, les institutions et la société ?","Comment les ressources limitées influencent-elles les priorités ?","Comment les personnes concernées peuvent-elles évaluer les progrès ?"],"explanations":["Les gouvernements, les écoles et les communautés locales peuvent tous changer les choses. Que peut faire chacun ?","S’il n’y a pas assez d’argent pour tout, qu’est-ce qui devrait passer en premier ?","Comment les personnes concernées pourraient-elles aider à juger si les choses s’améliorent vraiment ?"],"support":["Les gouvernements sont responsables de …, alors que les communautés peuvent …","Avec des moyens limités, la première priorité devrait être …","Les personnes concernées pourraient évaluer les progrès en …"],"challenge":"Conseil scolaire : Dans deux pays fictifs, les jeunes n’ont pas le même accès à l’école ni à l’information publique. Proposez une réaction et dites qui pourrait y perdre et comment vous réduiriez ce coût.","stretch":"Présente le problème du point de vue d’un jeune de l’un des deux pays."},{"title":"Agir pour changer","subtitle":"Passer d’une idée à une action juste.","main":"Comment les jeunes peuvent-ils défendre les droits d’autrui sans parler à la place des personnes concernées ?","mainExplain":"Des jeunes peuvent vouloir défendre les droits des autres. Comment le faire sans parler à leur place au lieu de parler avec eux ?","questions":["Que signifie une véritable consultation ?","Comment une campagne peut-elle simplifier excessivement un problème ?","À quoi verrait-on un succès durable, une fois l’attention médiatique retombée ?"],"explanations":["Demander leur avis aux gens n’est pas toujours une vraie consultation. Qu’est-ce qui la rend réelle ?","Comment une campagne pourrait-elle faire paraître trop simple un problème compliqué ?","Quand on ne parle plus de la campagne dans les médias, qu’est-ce qui montrerait qu’elle a vraiment réussi ?"],"support":["Une consultation a du sens quand …","Une campagne pourrait trop simplifier le problème en …","Un succès durable voudrait dire que, des mois plus tard, …"],"challenge":"Conseil scolaire : Le conseil des élèves a un petit budget pour améliorer l’inclusion ou la participation. Proposez une mesure proportionnée et examinez un effet imprévu.","stretch":"Reformule le message de ta campagne pour que les personnes concernées l’approuvent."}],"vocab":[["la proportionnalité","limiter seulement autant que nécessaire"],["l’égalité formelle","appliquer la même règle à tous"],["l’égalité réelle","chances équitables dans la vie"],["la responsabilité institutionnelle","obligation de justifier des décisions"],["la confiance institutionnelle","confiance dans une organisation"],["le désavantage structurel","obstacle inscrit dans un système"],["les droits universels","droits de tous les êtres humains"],["la restriction légitime","limite justifiée d’une liberté"],["le consentement","accord libre et éclairé"],["la conséquence imprévue","effet non recherché"],["l’intérêt général","bénéfice pour la collectivité"],["la participation effective","possibilité réelle de décider"]],"toolkit":[["Cerner l’enjeu","Le problème fondamental semble être …"],["Changer de perspective","Du point de vue de …"],["Évaluer","On pourrait mesurer les effets en …"],["Concéder","Je reconnais ce risque ; néanmoins, …"]]},"C2":{"warm":"Une école promet « les mêmes droits pour tous », mais certains ne participent pas. Quelle question poserais-tu ?","stations":[{"title":"Tous méritent le respect","subtitle":"L’équité commence au quotidien.","main":"Une politique formellement neutre peut-elle compromettre l’égale dignité dans les faits ?","mainExplain":"Une règle peut traiter tout le monde de la même façon et pourtant, en pratique, porter atteinte à l’égale dignité de certaines personnes. Cela peut-il vraiment arriver ?","questions":["Quand une règle qui semble neutre peut-elle cacher un désavantage inscrit dans le système ?","Comment une exception bien intentionnée peut-elle créer une nouvelle injustice ?","Quel principe permettrait de corriger une règle défaillante ?"],"explanations":["Certaines règles semblent justes pour tous, mais certaines personnes partent avec un désavantage que la règle ne voit pas. Quand est-ce le cas ?","Une exception est censée aider, mais elle pourrait être injuste pour quelqu’un d’autre. Comment cela pourrait-il arriver ?","Si tu découvres qu’une règle a des défauts, quel principe te guiderait pour la changer ?"],"support":["Derrière la règle se cache l’hypothèse que …","L’exception pourrait créer une nouvelle injustice si …","Je réviserais la règle selon le principe que …"],"challenge":"Comité d’éthique : Un club donne plus de possibilités à certains élèves, même si les règles semblent identiques. Examinez les présupposés de deux réactions et formulez un principe défendable.","stretch":"Trouve un contre-exemple qui isible ?","Quelles limites imposer à une institution qui invoque la sécurité ?"],"explanations":["Si dire non te rend impopulaire, ton oui peut-il vraiment être libre ?","Se savoir surveillé peut-il changer le comportement des gens, même si personne n’est puni ? Comment ?","Une institution dit qu’elle a besoin de plus de contrôle pour la sécurité. Quelles limites fixerais-tu ?"],"support":["Le consentement perd son sens quand …","Même sans sanction, se savoir surveillé peut …","Je limiterais le pouvoir de l’institution en …"],"challenge":"Comité d’éthique : Un compte anonyme partage des captures d’un groupe de discussion privé. Décidez à quelle valeur vous renonceriez en dernier, et justifiez votre choix.","stretch":"Teste ton principe avec un cas où la vie privée pourrait mettre quelqu’un d’autre en danger."},{"title":"Une chance d’apprendre","subtitle":"Éducation et besoins différents.","main":"Un système éducatif réalise-t-il un droit lorsque l’accès est universel mais que les chances réelles restent inégales ?","mainExplain":"Tout le monde peut peut-être aller à l’école, mais tout le monde n’y a pas les mêmes chances. Le système respecte-t-il alors vraiment le droit à l’éducation ?","questions":["Quelle est la différence entre avoir un droit sur le papier et pouvoir vraiment participer ?","Une aide ciblée peut-elle nuire à la dignité qu’elle veut protéger ?","Quels indicateurs révéleraient la réussite au-delà des notes ?"],"explanations":["Avoir un droit, c’est une chose ; pouvoir vraiment l’utiliser, c’en est une autre. Quelle est la différence ?","L’aide apportée à certains élèves pourrait les faire se sentir différents ou moins respectés. Cela pourrait-il arriver ? Quand ?","Si les résultats aux examens ne suffisent pas, qu’est-ce qui pourrait montrer qu’un établissement réussit ?"],"support":["Avoir un droit sur le papier signifie …, mais participer vraiment exige …","Une aide ciblée pourrait porter atteinte à la dignité si …","Le succès se verrait dans … et function setMainQuestion(value,hasScenario){
 const target=$('mainQuestion');
 const questionAt=value.indexOf('?');
 let splitAt=-1;
 if(!hasScenario)for(const m of value.matchAll(/[.!…]["'»“”’]?\s+(?=[¿¡\p{Lu}])/gu)){if(m.index<questionAt)splitAt=m.index+m[0].length;}
 if(!hasScenario&&value.length>105&&splitAt>25&&value.length-splitAt>23){
  target.replaceChildren(make('span','main-scenario-inline',value.slice(0,splitAt).trim()),document.createTextNode(' '),make('span','main-question-core',value.slice(splitAt)));
 }else setText('mainQuestion',value);
}

  if(norm.endsWith('innen'))add(norm.slice(0,-5));
 }
 for(const stem of candidate){if(Object.prototype.hasOwnProperty.call(dict,stem))return {translation:dict[stem],base:stem};}
 return null;
}
function triggerLookup(evt){
 const element=evt.target instanceof Element?evt.target:null;
 if(element?.closest('.question-action'))return;
 const block=evt.__block||element?.closest(LOOKUP_SELECTOR);if(!block||$('lookupPopover').contains(element))return;
 const text=block.textContent?.trim();if(!text)return;
 const hit=evt.__hit||locateWord(evt,block);if(!hit)return;
 const word=hit.word,sentence=sentenceForLookup(text,hit.index);
 const phrase=localPhraseFor(text,hit.index,lang);
 const initial=/^\s*$|[.!?:„“"«(\/–—…]\s*$/.test(text.slice(0,hit.index));
 const meaning=lookupWordMeaning(word,lang,initial);
 lastLookup={block,index:hit.index,kbd:!!evt.__kbd};
 if(phrase){
  setLookupCard(phrase,sentence,evt.clientX,evt.clientY,'Překlad celé fráze · rozšířený offline slovník');
 }else if(meaning){
  setLookupCard({expression:word,translation:meaning.translation,kind:'word'},sentence,evt.clientX,evt.clientY,
   meaning.base?'Základní význam odvozený od „'+meaning.base+'“ · offline slovník':'Základní význam · offline slovník; přesný význam může záviset na větě');
 }else{
  setLookupCard({expression:word,translation:'Tento výraz zatím v rozšířeném offline slovníku není.',kind:'word'},sentence,evt.clientX,evt.clientY,
    'Bez připojení · zkus odvodit význam z kontextu nebo se zeptej vyučujícího');
 }
}
function initLookups(){
 const set=(ORDER.indexOf(level)<2?LOOKUP_HINTS_SIMPLE:LOOKUP_HINTS);
 const [label,text]=set[lang]||set.en;
 $('lookupHint').replaceChildren(make('strong','',label),document.createTextNode(' '+text));
}
// Desktop: preserve native double-click selection; iPads/iPhones: one tap avoids Safari double-tap zoom.
document.querySelector('.app').addEventListener('dblclick',e=>triggerLookup(e));
let tapStart=null;
document.querySelector('.app').addEventListener('pointerdown',e=>{
 tapStart=(e.pointerType==='touch'||e.pointerType==='pen')?{x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId}:null;
});
document.querySelector('.app').addEventListener('pointercancel',()=>{tapStart=null;});
document.querySelector('.app').addEventListener('pointerup',e=>{
 if(!(e.pointerType==='touch'||e.pointerType==='pen')||!tapStart||tapStart.id!==e.pointerId)return;
 const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y),held=performance.now()-tapStart.t;tapStart=null;
 if(moved<=10&&held<=600&&!(e.target instanceof Element&&e.target.closest('.question-action,.main-explain-btn,button,summary')))triggerLookup(e);
});
function lookupSelection(){
 const sel=getSelection();if(!sel||!sel.rangeCount||sel.isCollapsed)return false;
 const range=sel.getRangeAt(0),node=range.startContainer,el=node.nodeType===1?node:node.parentElement;
 const block=el?.closest(LOOKUP_SELECTOR);if(!block)return false;
 const upto=document.createRange();upto.selectNodeContents(block);upto.setEnd(range.startContainer,range.startOffset);
 const offset=upto.toString().length,text=block.textContent,box=range.getBoundingClientRect();
 const hit=readWordAt(text,offset+Math.max(0,text.slice(offset).search(/[\p{L}\p{M}]/u)));if(!hit)return false;
 triggerLookup({target:el,clientX:box.left,clientY:box.bottom,__hit:hit,__block:block});return true;
}
$('lookupClose').addEventListener('click',hideLookup);
let lastLookup=null;
const LOOKUP_WORD_RE=/[\p{L}\p{M}]+(?:[’'-][\p{L}\p{M}]+)*/gu;
const KBD_LOOKUP_SELECTOR='#mainScenarioText,#mainQuestion,#mainExplainText,#questions .question-text,#questions .question-meaning,#supportList li,#challengeReveal,#stretchReveal,#vocabGrid .vocab-item,#toolkitGrid .vocab-item';
function markLookupTargets(){document.querySelectorAll(KBD_LOOKUP_SELECTOR).forEach(el=>{el.tabIndex=0;el.classList.add('kbd-lookup');});}
function lookupWordsIn(block){return [...block.textContent.matchAll(LOOKUP_WORD_RE)];}
function openLookupAt(block,m,kbd){const r=block.getBoundingClientRect();triggerLookup({target:block,clientX:r.left,clientY:r.bottom,__hit:{word:m[0],index:m.index},__block:block,__kbd:kbd});}
function openFirstWord(block){const w=lookupWordsIn(block);if(w.length)openLookupAt(block,w[0],true);}
function stepLookup(dir){if(!lastLookup||!document.contains(lastLookup.block))return;const w=lookupWordsIn(lastLookup.block);let i=w.findIndex(m=>m.index===lastLookup.index);if(i<0)i=0;const prev=$('lookupExpression').textContent,blk=lastLookup.block,kbd=lastLookup.kbd;for(let n=i+dir;n>=0&&n<w.length;n+=dir){openLookupAt(blk,w[n],kbd);if($('lookupExpression').textContent!==prev)return;}}
$('lookupPrev').addEventListener('click',()=>stepLookup(-1));
$('lookupNext').addEventListener('click',()=>stepLookup(1));
document.addEventListener('pointerdown',e=>{
 if(!$('lookupPopover').hidden&&!$('lookupPopover').contains(e.target)&&!(e.target instanceof Element&&e.target.closest(LOOKUP_SELECTOR)))hideLookup();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('lookupPopover').hidden){hideLookup();if(lastLookup?.kbd&&document.contains(lastLookup.block))lastLookup.block.focus();e.preventDefault();return;}
 if(e.key==='Enter'&&!e.target.closest?.('input,select,textarea,button,a,summary,#timerEditor')){
  const sel=getSelection();if(sel&&!sel.isCollapsed&&e.target.contains?.(sel.anchorNode)&&lookupSelection()){e.preventDefault();return;}
  const blk=e.target.closest?.('.kbd-lookup');if(blk){openFirstWord(blk);e.preventDefault();return;}
 }
 if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!$('lookupPopover').hidden&&lastLookup&&(e.target===lastLookup.block||$('lookupPopover').contains(e.target))){stepLookup(e.key==='ArrowRight'?1:-1);e.preventDefault();}
});

// --- Single shared countdown, including the movable mobile overlay ---
const timeText=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
function updateTimerTranslations(){
 const u=ui();setText('timerLabel',u.timerLabel);$('timerPanel').setAttribute('aria-label',u.timerLabel);
 setText('timerReset',`↺ ${u.timerReset}`);setText('timerEditorTitle',u.timerEdit);
 setText('timerMinutesLabel',u.timerMinutes);setText('timerSecondsLabel',u.timerSeconds);setText('timeHelp',u.timerHelp);
 setText('timerSet',u.timerSet);setText('cancelEdit',u.timerCancel);
 updateFloatingControls();refreshTimer();
}
function mountTimer(){
 const p=$('timerPanel');
 if(p.parentElement!==$('timerDock'))$('timerDock').appendChild(p);
 if(!mobileTimerQuery.matches)p.classList.remove('mobile-expanded');
 p.hidden=false;updateFloatingControls();
}
function updateFloatingControls(){const expanded=$('timerPanel').classList.contains('mobile-expanded'),u=ui();
 const b=$('timerFloatToggle');b.textContent=expanded?'⌄':'⌃';b.setAttribute('aria-expanded',String(expanded));b.setAttribute('aria-label',expanded?u.timerCollapse:u.timerExpand);b.title=expanded?u.timerCollapse:u.timerExpand;
 $('clock').title=mobileTimerQuery.matches&&!expanded?u.timerExpand:u.timerEdit;
}
function setFloatingExpanded(expand){if(!mobileTimerQuery.matches)return;const p=$('timerPanel');if(!expand)closeEditor();p.classList.toggle('mobile-expanded',expand);updateFloatingControls();}
function refreshTimer(){
 if(ticker!==null){left=Math.max(0,endAt-Date.now());if(left===0){clearInterval(ticker);ticker=null;dropWake();showToast(ui().timerFinishToast);}}
 const seconds=Math.ceil(left/1000),u=ui();
 setText('clock',timeText(seconds));$('clock').classList.toggle('almost',seconds>0&&seconds<=15);$('clock').classList.toggle('finished',seconds===0&&duration>0);
 setText('timerStart',ticker!==null?`Ⅱ ${u.timerPause}`:`▶ ${u.timerStart}`);$('timerStart').disabled=seconds===0;$('timerReset').disabled=duration===0||(ticker===null&&left===duration*1000);
 setText('timerHint',ticker!==null?u.timerRunning:duration===0?u.timerInit:seconds===0?u.timerDone:left<duration*1000?u.timerPaused:u.timerReady);
}
let wakeLock=null;
async function holdWake(){try{if('wakeLock' in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(_){wakeLock=null;}}
function dropWake(){try{wakeLock?.release();}catch(_){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ticker!==null)holdWake();});
function stopTimer(){if(ticker!==null){left=Math.max(0,endAt-Date.now());clearInterval(ticker);ticker=null;}dropWake();}
function toggleTimer(){if(!$('timerEditor').hidden)return;if(ticker!==null){stopTimer();refreshTimer();return;}if(left<=0)return;endAt=Date.now()+left;ticker=setInterval(refreshTimer,100);holdWake();refreshTimer();}
function openEditor(reset=false){stopTimer();if(reset){duration=0;left=0;}refreshTimer();const secs=Math.ceil(left/1000);$('timerEditor').hidden=false;setText('timeError','');$('timerMinutes').value=duration?String(Math.floor(secs/60)).padStart(2,'0'):'';$('timerSeconds').value=duration?String(secs%60).padStart(2,'0'):'';$('timerMinutes').focus();$('timerMinutes').select();}
function closeEditor(){$('timerEditor').hidden=true;setText('timeError','');}
function parseTime(mm,ss){const m=mm.trim(),s=ss.trim();if(!/^\d{0,2}$/.test(m)||!/^\d{0,2}$/.test(s)||(!m&&!s))return null;const minutes=Number(m||0),seconds=Number(s||0);if(seconds>59)return null;const total=minutes*60+seconds;return total>=5&&total<=99*60+59?total:null;}
function submitTime(e){e.preventDefault();const seconds=parseTime($('timerMinutes').value,$('timerSeconds').value);if(seconds===null){setText('timeError',ui().timerError);(Number($('timerSeconds').value)>59?$('timerSeconds'):$('timerMinutes')).focus();return;}stopTimer();duration=seconds;left=seconds*1000;closeEditor();refreshTimer();$('clock').focus();showToast(ui().timerSetToast);}
function resetTimer(){closeEditor();stopTimer();left=duration*1000;refreshTimer();}
function showToast(txt){const el=$('toast');el.textContent=txt;el.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('show'),2300);}
$('mainExplainBtn').addEventListener('click',()=>{const panel=$('mainExplainPanel'),opening=panel.hidden;panel.hidden=!opening;$('mainExplainBtn').setAttribute('aria-expanded',String(opening));hideLookup();});

document.addEventListener('fullscreenchange',updateFullscreenButton);document.addEventListener('webkitfullscreenchange',updateFullscreenButton);
$('resetBtn').addEventListener('click',()=>{stopTimer();duration=0;left=0;closeEditor();refreshTimer();$('warmDetails').open=false;current=0;goTo(0,{scroll:false});showToast(ui().lessonResetToast);window.scrollTo({top:0,behavior:'smooth'});});
$('previousBtn').addEventListener('click',()=>goTo(current-1));$('nextBtn').addEventListener('click',()=>goTo(current+1));
for(const name of ['support','challenge','stretch'])$(name+'Btn').addEventListener('click',()=>toggleDetails(name,$(name+'Reveal').hidden));
$('clock').addEventListener('click',()=>{if(mobileTimerQuery.matches&&!$('timerPanel').classList.contains('mobile-expanded'))setFloatingExpanded(true);else openEditor();});
$('timerFloatToggle').addEventListener('click',()=>setFloatingExpanded(!$('timerPanel').classList.contains('mobile-expanded')));
mobileTimerQuery.addEventListener('change',()=>{closeEditor();mountTimer();});
$('timerStart').addEventListener('click',toggleTimer);$('timerReset').addEventListener('click',resetTimer);
$('timerEditor').addEventListener('submit',submitTime);
for(const id of ['timerMinutes','timerSeconds'])$(id).addEventListener('input',()=>{$(id).value=$(id).value.replace(/\D/g,'').slice(0,2);setText('timeError','');});
$('timerMinutes').addEventListener('input',()=>{if($('timerMinutes').value.length===2){$('timerSeconds').focus();$('timerSeconds').select();}});
$('timerMinutes').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){$('timerSeconds').focus();$('timerSeconds').select();e.preventDefault();}});
$('cancelEdit').addEventListener('click',()=>{closeEditor();refreshTimer();$('clock').focus();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('timerEditor').hidden){closeEditor();refreshTimer();$('clock').focus();e.preventDefault();}});
document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;const t=e.target;
 // Arrows change stations on the page itself and inside station navigation (list + Previous/Next);
 // every other control (and a focused question used for the word lookup) keeps its own keyboard behaviour.
 const inStationNav=!!(t&&t.closest&&t.closest('#sectionNav,.nav-buttons'));
 if(!inStationNav&&t&&t.closest&&t.closest('button,a,summary,input,select,textarea,[contenteditable],[role=button],#timerEditor,.question-action,.kbd-lookup'))return;
 const dir={ArrowRight:1,PageDown:1,ArrowLeft:-1,PageUp:-1}[e.key];if(!dir)return;const n=current+dir;if(n<0||n>7)return;e.preventDefault();goTo(n,{focusNav:!!(t&&t.closest&&t.closest('#sectionNav'))});});
window.addEventListener('pagehide',stopTimer);
$('sectionNav').addEventListener('scroll',updateNavHint,{passive:true});window.addEventListener('resize',updateNavHint);
const topbar=document.querySelector('.topbar');const syncTopbar=()=>document.documentElement.style.setProperty('--topbar-h',topbar.offsetHeight+'px');
if('ResizeObserver' in window)new ResizeObserver(syncTopbar).observe(topbar);syncTopbar();
const _renderStationBase=renderStation;renderStation=function(){_renderStationBase();markLookupTargets();};
loadPrefs();
// CATALOG_PRESET_V1: accept only the four real languages and six CEFR levels.
const clbPreset = new URLSearchParams(window.location.search);

if (clbLangNorm && Object.prototype.hasOwnProperty.call(CONTENT, clbLangNorm)) lang = clbLangNorm;
